# 태그를 찍으면 이 저장소의 모든 모듈을 `.tmod` 로 구워 릴리스 자산으로 올린다.
#
# 코어(Terra)는 이 릴리스를 **받아서 전개할 뿐 컴파일하지 않는다** — `pack` 이 이미
# `integrity.process.<target>` 을 찍어 두기 때문이다(분리 검토 D-21). 그래서 코어
# 릴리스 빌드가 모듈 소스도, Go 툴체인도, 이 저장소의 체크아웃도 필요로 하지 않는다.
#
# **왜 사람이 태그를 찍나** (Q-14) — 릴리스는 의도적 행위여야 하고 되돌리기가 비싸다.
# 버튼 하나로 태그까지 만들면 실수로 찍기 쉽다. 태그 형식은 날짜형이다(Q-11):
#
#     git tag v2026.09.29 && git push origin v2026.09.29
#     # 같은 날 다시 찍어야 하면 v2026.09.29-2
#
# 모듈별 버전은 매니페스트가 이미 들고 있다. 저장소 태그가 말해야 하는 것은 "언제
# 찍은 묶음인가" 하나뿐이고, 모듈 여럿의 semver 를 하나로 합치면 그 숫자는 거짓말이
# 된다.
#
# **태그가 main 위에 있는지는 강제하지 않는다.** 지난 커밋에 찍는 재발행이 정당한
# 경우가 있고, 이 잡이 무엇을 굽든 그 자리에서 validate·schema·pack 을 전부 다시
# 돌기 때문에 검사받지 않은 것이 실리지는 않는다.
#
# **서명한다** (Terra ADR-MD-005). Q-13 은 "검증하는 쪽에 신뢰 앵커가 없는 동안의
# 서명은 장식"이라며 미뤘다 — 그 판단은 옳았고, 그래서 서명은 앵커와 **함께** 선다:
#
#   - 무엇을 어느 키로: signing.json (접두사 → 키·tier·keyId). 맞는 키가 없는 모듈이
#     있으면 포장이 선다.
#   - 비밀키: 환경 `module-signing` 의 시크릿에만 있다. 포장 직전에 임시 파일로 쓰고
#     `always()` 에서 지운다. 이 잡 밖에는 존재하지 않는다.
#   - 앵커: 아래 "Verify signatures as Terra would" 가 Terra main 으로 빌드한 CLI 의
#     `module inspect` 로 모든 .tmod 를 다시 판정한다. Terra main 의 builtin_keys.json 이
#     그 키를 기대한 tier 로 모르면 **릴리스가 선다.** 키를 모르는 Terra 에 서명된 모듈은
#     미서명보다 나쁘기 때문이다(dev 모드에서도 격리된다 — ADR-MD-005 §1).
#   - 시크릿이 없거나, signing.json 의 keyId 가 비었거나, 시크릿의 키가 그 keyId 가 아니면
#     선다. 조용히 미서명으로 내보내지 않는다(G-12).
#
# 사람이 한 번 해야 하는 일(키 생성·공개키 등록·시크릿): Terra
# docs/architecture/operations/module-signing-key-procedure.md

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Pack and publish
    runs-on: [self-hosted, linux, x64, docker, homelab]
    # 서명 키는 이 환경의 시크릿이다. 보호 규칙(승인자)은 환경 설정에서 건다.
    environment: module-signing
    steps:
      - uses: actions/checkout@v4
        with:
          path: modules

      # CI 의 pack 잡은 시크릿이 없으면 건너뛴다 — 포크에서 온 PR 에는 시크릿이
      # 가지 않으므로 거기서 실패로 올리면 기여를 막는다. **여기는 다르다.**
      # 릴리스는 검증이 아니라 출하다: Terra 없이는 pack 자체가 불가능하고,
      # 자산 없는 릴리스는 그 태그를 핀한 코어를 빌드 때 세운다.
      - name: Require a Terra checkout
        env:
          KEY: ${{ secrets.TERRA_CHECKOUT_SSH_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::TERRA_CHECKOUT_SSH_KEY 가 없다 — 릴리스는 Terra 체크아웃 없이 만들 수 없다(README 의 \"검증\" 절)"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          repository: StellaxiaLab/Terra
          ssh-key: ${{ secrets.TERRA_CHECKOUT_SSH_KEY }}
          path: terra

      - uses: actions/setup-go@v5
        with:
          go-version-file: terra/go.work
          cache: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # 검증기는 ajv 를 쓴다(Manifest v2 스키마). CI 의 validate 잡은 `npm ci` 를 돌지만
      # 이 잡에는 그 줄이 없었다 — 그대로 태그를 찍으면 첫 릴리스가 바로 아래 단계에서
      # `ERR_MODULE_NOT_FOUND: ajv` 로 선다. 태그가 한 번도 찍히지 않아 드러나지 않았다.
      - name: Install the validator's dependencies
        working-directory: modules
        run: npm ci --no-audit --no-fund

      # 출하 전에 이 저장소의 규약을 다시 본다. CI 가 main 에서 이미 봤지만
      # 태그는 main 이 아닌 커밋에도 찍힌다 — 위 주석 참고.
      - name: Validate every module
        working-directory: modules
        run: node tools/validate-modules.mjs

      - name: Check the vendored schema against Terra
        working-directory: modules
        run: node tools/check-schema-drift.mjs --terra "$GITHUB_WORKSPACE/terra"

      # main 패키지는 모듈 루트가 아니라 cmd/terra 에 있다.
      - name: Build the terra CLI
        working-directory: terra/products/common/apps/terra-cli
        run: go build -o "$RUNNER_TEMP/terra" ./cmd/terra

      # `bin/` 을 채운다. 이 단계가 없으면 Go 소스를 가진 모듈이 다음 줄에서
      # MODULE_ENTRYPOINT_MISSING 으로 거절된다 — 조용히 빠지지 않고 선다.
      - name: Build modules that carry Go source
        working-directory: modules
        run: node tools/build-modules.mjs --terra "$GITHUB_WORKSPACE/terra"

      # 시험도 여기서 다시 돈다. 위 주석이 *"태그가 main 위에 있는지는 강제하지
      # 않는다 — 이 잡이 무엇을 굽든 validate·schema·pack 을 전부 다시 돌기
      # 때문에 검사받지 않은 것이 실리지는 않는다"* 라고 적었다. 시험이 생긴
      # 뒤로는 시험도 그 "검사" 에 든다 — 안 돌면 그 문장이 거짓이 된다
      # (분리 검토 G-14).
      - name: Test modules that carry Go source
        working-directory: modules
        run: node tools/test-modules.mjs --terra "$GITHUB_WORKSPACE/terra"

      # `ui/` 를 채운다. 웹 모듈의 화면은 `web/` 소스의 빌드 산출물이고(`bin/` 과 같다)
      # `web/` 은 포장되지 않는다. `terra module pack` 은 앱 entry 를 보지 않으므로
      # (없어도 `VERIFIED true` — 실측) 이 단계를 빠뜨리면 pack-modules 의 entry
      # 검사가 다음 단계에서 세운다. 시험은 위의 Go 시험과 같은 이유로 여기서 다시 돈다.
      - name: Build modules that carry a web UI
        working-directory: modules
        run: node tools/build-web.mjs

      - name: Test modules that carry a web UI
        working-directory: modules
        run: node tools/test-web.mjs

      # 키 파일은 포장 바로 앞에서 쓴다 — 모듈 코드를 돌리는 빌드·시험 단계가 끝난 뒤.
      # write-keys 가 시크릿의 키를 signing.json 의 keyId 와 대조하고, 하나라도 틀리면
      # 아무것도 쓰지 않고 선다.
      - name: Write the signing keys
        working-directory: modules
        env:
          MODULE_SIGNING_KEY_BUILTIN: ${{ secrets.MODULE_SIGNING_KEY_BUILTIN }}
          MODULE_SIGNING_KEY_STELLAXIA: ${{ secrets.MODULE_SIGNING_KEY_STELLAXIA }}
        run: |
          set -euo pipefail
          umask 077
          node tools/signing.mjs write-keys --signing signing.json --out "$RUNNER_TEMP/module-signing"

      # 타깃마다 따로 굽는다. 실측: 타깃 셋을 선언한 모듈을 안 좁히고 포장하면
      # 자산 하나가 4.9 MB → 14.3 MB 로 2.9배가 되고, 리눅스 노드가 윈도우·arm
      # 바이너리까지 받는다.
      - name: Pack every module
        working-directory: modules
        run: |
          node tools/pack-modules.mjs \
            --cli "$RUNNER_TEMP/terra" \
            --terra "$GITHUB_WORKSPACE/terra" \
            --tag "$GITHUB_REF_NAME" \
            --out "$RUNNER_TEMP/dist" \
            --signing signing.json \
            --key-dir "$RUNNER_TEMP/module-signing"

      - name: Remove the signing keys
        if: always()
        run: rm -rf "$RUNNER_TEMP/module-signing"

      # pack 의 성공은 "서명을 붙였다"까지다. 노드가 믿는지는 Terra 의 keyring 이 정하고,
      # 이 CLI 는 Terra main 으로 빌드됐다 — 그래서 이 단계가 "Terra main 이 이 패키지를
      # 기대한 키·tier 로 믿는다"를 확인한다. 하나라도 아니면 업로드하지 않는다.
      - name: Verify signatures as Terra would
        working-directory: modules
        run: |
          node tools/verify-signatures.mjs \
            --cli "$RUNNER_TEMP/terra" \
            --dist "$RUNNER_TEMP/dist" \
            --signing signing.json

      # 독립적으로 한 번 더 센다. pack-modules 의 훑기가 조용히 한 tier 를
      # 빠뜨려도 여기서 걸린다 — 셸이 세는 수와 스크립트가 적은 수가 달라진다.
      # G-10 이 코어 번들에서 당한 것(모듈 15개가 5개가 되고도 exit 0)의 릴리스판이다.
      - name: Count what shipped against what exists
        working-directory: modules
        run: |
          on_disk=$(find common leaf tree -mindepth 2 -maxdepth 2 -name module.json 2>/dev/null | wc -l)
          in_listing=$(node -e 'console.log(JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")).moduleCount)' "$RUNNER_TEMP/dist/modules.json")
          echo "디스크 ${on_disk}개 · 목록 ${in_listing}개"
          if [ "$on_disk" -ne "$in_listing" ]; then
            echo "::error::릴리스에 오를 모듈 수가 저장소의 모듈 수와 다르다 — 릴리스를 만들지 않는다"
            exit 1
          fi

      # draft 로 만들어 전부 올린 뒤 발행한다 — 업로드가 중간에 실패해도
      # 반쪽짜리 공개 릴리스가 남지 않는다.
      - name: Publish the release
        working-directory: modules
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/publish-release.mjs --dist "$RUNNER_TEMP/dist"
