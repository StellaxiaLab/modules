# 모듈 소스 저장소 CI.
#
# 잡이 셋이고, **셋 다 이 저장소를 클론한 것만으로 돈다** — Terra 체크아웃도,
# `TERRA_CHECKOUT_SSH_KEY` 도, 어떤 시크릿도 필요 없다(독립 레포 전환 M-5·M-6).
#
#   validate  매니페스트 형식, 배치 규칙, 참조 경로의 실재, 벤더링한 스키마 사본의
#             자기 해시.
#   web       웹 화면을 가진 모듈(web/package.json)의 빌드와 시험.
#   go        Go 소스를 가진 모듈 10개의 빌드와 시험. 의존은 공개 `terra-sdk` ·
#             `terra-agent` 의 태그(Go 모듈 프록시)뿐이다.
#
# **여기서 더 이상 보지 않는 것, 그리고 누가 보는가** — 예전에는 `pack` 잡이 Terra
# 비공개 체크아웃으로 `terra` CLI 를 굽고 아래 셋을 봤다. 셋 다 Terra 의 코드가 있어야
# 서는 검사라서 이 저장소의 CI 에서는 뺐고, **권위는 Terra 쪽 CI 로 간다**:
#
#   1. `terra module pack` — Scene 무결성, 포장이 설치기와 같은 검사로 다시 열리는지.
#      `terra` CLI 를 Terra 소스에서 굽는다.
#   2. 출하 Scene 의 실 런타임 마운트(`npm run test:scenes -- --terra <path>`, 분리 검토
#      G-23). Terra 의 npm 의존과 `shipped-scenes.test.ts` 를 쓴다.
#   3. 스키마 사본과 Terra 원본의 바이트 대조(`npm run check:schema -- --terra <path>`)
#      와 Terra Master 계약 대조 시험(`node tools/test-modules.mjs --terra <path>`).
#
# 이 저장소의 도구(`tools/pack-modules.mjs` · `test-scenes.mjs` 등)는 그대로 남아
# 있다 — Terra 쪽 CI 가 이 저장소를 체크아웃해 부르면 된다. 릴리스(`release.yml`)는
# 태그를 찍을 때 `terra` CLI 로 `.tmod` 를 굽기 때문에 아직 Terra 체크아웃이 필요하다
# (README 의 "독립 빌드" 절).
#
# 러너가 self-hosted 인 이유 — 처음에 ubuntu-latest 로 적었다가 첫 실행에서 두 잡
# 모두 3초 만에 러너를 못 받고 죽었다(runner_id 0, 로그 없음). Terra 의 ci.yml 이
# 적어 둔 사정이 이 저장소에도 그대로다: 호스티드 러너의 지출 한도가 소진돼
# 조직 전체가 self-hosted 풀로 옮겨 갔다. 라벨은 Terra 의 리눅스 잡과 같은 것을 쓴다.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  validate:
    name: Manifest and layout
    runs-on: [self-hosted, linux, x64, docker, homelab]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # --allow-empty 는 첫 모듈(lab.stellaxia.scene.hello, 당시 io.terra.scene.hello)이
      # 들어오면서 빠졌다. 빈 모듈
      # 집합을 조용히 통과시키지 않는 것이 L-9 의 존재 이유이고, 이제 지킬 모듈이
      # 있으므로 그 예외를 둘 이유도 없다.
      - name: Validate every module
        run: node tools/validate-modules.mjs

      # 사본이 PROVENANCE.json 에 적힌 해시 그대로인가. 손으로 고친 스키마를 여기서
      # 잡는다. `--self-only` 는 "Terra 원본과의 대조는 이 잡에서 하지 않는다" 를
      # 명시적으로 고른 것이다 — 그 대조는 Terra 쪽 CI 몫이다(위 머리 주석 3).
      - name: Check the vendored schema against its recorded hash
        run: node tools/check-schema-drift.mjs --self-only

  web:
    name: Web UI build and test
    runs-on: [self-hosted, linux, x64, docker, homelab]
    steps:
      - uses: actions/checkout@v4

      # 웹 모듈의 의존은 모듈마다 자기 잠금 파일을 갖는다(web/package-lock.json).
      # 저장소 루트의 잠금 파일과 다르므로 setup-node 의 npm 캐시는 두지 않는다.
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # 굽기가 먼저인 이유: build-web 이 `npm ci` 로 의존을 받고, test-web 은
      # node_modules 가 있으면 그것을 그대로 쓴다. 순서를 뒤집으면 의존을 두 번 받는다.
      - name: Build modules that carry a web UI
        run: node tools/build-web.mjs

      # 시험을 가진 웹 모듈은 여기서 돈다. test-modules.mjs 는 Go 시험만 보므로,
      # 이 단계가 없으면 웹 시험은 "아무도 돌리지 않는 시험" 이 된다(G-14 와 같은 모양).
      - name: Test modules that carry a web UI
        run: node tools/test-web.mjs

  go:
    name: Go build and test
    runs-on: [self-hosted, linux, x64, docker, homelab]
    steps:
      - uses: actions/checkout@v4

      # io.terra.file 이 os.Root 를 써서 go 1.25 를 요구한다(모듈 go.mod 의 go 줄).
      # 모듈마다 go 줄이 다르므로 가장 높은 쪽에 맞춘다. 캐시는 모듈마다 go.sum 이
      # 달라 setup-go 의 기본 캐시 키(루트 go.sum)가 맞지 않아 끈다.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # 도구는 Node 로 돌지만 의존(ajv)은 쓰지 않는다. build/test 는 모듈별로
      # `GOWORK=off` 로 go build / go test 를 부른다 — 모듈이 자기 go.mod/go.sum
      # 만으로 서는지를 그대로 본다.
      #
      # `--terra` 를 주지 않는다. 그래서 Terra 의 Master 계약 파일을 읽는
      # io.terra.treebench 시험 둘은 **이름이 로그에 찍히며** 빠진다
      # (tools/test-modules.mjs 의 NEEDS_TERRA). 그 대조는 Terra 쪽 CI 몫이다.
      - name: Build modules that carry Go source
        run: node tools/build-modules.mjs

      - name: Test modules that carry Go source
        run: node tools/test-modules.mjs
