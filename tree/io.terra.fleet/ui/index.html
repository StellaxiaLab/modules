<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fleet</title>
<link rel="stylesheet" href="fleet.css">
</head>
<body>

<header class="topbar">
  <span class="brand">Fleet</span>
  <span id="session-pill" class="pill dim">세션 없음</span>
  <span class="spacer"></span>
  <button id="create-fleet" class="btn primary" type="button">Fleet 선언</button>
  <button id="refresh" class="btn" type="button">새로고침</button>
</header>

<div class="shell">
  <nav class="side" aria-label="Fleet 목록">
    <h2>Fleet</h2>
    <div id="fleet-list" class="list"><p class="empty">읽는 중…</p></div>
  </nav>

  <main class="main" id="main">
    <p class="empty">왼쪽에서 Fleet을 선택하십시오.</p>
  </main>
</div>

<div id="toast" class="toast" hidden></div>

<script src="fleet.js"></script>
</body>
</html>
