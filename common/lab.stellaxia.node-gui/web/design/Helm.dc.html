<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Terra 나침반 조타륜</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&amp;family=Cormorant+Garamond:wght@600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#ffffff}
.hm-drag{cursor:grab;touch-action:none;outline:none}
.hm-drag:active{cursor:grabbing}
.hm-drag:focus-visible{box-shadow:0 0 0 2px #b08d57 inset;border-radius:10px}
</style>
</helmet>
<!-- 나침반 조타륜 (테스트): 새긴 선 느낌의 눈금 고리. 홀드하고 좌우로 끌면 돈다 (놓으면 관성으로 돌다 1°에 멈춘다)
     눈금 그림은 한 번만 만들어 붙이고, 돌릴 때는 그룹의 transform만 바꾼다 (다시 그리지 않음) -->
<div style="width: 1064px; height: 461px; display: flex; gap: 20px; padding: 18px 22px; box-sizing: border-box; background: #efe8d8; color: #6b5230; font-family: 'Noto Sans KR','Noto Sans',system-ui,sans-serif; border: 1px solid #d9ccb0; border-radius: 12px; overflow: hidden;">
  <div style="width: 680px; flex-shrink: 0; display: flex; flex-direction: column; gap: 6px;">
    <div style="display: flex; align-items: baseline; gap: 10px;">
      <b style="font-size: 15px; color: #5a4526; white-space: nowrap;">나침반 조타륜</b>
      <span style="font-size: 12px; color: #9c7a45; white-space: nowrap;">끌어 돌리기 · ← → 1° · Shift 10°</span>
      <span style="flex-grow: 1;"></span>
      <label style="display: flex; align-items: center; gap: 8px; white-space: nowrap; font-size: 12px; font-weight: 600; color: #6b5230; align-self: center;">곡률
        <input data-hm-curve="1" type="range" min="0" max="100" value="54" aria-label="눈금 원호의 곡률 — 왼쪽은 납작하게, 오른쪽은 둥글게" onInput="{{curve}}" style="width: 120px; accent-color: #9c7a45;">
        <span data-hm-rv="1" style="width: 58px; font-weight: 500; color: #9c7a45; font-variant-numeric: tabular-nums;">R 1313</span>
      </label>
    </div>
    <div data-hm-arcwrap="1" class="hm-drag" tabindex="0" role="slider" aria-label="방위 — 좌우로 끌어 돌리기" aria-valuemin="0" aria-valuemax="359" onPointerDown="{{down}}" onPointerMove="{{move}}" onPointerUp="{{up}}" onPointerCancel="{{up}}" onKeyDown="{{key}}" style="position: relative; width: 680px; height: 392px; border-radius: 10px; overflow: hidden;">
      <svg data-hm-arc="1" width="680" height="392" viewBox="0 0 680 392" aria-hidden="true" style="display: block;"></svg>
    </div>
  </div>
  <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;">
    <div class="hm-drag" tabindex="-1" onPointerDown="{{downWheel}}" onPointerMove="{{move}}" onPointerUp="{{up}}" onPointerCancel="{{up}}" style="width: 320px; height: 320px;">
      <svg data-hm-wheel="1" width="320" height="320" viewBox="0 0 320 320" aria-hidden="true" style="display: block;"></svg>
    </div>
    <div style="display: flex; align-items: baseline; gap: 10px;">
      <span data-hm-deg="1" style="font-family: 'Cormorant Garamond', Georgia, serif; font-size: 38px; font-weight: 700; color: #5a4526; font-variant-numeric: tabular-nums; min-width: 92px; text-align: right;">000°</span>
      <span data-hm-dir="1" style="font-size: 14px; font-weight: 600; color: #9c7a45; min-width: 76px;">북 N</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1064,"height":461}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.rot = 0;       // 눈금판이 시계 방향으로 돈 각도(°). 방위 = -rot
    this.arcR = this.curveR(54); // 큰 원호 반지름 (곡률 슬라이더 기본값 54 ≈ R 1320)
    this.vel = 0;       // 놓은 뒤 관성 (°/s)
  }
  // ───── 새긴 선 눈금 고리 (SVG 문자열) ─────
  // 바깥 두 줄 → 1° 짧은 눈금 · 5° 중간 · 10° 긴 눈금 → 줄 → 숫자 · 방위 글자 → 줄 → 점 고리 → 줄 → 빗금 띠
  ring(cx, cy, R, o) {
    const C = '#9c7a45', D = '#6b5230', L = '#b89a66', f = (v) => Math.round(v * 100) / 100, out = [];
    const circ = (r, w, col) => out.push('<circle cx="' + cx + '" cy="' + cy + '" r="' + f(r) + '" fill="none" stroke="' + (col || C) + '" stroke-width="' + w + '"/>');
    // sc: 눈금 1°가 원 위에서 차지하는 각도(°). 큰 원호는 반지름과 상관없이 눈금 간격(px)이 같도록 sc를 맞춘다
    // lo ~ hi: 그릴 눈금 범위 (큰 원호는 지금 방위 주변만 — 원을 한 바퀴 넘겨 겹치지 않게)
    const sc = o.sc || 1, lo = o.lo != null ? o.lo : 0, hi = o.hi != null ? o.hi : 360, nm = (d) => ((d % 360) + 360) % 360;
    const rad = (a, r) => { const t = (a * sc - 90) * Math.PI / 180; return [f(cx + Math.cos(t) * r), f(cy + Math.sin(t) * r)]; };
    const band = o.band, step = o.step || 1, r0 = R - 7;
    circ(R, o.w1 || 2.4, D); circ(R - 5, 1);
    for (let d = lo; d < hi; d += step) {
      const big = nm(d) % 10 === 0, mid = nm(d) % 5 === 0, len = big ? band : mid ? band * 0.62 : band * 0.36;
      const [x1, y1] = rad(d, r0), [x2, y2] = rad(d, r0 - len);
      out.push('<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '" stroke="' + (big ? D : C) + '" stroke-width="' + (big ? o.tw * 1.9 : mid ? o.tw * 1.35 : o.tw) + '" stroke-linecap="round"/>');
    }
    const rN = r0 - band - 3; circ(rN, 1.1);
    // 숫자 · 방위 글자: 고리를 따라 눕혀 쓴다 (위에서 똑바로 읽힌다)
    const NAMES = { 0: 'N', 90: 'E', 180: 'S', 270: 'W' };
    for (let d = Math.ceil(lo / o.numEvery) * o.numEvery; d < hi; d += o.numEvery) {
      const [x, y] = rad(d, rN - o.fs * 0.95), card = NAMES[nm(d)];
      out.push('<text x="' + x + '" y="' + y + '" transform="rotate(' + f(d * sc) + ' ' + x + ' ' + y + ')" text-anchor="middle" dominant-baseline="central" font-family="Cormorant Garamond, Georgia, serif" font-weight="700" font-size="' + (card ? o.fs * 1.35 : o.fs) + '" fill="' + (card ? D : C) + '">' + (card || nm(d)) + '</text>');
    }
    const rD = rN - o.fs * 1.9; circ(rD, 1.1);
    // 점 고리 · 사이 사이 작은 마름모
    for (let d = Math.ceil(lo / o.dotEvery) * o.dotEvery; d < hi; d += o.dotEvery) {
      const [x, y] = rad(d, rD - o.dotGap);
      out.push(nm(d) % (o.dotEvery * 5) === 0 ? '<rect x="' + f(x - 2.2) + '" y="' + f(y - 2.2) + '" width="4.4" height="4.4" transform="rotate(' + f(d * sc + 45) + ' ' + x + ' ' + y + ')" fill="' + D + '"/>' : '<circle cx="' + x + '" cy="' + y + '" r="' + o.dotR + '" fill="' + C + '"/>');
    }
    const rH = rD - o.dotGap * 2; circ(rH, 1.1);
    // 빗금 띠: 비스듬한 가는 선 (새긴 느낌)
    for (let d = lo; d < hi; d += o.hatch) { const [x1, y1] = rad(d, rH), [x2, y2] = rad(d + o.hatch * 1.6, rH - o.hatchW); out.push('<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '" stroke="' + L + '" stroke-width="0.8"/>'); }
    circ(rH - o.hatchW, 1.3, D);
    return { svg: out.join(''), inner: rH - o.hatchW };
  }
  // 나침반 별: 방위 넷은 길게 · 사이 넷은 짧게. 반쪽은 채우고 반쪽은 선만 (새긴 판화 느낌)
  rose(cx, cy, r) {
    const D = '#6b5230', C = '#9c7a45', f = (v) => Math.round(v * 100) / 100, out = [];
    const pt = (a, rr) => { const t = (a - 90) * Math.PI / 180; return [f(cx + Math.cos(t) * rr), f(cy + Math.sin(t) * rr)]; };
    [[45, 0.62, 0.13], [0, 1, 0.16]].forEach(([off, len, wide]) => {
      for (let k = 0; k < 4; k++) {
        const a = off + k * 90, tip = pt(a, r * len), l = pt(a - 45, r * wide), rr = pt(a + 45, r * wide);
        out.push('<polygon points="' + [cx, cy].join(',') + ' ' + tip.join(',') + ' ' + l.join(',') + '" fill="' + (len === 1 ? D : C) + '" stroke="' + D + '" stroke-width="0.9" stroke-linejoin="round"/>');
        out.push('<polygon points="' + [cx, cy].join(',') + ' ' + tip.join(',') + ' ' + rr.join(',') + '" fill="#efe8d8" stroke="' + D + '" stroke-width="0.9" stroke-linejoin="round"/>');
      }
    });
    out.push('<circle cx="' + cx + '" cy="' + cy + '" r="' + f(r * 0.1) + '" fill="#efe8d8" stroke="' + D + '" stroke-width="1.2"/><circle cx="' + cx + '" cy="' + cy + '" r="' + f(r * 0.04) + '" fill="' + D + '"/>');
    return out.join('');
  }
  // 조타륜 손잡이: 고리 밖으로 뻗은 살 8개 + 끝의 손잡이
  spokes(cx, cy, r0, r1) {
    const D = '#6b5230', C = '#9c7a45', f = (v) => Math.round(v * 100) / 100, out = [];
    for (let k = 0; k < 8; k++) {
      const t = (k * 45 - 90) * Math.PI / 180, ux = Math.cos(t), uy = Math.sin(t), nx = -uy, ny = ux;
      const a = [cx + ux * r0, cy + uy * r0], b = [cx + ux * (r1 - 16), cy + uy * (r1 - 16)], w = 3.2;
      out.push('<polygon points="' + [a[0] + nx * w, a[1] + ny * w, b[0] + nx * w * 0.8, b[1] + ny * w * 0.8, b[0] - nx * w * 0.8, b[1] - ny * w * 0.8, a[0] - nx * w, a[1] - ny * w].map(f).join(',') + '" fill="#efe8d8" stroke="' + D + '" stroke-width="1.1"/>');
      const k1 = [cx + ux * (r1 - 16), cy + uy * (r1 - 16)], k2 = [cx + ux * r1, cy + uy * r1];
      out.push('<line x1="' + f(k1[0]) + '" y1="' + f(k1[1]) + '" x2="' + f(k2[0]) + '" y2="' + f(k2[1]) + '" stroke="' + D + '" stroke-width="9" stroke-linecap="round"/>');
      out.push('<line x1="' + f(k1[0]) + '" y1="' + f(k1[1]) + '" x2="' + f(k2[0]) + '" y2="' + f(k2[1]) + '" stroke="' + C + '" stroke-width="5" stroke-linecap="round"/>');
    }
    return out.join('');
  }
  // 큰 원호의 안쪽: 가는 줄 · 10°마다 짧은 표시
  inner(cx, cy, r, sc, lo, hi) {
    const C = '#9c7a45', D = '#6b5230', L = '#b89a66', f = (v) => Math.round(v * 100) / 100, out = [];
    const circ = (rr, w, col) => out.push('<circle cx="' + cx + '" cy="' + cy + '" r="' + f(rr) + '" fill="none" stroke="' + (col || C) + '" stroke-width="' + w + '"/>');
    const pt = (a, rr) => { const t = (a * sc - 90) * Math.PI / 180; return [f(cx + Math.cos(t) * rr), f(cy + Math.sin(t) * rr)]; };
    circ(r - 10, 0.9, L);
    for (let d = Math.ceil(lo / 10) * 10; d < hi; d += 10) { const [x1, y1] = pt(d, r - 10), [x2, y2] = pt(d, r - 22); out.push('<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '" stroke="' + C + '" stroke-width="1"/>'); }
    circ(r - 22, 1.1);
    return out.join('');
  }
  // 큰 원호의 반지름: 곡률 슬라이더(0~100)가 정한다. 원호 꼭대기는 늘 y=60에 둔다
  get ARC() { const R = this.arcR || 1320; return { cx: 340, cy: 60 + R, R }; }
  // 곡률 슬라이더 값 → 반지름 (지수 눈금: 0 = 6000 납작, 100 = 360 둥글게). 눈금 간격은 곡률과 상관없이 1° = DPX(px)
  curveR(v) { return Math.round(6000 * Math.pow(360 / 6000, v / 100)); }
  get DPX() { return 23; }
  get SC() { return this.DPX * 180 / (Math.PI * this.ARC.R); }        // 눈금 1°가 원 위에서 차지하는 각도(°)
  setCurve(v) {
    this.arcR = this.curveR(v);
    this.buildArc(); this.apply();
  }
  build() { this.buildArc(); this.buildWheel(); this.apply(); }
  buildArc() {
    // 큰 원호: 원의 중심을 화면 아래 멀리 두어 눈금 고리의 윗부분만 보인다 (반지름이 클수록 납작 — 곡률 슬라이더)
    const A = this.ARC;
    const rv = document.querySelector('[data-hm-rv]'); if (rv) rv.textContent = 'R ' + A.R;
    // 지금 방위 주변만 그린다 — 반 바퀴(πR)보다 조금 덜. 많이 돌면 apply()가 가운데를 옮겨 다시 그린다
    const N = Math.min(180, Math.floor(Math.PI * A.R / this.DPX) - 2), c = Math.round(-this.rot), sc = this.SC;
    this._arcC = c; this._arcN = N;
    const ra = this.ring(A.cx, A.cy, A.R, { sc, lo: c - N, hi: c + N + 1, band: 30, tw: 1.1, fs: 17, numEvery: 5, dotEvery: 2, dotGap: 8, dotR: 1.7, hatch: 1.2, hatchW: 14 });
    const arc = document.querySelector('[data-hm-arc]');
    if (arc) arc.innerHTML =
      '<g data-hm-rot="arc">' + ra.svg + this.inner(A.cx, A.cy, ra.inner, sc, c - N, c + N + 1) + '</g>' +
      // 가운데 고정 바늘(러버 라인): 위에서 눈금을 짚는 삼각형 + 가는 선
      '<line x1="340" y1="44" x2="340" y2="152" stroke="#8a2f22" stroke-width="1.6"/><polygon points="332,30 348,30 340,46" fill="#8a2f22"/>' +
      '<rect x="0" y="0" width="680" height="392" fill="url(#hm-fade)"/>' +
      '<defs><linearGradient id="hm-fade" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#efe8d8" stop-opacity="1"/><stop offset="0.12" stop-color="#efe8d8" stop-opacity="0"/><stop offset="0.88" stop-color="#efe8d8" stop-opacity="0"/><stop offset="1" stop-color="#efe8d8" stop-opacity="1"/></linearGradient></defs>';
  }
  buildWheel() {
    // 작은 조타륜: 전체 고리 + 별 + 손잡이
    const W = { cx: 160, cy: 160, R: 118 };
    const rw = this.ring(W.cx, W.cy, W.R, { band: 13, tw: 0.7, fs: 10, numEvery: 30, dotEvery: 6, dotGap: 5, dotR: 1.1, hatch: 2.5, hatchW: 7, step: 2, w1: 2 });
    const wh = document.querySelector('[data-hm-wheel]');
    if (wh) wh.innerHTML = '<g data-hm-rot="wheel">' + this.spokes(W.cx, W.cy, W.R, 158) + '<circle cx="160" cy="160" r="' + (W.R + 1) + '" fill="#efe8d8"/>' + rw.svg + this.rose(W.cx, W.cy, rw.inner - 6) + '</g>' +
      '<polygon points="153,2 167,2 160,15" fill="#8a2f22"/>';
    this.apply();
  }
  apply() {
    const r = this.rot, h = ((-Math.round(r) % 360) + 360) % 360;
    const a = document.querySelector('[data-hm-rot="arc"]'), w = document.querySelector('[data-hm-rot="wheel"]');
    if (this._arcN != null && this._arcN < 180 && Math.abs(-r - this._arcC) > this._arcN / 2) this.buildArc();   // 그린 범위 끝에 가까워지면 가운데를 옮겨 다시 그림
    const a2 = document.querySelector('[data-hm-rot="arc"]');
    if (a2) a2.setAttribute('transform', 'rotate(' + (r * this.SC).toFixed(3) + ' 340 ' + this.ARC.cy + ')');
    if (w) w.setAttribute('transform', 'rotate(' + r.toFixed(2) + ' 160 160)');
    const NAMES = ['북 N', '북북동 NNE', '북동 NE', '동북동 ENE', '동 E', '동남동 ESE', '남동 SE', '남남동 SSE', '남 S', '남남서 SSW', '남서 SW', '서남서 WSW', '서 W', '서북서 WNW', '북서 NW', '북북서 NNW'];
    const dg = document.querySelector('[data-hm-deg]'), dr = document.querySelector('[data-hm-dir]'), wrap = document.querySelector('[data-hm-arcwrap]');
    if (dg) dg.textContent = String(h).padStart(3, '0') + '°';
    if (dr) dr.textContent = NAMES[Math.round(h / 22.5) % 16];
    if (wrap) wrap.setAttribute('aria-valuenow', String(h));
  }
  componentDidMount() {
    this.build();
    let last = performance.now();
    const loop = (now) => {
      if (this._dead) return;
      const dt = Math.min(0.05, (now - last) / 1000); last = now;
      if (!this.drag) {
        if (Math.abs(this.vel) > 4) { this.rot += this.vel * dt; this.vel *= Math.exp(-dt * 2.6); this.apply(); }
        else {
          // 멈출 때는 가장 가까운 1°로 부드럽게 붙는다
          this.vel = 0;
          const tgt = Math.round(this.rot), d = tgt - this.rot;
          if (Math.abs(d) > 0.002) { this.rot += d * Math.min(1, dt * 12); this.apply(); }
        }
      }
      this._raf = requestAnimationFrame(loop);
    };
    this._raf = requestAnimationFrame(loop);
  }
  componentWillUnmount() { this._dead = true; cancelAnimationFrame(this._raf); }

  renderVals() {
    // 끌기: 큰 원호는 1px = 원호 위 1px (손가락 밑 눈금이 그대로 따라온다), 조타륜은 1px = 0.5°
    const start = (e, k) => {
      try { e.currentTarget.setPointerCapture(e.pointerId); } catch (er) { /* 무시 */ }
      this.drag = { x: e.clientX, rot: this.rot, k, t: performance.now(), lx: e.clientX };
      this.vel = 0;
    };
    return {
      curve: (e) => this.setCurve(Number(e.target.value)),
      down: (e) => start(e, 1 / this.DPX),
      downWheel: (e) => start(e, 0.5),
      move: (e) => {
        const D = this.drag; if (!D) return;
        const r = e.currentTarget.getBoundingClientRect(), sc = r.width / (e.currentTarget.offsetWidth || r.width) || 1;
        const now = performance.now(), dx = (e.clientX - D.x) / sc;
        this.rot = D.rot + dx * D.k;
        const inst = ((e.clientX - D.lx) / sc) * D.k / Math.max(0.008, (now - D.t) / 1000);
        this.vel = this.vel * 0.7 + inst * 0.3; D.t = now; D.lx = e.clientX;
        this.apply();
      },
      up: () => { if (this.drag && performance.now() - this.drag.t > 80) this.vel = 0; this.drag = null; },
      key: (e) => {
        const st = e.shiftKey ? 10 : 1;
        if (e.key === 'ArrowLeft') { this.rot = Math.round(this.rot) - st; this.vel = 0; this.apply(); e.preventDefault(); }
        else if (e.key === 'ArrowRight') { this.rot = Math.round(this.rot) + st; this.vel = 0; this.apply(); e.preventDefault(); }
      }
    };
  }
}
</script>
</body>
</html>
