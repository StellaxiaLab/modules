<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Terra · 시작</title>
<style>
body{margin:0;background:#0b222d;overflow:hidden}
@keyframes in-rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
.in-rise{animation:in-rise 700ms cubic-bezier(.2,.8,.3,1) both}
@keyframes in-shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
.in-shake{animation:in-shake 420ms cubic-bezier(.3,.7,.3,1)}
@keyframes in-spin{to{transform:rotate(360deg)}}
@keyframes in-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes in-away{0%{transform:translateY(0)}18%{transform:translateY(14px)}100%{transform:translateY(-120vh)}}
.in-away{animation:in-away 1100ms cubic-bezier(.55,0,.75,.3) both}
.in-field{transition:border-color 140ms,box-shadow 140ms}
.in-field:focus-within{border-color:#ede9e1;box-shadow:0 0 0 4px rgba(237,233,225,0.10)}
.in-field input{outline:none}
.in-btn{transition:filter 120ms,transform 120ms}
.in-btn:hover{background:#ffffff!important}
.in-ghost:hover{background:rgba(255,255,255,.09)!important;color:#ede9e1!important}
.in-eye:hover{color:#ede9e1!important}
.in-sw .in-knob{background:#9aa1ab}
[aria-checked="true"] .in-sw .in-knob{background:#111111}
.in-field input::placeholder{color:#6b7280}
::selection{background:rgba(255,216,77,.35)}
:focus-visible{outline:2px solid #ffd84d;outline-offset:2px}
.in-field input:focus-visible{outline:none}
.in-btn:active{transform:translateY(1px)}
.in-sw{transition:background 260ms}
@keyframes in-turn{to{transform:rotate(360deg)}}
.in-wheel{animation:in-turn 80s linear infinite;transform-origin:center;transform-box:fill-box}
.in-sw span{transition:transform 260ms cubic-bezier(.34,1.56,.64,1),background 260ms}
</style>
<style>
html,body{margin:0;background:#dfe3ea}
html,body{height:100%;overflow:hidden;background:#a9dbf7}
#stage{position:fixed;left:0;top:0;width:100vw;height:100vh}
</style>
</head>
<body>
<div id="stage"></div>
<script type="text/x-template" id="view">
<!-- 인트로 (새 씬): 바다와 맑은 하늘의 수평선 위에 로그인 판. 배경은 캔버스에 직접 그린다 (렌더 밖 — introSky) -->
<div data-in-root="1" style="position: relative; width: 100vw; height: 100vh; min-width: 360px; min-height: 520px; overflow: hidden; background: #0b222d; color: #ede9e1; font-family: 'Noto Sans KR','Noto Sans CJK KR',system-ui,sans-serif; font-size: 14px; line-height: 1.5;">
  <canvas data-in-sky="1" aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block;"></canvas>
  <div aria-hidden="true" style="position: absolute; inset: 0; pointer-events: none; opacity: {{v.chromeOp}}; transition: opacity 900ms; background: linear-gradient(180deg, rgba(8,12,30,0.52) 0%, rgba(18,22,46,0.34) 36%, rgba(90,52,44,0.14) 55%, rgba(4,16,26,0.34) 63%, rgba(2,8,14,0.60) 100%), radial-gradient(ellipse 75% 65% at 50% 46%, rgba(0,0,0,0) 45%, rgba(0,0,0,0.38) 100%);"></div>

  <sc-if value="{{v.frameOn}}" hint-placeholder-val="{{false}}">
    <iframe data-in-map="1" data-src="node.html" title="Terra 노드 화면" style="position: absolute; left: 0; top: 0; width: 100%; height: 100%; border: 0; opacity: 0; z-index: 1; pointer-events: none; background: transparent;"></iframe>
  </sc-if>
  <!-- 맵(노드 화면)을 못 읽었을 때: 구름이 걷힌 뒤 바로 갈 수 있는 길 -->
  <sc-if value="{{v.mapFail}}" hint-placeholder-val="{{false}}">
    <a data-in-fallback="1" href="node.html" class="in-btn in-rise" style="position: absolute; left: 50%; top: 50%; z-index: 4; transform: translate(-50%, -50%); height: 48px; padding: 0 22px; border-radius: 12px; background: #ede9e1; color: #111111; font-size: 14.5px; font-weight: 700; text-decoration: none; display: flex; align-items: center; box-shadow: 0 10px 30px rgba(0,0,0,0.77);">노드 화면으로 →</a>
  </sc-if>
  <canvas data-in-fly="1" aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; z-index: 2; pointer-events: none;"></canvas>

  <!-- 로그인 판: 테이블과 같은 흰 젤코트 · 짙은 남색 테두리 · 안쪽 남색 줄 -->

    <div data-in-stack="1" class="{{v.cardCls}}" style="position: relative; width: 384px; max-width: 100%; margin-top: {{v.cardTop}}px; pointer-events: none;">
      <!-- 조타륜: 판 뒤에서 위쪽 절반쯤만 보인다(판 속에 잠김). 천천히 돈다 -->

          <defs>
            <linearGradient id="in-gel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a2f37"></stop><stop offset="1" stop-color="#121418"></stop></linearGradient>
          </defs>
          <g class="in-wheel">
            <sc-for list="{{v.spokes}}" as="sp" hint-placeholder-count="8">
              <g transform="rotate({{sp.a}})">
                <rect x="-6.5" y="-150" width="13" height="110" fill="url(#in-gel)" stroke="rgba(237,233,225,0.42)" stroke-width="1.6"></rect>
                <rect x="-9.5" y="-179" width="19" height="40" rx="9.5" fill="url(#in-gel)" stroke="rgba(237,233,225,0.42)" stroke-width="1.6"></rect>
                <rect x="-4" y="-174" width="3" height="28" rx="1.5" fill="rgba(237,233,225,0.30)"></rect>
              </g>
            </sc-for>
            <circle r="132" fill="none" stroke="rgba(237,233,225,0.42)" stroke-width="22"></circle>
            <circle r="132" fill="none" stroke="#16191e" stroke-width="18.8"></circle>
            <circle r="132" fill="none" stroke="rgba(237,233,225,0.22)" stroke-width="1.2" opacity="0.85"></circle>
            <circle r="136.5" fill="none" stroke="rgba(255,255,255,0.10)" stroke-width="2"></circle>
          </g>
        </svg>
      </div>
      <!-- 가운데 베어링: 고정(돌지 않음). 스테인리스 고리 + 흰 판 + Terra 로고. 판 윗변에 걸쳐 있다 -->
      <div aria-hidden="true" style="position: absolute; left: 50%; top: -106px; width: 212px; height: 212px; margin-left: -106px; z-index: 2; border-radius: 50%; box-sizing: border-box; border: 1.5px solid rgba(237,233,225,0.45); background: linear-gradient(180deg, #1d2128, #0d0f13 55%, #16191e); box-shadow: 0 14px 34px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.10); display: flex; align-items: center; justify-content: center;">

          <img src="data:image/svg+xml;base64,PD94bWwgdmVyc2lvbj0iMS4wIiBlbmNvZGluZz0iVVRGLTgiPz4KPHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9Ii0xMiAtMTIgMjI0IDIyNCIgd2lkdGg9IjEwMjQiIGhlaWdodD0iMTAyNCI+PHRpdGxlPlRlcnJhPC90aXRsZT48ZGVmcz48ZmlsdGVyIGlkPSJyb3VnaCIgeD0iLTEwJSIgeT0iLTEwJSIgd2lkdGg9IjEyMCUiIGhlaWdodD0iMTIwJSI+PGZlVHVyYnVsZW5jZSB0eXBlPSJmcmFjdGFsTm9pc2UiIGJhc2VGcmVxdWVuY3k9IjEuMSIgbnVtT2N0YXZlcz0iMiIgc2VlZD0iNyIgcmVzdWx0PSJuIj48L2ZlVHVyYnVsZW5jZT48ZmVEaXNwbGFjZW1lbnRNYXAgaW49IlNvdXJjZUdyYXBoaWMiIGluMj0ibiIgc2NhbGU9IjIuNCI+PC9mZURpc3BsYWNlbWVudE1hcD48L2ZpbHRlcj48L2RlZnM+PGcgZmlsdGVyPSJ1cmwoI3JvdWdoKSI+PHBhdGggZmlsbD0iI0RDREFENSIgZD0iTTggMjIgTDUwIDMxIEw0MCAxOCBMNzAgMjggTDc4IDI2IEw4MCA5IEw5MCAyNCBMMTE2IDMwIEwxNTAgMjkgTDE1OCAzNCBMMTg0IDE5IEwxNjggNDYgTDE1MCA0MiBMMTM4IDQ3IEwxMjMgNTcgTDExOSA5OCBMMTM2IDEwMCBMMTIxIDExMiBMMTE3IDEyNSBMMTIzIDE1OCBMMTQyIDE3NCBMNTIgMTc0IEw3NiAxNDggTDg2IDExOCBMODggMTA2IEw4MyA4MSBMOTMgODggTDk4IDcyIEw5NSA2MCBMNjQgNDUgTDI2IDQ5IEwzOCA0MFoiPjwvcGF0aD48cGF0aCBmaWxsPSIjRENEQUQ1IiBkPSJNMTkxLjIgNzcuMyBMMTk3LjkgOTQuOSBMMTkzLjEgMTEzLjEgTDE5Mi4zIDk1LjJaIj48L3BhdGg+PHBhdGggZmlsbD0iI0RDREFENSIgZD0iTTE4Ny4yIDEzNS4yIEwxODUuNiAxNDUuNSBMMTc3LjkgMTUyLjYgTDE4MS45IDE0My42WiI+PC9wYXRoPjxwYXRoIGZpbGw9IiNEQ0RBRDUiIGQ9Ik0xNjIuOSAxNjkuOSBMMTUwLjcgMTg0LjQgTDEzMi4xIDE4OC4zIEwxNDcuNSAxNzkuMFoiPjwvcGF0aD48cGF0aCBmaWxsPSIjRENEQUQ1IiBkPSJNNjQuOCAxODcuMiBMNTEuMyAxODQuNCBMNDIuMSAxNzQuMSBMNTMuNyAxODAuMloiPjwvcGF0aD48cGF0aCBmaWxsPSIjRENEQUQ1IiBkPSJNMjguMCAxNjAuNCBMMTMuOCAxNDcuOCBMMTAuNiAxMjkuMCBMMTkuNCAxNDQuN1oiPjwvcGF0aD48cGF0aCBmaWxsPSIjRENEQUQ1IiBkPSJNMTEuNyA2Ny45IEwxMy42IDU2LjAgTDIyLjEgNDcuNCBMMTcuMyA1Ny45WiI+PC9wYXRoPjxwYXRoIGZpbGw9IiNEQ0RBRDUiIGQ9Ik0zNy4xIDMwLjEgTDQ1LjIgMTguOCBMNTguOCAxNS41IEw0OC4zIDIzLjRaIj48L3BhdGg+PC9nPjxwYXRoIGZpbGw9IiNEQ0RBRDUiIGQ9Ik0xMTggMiBDMTE4LjM4IDguNDYgMTE5LjU0IDkuNjIgMTI2IDEwIEMxMTkuNTQgMTAuMzggMTE4LjM4IDExLjU0IDExOCAxOCBDMTE3LjYyIDExLjU0IDExNi40NiAxMC4zOCAxMTAgMTAgQzExNi40NiA5LjYyIDExNy42MiA4LjQ2IDExOCAyWiI+PC9wYXRoPjwvc3ZnPgo=" alt="Terra" width="118" height="118" style="width: 118px; height: 118px; filter: drop-shadow(0 0 14px rgba(237,233,225,0.12));">
        </div>
      </div>
    <!-- form 제출 대신 버튼 · Enter로 (캔버스처럼 form 제출이 막힌 곳에서도 돌게) -->
    <div data-in-card="1" role="form" aria-label="Terra 로그인" style="pointer-events: auto; position: relative; z-index: 1; width: 100%; box-sizing: border-box; padding: 30px 30px 24px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.12); background: linear-gradient(180deg, rgba(16,18,23,0.96), rgba(7,8,10,0.97)); backdrop-filter: blur(16px) saturate(1.1); -webkit-backdrop-filter: blur(16px) saturate(1.1); box-shadow: inset 0 1px 0 rgba(255,255,255,0.06), 0 30px 80px rgba(0,0,0,0.6), 0 4px 12px rgba(0,0,0,0.3); position: relative; display: flex; flex-direction: column;">
      <div style="position: relative; z-index: 1; display: flex; flex-direction: column; gap: 14px;">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 2px; margin-bottom: 4px; padding-top: 98px;">
        <span aria-label="Terra" style="font-size: 28px; font-weight: 600; letter-spacing: 0.42em; padding-left: 0.42em; line-height: 1.2; color: #ede9e1;">TERRA</span>
        <span style="margin-top: 4px; font-size: 12.5px; color: #9aa1ab;">{{v.sub}}</span>
      </div>

      <sc-if value="{{v.form}}" hint-placeholder-val="{{true}}">
        <!-- 모듈: 비밀번호는 Terra가 받는다. 이 판은 Terra 로그인 카드를 부르고(terra.emit('login')) 세션이 생기면 내려간다 -->
        <div data-in-terra="1" style="display: flex; flex-direction: column; gap: 6px; padding: 12px 14px; border: 1px solid rgba(255,255,255,0.12); border-radius: 12px; background: #0e1013;">
          <span style="display: flex; align-items: center; gap: 8px; font-size: 13.5px; font-weight: 700; color: #ede9e1;"><span style="width: 8px; height: 8px; flex-shrink: 0; border-radius: 50%; background: {{v.whoDot}};"></span>{{v.whoTitle}}</span>
          <span style="font-size: 12px; color: #9aa1ab; line-height: 1.5;">{{v.whoSub}}</span>
        </div>

        <span data-in-msg="1" style="min-height: 18px; font-size: 12px; font-weight: 600; color: {{v.msgC}};">{{v.msg}}</span>

        <button type="button" data-in-go="1" onClick="{{v.submit}}" class="in-btn" style="height: 48px; border: 0; border-radius: 10px; background: #ede9e1; color: #111111; font: inherit; font-size: 14.5px; font-weight: 700; letter-spacing: 0.02em; box-shadow: 0 8px 24px rgba(0,0,0,0.35); cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px;">
          <sc-if value="{{v.busy}}" hint-placeholder-val="{{false}}"><span aria-hidden="true" style="width: 16px; height: 16px; border-radius: 50%; border: 2px solid rgba(0,0,0,0.15); border-top-color: #111111; animation: in-spin 700ms linear infinite;"></span></sc-if>
          {{v.goLabel}}
        </button>
        <span style="font-size: 11px; color: #9aa1ab; text-align: center;">{{v.goNote}}</span>
      </sc-if>

      <!-- 자동 로그인 중 · 로그인됨 -->
      <sc-if value="{{v.status}}" hint-placeholder-val="{{false}}">
        <div data-in-status="1" style="display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 10px 0 4px;">
          <span aria-hidden="true" style="width: 54px; height: 54px; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-sizing: border-box; background: {{v.stBg}}; border: 1px solid {{v.stLine}}; color: #0b0d11; font-size: 26px; font-weight: 800;">
            <sc-if value="{{v.busy}}" hint-placeholder-val="{{true}}"><span style="width: 26px; height: 26px; border-radius: 50%; border: 2.5px solid rgba(255,255,255,0.12); border-top-color: #ede9e1; animation: in-spin 800ms linear infinite;"></span></sc-if>
            <sc-if value="{{v.ok}}" hint-placeholder-val="{{false}}"><svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round;"><path d="M5 12l5 5 9-10"></path></svg></sc-if>
          </span>
          <span style="font-size: 15px; font-weight: 700; color: #ede9e1;">{{v.stTitle}}</span>
          <span style="font-size: 12.5px; color: #9aa1ab; text-align: center;">{{v.stSub}}</span>
          <sc-if value="{{v.ok}}" hint-placeholder-val="{{false}}">

          </sc-if>
          <sc-if value="{{v.canCancel}}" hint-placeholder-val="{{true}}">
            <button type="button" data-in-cancel="1" onClick="{{v.cancel}}" class="in-ghost" style="height: 34px; padding: 0 16px; border: 1px solid rgba(255,255,255,0.18); border-radius: 9px; background: rgba(255,255,255,0.04); color: #ede9e1; font: inherit; font-size: 12.5px; font-weight: 600; cursor: pointer;">취소 — 여기 머물기</button>

    <span class="in-mono" style="color: #9aa1ab; font-family: 'JetBrains Mono', ui-monospace, 'DejaVu Sans Mono', monospace; font-size: 11.5px;">{{v.gwText}}</span>
  </div>
  <div style="position: absolute; z-index: 3; opacity: {{v.chromeOp}}; pointer-events: {{v.chromePe}}; transition: opacity 400ms; right: 20px; bottom: 16px; height: 30px; display: flex; align-items: center; gap: 8px; padding: 0 12px; border-radius: 15px; background: rgba(13,15,19,0.72); border: 1px solid rgba(255,255,255,0.10); color: #ede9e1; font-size: 12px; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); box-shadow: 0 10px 30px rgba(0,0,0,0.30);">
    <span style="font-size: 10px; font-weight: 600; letter-spacing: 0.28em; color: #9aa1ab;">TERRA</span><span style="font-size: 11.5px; color: #9aa1ab;">Terra 노드</span><span style="font-size: 11.5px; font-weight: 700; color: #ede9e1;">{{v.where}}</span>
  </div>
</div>
</script>
<script type="module">
import './src/api/frame-boot.js';   // 첫 import — Terra 안이면 마운트보다 먼저 frame에 hello를 보낸다
import { mount, fit } from './src/runtime/dc.js';
import Screen from './src/screens/index.js';
import * as Boot from './src/boot/module.js';
const stage = document.getElementById('stage');
const View = (Boot.prep && Boot.prep('intro', Screen)) || Screen;   // 프로필이 예시를 지운 클래스를 돌려주면 그것을 띄운다
window.__screen = mount(View, { template: document.getElementById('view').textContent, target: stage, props: {} });

Boot.boot && Boot.boot('intro', window.__screen);
</script>
</body>
</html>
