<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Terra · 시작</title>
<style>
body{margin:0;background:#a9dbf7;overflow:hidden}
@keyframes in-rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
.in-rise{animation:in-rise 700ms cubic-bezier(.2,.8,.3,1) both}
@keyframes in-shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
.in-shake{animation:in-shake 420ms cubic-bezier(.3,.7,.3,1)}
@keyframes in-spin{to{transform:rotate(360deg)}}
@keyframes in-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes in-away{0%{transform:translateY(0)}18%{transform:translateY(14px)}100%{transform:translateY(-120vh)}}
.in-away{animation:in-away 1100ms cubic-bezier(.55,0,.75,.3) both}
.in-field{transition:border-color 140ms,box-shadow 140ms}
.in-field:focus-within{border-color:#1e3a5f;box-shadow:0 0 0 3px rgba(30,58,95,0.16)}
.in-field input{outline:none}
.in-btn{transition:filter 120ms,transform 120ms}
.in-btn:hover{filter:brightness(1.08)}
.in-btn:active{transform:translateY(1px)}
.in-sw{transition:background 160ms}
@keyframes in-turn{to{transform:rotate(360deg)}}
.in-wheel{animation:in-turn 80s linear infinite;transform-origin:center;transform-box:fill-box}
.in-sw span{transition:transform 180ms cubic-bezier(.3,.7,.3,1)}
</style>
<style>
html,body{margin:0;background:#dfe3ea}
html,body{height:100%;overflow:hidden;background:#a9dbf7}
#stage{position:fixed;left:0;top:0;width:100vw;height:100vh}
</style>
</head>
<body>
<div id="stage"></div>
<script type="text/x-template" id="view">
<!-- 인트로 (새 씬): 바다와 맑은 하늘의 수평선 위에 로그인 판. 배경은 캔버스에 직접 그린다 (렌더 밖 — introSky) -->
<div data-in-root="1" style="position: relative; width: 100vw; height: 100vh; min-width: 360px; min-height: 520px; overflow: hidden; background: #a9dbf7; color: #16191f; font-family: 'Noto Sans KR','Noto Sans',system-ui,'Segoe UI',-apple-system,sans-serif; font-size: 14px; line-height: 1.5;">
  <canvas data-in-sky="1" aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block;"></canvas>
  <!-- 로그인 성공 뒤: 카메라가 아래로 숙여지며(수평선이 위로) 구름을 지나 맵(노드 화면)이 드러난다. 노드 화면은 이 자리에서 미리 읽어 둔다 -->
  <sc-if value="{{v.frameOn}}" hint-placeholder-val="{{false}}">
    <iframe data-in-map="1" data-src="node.html" title="Terra 노드 화면" style="position: absolute; left: 0; top: 0; width: 100%; height: 100%; border: 0; opacity: 0; z-index: 1; pointer-events: none; background: transparent;"></iframe>
  </sc-if>
  <!-- 맵(노드 화면)을 못 읽었을 때: 구름이 걷힌 뒤 바로 갈 수 있는 길 -->
  <sc-if value="{{v.mapFail}}" hint-placeholder-val="{{false}}">
    <a data-in-fallback="1" href="node.html" class="in-btn in-rise" style="position: absolute; left: 50%; top: 50%; z-index: 4; transform: translate(-50%, -50%); height: 48px; padding: 0 22px; border-radius: 24px; background: #16191f; color: #ffffff; font-size: 15px; font-weight: 800; text-decoration: none; display: flex; align-items: center; box-shadow: 0 10px 30px rgba(14,58,84,0.35);">노드 화면으로 →</a>
  </sc-if>
  <canvas data-in-fly="1" aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; z-index: 2; pointer-events: none;"></canvas>

  <!-- 로그인 판: 테이블과 같은 흰 젤코트 · 짙은 남색 테두리 · 안쪽 남색 줄 -->
  <div style="position: absolute; inset: 0; z-index: 3; display: {{v.cardDisp}}; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box; pointer-events: none;">
    <div data-in-stack="1" class="{{v.cardCls}}" style="position: relative; width: 384px; max-width: 100%; margin-top: {{v.cardTop}}px; pointer-events: none;">
      <!-- 조타륜: 판 뒤에서 위쪽 절반쯤만 보인다(판 속에 잠김). 천천히 돈다 -->
      <div aria-hidden="true" style="position: absolute; left: 50%; top: -180px; width: 360px; height: 360px; margin-left: -180px; z-index: 0;">
        <svg width="360" height="360" viewBox="-180 -180 360 360" style="position: absolute; left: 0; top: 0; overflow: visible; filter: drop-shadow(0 6px 14px rgba(14,58,84,0.22));">
          <defs>
            <linearGradient id="in-gel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fdfdfb"></stop><stop offset="1" stop-color="#e6e9e6"></stop></linearGradient>
          </defs>
          <g class="in-wheel">
            <sc-for list="{{v.spokes}}" as="sp" hint-placeholder-count="8">
              <g transform="rotate({{sp.a}})">
                <rect x="-6.5" y="-150" width="13" height="110" fill="url(#in-gel)" stroke="#1f2a37" stroke-width="2"></rect>
                <rect x="-9.5" y="-179" width="19" height="40" rx="9.5" fill="url(#in-gel)" stroke="#1f2a37" stroke-width="2"></rect>
                <rect x="-4" y="-174" width="3" height="28" rx="1.5" fill="#ffffff"></rect>
              </g>
            </sc-for>
            <circle r="132" fill="none" stroke="#1f2a37" stroke-width="22"></circle>
            <circle r="132" fill="none" stroke="#f1f3f0" stroke-width="17.6"></circle>
            <circle r="132" fill="none" stroke="#1e3a5f" stroke-width="1.4" opacity="0.85"></circle>
            <circle r="136.5" fill="none" stroke="#ffffff" stroke-width="2"></circle>
          </g>
        </svg>
      </div>
      <!-- 가운데 베어링: 고정(돌지 않음). 스테인리스 고리 + 흰 판 + Terra 로고. 판 윗변에 걸쳐 있다 -->
      <div aria-hidden="true" style="position: absolute; left: 50%; top: -106px; width: 212px; height: 212px; margin-left: -106px; z-index: 2; border-radius: 50%; box-sizing: border-box; border: 2.2px solid #1f2a37; background: linear-gradient(180deg, #f4f6f8, #b9c0c9 50%, #e3e7ec); box-shadow: 0 8px 20px rgba(14,58,84,0.25); display: flex; align-items: center; justify-content: center;">
        <div style="width: 186px; height: 186px; border-radius: 50%; box-sizing: border-box; border: 2px solid #1f2a37; background: linear-gradient(180deg, #fdfdfb, #eef0ee); box-shadow: inset 0 0 0 4px #fdfdfb, inset 0 0 0 5.4px rgba(30,58,95,0.85), inset 0 3px 8px rgba(0,0,0,0.08); display: flex; align-items: center; justify-content: center;">
          <img src="data:image/svg+xml;base64,PD94bWwgdmVyc2lvbj0iMS4wIiBlbmNvZGluZz0iVVRGLTgiPz4KPHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9Ii0xMiAtMTIgMjI0IDIyNCIgd2lkdGg9IjEwMjQiIGhlaWdodD0iMTAyNCI+PHRpdGxlPlRlcnJhPC90aXRsZT48ZGVmcz48ZmlsdGVyIGlkPSJyb3VnaCIgeD0iLTEwJSIgeT0iLTEwJSIgd2lkdGg9IjEyMCUiIGhlaWdodD0iMTIwJSI+PGZlVHVyYnVsZW5jZSB0eXBlPSJmcmFjdGFsTm9pc2UiIGJhc2VGcmVxdWVuY3k9IjEuMSIgbnVtT2N0YXZlcz0iMiIgc2VlZD0iNyIgcmVzdWx0PSJuIj48L2ZlVHVyYnVsZW5jZT48ZmVEaXNwbGFjZW1lbnRNYXAgaW49IlNvdXJjZUdyYXBoaWMiIGluMj0ibiIgc2NhbGU9IjIuNCI+PC9mZURpc3BsYWNlbWVudE1hcD48L2ZpbHRlcj48L2RlZnM+PGcgZmlsdGVyPSJ1cmwoI3JvdWdoKSI+PHBhdGggZmlsbD0iIzEzMTMxMyIgZD0iTTggMjIgTDUwIDMxIEw0MCAxOCBMNzAgMjggTDc4IDI2IEw4MCA5IEw5MCAyNCBMMTE2IDMwIEwxNTAgMjkgTDE1OCAzNCBMMTg0IDE5IEwxNjggNDYgTDE1MCA0MiBMMTM4IDQ3IEwxMjMgNTcgTDExOSA5OCBMMTM2IDEwMCBMMTIxIDExMiBMMTE3IDEyNSBMMTIzIDE1OCBMMTQyIDE3NCBMNTIgMTc0IEw3NiAxNDggTDg2IDExOCBMODggMTA2IEw4MyA4MSBMOTMgODggTDk4IDcyIEw5NSA2MCBMNjQgNDUgTDI2IDQ5IEwzOCA0MFoiPjwvcGF0aD48cGF0aCBmaWxsPSIjMTMxMzEzIiBkPSJNMTkxLjIgNzcuMyBMMTk3LjkgOTQuOSBMMTkzLjEgMTEzLjEgTDE5Mi4zIDk1LjJaIj48L3BhdGg+PHBhdGggZmlsbD0iIzEzMTMxMyIgZD0iTTE4Ny4yIDEzNS4yIEwxODUuNiAxNDUuNSBMMTc3LjkgMTUyLjYgTDE4MS45IDE0My42WiI+PC9wYXRoPjxwYXRoIGZpbGw9IiMxMzEzMTMiIGQ9Ik0xNjIuOSAxNjkuOSBMMTUwLjcgMTg0LjQgTDEzMi4xIDE4OC4zIEwxNDcuNSAxNzkuMFoiPjwvcGF0aD48cGF0aCBmaWxsPSIjMTMxMzEzIiBkPSJNNjQuOCAxODcuMiBMNTEuMyAxODQuNCBMNDIuMSAxNzQuMSBMNTMuNyAxODAuMloiPjwvcGF0aD48cGF0aCBmaWxsPSIjMTMxMzEzIiBkPSJNMjguMCAxNjAuNCBMMTMuOCAxNDcuOCBMMTAuNiAxMjkuMCBMMTkuNCAxNDQuN1oiPjwvcGF0aD48cGF0aCBmaWxsPSIjMTMxMzEzIiBkPSJNMTEuNyA2Ny45IEwxMy42IDU2LjAgTDIyLjEgNDcuNCBMMTcuMyA1Ny45WiI+PC9wYXRoPjxwYXRoIGZpbGw9IiMxMzEzMTMiIGQ9Ik0zNy4xIDMwLjEgTDQ1LjIgMTguOCBMNTguOCAxNS41IEw0OC4zIDIzLjRaIj48L3BhdGg+PC9nPjxwYXRoIGZpbGw9IiMxMzEzMTMiIGQ9Ik0xMTggMiBDMTE4LjM4IDguNDYgMTE5LjU0IDkuNjIgMTI2IDEwIEMxMTkuNTQgMTAuMzggMTE4LjM4IDExLjU0IDExOCAxOCBDMTE3LjYyIDExLjU0IDExNi40NiAxMC4zOCAxMTAgMTAgQzExNi40NiA5LjYyIDExNy42MiA4LjQ2IDExOCAyWiI+PC9wYXRoPjwvc3ZnPgo=" alt="Terra" width="124" height="124" style="width: 124px; height: 124px;">
        </div>
      </div>
    <!-- form 제출 대신 버튼 · Enter로 (캔버스처럼 form 제출이 막힌 곳에서도 돌게) -->
    <div data-in-card="1" role="form" aria-label="Terra 로그인" style="pointer-events: auto; position: relative; z-index: 1; width: 100%; box-sizing: border-box; padding: 30px 30px 24px; border-radius: 24px; border: 2.2px solid #1f2a37; background: linear-gradient(180deg, #fdfdfb, #eef0ee); box-shadow: inset 0 0 0 4px #fdfdfb, inset 0 0 0 5.6px rgba(30,58,95,0.85), 0 24px 60px rgba(14,58,84,0.28), 0 4px 12px rgba(14,58,84,0.12); position: relative; display: flex; flex-direction: column;">
      <div style="position: relative; z-index: 1; display: flex; flex-direction: column; gap: 14px;">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 2px; margin-bottom: 4px; padding-top: 98px;">
        <span style="font-family: 'Cormorant Garamond', Georgia, serif; font-size: 38px; font-weight: 700; letter-spacing: 0.04em; line-height: 1.05; text-shadow: 0 1px 0 #fdfdfb;">Terra</span>
        <span style="font-size: 12.5px; color: #5b6472;">{{v.sub}}</span>
      </div>

      <sc-if value="{{v.form}}" hint-placeholder-val="{{true}}">
        <!-- 모듈: 비밀번호는 Terra가 받는다. 이 판은 Terra 로그인 카드를 부르고(terra.emit('login')) 세션이 생기면 내려간다 -->
        <div data-in-terra="1" style="display: flex; flex-direction: column; gap: 6px; padding: 12px 14px; border: 1px solid #d8dde5; border-radius: 12px; background: #ffffff;">
          <span style="display: flex; align-items: center; gap: 8px; font-size: 13.5px; font-weight: 700; color: #16191f;"><span style="width: 8px; height: 8px; flex-shrink: 0; border-radius: 50%; background: {{v.whoDot}};"></span>{{v.whoTitle}}</span>
          <span style="font-size: 12px; color: #5b6472; line-height: 1.5;">{{v.whoSub}}</span>
        </div>

        <span data-in-msg="1" style="min-height: 18px; font-size: 12px; font-weight: 600; color: {{v.msgC}};">{{v.msg}}</span>

        <button type="button" data-in-go="1" onClick="{{v.submit}}" class="in-btn" style="height: 48px; border: 0; border-radius: 12px; background: #16191f; color: #ffffff; font: inherit; font-size: 15px; font-weight: 800; letter-spacing: 0.02em; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px;">
          <sc-if value="{{v.busy}}" hint-placeholder-val="{{false}}"><span aria-hidden="true" style="width: 16px; height: 16px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.35); border-top-color: #ffffff; animation: in-spin 700ms linear infinite;"></span></sc-if>
          {{v.goLabel}}
        </button>
        <span style="font-size: 11px; color: #8b95a6; text-align: center;">{{v.goNote}}</span>
      </sc-if>

      <!-- 자동 로그인 중 · 로그인됨 -->
      <sc-if value="{{v.status}}" hint-placeholder-val="{{false}}">
        <div data-in-status="1" style="display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 10px 0 4px;">
          <span aria-hidden="true" style="width: 54px; height: 54px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: {{v.stBg}}; color: #ffffff; font-size: 26px; font-weight: 800;">
            <sc-if value="{{v.busy}}" hint-placeholder-val="{{true}}"><span style="width: 26px; height: 26px; border-radius: 50%; border: 3px solid rgba(255,255,255,0.35); border-top-color: #ffffff; animation: in-spin 800ms linear infinite;"></span></sc-if>
            <sc-if value="{{v.ok}}" hint-placeholder-val="{{false}}">✓</sc-if>
          </span>
          <span style="font-size: 15px; font-weight: 800;">{{v.stTitle}}</span>
          <span style="font-size: 12.5px; color: #5b6472; text-align: center;">{{v.stSub}}</span>
          <sc-if value="{{v.ok}}" hint-placeholder-val="{{false}}">
            <button type="button" onClick="{{v.logout}}" style="border: 0; background: transparent; color: #5b6472; font: inherit; font-size: 12.5px; cursor: pointer; text-decoration: underline;">다른 계정으로 로그인</button>
          </sc-if>
          <sc-if value="{{v.canCancel}}" hint-placeholder-val="{{true}}">
            <button type="button" data-in-cancel="1" onClick="{{v.cancel}}" style="height: 34px; padding: 0 16px; border: 1px solid #d8dde5; border-radius: 17px; background: #ffffff; font: inherit; font-size: 12.5px; font-weight: 700; cursor: pointer;">취소 — 여기 머물기</button>
          </sc-if>
        </div>
      </sc-if>
      </div>
    </div>
    </div>
  </div>

  <!-- 아래: 연결 상태 · 판 -->
  <div style="position: absolute; z-index: 3; opacity: {{v.chromeOp}}; pointer-events: {{v.chromePe}}; transition: opacity 400ms; left: 20px; bottom: 16px; display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 12px; border-radius: 15px; background: rgba(15,40,56,0.38); color: #ffffff; font-size: 12px; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);">
    <span style="width: 8px; height: 8px; border-radius: 50%; background: {{v.gwDot}}; box-shadow: 0 0 6px {{v.gwDot}};"></span>
    <span style="font-weight: 700;">Gateway</span>
    <span style="opacity: 0.85;">{{v.gwText}}</span>
  </div>
  <div style="position: absolute; z-index: 3; opacity: {{v.chromeOp}}; pointer-events: {{v.chromePe}}; transition: opacity 400ms; right: 20px; bottom: 16px; height: 30px; display: flex; align-items: center; gap: 8px; padding: 0 12px; border-radius: 15px; background: rgba(15,40,56,0.38); color: #ffffff; font-size: 12px; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);">
    <span>Terra 노드</span><span style="opacity: 0.6;">·</span><span style="font-weight: 700;">{{v.where}}</span>
  </div>
</div>
</script>
<script type="module">
import './src/api/frame-boot.js';   // 첫 import — Terra 안이면 마운트보다 먼저 frame에 hello를 보낸다
import { mount, fit } from './src/runtime/dc.js';
import Screen from './src/screens/index.js';
import * as Boot from './src/boot/module.js';
const stage = document.getElementById('stage');
const View = (Boot.prep && Boot.prep('intro', Screen)) || Screen;   // 프로필이 예시를 지운 클래스를 돌려주면 그것을 띄운다
window.__screen = mount(View, { template: document.getElementById('view').textContent, target: stage, props: {} });

Boot.boot && Boot.boot('intro', window.__screen);
</script>
</body>
</html>
