<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Terra · 조타륜 앱 노트 (디자인 노트)</title>
<style>
body{margin:0;font-family:'Noto Sans KR','Noto Sans',system-ui,'Segoe UI',-apple-system,sans-serif;background:#f4f6f9}
</style>
<style>
html,body{margin:0;background:#dfe3ea}
.frame{margin:12px auto;overflow:hidden;box-shadow:0 6px 24px rgba(22,25,31,0.16);border-radius:6px}
#stage{width:1600px;height:2540px;transform-origin:0 0;background:#ffffff}
</style>
</head>
<body>
<div class="frame"><div id="stage"></div></div>
<script type="text/x-template" id="view">
<div style="width: 1600px; height: 2540px; box-sizing: border-box; padding: 32px 40px; background: #f4f6f9; color: #16191f; font-family: 'Noto Sans KR','Noto Sans',system-ui,'Segoe UI',-apple-system,sans-serif; font-size: 14px; line-height: 1.55; display: flex; flex-direction: column; gap: 20px; overflow: hidden;">

  <header style="display: flex; align-items: flex-end; gap: 16px;">
    <div style="display: flex; flex-direction: column; gap: 2px;">
      <span style="font-size: 12px; color: #5b6472; font-family: ui-monospace,'DejaVu Sans Mono',Consolas,Menlo,monospace;">terra · 조타륜 = 로컬 자원 관리</span>
      <h1 style="margin: 0; font-size: 24px; font-weight: 700; letter-spacing: -0.01em;">조타륜 앱 노트</h1>
    </div>
    <span style="font-size: 13px; color: #5b6472; padding-bottom: 4px;">조타륜 로고 9개가 열 화면에 무엇이 들어가나 — 자원 목록(terra-gui-resource-inventory) 실측에서 뽑음</span>
    <span style="flex-grow: 1;"></span>
    <div style="display: flex; gap: 8px; padding-bottom: 4px; align-items: center;">
      <span style="font-size: 11.5px; color: #5b6472;">공통 배지</span>
      <sc-for list="{{badges}}" as="b" hint-placeholder-count="5">
        <span style="height: 22px; padding: 0 9px; border-radius: 11px; background: {{b.bg}}; color: {{b.fg}}; font-size: 11.5px; font-weight: 700; display: inline-flex; align-items: center; gap: 5px;"><span style="width: 6px; height: 6px; border-radius: 50%; background: {{b.fg}};"></span>{{b.n}}</span>
      </sc-for>
    </div>
  </header>

  <div style="display: flex; gap: 14px; align-items: center; font-size: 12.5px; color: #3a4049; background: #ffffff; border: 1px solid #d8dde5; border-radius: 12px; padding: 12px 18px;">
    <span style="font-weight: 700; white-space: nowrap;">읽는 법</span>
    <span><b style="background: #fbf0cc; padding: 1px 6px; border-radius: 4px;">L</b> leaf 노드의 Daemon에 묻는다 · <b style="background: #e7ebf0; padding: 1px 6px; border-radius: 4px;">T</b> tree(Master)에 묻는다</span>
    <span style="color: #c3cad5;">|</span>
    <span>권한 <b style="color: #a65f00;">★</b> = 기본 권한 밖 (자물쇠) · <b>—(미선언)</b> = 계약에 권한이 없어 잠글 수 없음</span>
    <span style="color: #c3cad5;">|</span>
    <span>응답 <b>즉시</b> · <b>작업</b>(202 뒤 진행 링) · <b>스트림</b>(WebSocket — Gateway invoke로 안 닿음)</span>
    <span style="flex-grow: 1;"></span>
    <span style="color: #5b6472;">배지 원래 값은 툴팁으로</span>
  </div>

  <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; align-content: start;">
    <sc-for list="{{apps}}" as="a" hint-placeholder-count="9">
      <section aria-label="{{a.name}}" style="min-width: 0; background: #ffffff; border: 1px solid #d8dde5; border-radius: 12px; padding: 18px 20px; display: flex; flex-direction: column; gap: 12px;">
        <div style="display: flex; align-items: center; gap: 12px;">
          <span style="width: 54px; height: 54px; flex-shrink: 0; box-sizing: border-box; border: 2px solid #16191f; border-radius: 8px; background: #ffffff; box-shadow: 0 -3px 0 #c9d1dc inset; display: flex; align-items: center; justify-content: center;"><img src="{{a.logo}}" alt="" width="42" height="42" style="width: 42px; height: 42px; image-rendering: pixelated;"></span>
          <div style="display: flex; flex-direction: column; gap: 1px; min-width: 0; flex-grow: 1;">
            <div style="display: flex; align-items: center; gap: 8px;">
              <h2 style="margin: 0; font-size: 17px; font-weight: 700;">{{a.name}}</h2>
              <span title="{{a.whereName}}" style="height: 20px; padding: 0 7px; border-radius: 4px; background: {{a.whereBg}}; font-size: 11px; font-weight: 700; display: inline-flex; align-items: center; font-family: ui-monospace,'DejaVu Sans Mono',Consolas,Menlo,monospace;">{{a.where}}</span>
              <span style="flex-grow: 1;"></span>
              <span style="font-size: 11px; color: #8b95a6; font-family: ui-monospace,'DejaVu Sans Mono',Consolas,Menlo,monospace;">{{a.sec}}</span>
            </div>
            <span style="font-size: 12.5px; color: #5b6472;">{{a.one}}</span>
          </div>
        </div>

        <div style="display: flex; flex-direction: column; gap: 6px;">
          <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.06em; color: #5b6472;">목록 한 줄</span>
          <div style="display: flex; flex-wrap: wrap; gap: 5px;">
            <sc-for list="{{a.row}}" as="r" hint-placeholder-count="5">
              <span style="padding: 2px 8px; border-radius: 6px; background: #f4f6f9; border: 1px solid #e6eaf0; font-size: 12px; color: #16191f;">{{r.t}}</span>
            </sc-for>
          </div>
          <span style="font-size: 12px; color: #3a4049;">{{a.detail}}</span>
          <span style="font-size: 12px; color: #3a4049;">{{a.filt}}</span>
        </div>

        <div style="display: flex; flex-direction: column; gap: 6px;">
          <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.06em; color: #5b6472;">상태 → 배지</span>
          <div style="display: flex; flex-direction: column; gap: 4px;">
            <sc-for list="{{a.st}}" as="s" hint-placeholder-count="3">
              <div style="display: flex; align-items: center; gap: 8px; font-size: 12px;">
                <span style="width: 76px; flex-shrink: 0; height: 20px; border-radius: 10px; background: {{s.bg}}; color: {{s.fg}}; font-size: 11px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center;">{{s.b}}</span>
                <span style="font-family: ui-monospace,'DejaVu Sans Mono',Consolas,Menlo,monospace; font-size: 11.5px; color: #3a4049;">{{s.v}}</span>
              </div>
            </sc-for>
          </div>
        </div>

        <div style="display: flex; flex-direction: column; gap: 6px;">
          <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.06em; color: #5b6472;">동작</span>
          <div style="display: flex; flex-direction: column; border: 1px solid #e6eaf0; border-radius: 8px; overflow: hidden;">
            <sc-for list="{{a.acts}}" as="c" hint-placeholder-count="3">
              <div style="display: flex; align-items: center; gap: 8px; padding: 5px 10px; border-top: 1px solid #eef1f5; font-size: 12px;">
                <span style="flex-grow: 1; min-width: 0;">{{c.n}}</span>
                <span style="flex-shrink: 0; font-size: 11px; color: #5b6472; font-family: ui-monospace,'DejaVu Sans Mono',Consolas,Menlo,monospace;">{{c.p}}</span>
                <span style="flex-shrink: 0; width: 42px; text-align: center; font-size: 11px; border-radius: 4px; background: #f4f6f9; color: #3a4049;">{{c.r}}</span>
              </div>
            </sc-for>
          </div>
        </div>

        <div style="display: flex; gap: 8px; font-size: 12px; color: #3a4049;">
          <span style="flex-shrink: 0; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; color: #5b6472; padding-top: 1px;">바뀜</span>
          <span>{{a.watch}}</span>
        </div>

        <div style="display: flex; flex-direction: column; gap: 4px; background: #fdf8ea; border: 1px solid #f3e3b0; border-radius: 8px; padding: 8px 10px;">
          <span style="font-size: 11px; font-weight: 700; color: #a65f00;">주의 — 실측에서 드러난 것</span>
          <sc-for list="{{a.warn}}" as="w" hint-placeholder-count="2">
            <span style="font-size: 12px; color: #3a4049; padding-left: 10px; position: relative;"><span style="position: absolute; left: 0; color: #a65f00;">·</span>{{w.t}}</span>
          </sc-for>
        </div>
      </section>
    </sc-for>
  </div>

  <section aria-label="조타륜에 넣지 않은 것" style="background: #ffffff; border: 1px dashed #c3cad5; border-radius: 12px; padding: 14px 20px; display: flex; gap: 18px; align-items: flex-start; font-size: 12.5px; color: #3a4049;">
    <span style="font-weight: 700; flex-shrink: 0;">조타륜에 넣지 않은 것</span>
    <sc-for list="{{outs}}" as="o" hint-placeholder-count="4">
      <span style="flex: 1 1 0;"><b>{{o.n}}</b> — {{o.v}}</span>
    </sc-for>
  </section>
</div>
</script>
<script type="module">
import './src/api/frame-boot.js';   // 첫 import — Terra 안이면 마운트보다 먼저 frame에 hello를 보낸다
import { mount, fit } from './src/runtime/dc.js';
import Screen from './src/screens/helm-apps.js';
const stage = document.getElementById('stage');
window.__screen = mount(Screen, { template: document.getElementById('view').textContent, target: stage, props: {} });
fit(stage, 1600, 2540);

</script>
</body>
</html>
