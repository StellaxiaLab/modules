<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Terra · 건물 편집기</title>
<style>
body{margin:0;font-family: 'Noto Sans KR','Noto Sans CJK KR',system-ui,sans-serif;background:#07090c;-webkit-font-smoothing:antialiased}
a{color:#ede9e1}a:hover{color:#ffffff}
.face-hit:hover{filter:brightness(1.05)}
*{scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.18) transparent}
*::-webkit-scrollbar{width:8px;height:8px}*::-webkit-scrollbar-thumb{background:rgba(255,255,255,.16);border-radius:4px}*::-webkit-scrollbar-track{background:transparent}
button,a,select,input{transition:background-color 140ms,border-color 140ms,color 140ms,transform 140ms cubic-bezier(.22,1,.36,1)}
button:not([role]):active{transform:scale(.97)}
button[style*="rgba(255,255,255,0.04)"]:hover,a[style*="rgba(255,255,255,0.04)"]:hover{background:rgba(255,255,255,0.09)!important;border-color:rgba(255,255,255,0.28)!important}
button[role="treeitem"]:hover{background-color:rgba(255,255,255,0.05)}
button[role="treeitem"][aria-selected="true"]:hover{background-color:rgba(255,255,255,0.09)}
button[aria-expanded] .tw-caret{transition:transform 160ms cubic-bezier(.22,1,.36,1)}
button[aria-expanded="true"] .tw-caret{transform:rotate(90deg)}
:focus-visible{outline:2px solid #ffd84d;outline-offset:2px}
input[type=range]{accent-color:#ede9e1}
select option{background:#15181d;color:#ede9e1}
input::placeholder{color:#6b7280}
::selection{background:rgba(255,216,77,.35)}
.tw-pri:hover{background:#ffffff!important}
</style>
<style>
html,body{margin:0;background:#dfe3ea}
.frame{margin:12px auto;overflow:hidden;box-shadow:0 6px 24px rgba(22,25,31,0.16);border-radius:6px}
#stage{width:1440px;height:900px;transform-origin:0 0;background:#ffffff}
</style>
</head>
<body>
<div class="frame"><div id="stage"></div></div>
<script type="text/x-template" id="view">
<div onPointerMove="{{rootMove}}" onPointerUp="{{rootUp}}" onPointerLeave="{{rootCancel}}" onKeyDown="{{rootKey}}" style="position: relative; outline: none; width: 1440px; height: 900px; display: flex; flex-direction: column; background: #0d0f13; color: #ede9e1; font-family: 'Noto Sans KR','Noto Sans CJK KR',system-ui,sans-serif; font-size: 14px; line-height: 1.55; overflow: hidden;">

  <header style="height: 52px; flex-shrink: 0; box-sizing: border-box; padding: 0 14px 0 12px; display: flex; align-items: center; gap: 14px; background: rgba(15,17,21,0.92); border-bottom: 1px solid rgba(255,255,255,0.10);">
    <a href="node.html" style="display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px 0 6px; border-radius: 8px; font-size: 12.5px; color: #b4bac3; text-decoration: none;"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" style="fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;"><path d="M15 6l-6 6 6 6"/></svg>노드 화면</a><span style="width: 1px; height: 20px; background: rgba(255,255,255,0.10);"></span>
    <h1 style="margin: 0; display: inline-flex; align-items: center; gap: 8px; font-size: 14.5px; font-weight: 700; letter-spacing: -0.01em; color: #ede9e1;"><svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true" style="fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;"><path d="M3 11l9-7 9 7v10H3z"/><path d="M10 21v-6h4v6"/></svg>건물 편집기</h1>
    <span style="font-size: 12.5px; color: #9aa1ab;">{{curName}}</span>
    <div role="radiogroup" aria-label="{{an.typeLabel}} 타입" style="display: flex; gap: 2px; padding: 3px; border-radius: 10px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.06);">
      <sc-for list="{{an.types}}" as="ty" hint-placeholder-count="2">
        <button type="button" role="radio" aria-checked="{{ty.on}}" onClick="{{ty.pick}}" style="height: 26px; padding: 0 11px; border: 0; border-radius: 7px; background: {{ty.bg}}; color: {{ty.fg}}; box-shadow: {{ty.sh}}; font: inherit; font-size: 12.5px; font-weight: {{ty.fw}}; cursor: pointer;">{{ty.label}}</button>
      </sc-for>
    </div>
    <span style="font-size: 12px; color: {{saveColor}};">{{saveText}}</span>
    <span style="flex-grow: 1;"></span>
    <nav aria-label="편집기 메뉴" style="display: flex; align-items: center; gap: 6px;">
      <button type="button" onClick="{{save}}" style="height: 32px; padding: 0 12px; border: 1px solid rgba(255,255,255,0.18); border-radius: 8px; background: rgba(255,255,255,0.04); color: #ede9e1; font: inherit; font-size: 12.5px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; "><svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true" style="fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;"><path d="M5 12l5 5 9-10"/></svg>저장</button>
      <button type="button" onClick="{{exportNow}}" class="tw-pri" style="height: 32px; padding: 0 14px; border: 1px solid #ede9e1; border-radius: 8px; background: #ede9e1; color: #111111; font: inherit; font-size: 12.5px; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; "><svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true" style="fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;"><path d="M12 16V4M6 10l6-6 6 6M4 20h16"/></svg>내보내기</button>
      <button type="button" style="height: 32px; padding: 0 12px; border: 1px solid rgba(255,255,255,0.18); border-radius: 8px; background: rgba(255,255,255,0.04); color: #ede9e1; font: inherit; font-size: 12.5px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; "><svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true" style="fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;"><path d="M12 4v12M6 10l6 6 6-6M4 20h16"/></svg>불러오기</button>
      <a href="material.html" style="height: 32px; box-sizing: border-box; display: inline-flex; align-items: center; gap: 6px; padding: 0 12px; border: 1px solid rgba(255,255,255,0.18); border-radius: 8px; background: rgba(255,255,255,0.04); color: #ede9e1; font-size: 12.5px; font-weight: 600; text-decoration: none;"><svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true" style="fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;"><path d="M3 7l9-4 9 4v10l-9 4-9-4z"/><path d="M3 7l9 4 9-4M12 11v10"/></svg>자재</a>
    </nav>
  </header>

  <div style="flex-grow: 1; display: flex; min-height: 0;">

    <aside aria-label="설계도 리스트" style="width: 232px; flex-shrink: 0; box-sizing: border-box; border-right: 1px solid rgba(255,255,255,0.10); background: rgba(255,255,255,0.02); padding: 14px 10px; display: flex; flex-direction: column; gap: 8px; min-height: 0;">
      <div style="display: flex; align-items: center; gap: 4px; padding: 0 4px; font-size: 12.5px;">
        <h3 style="margin: 0; white-space: nowrap; font-size: 10.5px; font-weight: 600; letter-spacing: .28em; color: #9aa1ab;">설계도</h3>
        <span style="flex-grow: 1;"></span>
        <button type="button" onClick="{{newFolder}}" style="height: 28px; padding: 0 8px; border: 1px solid rgba(255,255,255,0.18); border-radius: 8px; background: rgba(255,255,255,0.04); color: #ede9e1; font: inherit; font-size: 12.5px; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; white-space: nowrap;" title="새 폴더"><svg viewBox="0 0 24 24" width="13" height="13" aria-hidden="true" style="fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;"><path d="M3 6h6l2 2h10v11H3z"/></svg>새 폴더</button>
        <button type="button" onClick="{{delBp}}" style="height: 28px; padding: 0 8px; border: 1px solid rgba(255,255,255,0.18); border-radius: 8px; background: rgba(255,255,255,0.04); color: {{delBpColor}}; font: inherit; font-size: 12.5px; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; white-space: nowrap;"><svg viewBox="0 0 24 24" width="13" height="13" aria-hidden="true" style="fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>삭제</button>
      </div>
      <div role="tree" aria-label="설계도 셋" style="display: flex; flex-direction: column; gap: 1px; overflow-y: auto; min-height: 0;">
        <sc-for list="{{bpTree}}" as="row" hint-placeholder-count="7">
          <sc-if value="{{row.isSet}}" hint-placeholder-val="{{false}}">
            <div role="treeitem" data-bpdrop="{{row.drop}}" style="padding: 10px 6px 3px; font-size: 12px; font-weight: 600; color: #b4bac3; border-radius: 6px; background: {{row.dropBg}}; outline: {{row.dropLine}};">{{row.label}}</div>
          </sc-if>
          <sc-if value="{{row.isFolder}}" hint-placeholder-val="{{false}}">
            <button type="button" role="treeitem" aria-expanded="{{row.expanded}}" data-bpdrop="{{row.drop}}" onClick="{{row.toggle}}" style="display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 6px 0 {{row.indent}}; border: 0; border-radius: 6px; background: {{row.dropBg}}; outline: {{row.dropLine}}; color: #ede9e1; font: inherit; font-size: 13px; text-align: left; cursor: pointer;"><span style="color: rgba(255,255,255,0.18);">└</span><span style="width: 12px; display: inline-flex; color: #9aa1ab;"><svg viewBox="0 0 24 24" width="12" height="12" aria-hidden="true" style="fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;stroke-width:2.2;" class="tw-caret"><path d="M9 6l6 6-6 6"/></svg></span>{{row.label}}</button>
          </sc-if>
          <sc-if value="{{row.isBp}}" hint-placeholder-val="{{true}}">
            <button type="button" role="treeitem" aria-selected="{{row.pressed}}" onPointerDown="{{row.grab}}" onClick="{{row.load}}" title="눌러서 열기 · 끌어서 설계 화면에 놓으면 현재 설계도에 추가 · 폴더에 놓으면 옮기기" style="display: flex; align-items: center; gap: 8px; padding: 6px 8px 6px {{row.indent}}; border: {{row.border}}; border-radius: 9px; background: {{row.bg}}; color: #ede9e1; font: inherit; text-align: left; cursor: grab; touch-action: none; opacity: {{row.op}};">
              <span style="color: rgba(255,255,255,0.18);">└</span>
              <span style="display: flex; flex-direction: column; min-width: 0;">
                <span style="font-size: 13px; font-weight: {{row.fw}};">{{row.label}} <span title="{{row.playTip}}" style="display: {{row.playDisp}}; vertical-align: -1px; color: #f5b83d;"><svg viewBox="0 0 24 24" width="11" height="11" aria-hidden="true" style="fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;fill:currentColor;"><path d="M7 4l13 8-13 8z"/></svg></span></span>
                <span style="font-size: 11px; color: #9aa1ab; font-variant-numeric: tabular-nums;">{{row.meta}}</span>
              </span>
              <span style="flex-grow: 1;"></span>
              <span style="font-size: 10.5px; font-weight: 600; color: #ffd84d; white-space: nowrap; flex-shrink: 0;">{{row.state}}</span>
            </button>
          </sc-if>
        </sc-for>
      </div>
      <button type="button" onClick="{{newBp}}" style="height: 34px; flex-shrink: 0; border: 1px dashed rgba(255,255,255,0.18); border-radius: 9px; background: transparent; color: #b4bac3; font: inherit; font-size: 12.5px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px;"><svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true" style="fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;"><path d="M12 5v14M5 12h14"/></svg>새 설계도</button>
      <span style="font-size: 11px; line-height: 1.6; color: #6b7280; padding: 0 4px;">설계도를 끌어 설계 화면에 놓으면 지금 설계도에 합쳐집니다 (끄는 중 R = 90° 회전). 폴더·셋 이름 위에 놓으면 그리로 옮겨집니다.</span>
    </aside>

    <main onKeyDown="{{key}}" style="position: relative; flex-grow: 1; min-width: 0; background: radial-gradient(ellipse 70% 60% at 50% 48%, #1b1f26 0%, #121419 45%, #0a0c0f 100%); outline: none;">
      <svg width="960" height="848" viewBox="0 0 960 848" role="img" aria-label="설계 화면 — {{curName}}, 끌어서 돌려 봄" style="display: block; cursor: {{cursor}}; touch-action: none; user-select: none;" onPointerDown="{{down}}" onPointerMove="{{move}}" onPointerUp="{{up}}" onPointerLeave="{{leave}}" onContextMenu="{{ctx}}">
        <defs>
          <sc-for list="{{pats}}" as="pt" hint-placeholder-count="0">
            <pattern id="{{pt.id}}" patternUnits="userSpaceOnUse" width="1" height="1" patternTransform="{{pt.m}}">
              <sc-for list="{{pt.rects}}" as="r" hint-placeholder-count="0">
                <rect x="{{r.x}}" y="{{r.y}}" width="{{r.w}}" height="{{r.h}}" fill="{{r.fill}}"></rect>
              </sc-for>
            </pattern>
          </sc-for>
        </defs>
        <polygon points="{{plateRim}}" fill="#15181d"></polygon>
        <sc-for list="{{plate}}" as="c" hint-placeholder-count="16">
          <polygon class="face-hit" points="{{c.pts}}" fill="{{c.fill}}" stroke="rgba(255,255,255,0.07)" stroke-width="{{gridW}}" data-target="{{c.target}}"></polygon>
        </sc-for>
        <polygon points="{{hexOutline}}" fill="none" stroke="#9aa1ab" stroke-width="1.2" stroke-dasharray="5 6" opacity="0.55" style="pointer-events: none;"></polygon>
        <sc-for list="{{faces}}" as="f" hint-placeholder-count="40">
          <polygon points="{{f.pts}}" fill="{{f.fill}}" stroke="{{f.stroke}}" stroke-width="{{f.sw}}" stroke-linejoin="round" opacity="{{f.op}}" data-target="{{f.target}}" data-block="{{f.block}}" style="pointer-events: {{f.pe}};"></polygon>
        </sc-for>
      </svg>

      <div style="position: absolute; left: 16px; top: 14px; display: flex; flex-direction: column; gap: 6px; background: rgba(13,15,19,0.82); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border: 1px solid rgba(255,255,255,0.10); border-radius: 14px; box-shadow: 0 10px 30px rgba(0,0,0,0.30); padding: 12px 14px; width: 300px; box-sizing: border-box;">
        <label style="display: flex; align-items: center; gap: 10px; font-size: 13px;">
          <span style="font-size: 10.5px; font-weight: 600; letter-spacing: .28em; color: #9aa1ab; white-space: nowrap;">가로 · 세로</span>
          <input type="range" min="4" max="64" step="2" value="{{N}}" onChange="{{setN}}" aria-label="가로 세로 칸 수" style="flex-grow: 1; accent-color: #ede9e1;">
          <span style="font-family: 'JetBrains Mono',ui-monospace,'DejaVu Sans Mono',Consolas,Menlo,monospace; font-size: 12.5px; min-width: 56px; text-align: right;">{{N}} × {{N}}</span>
        </label>
        <span style="font-size: 12px; color: #9aa1ab;">최대 64 · 설치 범위는 타일 육각형 안 {{cap}}칸 · 높이 {{N}}단</span>
        <span style="font-size: 12px; color: #f5b83d;">{{warnText}}</span>
        <span style="font-size: 12px; color: #9aa1ab;">{{activeText}}</span>
        <span style="font-size: 12px; color: #b4bac3;">블록 방향 · <span style="color: #ede9e1;">{{orientLabel}}</span></span>
      </div>

      <!-- 애니메이션 확장: 1초 = 16칸 고정. 칸마다 프레임을 넣거나 비워 두고, 빈 칸은 앞 프레임을 그대로 보인다 (한 줄 = 1초) -->
      <section aria-label="애니메이션 칸" style="position: absolute; left: 16px; top: 236px; width: 330px; display: {{an.disp}}; flex-direction: column; gap: 8px; box-sizing: border-box; background: rgba(13,15,19,0.82); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border: 1px solid rgba(255,255,255,0.10); border-radius: 14px; box-shadow: 0 10px 30px rgba(0,0,0,0.30); padding: 10px 12px;">
        <div style="display: flex; align-items: center; gap: 6px 8px; flex-wrap: wrap; font-size: 12.5px;">
          <button type="button" onClick="{{an.toggle}}" aria-label="{{an.playLabel}}" title="{{an.playLabel}}" style="width: 32px; height: 28px; display: inline-flex; align-items: center; justify-content: center; padding: 0; border: 1px solid {{an.playLine}}; border-radius: 8px; background: {{an.playBg}}; color: {{an.playFg}}; font: inherit; font-size: 13px; cursor: pointer;"><sc-if value="{{an.playOn}}" hint-placeholder-val="{{false}}"><svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true" style="fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;"><path d="M8 5v14M16 5v14"/></svg></sc-if><sc-if value="{{an.playOff}}" hint-placeholder-val="{{true}}"><svg viewBox="0 0 24 24" width="13" height="13" aria-hidden="true" style="fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;"><path d="M7 4l13 8-13 8z"/></svg></sc-if></button>
          <b style="font-size: 12.5px; font-family: 'JetBrains Mono',ui-monospace,'DejaVu Sans Mono',Consolas,Menlo,monospace; font-variant-numeric: tabular-nums;">칸 {{an.cur}} / {{an.len}}</b>
          <span style="color: {{an.slotFg}};">{{an.slotInfo}}</span>
          <span style="flex-grow: 1;"></span>
          <label style="display: {{an.lenDisp}}; align-items: center; gap: 4px; color: #9aa1ab;">길이
            <select value="{{an.lenVal}}" onChange="{{an.setLen}}" aria-label="애니메이션 길이" style="height: 28px; padding: 0 6px; border: 1px solid rgba(255,255,255,0.18); border-radius: 8px; background: #15181d; font: inherit; font-size: 12.5px; color: #ede9e1; color-scheme: dark;">
              <sc-for list="{{an.lens}}" as="lo" hint-placeholder-count="4"><option value="{{lo.v}}">{{lo.t}}</option></sc-for>
            </select></label>
          <span style="display: {{an.lenFixDisp}}; color: #9aa1ab;">길이 1초 고정 (16칸)</span>
        </div>
        <div style="display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 12px;">
          <span style="color: #9aa1ab;">복제 간격</span>
          <div role="radiogroup" aria-label="복제 간격" style="display: flex; gap: 2px; padding: 2px; border-radius: 8px; background: rgba(255,255,255,0.05);">
            <sc-for list="{{an.steps}}" as="sp" hint-placeholder-count="3">
              <button type="button" role="radio" aria-checked="{{sp.on}}" title="{{sp.tip}}" onClick="{{sp.pick}}" style="height: 22px; padding: 0 8px; border: 0; border-radius: 6px; background: {{sp.bg}}; color: {{sp.fg}}; box-shadow: {{sp.sh}}; font: inherit; font-size: 11.5px; font-weight: {{sp.fw}}; cursor: pointer;">{{sp.label}}</button>
            </sc-for>
          </div>
          <button type="button" onClick="{{an.dup}}" title="{{an.dupTip}}" style="height: 26px; padding: 0 8px; border: 1px solid rgba(255,216,77,0.45); border-radius: 8px; background: rgba(255,216,77,0.08); color: {{an.dupFg}}; font: inherit; font-size: 12px; font-weight: 600; cursor: pointer;">+ 복제 → {{an.stepLabel}} 뒤</button>
          <button type="button" onClick="{{an.fill}}" title="{{an.fillTip}}" style="height: 28px; padding: 0 8px; border: 1px solid rgba(255,255,255,0.18); border-radius: 8px; background: rgba(255,255,255,0.04); color: #ede9e1; font: inherit; font-size: 12px; cursor: pointer;">{{an.fillLabel}}</button>
          <span style="flex-grow: 1;"></span>
          <button type="button" onClick="{{an.left}}" title="이 프레임을 한 칸 앞으로" style="height: 26px; padding: 0 7px; border: 1px solid rgba(255,255,255,0.18); border-radius: 8px; background: rgba(255,255,255,0.04); color: {{an.leftFg}}; font: inherit; font-size: 12px; cursor: pointer; display: inline-flex; align-items: center;"><svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true" style="fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;"><path d="M15 6l-6 6 6 6"/></svg></button>
          <button type="button" onClick="{{an.right}}" title="이 프레임을 한 칸 뒤로" style="height: 26px; padding: 0 7px; border: 1px solid rgba(255,255,255,0.18); border-radius: 8px; background: rgba(255,255,255,0.04); color: {{an.rightFg}}; font: inherit; font-size: 12px; cursor: pointer; display: inline-flex; align-items: center;"><svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true" style="fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;"><path d="M9 6l6 6-6 6"/></svg></button>
        </div>
        <div role="listbox" aria-label="칸 (한 줄 = 1초)" style="display: grid; grid-template-columns: repeat(16, minmax(0, 1fr)); gap: 3px;">
          <sc-for list="{{an.slots}}" as="fs" hint-placeholder-count="16">
            <button type="button" role="option" aria-selected="{{fs.sel}}" aria-label="{{fs.label}}" title="{{fs.label}}" onClick="{{fs.pick}}" style="position: relative; height: {{an.slotH}}px; padding: 0; box-sizing: border-box; border: {{fs.border}}; border-radius: 5px; background: {{fs.bg}}; cursor: pointer; overflow: hidden; box-shadow: {{fs.ring}};">
              <img src="{{fs.img}}" alt="" style="display: {{fs.imgDisp}}; width: 100%; height: 100%; object-fit: contain; image-rendering: pixelated;">
              <span style="display: {{fs.holdDisp}}; position: absolute; left: 0; right: 0; top: 50%; height: 3px; margin-top: -1px; background: rgba(255,255,255,0.14);"></span>
              <span style="position: absolute; left: 3px; top: 0; font-size: 9.5px; font-weight: 700; color: {{fs.numFg}};">{{fs.num}}</span>
            </button>
          </sc-for>
        </div>
        <div style="display: {{an.confirmDisp}}; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 8px; background: rgba(245,184,61,0.10); border: 1px solid rgba(245,184,61,0.45); font-size: 12.5px; color: #f5b83d;">
          <span style="flex-grow: 1;">일반 타입은 프레임 하나 · 1초입니다 — 지금 보이는 프레임만 남기고 나머지 프레임 {{an.dropN}}개를 지웁니다.</span>
          <button type="button" onClick="{{an.confirmYes}}" style="height: 26px; padding: 0 10px; border: 1px solid rgba(255,93,93,0.5); border-radius: 8px; background: rgba(255,93,93,0.10); color: #ff5d5d; font: inherit; font-size: 12px; font-weight: 600; cursor: pointer;">지우고 일반으로</button>
          <button type="button" onClick="{{an.confirmNo}}" style="height: 26px; padding: 0 10px; border: 1px solid rgba(255,255,255,0.18); border-radius: 8px; background: rgba(255,255,255,0.04); color: #ede9e1; font: inherit; font-size: 12px; cursor: pointer;">취소</button>
        </div>
      </section>

      <!-- 이벤트: 상태(동작 · 대기 · 정지 · 실패) · 사용자 이벤트마다 다른 모습. 고르면 그 디자인을 편집한다 -->
      <section aria-label="이벤트" data-ev-bar="1" style="position: absolute; left: 16px; right: 16px; bottom: 86px; display: flex; flex-direction: column; gap: 6px; box-sizing: border-box; background: rgba(13,15,19,0.82); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border: 1px solid rgba(255,255,255,0.10); border-radius: 14px; box-shadow: 0 10px 30px rgba(0,0,0,0.30); padding: 9px 12px;">
        <div style="display: flex; align-items: center; gap: 5px; flex-wrap: wrap;">
          <b style="font-size: 10.5px; font-weight: 600; letter-spacing: .28em; color: #9aa1ab; margin-right: 4px;">이벤트</b>
          <sc-for list="{{evb.common}}" as="ec" hint-placeholder-count="5">
            <button type="button" role="radio" aria-checked="{{ec.on}}" data-ev="{{ec.id}}" title="{{ec.tip}}" onClick="{{ec.pick}}" style="height: 26px; padding: 0 9px; border: 1px {{ec.style}} {{ec.line}}; border-radius: 13px; background: {{ec.bg}}; color: {{ec.fg}}; font: inherit; font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap;"><span style="display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: {{ec.dot}}; opacity: {{ec.dotOp}}; margin-right: 5px; vertical-align: 1px;"></span>{{ec.label}}</button>
          </sc-for>
          <span style="display: {{evb.dirDisp}}; align-items: center; gap: 5px; padding-left: 8px; margin-left: 2px; border-left: 1px solid rgba(255,255,255,0.10);">
            <span style="font-size: 10.5px; font-weight: 600; letter-spacing: .28em; color: #9aa1ab;">방향</span>
            <sc-for list="{{evb.dirs}}" as="ed" hint-placeholder-count="0">
              <button type="button" role="radio" aria-checked="{{ed.on}}" data-ev="{{ed.id}}" title="{{ed.tip}}" onClick="{{ed.pick}}" style="height: 26px; padding: 0 9px; border: 1px {{ed.style}} {{ed.line}}; border-radius: 13px; background: {{ed.bg}}; color: {{ed.fg}}; font: inherit; font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap;">{{ed.label}}</button>
            </sc-for>
          </span>
          <span style="display: inline-flex; align-items: center; gap: 5px; padding-left: 8px; margin-left: 2px; border-left: 1px solid rgba(255,255,255,0.10);">
            <sc-for list="{{evb.custom}}" as="eu" hint-placeholder-count="0">
              <button type="button" role="radio" aria-checked="{{eu.on}}" data-ev="{{eu.id}}" title="{{eu.tip}}" onClick="{{eu.pick}}" style="height: 26px; padding: 0 9px; border: 1px {{eu.style}} {{eu.line}}; border-radius: 13px; background: {{eu.bg}}; color: {{eu.fg}}; font: inherit; font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap;"><span style="display: inline-block; width: 7px; height: 7px; border-radius: 2px; background: {{eu.dot}}; opacity: {{eu.dotOp}}; margin-right: 5px; vertical-align: 1px;"></span>{{eu.label}}</button>
            </sc-for>
            <sc-if value="{{evb.newOff}}" hint-placeholder-val="{{true}}">
              <button type="button" data-ev-add="1" onClick="{{evb.newStart}}" title="사용자 이벤트 만들기 (예: 점검 중 · 백업 중)" style="height: 26px; padding: 0 9px; border: 1px dashed rgba(255,108,162,0.55); border-radius: 13px; background: rgba(255,108,162,0.08); color: #ff6ca2; font: inherit; font-size: 12px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 4px;"><svg viewBox="0 0 24 24" width="13" height="13" aria-hidden="true" style="fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;"><path d="M12 5v14M5 12h14"/></svg>이벤트</button>
            </sc-if>
            <sc-if value="{{evb.newOn}}" hint-placeholder-val="{{false}}">
              <input type="text" data-ev-name="1" value="{{evb.newVal}}" onChange="{{evb.newInput}}" onKeyDown="{{evb.newKey}}" placeholder="이벤트 이름" aria-label="새 이벤트 이름" style="width: 120px; height: 26px; box-sizing: border-box; padding: 0 10px; border: 1px solid rgba(255,108,162,0.6); border-radius: 13px; background: #15181d; color: #ede9e1; outline: none; font: inherit; font-size: 12px;">
              <button type="button" data-ev-ok="1" onClick="{{evb.newOk}}" style="height: 26px; padding: 0 10px; border: 0; border-radius: 13px; background: #ff6ca2; color: #111111; font: inherit; font-size: 12px; font-weight: 700; cursor: pointer;">만들기</button>
              <button type="button" onClick="{{evb.newCancel}}" style="height: 26px; padding: 0 8px; border: 1px solid rgba(255,255,255,0.18); border-radius: 13px; background: rgba(255,255,255,0.04); color: #b4bac3; font: inherit; font-size: 12px; cursor: pointer;">취소</button>
            </sc-if>
          </span>
          <span style="flex-grow: 1;"></span>
          <button type="button" onClick="{{evb.drop}}" style="display: {{evb.dropDisp}}; height: 26px; padding: 0 10px; border: 1px solid rgba(255,255,255,0.18); border-radius: 8px; background: rgba(255,93,93,0.08); color: #ff5d5d; border-color: rgba(255,93,93,0.45); font: inherit; font-size: 12px; cursor: pointer;">{{evb.dropLabel}}</button>
        </div>
        <span style="font-size: 11.5px; color: {{evb.infoC}};">{{evb.info}}</span>
      </section>

      <div style="position: absolute; left: 16px; bottom: 16px; display: flex; flex-wrap: wrap; gap: 6px 14px; max-width: 640px; font-size: 12px; color: #9aa1ab; background: rgba(13,15,19,0.82); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border: 1px solid rgba(255,255,255,0.10); border-radius: 14px; box-shadow: 0 10px 30px rgba(0,0,0,0.30); padding: 9px 14px; pointer-events: none;">
        <span><b style="color: #ede9e1; font-weight: 600;">좌클릭 끌기</b> 회전</span>
        <span><b style="color: #ede9e1; font-weight: 600;">자재 클릭</b> 활성화</span>
        <span><b style="color: #ede9e1; font-weight: 600;">우클릭 누르고 있기</b> 설치 준비</span>
        <span><b style="display: inline-block; min-width: 14px; padding: 0 5px; margin-right: 3px; border: 1px solid rgba(255,255,255,0.18); border-radius: 5px; font-family: 'JetBrains Mono',ui-monospace,'DejaVu Sans Mono',Consolas,Menlo,monospace; font-size: 10.5px; line-height: 17px; text-align: center; color: #ede9e1; font-weight: 600;">R</b> 옆으로 · <b style="display: inline-block; min-width: 14px; padding: 0 5px; margin-right: 3px; border: 1px solid rgba(255,255,255,0.18); border-radius: 5px; font-family: 'JetBrains Mono',ui-monospace,'DejaVu Sans Mono',Consolas,Menlo,monospace; font-size: 10.5px; line-height: 17px; text-align: center; color: #ede9e1; font-weight: 600;">T</b> 위로 90°</span>
        <span><b style="color: #ede9e1; font-weight: 600;">떼기</b> 설치</span>
        <span><b style="color: #ede9e1; font-weight: 600;">좌클릭</b> 설치 취소(블록 제거)</span>
      </div>

      <sc-if value="{{hasExport}}" hint-placeholder-val="{{false}}">
        <section aria-label="내보내기 결과" style="position: absolute; left: 16px; right: 16px; bottom: 64px; background: rgba(17,19,24,0.96); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border: 1px solid rgba(255,255,255,0.12); border-radius: 14px; box-shadow: 0 18px 50px rgba(0,0,0,0.5); padding: 14px 16px; display: flex; flex-direction: column; gap: 10px;">
          <svg width="0" height="0" aria-hidden="true" style="position: absolute;">
            <defs>
              <sc-for list="{{ex.patterns}}" as="pt" hint-placeholder-count="0">
                <pattern id="{{pt.id}}" patternUnits="userSpaceOnUse" width="1" height="1" patternTransform="{{pt.m}}">
                  <sc-for list="{{pt.rects}}" as="r" hint-placeholder-count="0">
                    <rect x="{{r.x}}" y="{{r.y}}" width="{{r.w}}" height="{{r.h}}" fill="{{r.fill}}"></rect>
                  </sc-for>
                </pattern>
              </sc-for>
            </defs>
          </svg>
          <div style="display: flex; align-items: baseline; gap: 12px;">
            <h3 style="margin: 0; font-size: 14px; font-weight: 600;">내보내기 결과 — {{ex.name}}</h3>
            <span style="font-size: 12px; color: #9aa1ab;">2D 벡터 · 필드와 같은 투시(기울기 {{pitchField}}°) · 회전 4장</span>
            <span style="flex-grow: 1;"></span>
            <button type="button" onClick="{{closeExport}}" style="height: 28px; padding: 0 10px; border: 1px solid rgba(255,255,255,0.18); border-radius: 8px; background: rgba(255,255,255,0.04); color: #ede9e1; font: inherit; font-size: 12.5px; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; white-space: nowrap;"><svg viewBox="0 0 24 24" width="13" height="13" aria-hidden="true" style="fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;"><path d="M6 6l12 12M18 6L6 18"/></svg>닫기</button>
          </div>
          <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px;">
            <sc-for list="{{ex.views}}" as="v" hint-placeholder-count="4">
              <figure style="margin: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; background: radial-gradient(ellipse at 50% 45%, #1b1f26, #0e1014); border: 1px solid rgba(255,255,255,0.06); border-radius: 10px; padding: 8px;">
                <svg width="150" height="120" viewBox="{{v.vb}}" aria-label="{{v.label}}">
                  <path d="{{v.shadow}}" fill="#1c2733" opacity="0.22"></path>
                  <sc-for list="{{v.paths}}" as="p" hint-placeholder-count="8">
                    <path d="{{p.d}}" fill="{{p.edge}}" fill-rule="evenodd" stroke="{{p.edge}}" stroke-width="0.5" stroke-linejoin="round"></path>
                    <path d="{{p.d}}" fill="{{p.fill}}" fill-rule="evenodd"></path>
                  </sc-for>
                </svg>
                <figcaption style="font-size: 12px; color: #9aa1ab; font-family: 'JetBrains Mono',ui-monospace,'DejaVu Sans Mono',Consolas,Menlo,monospace;">{{v.label}} · 면 {{v.count}}</figcaption>
              </figure>
            </sc-for>
          </div>
          <span style="font-size: 12.5px;">블록 <b>{{ex.blocks}}</b> · 보이는 단위면 <b>{{ex.unit}}</b> → 내보낸 면 <b>{{ex.merged}}</b> <span style="color: #9aa1ab;">(회전 0 기준 — 같은 평면 · 같은 자재로 이어진 면은 하나로 합치고, 자재 픽셀은 그 면의 무늬로 들어감)</span></span>
        </section>
      </sc-if>
    </main>

    <aside style="width: 272px; flex-shrink: 0; box-sizing: border-box; border-left: 1px solid rgba(255,255,255,0.10); background: rgba(255,255,255,0.02); padding: 16px; display: flex; flex-direction: column; gap: 16px; overflow: hidden;">
      <section aria-label="시점" style="display: flex; flex-direction: column; align-items: center; gap: 6px; background: radial-gradient(ellipse at 50% 40%, #1b1f26, #0f1115); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 12px;">
        <svg width="140" height="132" viewBox="0 0 140 132" role="group" aria-label="시점 큐브 — 면을 누르면 그 방향으로 봅니다" style="cursor: pointer;" onClick="{{cubeClick}}">
          <sc-for list="{{cube}}" as="q" hint-placeholder-count="3">
            <g data-face="{{q.id}}">
              <polygon points="{{q.pts}}" fill="{{q.fill}}" stroke="#16191f" stroke-opacity="0.25" stroke-width="1" stroke-linejoin="round"></polygon>
              <text x="{{q.lx}}" y="{{q.ly}}" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="600" fill="#ffffff" style="pointer-events: none;">{{q.label}}</text>
            </g>
          </sc-for>
        </svg>
        <span style="font-size: 12px; color: #9aa1ab; font-family: 'JetBrains Mono',ui-monospace,'DejaVu Sans Mono',Consolas,Menlo,monospace;">방위 {{yawLabel}} · 기울기 {{pitchLabel}}</span>
        <button type="button" onClick="{{resetView}}" style="height: 28px; padding: 0 10px; border: 1px solid rgba(255,255,255,0.18); border-radius: 8px; background: rgba(255,255,255,0.04); color: #ede9e1; font: inherit; font-size: 12.5px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; "><svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true" style="fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></svg>필드 시점으로</button>
      </section>

      <section aria-label="자재" style="display: flex; flex-direction: column; gap: 8px; min-height: 0;">
        <div style="display: flex; align-items: center; gap: 4px; flex-wrap: wrap; font-size: 12.5px;">
          <h3 style="margin: 0 0 2px; flex-basis: 100%; font-size: 10.5px; font-weight: 600; letter-spacing: .28em; color: #9aa1ab;">자재</h3>
          <a href="material.html" style="height: 28px; box-sizing: border-box; display: inline-flex; align-items: center; padding: 0 8px; gap: 4px; font-size: 12.5px; border: 1px solid rgba(255,255,255,0.18); border-radius: 8px; background: rgba(255,255,255,0.04); color: #ede9e1; text-decoration: none;"><svg viewBox="0 0 24 24" width="13" height="13" aria-hidden="true" style="fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>편집기</a>
          <button type="button" style="height: 28px; padding: 0 8px; border: 1px solid rgba(255,255,255,0.18); border-radius: 8px; background: rgba(255,255,255,0.04); color: #ede9e1; font: inherit; font-size: 12.5px; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; white-space: nowrap;"><svg viewBox="0 0 24 24" width="13" height="13" aria-hidden="true" style="fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;"><path d="M12 4v12M6 10l6 6 6-6M4 20h16"/></svg>불러오기</button>
          <button type="button" onClick="{{delMat}}" style="height: 28px; padding: 0 8px; border: 1px solid rgba(255,255,255,0.18); border-radius: 8px; background: rgba(255,255,255,0.04); color: {{delColor}}; font: inherit; font-size: 12.5px; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; white-space: nowrap;"><svg viewBox="0 0 24 24" width="13" height="13" aria-hidden="true" style="fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>삭제</button>
        </div>
        <div role="tree" aria-label="자재 셋" style="display: flex; flex-direction: column; gap: 1px; overflow-y: auto;">
          <sc-for list="{{tree}}" as="row" hint-placeholder-count="10">
            <sc-if value="{{row.isSet}}" hint-placeholder-val="{{false}}">
              <div role="treeitem" style="padding: 10px 4px 3px; font-size: 12px; font-weight: 600; color: #b4bac3;">{{row.label}}</div>
            </sc-if>
            <sc-if value="{{row.isFolder}}" hint-placeholder-val="{{false}}">
              <button type="button" role="treeitem" aria-expanded="{{row.expanded}}" onClick="{{row.toggle}}" style="display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 6px 0 {{row.indent}}; border: 0; background: transparent; color: #ede9e1; font: inherit; font-size: 13px; text-align: left; cursor: pointer;"><span style="color: rgba(255,255,255,0.18);">└</span><span style="width: 12px; display: inline-flex; color: #9aa1ab;"><svg viewBox="0 0 24 24" width="12" height="12" aria-hidden="true" style="fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;stroke-width:2.2;" class="tw-caret"><path d="M9 6l6 6-6 6"/></svg></span>{{row.label}}</button>
            </sc-if>
            <sc-if value="{{row.isMat}}" hint-placeholder-val="{{true}}">
              <button type="button" role="treeitem" aria-selected="{{row.pressed}}" onClick="{{row.pick}}" style="display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 8px 0 {{row.indent}}; border: {{row.border}}; border-radius: 9px; background: {{row.bg}}; color: #ede9e1; font: inherit; font-size: 13px; text-align: left; cursor: pointer;">
                <span style="color: rgba(255,255,255,0.18);">└</span>
                <svg width="22" height="22" viewBox="0 0 26 26" aria-hidden="true">
                  <polygon points="13,3 23,8 13,13 3,8" fill="{{row.top}}"></polygon>
                  <polygon points="3,8 13,13 13,24 3,19" fill="{{row.left}}"></polygon>
                  <polygon points="13,13 23,8 23,19 13,24" fill="{{row.right}}"></polygon>
                </svg>
                <span style="font-weight: {{row.fw}};">{{row.label}} <span title="{{row.playTip}}" style="display: {{row.playDisp}}; vertical-align: -1px; color: #f5b83d;"><svg viewBox="0 0 24 24" width="11" height="11" aria-hidden="true" style="fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;fill:currentColor;"><path d="M7 4l13 8-13 8z"/></svg></span></span>
                <span style="flex-grow: 1;"></span>
                <span style="font-size: 10.5px; font-weight: 600; color: #ffd84d; white-space: nowrap; flex-shrink: 0;">{{row.state}}</span>
              </button>
            </sc-if>
          </sc-for>
        </div>
      </section>
    </aside>
  </div>
  <div aria-hidden="true" style="position: absolute; left: {{chip.x}}px; top: {{chip.y}}px; display: {{chip.disp}}; pointer-events: none; padding: 6px 10px; border: 1px solid rgba(255,216,77,0.55); border-radius: 9px; background: rgba(13,15,19,0.92); backdrop-filter: blur(14px); box-shadow: 0 10px 30px rgba(0,0,0,0.4); font-size: 12.5px; white-space: nowrap;"><b>{{chip.name}}</b> <span style="color: #9aa1ab;">{{chip.hint}}</span></div>
</div>
</script>
<script type="module">
import './src/api/frame-boot.js';   // 첫 import — Terra 안이면 마운트보다 먼저 frame에 hello를 보낸다
import { mount, fit } from './src/runtime/dc.js';
import Screen from './src/screens/building.js';
import * as Boot from './src/boot/module.js';
const stage = document.getElementById('stage');
const View = (Boot.prep && Boot.prep('building', Screen)) || Screen;   // 프로필이 예시를 지운 클래스를 돌려주면 그것을 띄운다
window.__screen = mount(View, { template: document.getElementById('view').textContent, target: stage, props: {} });
fit(stage, 1440, 900);
Boot.boot && Boot.boot('building', window.__screen);
</script>
</body>
</html>
