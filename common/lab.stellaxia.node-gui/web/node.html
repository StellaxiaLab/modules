<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Terra · 노드 화면</title>
<style>
body{margin:0;font-family:'Noto Sans KR','Noto Sans',system-ui,'Segoe UI',-apple-system,sans-serif;background:#ffffff}
a{color:#2563eb}a:hover{color:#1d4ed8}
@keyframes tile-rise{from{transform:translateY(-28px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes ring-march{to{stroke-dashoffset:-24}}
@keyframes sea-wash{0%,100%{stroke-width:52px}50%{stroke-width:76px}}
.sea-wash{animation:sea-wash 4.6s ease-in-out infinite}
@keyframes sea-foam{0%,100%{stroke-width:20px;opacity:.95}50%{stroke-width:36px;opacity:.55}}
.sea-foam{animation:sea-foam 4.6s ease-in-out infinite}
@keyframes hb-in{0%{transform:translateY(26px) scaleX(.9);opacity:0}70%{transform:translateY(-3px) scaleX(1.005);opacity:1}100%{transform:translateY(0) scaleX(1);opacity:1}}
.hb-in{animation:hb-in 300ms cubic-bezier(.2,.8,.3,1) both;transform-origin:50% 100%}
@keyframes hb-card{from{transform:translateY(8px);opacity:0}to{transform:translateY(0);opacity:1}}
.hb-card{animation:hb-card 240ms cubic-bezier(.2,.8,.3,1) both}
.hb-row::-webkit-scrollbar{display:none}
.hb-btn{transition:background 120ms,border-color 120ms}
.hb-btn:hover{filter:brightness(0.96)}
.tile-rise{animation:tile-rise 520ms cubic-bezier(.2,.8,.2,1) both}
@keyframes lg-pop{0%{transform:translateY(105%)}70%{transform:translateY(-4%)}100%{transform:translateY(0)}}
.lg-pop{animation:lg-pop 360ms cubic-bezier(.2,.8,.3,1) both}
@keyframes lg-drop{0%{transform:translateY(0)}25%{transform:translateY(-3%)}100%{transform:translateY(105%)}}
@keyframes tl-spin{to{transform:rotate(360deg)}}
.tl-spin{animation:tl-spin 900ms linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes rmenu-pop{from{transform:translate(-50%,-50%) scale(.35);opacity:0}to{transform:translate(-50%,-50%) scale(1);opacity:1}}
.rmenu-item{position:absolute;transform:translate(-50%,-50%);animation:rmenu-pop 170ms cubic-bezier(.2,.8,.2,1) both;transition:box-shadow 120ms,background 120ms,width 120ms,height 120ms}
.tile{cursor:pointer}
.tile .tile-top{transition:filter 160ms ease}
.tile:hover .tile-top{filter:brightness(1.12)}
.tile .tile-body{transition:filter 160ms ease}
.tile:hover .tile-body{filter:brightness(1.07)}
.tile-lift{transition:transform 220ms cubic-bezier(.2,.8,.2,1)}
.tile-ring{animation:ring-march 900ms linear infinite}
@keyframes rim-in{from{opacity:0}to{opacity:.92}}
.rim-in{animation:rim-in 160ms ease-out both}
@keyframes ev-wait{0%,100%{filter:drop-shadow(0 0 0 rgba(255,176,32,0))}50%{filter:drop-shadow(0 0 7px rgba(255,176,32,.95))}}
.ev-wait{animation:ev-wait 1.4s ease-in-out infinite}
.ev-stop{filter:grayscale(.92) brightness(.9)}
@keyframes ev-fail{0%,100%{filter:sepia(.9) saturate(3.5) hue-rotate(-38deg) brightness(.92)}50%{filter:sepia(.5) saturate(3) hue-rotate(-38deg) brightness(1.12) drop-shadow(0 0 6px rgba(211,61,82,.95))}}
.ev-fail{animation:ev-fail 1s steps(2,jump-none) infinite}
@keyframes route-pulse{0%,100%{opacity:.55}50%{opacity:1}}
.route-glow{animation:route-pulse 1.6s ease-in-out infinite}
@keyframes pill-pop{0%{transform:translateY(14px) scale(.6);opacity:0}70%{transform:translateY(-2px) scale(1.03);opacity:1}100%{transform:translateY(0) scale(1);opacity:1}}
.pill-logo{transition:box-shadow 120ms}
.pill-logo:hover{box-shadow:0 0 0 2.5px #2563eb}
.hb-tool:hover{border-color:#16191f !important}
.sg-node{transition:box-shadow 120ms,transform 120ms}
.sg-node:hover{box-shadow:0 0 0 4px rgba(37,99,235,.22)}
.pill-pop{animation:pill-pop 300ms 90ms cubic-bezier(.2,.8,.3,1) both;transform-box:fill-box;transform-origin:50% 100%}
@keyframes pill-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.pill-bob{animation:pill-bob 2.6s ease-in-out infinite}
@keyframes rm-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
.rm-bob{animation:rm-bob 3.2s ease-in-out infinite}
@keyframes place-bar{from{transform:translate(-50%,-10px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
.place-bar{animation:place-bar 220ms cubic-bezier(.2,.8,.3,1) both}
.fmap-node .fm-full{display:none}
.fmap-node:hover .fm-full{display:block}
.fmap-node:hover .fm-short{visibility:hidden}
.fmap-node:hover{z-index:5}
.win-fs>:not(header){width:min(820px,100%);align-self:center}
.win-fs>.win-fs-full{width:100%;flex-grow:1;min-height:0}
.win-fs>.sg-tabs{width:auto;align-self:flex-start}
@keyframes fs-in{from{opacity:0;transform:scale(.985)}to{opacity:1;transform:scale(1)}}
.win-fs,.fs-hb{animation:fs-in 220ms cubic-bezier(.2,.8,.3,1) both}
@keyframes fsl-drop{from{transform:translateY(-58px)}to{transform:translateY(0)}}
.fsl-drop{animation:fsl-drop 240ms cubic-bezier(.2,.8,.3,1) both}
.fb-row:hover{background:#f4f6f9 !important}
@keyframes fb-drop{from{transform:translateY(-690px)}to{transform:translateY(0)}}
.fb-drop{animation:fb-drop 380ms cubic-bezier(.2,.8,.3,1) both}
.fsl-item{transition:background 120ms,border-color 120ms,transform 120ms}
.fsl-item:hover{background:#ffffff;border-color:#9fb3cc;transform:translateY(-1px)}
.fs-notch .fs-notch-tag{opacity:.0;transition:opacity 160ms}
.fs-notch:hover .fs-notch-tag{opacity:1}
.fs-notch:hover{background:rgba(255,255,255,0.12)}
</style>
<style>
html,body{margin:0;background:#dfe3ea}
html,body{height:100%}
#stage{width:100vw;height:100vh}
</style>
</head>
<body>
<div id="stage"></div>
<script type="text/x-template" id="view">
<div data-node-root="1" style="width: {{lay.W}}px; height: {{lay.H}}px; display: flex; background: #ffffff; color: #16191f; font-family: 'Noto Sans KR','Noto Sans',system-ui,'Segoe UI',-apple-system,sans-serif; font-size: 14px; line-height: 1.55; overflow: hidden;">

  <!-- 왼쪽 주 메뉴는 없앴다 — 기능은 유틸 서랍 · 서브 창으로 연다 -->

  <div style="flex-grow: 1; display: flex; flex-direction: column; min-width: 0;">
    <!-- 오버헤드 패널(화면 위): 조종실 천장 패널. 테이블과 같은 흰 FRP 선체 · 남색 테두리 · 남색 줄(아래쪽을 5px 위로)로 테이블을 위아래로 뒤집은 모양 —
         가운데는 얇은 띠(세션 정보), 양옆은 맵 위로 내려온 검은 계기판. 왼쪽 = 선택 상태(램프 + 표시창), 오른쪽 = 전체 창 목록(램프 버튼) -->
    <div role="status" aria-label="오버헤드 패널" data-ovh-root="1" style="height: 44px; flex-shrink: 0; position: relative; z-index: {{ovhZ}}; background: transparent; transform: {{ovA.rootT}}; pointer-events: {{ovA.pe}};">
      <svg width="{{lay.W}}" height="104" viewBox="0 0 {{lay.W}} 104" aria-hidden="true" style="position: absolute; left: 0; top: 0; z-index: 1; overflow: visible; pointer-events: none; filter: drop-shadow(0 3px 10px rgba(22,25,31,0.2));">
        <defs>
          <linearGradient id="ovh-gel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e6e9e6"></stop><stop offset="1" stop-color="#fdfdfb"></stop></linearGradient>
          <linearGradient id="ovh-pan" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a3038"></stop><stop offset="1" stop-color="#181c21"></stop></linearGradient>
          <linearGradient id="ovh-ss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4f6f8"></stop><stop offset="0.5" stop-color="#b9c0c9"></stop><stop offset="1" stop-color="#e3e7ec"></stop></linearGradient>
        </defs>
        <path data-ovh-hull="1" d="{{ovA.hull}}" fill="url(#ovh-gel)" stroke="#1f2a37" stroke-width="2.2" style="pointer-events: visiblePainted;"></path>
        <!-- 남색 줄: 아래쪽(맵 쪽)을 5px 위로 올려 아랫면 두께처럼 -->
        <path data-ovh-hull="1" d="{{ovA.hull}}" fill="none" stroke="#1e3a5f" stroke-width="1.6" opacity="0.85" transform="translate(0 -5)"></path>
        <g data-ovh-wing-g="1" transform="{{ovA.wingG}}">
        <!-- 계기판 두 장: 무광 검은 판 + 위쪽 그늘 선 -->
        <path d="M18 12 L428 12 Q438 12 432 19 L352 82 Q345 88 334 88 L34 88 Q18 88 18 72 Z" fill="url(#ovh-pan)" stroke="#0f1114" stroke-width="2"></path>
        <path d="{{lay.p1}}" fill="url(#ovh-pan)" stroke="#0f1114" stroke-width="2"></path>
        <path d="M18 12 L428 12 Q438 12 432 19 L352 82 Q345 88 334 88 L34 88 Q18 88 18 72 Z" fill="none" stroke="rgba(0,0,0,0.3)" stroke-width="3" transform="translate(0 1.5)"></path>
        <path d="{{lay.p1}}" fill="none" stroke="rgba(0,0,0,0.3)" stroke-width="3" transform="translate(0 1.5)"></path>
        <!-- 판 고정 나사 -->
        <g fill="url(#ovh-ss)" stroke="#5b6472" stroke-width="0.7">
          <circle cx="25" cy="19" r="2.6"></circle><circle cx="25" cy="81" r="2.6"></circle><circle cx="418" cy="19" r="2.6"></circle><circle cx="334" cy="81" r="2.6"></circle>
          <circle cx="{{lay.x1422}}" cy="19" r="2.6"></circle><circle cx="{{lay.x1422}}" cy="81" r="2.6"></circle><circle cx="{{lay.x1029}}" cy="19" r="2.6"></circle><circle cx="{{lay.x1113}}" cy="81" r="2.6"></circle>
        </g>
        </g>
        <!-- 가운데 띠: 테이블 네임 박스와 같은 흰 홈 -->
        <rect x="452" y="7" width="{{lay.boxW}}" height="26" rx="8" fill="#f7f8f6" stroke="#d3d8dd" stroke-width="1"></rect>
        <g transform="translate(470 41)"><rect x="-13" y="-2.6" width="26" height="5.2" rx="2.6" fill="url(#ovh-ss)" stroke="#6b7480" stroke-width="0.8"></rect></g>
        <g transform="translate({{lay.x977}} 41)"><rect x="-13" y="-2.6" width="26" height="5.2" rx="2.6" fill="url(#ovh-ss)" stroke="#6b7480" stroke-width="0.8"></rect></g>
      </svg>
      <!-- 손잡이: 오버헤드 패널 접기 · 펴기. 패널 오른쪽 아래에 매달려 따라 움직이고, 접히면 화면 맨 위에 남는다 -->
      <button type="button" data-ovh-handle="1" aria-label="{{ovA.hTip}}" title="{{ovA.hTip}}" aria-expanded="{{ovA.exp}}" onPointerDown="{{stopEv}}" onClick="{{ovA.toggle}}" style="position: absolute; left: {{ovA.hL}}px; top: {{ovA.hTop}}px; z-index: 3; width: 76px; height: 20px; box-sizing: border-box; padding: 0; border: 2.2px solid #1f2a37; border-top: 0; border-radius: 0 0 12px 12px; background: linear-gradient(180deg, #e6e9e6, #fdfdfb); box-shadow: 0 3px 8px rgba(22,25,31,0.22); cursor: pointer; pointer-events: auto; display: flex; align-items: center; justify-content: center; gap: 6px;">
        <span aria-hidden="true" style="width: 22px; height: 5px; box-sizing: border-box; border-radius: 3px; background: linear-gradient(180deg, #f4f6f8, #b9c0c9 55%, #e3e7ec); border: 1px solid #6b7480;"></span>
        <span data-ovh-chev="1" aria-hidden="true" style="font-size: 9px; color: #1e3a5f; font-weight: 800; line-height: 1;">{{ovA.chev}}</span>
      </button>
      <!-- 전체 화면 리스트: 상단 테이블(선체) 뒤에서 내려와 가운데 파인 곳을 다 메운다 (양옆 계기판 깊이 y 100까지).
           전체 화면으로 한 번 연 화면만 모인다 — 처음엔 빈 칸. 누르면 그 화면으로, ×는 리스트에서 빼기 -->
      <sc-if value="{{ovh.fsList}}" hint-placeholder-val="{{false}}">
        <div data-fs-list="1" class="fsl-drop" role="menu" aria-label="전체 화면 리스트" onPointerDown="{{stopEv}}" style="position: absolute; left: 300px; top: 30px; width: {{lay.fslW}}px; height: 70px; z-index: 0; box-sizing: border-box; background: linear-gradient(180deg, #e6e9e6, #fdfdfb); border-bottom: 2.2px solid #1f2a37; box-shadow: 0 4px 10px rgba(22,25,31,0.2);">
          <span aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 3.4px; height: 1.6px; background: #1e3a5f; opacity: 0.85;"></span>
          <div style="position: absolute; left: 112px; top: 20px; width: {{lay.fslInW}}px; height: 42px; display: flex; flex-wrap: wrap; align-content: flex-start; justify-content: center; gap: 4px 5px; overflow: hidden;">
            <sc-for list="{{ovh.fsl}}" as="fi" hint-placeholder-count="0">
              <div role="menuitem" class="fsl-item" data-fsl="{{fi.id}}" title="{{fi.tip}}" onClick="{{fi.go}}" style="position: relative; width: 140px; height: 19px; box-sizing: border-box; padding: 0 3px 0 9px; border: 1px solid {{fi.line}}; border-radius: 6px; background: {{fi.bg}}; color: {{fi.fg}}; font-size: 10.5px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 4px; white-space: nowrap; overflow: hidden;">
                <span aria-hidden="true" style="position: absolute; left: 3px; top: 4px; bottom: 4px; width: 2.5px; border-radius: 2px; background: {{fi.tick}};"></span>
                <img src="{{fi.logo}}" alt="" width="13" height="13" style="width: 13px; height: 13px; image-rendering: pixelated; flex-shrink: 0;">
                <span style="flex-grow: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis;">{{fi.label}}</span>
                <button type="button" aria-label="{{fi.label}} 리스트에서 빼기" title="리스트에서 빼기" onClick="{{fi.drop}}" style="width: 14px; height: 14px; flex-shrink: 0; border: 0; border-radius: 7px; background: transparent; color: inherit; opacity: 0.55; font: inherit; font-size: 11px; line-height: 1; cursor: pointer; padding: 0;">×</button>
              </div>
            </sc-for>
            <sc-if value="{{ovh.fslEmpty}}" hint-placeholder-val="{{true}}">
              <span data-fsl-empty="1" style="align-self: center; font-size: 11px; color: #8b95a6; line-height: 38px;">비어 있음 — 창을 전체 화면으로 열면 여기 모인다</span>
            </sc-if>
          </div>
        </div>
      </sc-if>
      <!-- 가운데: 전체 창 리스트 박스 (세션 정보 + 지금 화면). 누르면 리스트가 내려온다 -->
      <button type="button" data-fs-box="1" data-z="2" aria-label="전체 창 리스트 박스 — 지금 화면 {{ovh.boxCur}}" aria-expanded="{{ovh.fsList}}" onPointerDown="{{stopEv}}" onClick="{{ovh.boxToggle}}" style="position: absolute; z-index: 2; left: 452px; top: 7px; width: {{lay.boxW}}px; height: 26px; box-sizing: border-box; padding: 0 8px 0 12px; border: 0; border-radius: 8px; background: transparent; font: inherit; cursor: pointer; display: flex; align-items: center; gap: 9px; font-size: 12px; color: #16191f; white-space: nowrap; text-align: left;">
        <img src="data:image/svg+xml;base64,PD94bWwgdmVyc2lvbj0iMS4wIiBlbmNvZGluZz0iVVRGLTgiPz4KPHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9Ii0xMiAtMTIgMjI0IDIyNCIgd2lkdGg9IjEwMjQiIGhlaWdodD0iMTAyNCI+PHRpdGxlPlRlcnJhPC90aXRsZT48ZGVmcz48bWFzayBpZD0ic3Rhci1jdXQiIG1hc2tVbml0cz0idXNlclNwYWNlT25Vc2UiIHg9IjAiIHk9IjAiIHdpZHRoPSIyMDAiIGhlaWdodD0iMjAwIj48cGF0aCBmaWxsPSIjZmZmIiBkPSJNOCAyMiBMNTAgMzEgTDQwIDE4IEw3MCAyOCBMNzggMjYgTDgwIDkgTDkwIDI0IEwxMTYgMzAgTDE1MCAyOSBMMTU4IDM0IEwxODQgMTkgTDE2OCA0NiBMMTUwIDQyIEwxMzggNDcgTDEyMyA1NyBMMTE5IDk4IEwxMzYgMTAwIEwxMjEgMTEyIEwxMTcgMTI1IEwxMjMgMTU4IEwxNDIgMTc0IEw1MiAxNzQgTDc2IDE0OCBMODYgMTE4IEw4OCAxMDYgTDgzIDgxIEw5MyA4OCBMOTggNzIgTDk1IDYwIEw2NCA0NSBMMjYgNDkgTDM4IDQwWiI+PC9wYXRoPjxwYXRoIGZpbGw9IiMwMDAiIGQ9Ik0xMDYgMzIgQzEwNi40MCA0MC40MCAxMDcuNjAgNDEuNjAgMTE2IDQyIEMxMDcuNjAgNDIuNDAgMTA2LjQwIDQzLjYwIDEwNiA1MiBDMTA1LjYwIDQzLjYwIDEwNC40MCA0Mi40MCA5NiA0MiBDMTA0LjQwIDQxLjYwIDEwNS42MCA0MC40MCAxMDYgMzJaIj48L3BhdGg+PC9tYXNrPjwvZGVmcz48cmVjdCB4PSIwIiB5PSIwIiB3aWR0aD0iMjAwIiBoZWlnaHQ9IjIwMCIgZmlsbD0iIzEzMTMxMyIgbWFzaz0idXJsKCNzdGFyLWN1dCkiPjwvcmVjdD48L3N2Zz4K" alt="Terra" title="Terra" width="18" height="18" style="width: 18px; height: 18px; flex-shrink: 0;">
        <span style="color: {{who.dotC}}; font-size: 10px;">●</span>
        <span style="font-weight: 700;">{{who.name}}</span>
        <span title="{{who.sub}}" style="color: #5b6472; font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; min-width: 0;">{{who.sub}}</span>
        <span style="flex-grow: 1;"></span>
        <span style="width: 1px; height: 14px; background: #d3d8dd;"></span>
        <span data-fs-cur="1" style="font-size: 11.5px; font-weight: 700; color: #1e3a5f;">{{ovh.boxCur}}</span>
        <span aria-hidden="true" style="font-size: 10px; color: #1e3a5f;">{{ovh.boxChev}}</span>
      </button>
      <!-- 왼쪽 계기판: 선택 상태 -->
      <div data-ovh-status="1" data-ovh-wing-h="1" aria-label="선택 상태" style="position: absolute; left: 0; top: 0; z-index: 2; width: 440px; height: 88px; pointer-events: none; transform: {{ovA.wingH}}; font-family: 'Noto Sans KR', system-ui, sans-serif;">
        <div style="position: absolute; left: 32px; top: 18px; width: 164px; height: 60px; box-sizing: border-box; padding: 4px 9px; border-radius: 6px; background: linear-gradient(180deg, #0a120e, #0f1a14); border: 1px solid #05080a; box-shadow: inset 0 2px 6px rgba(0,0,0,0.7), 0 1px 0 rgba(255,255,255,0.06); display: flex; flex-direction: column; gap: 1px; overflow: hidden;">
          <span data-ovh-head="1" style="opacity: {{ovh.lcdOp}}; font-size: 10px; line-height: 13px; color: #4fbf82; letter-spacing: 0.02em; white-space: nowrap;">{{ovh.head}}</span>
          <span data-ovh-name="1" style="font-size: 15px; line-height: 20px; font-weight: 700; color: #a8f7cb; text-shadow: {{ovh.lcdGlow}}; opacity: {{ovh.lcdOp}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-family: ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;">{{ovh.name}}</span>
          <span style="opacity: {{ovh.lcdOp}}; font-size: 10px; line-height: 13px; color: #6fd29c; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{ovh.detail}}</span>
        </div>
        <div style="position: absolute; left: 204px; top: 18px; width: 132px; display: grid; grid-template-columns: repeat(3, 40px); grid-auto-rows: 18px; gap: 3px 4px;">
          <sc-for list="{{ovh.lamps}}" as="lp" hint-placeholder-count="9">
            <span title="{{lp.tip}}" style="pointer-events: auto; box-sizing: border-box; border-radius: 3px; border: 1px solid #07090b; background: {{lp.bg}}; box-shadow: {{lp.glow}}; color: {{lp.fg}}; text-shadow: {{lp.ts}}; font-size: 9px; font-weight: 700; letter-spacing: 0.02em; display: flex; align-items: center; justify-content: center; white-space: nowrap; transition: color 160ms, box-shadow 160ms;">{{lp.label}}</span>
          </sc-for>
        </div>
      </div>
      <!-- 오른쪽 계기판: 폴더 보관함. 누르면 사이드 바가 상단 테이블 뒤에서 위 → 아래로 내려온다. 램프 셋 = 바로가기(누르면 그곳으로 바로) -->
      <div data-fb-pod="1" role="button" aria-label="폴더 보관함 — {{fb.podState}}" aria-expanded="{{fb.open}}" onPointerDown="{{stopEv}}" onClick="{{fb.toggle}}" data-ovh-wing-h="1" style="position: absolute; left: {{lay.podL}}px; top: 10px; z-index: 2; width: 326px; height: 78px; cursor: pointer; transform: {{ovA.wingH}}; font-family: 'Noto Sans KR', system-ui, sans-serif; clip-path: polygon(0 0, 100% 0, 100% 100%, 13px 100%, 0 68px);">
        <svg width="30" height="28" viewBox="0 0 30 28" aria-hidden="true" style="position: absolute; left: 22px; top: 6px;">

             그라운드 윤곽(세계 좌표)을 굵기가 다른 선으로 겹쳐 그려 수심 띠를 만든다(바깥부터 깊음 → 얕음 → 물가 거품). 세로는 K로 눕혀 아이소 바닥에 붙는다
             물가 띠와 거품은 천천히 밀려왔다 빠진다(sea-wash · sea-foam). 바다 유체 킷(Ocean 보드)의 물 · 거품 색을 따른다 -->
        <g data-sea="1" style="pointer-events: none; opacity: {{gnd.op}}; transition: opacity 420ms ease-out;">
          <g transform="{{gnd.seaT}}">
</g>
        </g>

        <!-- 그라운드: 높이 0인 바닥 필드 (필드 바닥면 = 리전 높이). 칸 = 리전 격자의 보로노이 칸이라 이웃과 틈 없이 맞붙고, 이웃이 없는 꼭짓점만 둥글다
             재질 · 무늬 회전이 같은 칸끼리 경로 하나로 칠한다. 애니메이션 재질은 animTick이 무늬(fill)만 바꾼다 -->
        <g data-ground="1" style="pointer-events: none; opacity: {{gnd.op}}; transition: opacity 420ms ease-out;">
          <!-- 해안: 관리 노드 창 해변과 같은 beach-foam 엔진을 해안선을 따라 감아 돌린다 (coastStart가 매 프레임 d만 바꾼다, 세계 좌표 → seaT).
               뒤 → 앞: 얕은 물 · 거품 띠(리본) · 리본 구멍 · 거품 · 거품 구멍 → 해변(해안 그라운드 윗면, 물가 E 안쪽만) → 젖은 모래(E ~ W) → 그라운드 -->
          <g>

      <!-- 바다 · 해안(캔버스): 아래 층 svg(해변 = 해안 그라운드 윗면 · 그라운드) 위, 위 층 svg(필드 · 건물) 아래.
           깊은 바다 · 수심 띠 · beach-foam 해안(얕은 물 · 리본 · 거품 · 거품 구멍)을 그린 뒤, 물가(E) 안쪽을 지워 해변 · 그라운드가 보이게 한다. 젖은 모래(E ~ W)는 그 위에 옅게.
           맵 이동 · 확대는 매 프레임 [data-fx-g]의 변환을 읽어 맞춘다 (seaStart · coastStart, 렌더 밖) -->
      <canvas data-sea-cv="1" aria-hidden="true" style="position: absolute; left: 0; top: -44px; width: {{lay.W}}px; height: {{lay.FHx}}px; pointer-events: none;"></canvas>
      <!-- 위 층 svg: 필드 · 건물 · 노드 · 칸. 해안 파도가 매 프레임 바뀌어도 이 층은 다시 그리지 않도록 아래 층(바다 · 그라운드 · 해안)과 나눴다. 두 층은 같은 변환([data-fx-g])을 쓴다 -->
      <svg data-field-svg="1" width="{{lay.W}}" height="{{lay.FHx}}" viewBox="0 -44 {{lay.W}} {{lay.FHx}}" role="img" aria-label="필드 — 타일마다 재질이 다른 클러스터 바닥" style="display: block; position: absolute; left: 0; top: -44px;">
        <g data-fx-g="1" transform="{{fx.T}}" style="opacity: {{fx.op}}; transition: opacity 180ms ease-out;">


        <sc-for list="{{slots}}" as="sl" hint-placeholder-count="0">
          <g transform="{{sl.T}}" data-slot="{{sl.key}}">
            <polygon points="{{tg.top}}" fill="rgba(37,99,235,0.06)" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="8 7" stroke-linejoin="round" opacity="0.55"></polygon>
            <polygon points="{{tg.top}}" fill="rgba(37,99,235,0.16)" stroke="#2563eb" stroke-width="2.5" stroke-linejoin="round" opacity="{{sl.on}}"></polygon>
          </g>
        </sc-for>

        <sc-for list="{{tiles}}" as="t" hint-placeholder-count="29">
          <g class="{{t.rise}}" style="animation-delay: {{t.delay}};">
            <g class="tile tile-lift" data-key="{{t.key}}" style="transform: translateY({{t.dy}}); opacity: {{t.op}}; cursor: grab;" onPointerDown="{{t.grab}}" onClick="{{t.pick}}">
              <title>{{t.label}}</title>
              <g style="transform: {{t.xf}}; opacity: {{t.mop}}; transition: {{t.atr}}; filter: {{t.sun}};">
              <g id="{{t.gid}}" transform="{{t.T0}}" clip-path="url(#clip-ground)"><g style="transform: translateY({{t.ly}}px); transition: transform 520ms cubic-bezier(.3,.7,.2,1);">
              <image class="tile-body" data-anim="{{t.anim}}" href="{{t.img}}" x="{{t.ix}}" y="{{t.iy}}" width="{{t.iw}}" height="{{t.ih}}" preserveAspectRatio="none" style="display: {{t.imgDisp}};"></image>
              <use class="tile-body" href="{{t.href}}" style="display: {{t.useDisp}};"></use>
              <!-- 그라운드만 깔린 칸: 몸통이 없으니 바닥면의 윤곽으로 누른다 (필드를 끄는 동안엔 아래 빈 칸 표시가 받도록 비킨다) -->
              <polygon points="{{tg.top}}" fill="#1c2733" fill-opacity="0.001" style="display: {{t.gDisp}}; pointer-events: {{t.gPe}};"></polygon>
              <polygon class="{{t.ringCls}}" points="{{tg.top}}" fill="{{t.ringFill}}" stroke="{{t.ringC}}" stroke-width="3" stroke-dasharray="{{t.ringDash}}" stroke-linejoin="round" opacity="{{t.ring}}"></polygon>
              <g clip-path="url(#clip-tile)" style="pointer-events: none;">
                <path d="{{t.bshadow}}" fill="#1c2733" opacity="0.26"></path>
              </g>
              <image class="{{t.bcls}}" data-anim="{{t.banim}}" href="{{t.bimg}}" x="{{t.bix}}" y="{{t.biy}}" width="{{t.biw}}" height="{{t.bih}}" preserveAspectRatio="none" style="display: {{t.bimgDisp}}; pointer-events: none; opacity: {{t.bop}};"></image>
              <!-- 누르기 판정: 건물 윤곽 한 장 (그리지 않음 — 이미지의 투명한 테두리가 뒤 타일을 가리지 않게) -->
              <path d="{{t.bhit}}" fill="none" style="pointer-events: fill;"></path>
              <g>
                <sc-for list="{{t.bpaths}}" as="bp" hint-placeholder-count="0">
                  <path d="{{bp.d}}" fill="{{bp.edge}}" fill-rule="evenodd" stroke="{{bp.edge}}" stroke-width="0.5" stroke-linejoin="round"></path>
                  <path d="{{bp.d}}" fill="{{bp.fill}}" fill-rule="evenodd"></path>
                </sc-for>
              </g>
              <!-- 건물 없는 노드 · 자원 필드의 표지 (편집 창에서 고른다): 깃발 꽂기 · 눕힌 이모지 로고 -->
              <!-- 표지는 누르기 · 끌어 놓기 판정에 포함된다 (깃발 끝이 뒤 칸 위로 솟아도 이 칸으로 놓인다) -->
              <g style="display: {{t.mkFlat}};" transform="scale(1 0.55)">
                <image href="{{t.mkLogo}}" x="-31" y="-27" width="62" height="62" preserveAspectRatio="xMidYMid meet" opacity="0.28" style="display: {{t.mkLogoDisp}}; image-rendering: pixelated; filter: brightness(0);"></image>
                <image href="{{t.mkLogo}}" x="-31" y="-31" width="62" height="62" preserveAspectRatio="xMidYMid meet" style="display: {{t.mkLogoDisp}}; image-rendering: pixelated;"></image>
                <foreignObject x="-40" y="-40" width="80" height="80" style="display: {{t.mkEmDisp}};">
                  <div xmlns="http://www.w3.org/1999/xhtml" style="width: 80px; height: 80px; display: flex; align-items: center; justify-content: center; font-size: 50px; line-height: 1; letter-spacing: -14px; opacity: 0.94; filter: drop-shadow(0 4px 0 rgba(28,39,51,0.28));">{{t.mkEmoji}}</div>
                </foreignObject>
              </g>
              <g style="display: {{t.mkFlag}};">
                <ellipse cx="0" cy="2" rx="9" ry="4.5" fill="#1c2733" opacity="0.28"></ellipse>
                <ellipse cx="0" cy="0" rx="6" ry="3" fill="#8b95a6"></ellipse>
                <line x1="0" y1="0" x2="0" y2="-62" stroke="#3a404b" stroke-width="2.6" stroke-linecap="round"></line>
                <circle cx="0" cy="-63" r="2.6" fill="#ffd84d" stroke="#3a404b" stroke-width="1"></circle>
                <path d="M1.5 -60 L40 -60 L34 -47 L40 -34 L1.5 -34 Z" fill="{{t.mkColor}}" stroke="#16191f" stroke-width="1.2" stroke-linejoin="round"></path>
                <image href="{{t.mkLogo}}" x="9" y="-58" width="22" height="22" style="display: {{t.mkLogoDisp}}; image-rendering: pixelated;"></image>
                <foreignObject x="3" y="-60" width="30" height="26" style="display: {{t.mkEmDisp}};">
                  <div xmlns="http://www.w3.org/1999/xhtml" style="width: 30px; height: 26px; display: flex; align-items: center; justify-content: center; font-size: 15px; line-height: 1; letter-spacing: -5px;">{{t.mkEmoji}}</div>
                </foreignObject>
              </g>
              </g></g>
              </g>
            </g>
          </g>
        </sc-for>

        <g transform="{{fghost2.T}}" opacity="{{fghost2.op}}" style="pointer-events: none; display: {{fghost2.disp}};">
          <image data-anim="{{fghost2.anim}}" href="{{fghost2.img}}" x="{{fghost2.ix}}" y="{{fghost2.iy}}" width="{{fghost2.iw}}" height="{{fghost2.ih}}" preserveAspectRatio="none" style="display: {{fghost2.imgDisp}};"></image>
          <use href="{{fghost2.href}}" style="display: {{fghost2.useDisp}};"></use>
          <polygon points="{{tg.top}}" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="10 8" stroke-linejoin="round"></polygon>
        </g>
        <g transform="{{fghost.T}}" opacity="{{fghost.op}}" style="pointer-events: none; display: {{fghost.disp}};">
          <image data-anim="{{fghost.anim}}" href="{{fghost.img}}" x="{{fghost.ix}}" y="{{fghost.iy}}" width="{{fghost.iw}}" height="{{fghost.ih}}" preserveAspectRatio="none" style="display: {{fghost.imgDisp}};"></image>
          <use href="{{fghost.href}}" style="display: {{fghost.useDisp}};"></use>
          <polygon points="{{tg.top}}" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="10 8" stroke-linejoin="round"></polygon>
        </g>

        <g transform="{{ghost.t}}" opacity="{{ghost.op}}" style="pointer-events: none;">
          <path d="{{ghost.shadow}}" fill="#1c2733" opacity="0.26"></path>
          <sc-for list="{{ghost.paths}}" as="gp" hint-placeholder-count="0">
            <path d="{{gp.d}}" fill="{{gp.edge}}" fill-rule="evenodd" stroke="{{gp.edge}}" stroke-width="0.5" stroke-linejoin="round"></path>
            <path d="{{gp.d}}" fill="{{gp.fill}}" fill-rule="evenodd"></path>
          </sc-for>
        </g>

        <!-- 선택 실루엣 테두리 (앞 타일 위로 비쳐 보이게) -->
        <!-- 테두리 선은 이 한 줄뿐 (제자리 필터는 번지는 빛만). 타일이 다 올라온 뒤(0.24초)에 나타나 올라오는 동안 두 줄이 보이지 않게 한다 -->
        <use class="rim-in" href="{{selRim.href}}" transform="{{selRim.T}}" filter="url(#sel-rim)" style="display: {{selRim.disp}}; pointer-events: none;" opacity="0.92"></use>
        <!-- 경로 보기: 고른 칸이 든 연결의 칸들을 한 덩어리로 묶어 바깥 윤곽만 빛낸다. 출력 = 초록 · 길 = 파랑 · 입력 = 노랑 -->
        <g data-route-glow="1" class="route-glow" style="display: {{route.disp}}; pointer-events: none;">
          <g filter="url(#route-glow-b)" mask="url(#rt-m-b)"><sc-for list="{{route.all}}" as="rr" hint-placeholder-count="0"><use href="{{rr.href}}"></use></sc-for></g>
          <g filter="url(#route-glow-g)" mask="url(#rt-m-g)"><sc-for list="{{route.all}}" as="rr" hint-placeholder-count="0"><use href="{{rr.href}}"></use></sc-for></g>
          <g filter="url(#route-glow-y)" mask="url(#rt-m-y)"><sc-for list="{{route.all}}" as="rr" hint-placeholder-count="0"><use href="{{rr.href}}"></use></sc-for></g>
        </g>
        <!-- 노드 자원 표식: 자원이 설치된 필드 위에 떠 있는 작은 원 (선택되면 아래 상태 창으로 바뀐다) -->
        <sc-for list="{{rmarks}}" as="rm" hint-placeholder-count="0">
          <g transform="{{rm.T}}" style="pointer-events: none;">
            <g class="rm-bob">
              <line x1="0" y1="-4" x2="0" y2="-24" stroke="#16191f" stroke-width="1.5" stroke-linecap="round" opacity="0.5"></line>
              <!-- SVG text에는 {{}} 글자가 들어가지 않아(span) 글자는 foreignObject의 HTML로 -->
              <foreignObject x="-17" y="-55" width="34" height="34">
                <div xmlns="http://www.w3.org/1999/xhtml" style="position: relative; width: 29px; height: 29px; margin: 1px; box-sizing: border-box; border-radius: 50%; border: 1.6px solid #16191f; background: #ffffff; display: flex; align-items: center; justify-content: center;">
                  <span style="width: 23px; height: 23px; border-radius: 50%; background: {{rm.disc}}; display: flex; align-items: center; justify-content: center; font-size: 13px; line-height: 1;">{{rm.emoji}}</span>
                  <span style="position: absolute; right: -2px; top: -2px; width: 8px; height: 8px; border-radius: 50%; background: {{rm.dot}}; border: 1.5px solid #ffffff;"></span>
                </div>
              </foreignObject>
            </g>
          </g>
        </sc-for>
        <!-- 컴포넌트 상태 창: 고른 필드에 건물이 없으면 필드 위에 뜬다. 왼쪽 원 = 이모지(노드 leaf · tree · 둘 다 / 자원 타입), 오른쪽 = 이름 -->
        <!-- 노드 설정 창 (상태 창): 고른 노드 · 자원 · 도로 위에 뜬다. 건물이 있으면 건물 꼭대기 위로.
             누르면 메뉴가 펼쳐진다 — 🔗 연결하기(누른 채 끌어 연결할 노드 · 자원에 놓기) · 도로 종류 · 설정. 합류(도로 칸)는 이어진 자원을 골라 거기서 다시 끈다 -->
        <g transform="{{pill.T}}" data-key="{{pill.k}}" style="display: {{pill.disp}}; pointer-events: {{pill.pe}}; opacity: {{pill.op}}; cursor: pointer;">
          <title>{{pill.tip}}</title>
          <g class="pill-pop" data-pill="{{pill.k}}">
            <g class="{{pill.bob}}">
              <line x1="0" y1="-2" x2="0" y2="{{pill.stemY}}" stroke="#16191f" stroke-width="1.6" stroke-linecap="round" opacity="0.55"></line>
              <circle cx="0" cy="0" r="3" fill="#16191f" opacity="0.55"></circle>
              <foreignObject x="{{pill.x0}}" y="{{pill.fy}}" width="{{pill.fw}}" height="{{pill.fh}}">
                <div xmlns="http://www.w3.org/1999/xhtml" style="height: {{pill.fh}}px; display: flex; flex-direction: column; justify-content: flex-end; align-items: flex-start; gap: 5px; font-family: 'Noto Sans KR','Noto Sans',system-ui,sans-serif;">
                  <div data-pill-src="1" style="display: {{pill.srcDisp}}; align-items: center; gap: 4px; padding: 4px 6px; margin-left: 2px; border-radius: 10px; background: rgba(255,255,255,0.96); border: 1.2px solid #16191f; white-space: nowrap;">
                    <span style="font-size: 11px; color: #5b6472;">이어진 자원</span>
                    <sc-for list="{{pill.srcs}}" as="sr" hint-placeholder-count="0">
                      <button type="button" onClick="{{sr.pick}}" style="height: 22px; padding: 0 8px; border: 1px solid {{sr.line}}; border-radius: 11px; background: {{sr.bg}}; color: {{sr.fg}}; font: inherit; font-size: 11px; font-weight: 600; cursor: pointer;">{{sr.label}}</button>
                    </sc-for>
                    <span style="font-size: 11px; color: #8b95a6; display: {{pill.srcNoneDisp}};">없음 — 먼저 자원 · 노드에서 연결하세요</span>
                  </div>
                  <div data-pill-menu="1" style="display: {{pill.menuDisp}}; align-items: center; gap: 4px; padding: 4px; margin-left: 2px; border-radius: 12px; background: #16191f; box-shadow: 0 6px 16px rgba(22,25,31,0.25); white-space: nowrap;">
                    <button type="button" data-conn-btn="1" onPointerDown="{{pill.connDown}}" title="{{pill.connTip}}" style="height: 28px; padding: 0 11px; border: 0; border-radius: 9px; background: {{pill.connBg}}; color: {{pill.connFg}}; font: inherit; font-size: 12px; font-weight: 700; cursor: grab; touch-action: none;">🔗 연결하기 <span style="font-weight: 400; opacity: 0.75;">· 누른 채 끌기</span></button>
                    <button type="button" data-road-pick="1" onClick="{{pill.roadNext}}" title="새로 깔 도로 종류 — 누를 때마다 바뀐다" style="height: 28px; padding: 0 10px; border: 0; border-radius: 9px; background: #2b3039; color: #ffffff; font: inherit; font-size: 12px; cursor: pointer;">🛣️ {{pill.roadName}}</button>
                    <button type="button" onClick="{{pill.open}}" style="height: 28px; padding: 0 10px; border: 0; border-radius: 9px; background: #2b3039; color: #ffffff; font: inherit; font-size: 12px; cursor: pointer;">⚙️ {{pill.openLabel}}</button>
                    <button type="button" data-road-del="cell" onClick="{{pill.delCell}}" title="이 도로 칸만 걷어 낸다 — 이 칸을 지나던 연결은 끊긴다" style="display: {{pill.roadDisp}}; height: 28px; padding: 0 10px; border: 0; border-radius: 9px; background: #4a1f26; color: #ffb4bf; font: inherit; font-size: 12px; cursor: pointer;">🗑️ 칸 철거</button>
                    <button type="button" data-road-del="route" onClick="{{pill.delRoute}}" title="이 칸을 지나는 연결과, 그 연결만 쓰던 도로를 모두 걷어 낸다" style="display: {{pill.roadDisp}}; height: 28px; padding: 0 10px; border: 0; border-radius: 9px; background: #4a1f26; color: #ffb4bf; font: inherit; font-size: 12px; cursor: pointer;">🗑️ 경로 철거</button>
                  </div>
                  <div data-pill-box="1" onClick="{{pill.toggle}}" style="position: relative; display: inline-flex; align-items: center; gap: 7px; height: 38px; margin: 0 4px 6px 2px; padding: 0 12px 0 2px; box-sizing: border-box; border-radius: 19px; border: 1.6px solid #16191f; background: #ffffff; box-shadow: 1px 3px 0 rgba(22,25,31,0.16); white-space: nowrap; flex-shrink: 0;">
                    <span data-pill-logo="1" class="pill-logo" role="button" title="상태 화면" onClick="{{pill.stat}}" style="width: 31px; height: 31px; flex-shrink: 0; border-radius: 50%; background: {{pill.disc}}; display: flex; align-items: center; justify-content: center; font-size: {{pill.efs}}px; line-height: 1; letter-spacing: -2px; cursor: zoom-in;"><img src="{{pill.logo}}" alt="" width="24" height="24" style="display: {{pill.logoDisp}}; width: 24px; height: 24px; image-rendering: pixelated;">{{pill.emoji}}</span>
                    <b data-pill-name="1" title="연결 메뉴" style="font-size: 13.5px; color: #16191f;">{{pill.name}}</b>
                    <span style="font-size: 11px; color: #5b6472; display: {{pill.subDisp}};">{{pill.sub}}</span>
                    <span style="font-size: 10px; color: #8b95a6;">{{pill.caret}}</span>
                    <span style="position: absolute; right: 6px; top: 3px; width: 8px; height: 8px; border-radius: 50%; background: {{pill.dot}}; border: 1.5px solid #ffffff;"></span>
                  </div>
                </div>
              </foreignObject>
            </g>
          </g>
        </g>
        <!-- 연결 끌기: 경유지 핀 · 대상 표시 -->
        <sc-for list="{{connMarks}}" as="cm" hint-placeholder-count="0">
          <g transform="{{cm.T}}" style="pointer-events: none;">
            <ellipse cx="0" cy="0" rx="22" ry="12" fill="none" stroke="{{cm.c}}" stroke-width="3" stroke-dasharray="{{cm.dash}}"></ellipse>
            <foreignObject x="-12" y="-40" width="24" height="24" style="display: {{cm.nDisp}};">
              <div xmlns="http://www.w3.org/1999/xhtml" style="width: 22px; height: 22px; border-radius: 50%; background: #ffd84d; border: 1.5px solid #16191f; display: flex; align-items: center; justify-content: center; font: 700 12px 'Noto Sans KR',sans-serif; color: #16191f;">{{cm.n}}</div>
            </foreignObject>
          </g>
        </sc-for>
        <line x1="{{connLine.x1}}" y1="{{connLine.y1}}" x2="{{connLine.x2}}" y2="{{connLine.y2}}" stroke="#d33d52" stroke-width="3" stroke-dasharray="8 6" stroke-linecap="round" style="display: {{connLine.disp}}; pointer-events: none;"></line>
        </g>
      </svg>

      <!-- 연결하기: 누른 채 끄는 동안 뜬다 -->
      <sc-if value="{{connBar.on}}" hint-placeholder-val="{{false}}">
        <div data-conn-bar="1" class="place-bar" style="position: absolute; left: 50%; top: 66px; z-index: 12; display: flex; align-items: center; gap: 10px; height: 38px; padding: 0 14px 0 6px; border-radius: 19px; background: #16191f; color: #ffffff; font-size: 12.5px; box-shadow: 0 10px 26px rgba(22,25,31,0.28); white-space: nowrap; pointer-events: none;">
          <span style="width: 28px; height: 28px; border-radius: 50%; background: #3a404b; display: inline-flex; align-items: center; justify-content: center; font-size: 15px;">🔗</span>
          <span><b>{{connBar.from}}</b> → <b style="color: {{connBar.toC}};">{{connBar.to}}</b></span>
          <span style="color: #aab3c0;">경유 {{connBar.nw}} · 도로 {{connBar.len}}칸 · {{connBar.road}}</span>
          <span style="color: #ffd84d; font-weight: 700;">{{connBar.msg}}</span>
        </div>
      </sc-if>

      <!-- 노드 자원 설치: 조타륜 앱 카드의 📍 설치를 누르면 필드를 고르는 동안 뜬다 (Esc = 그만두기) -->
      <sc-if value="{{placeBar.on}}" hint-placeholder-val="{{false}}">
        <div data-place-bar="1" class="place-bar" style="position: absolute; left: 50%; top: 66px; z-index: 12; display: flex; align-items: center; gap: 10px; height: 38px; padding: 0 6px 0 6px; border-radius: 19px; background: #16191f; color: #ffffff; font-size: 12.5px; box-shadow: 0 10px 26px rgba(22,25,31,0.28); white-space: nowrap;">
          <span style="width: 28px; height: 28px; border-radius: 50%; background: #3a404b; display: inline-flex; align-items: center; justify-content: center; font-size: 15px;">{{placeBar.emoji}}</span>
          <span><b>{{placeBar.name}}</b> <span style="color: #aab3c0;">· {{placeBar.from}}</span></span>
          <span style="color: #ffd84d; font-weight: 700;">{{placeBar.msg}}</span>
          <button type="button" onClick="{{placeBar.cancel}}" style="height: 26px; padding: 0 12px; border: 0; border-radius: 13px; background: #ffffff; color: #16191f; font: inherit; font-size: 12px; font-weight: 700; cursor: pointer;">취소 · Esc</button>
        </div>
      </sc-if>

      <!-- 도로 표시 빠른 토글 (도로가 하나라도 있을 때) — 맵이 복잡할 때 끈다 -->
      <button type="button" data-roads-chip="1" onClick="{{roadSw.toggle}}" title="도로 표시 켜기 · 끄기 (연결은 그대로)" style="display: {{roadSw.chipDisp}}; position: absolute; left: 16px; top: 66px; z-index: 12; height: 30px; padding: 0 12px; border: 1px solid {{roadSw.line}}; border-radius: 15px; background: {{roadSw.chipBg}}; color: {{roadSw.chipFg}}; font: inherit; font-size: 12px; font-weight: 700; cursor: pointer; box-shadow: 0 4px 12px rgba(22,25,31,0.12);">🛣️ 도로 {{roadSw.label}}</button>
      <!-- 보기 배율: 옮기거나 확대했을 때만 보인다. 가운데 = 처음 보기로 (키 0) -->
      <div role="group" aria-label="맵 보기" style="display: {{zoom.disp}}; position: absolute; top: 14px; left: 50%; transform: translateX(-50%); z-index: 12; align-items: center; gap: 2px; padding: 3px; border-radius: 10px; background: rgba(255,255,255,0.92); border: 1px solid #d8dde5; box-shadow: 0 4px 14px rgba(22,25,31,0.10); font-size: 12px;">

           누른 채 좌우로 끌거나, 올라온 상태에서 휠로 돌린다. 그림 · 위치 · 곡률은 hxStart가 캔버스에 직접 그린다 (렌더 밖) -->
      <div data-hx-wrap="1" style="position: absolute; left: {{lay.hxL}}px; bottom: 0; width: 600px; height: 285px; z-index: 1; overflow: hidden; clip-path: inset(0 0 8px 0); pointer-events: none;">
        <canvas data-hx-cv="1" aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 600px; height: 285px; pointer-events: none;"></canvas>
        <div data-hx-zone="1" role="slider" aria-label="조타륜 — 누르면 올라옴 · 올라온 상태에서 누른 채 좌우로 끌거나 휠로 돌리기 · 누른 채 아래로 내리면 로컬 노드 맵으로(로컬 맵에선 부모 tree 맵으로) · 밖을 누르면 내려감" aria-valuemin="0" aria-valuemax="359" onPointerEnter="{{hxEnter}}" onPointerLeave="{{hxLeave}}" onPointerDown="{{hxDown}}" onPointerMove="{{hxMove}}" onPointerUp="{{hxUp}}" onPointerCancel="{{hxUp}}" onWheel="{{hxWheel}}" style="position: absolute; left: 0; bottom: 0; width: 600px; height: 30px; pointer-events: auto; cursor: grab; touch-action: none;"></div>
      </div>

      <!-- 조타륜 앱 바: 가운데 로고를 누르면 조타륜 위로 떠오른다. 창이 아니라 바 — 그 앱의 자원이 가로로 늘어서고 여기서 바로 조작한다.
           열려 있는 동안 조타륜은 내려가지 않고, 조타륜을 돌리면 바의 앱이 바뀐다. × · Esc · 가운데 로고를 다시 누르면 닫힌다 -->
      <sc-if value="{{hb.on}}" hint-placeholder-val="{{false}}">
        <div aria-label="{{hb.name}} — {{hb.node}}의 자원 · 조타륜 앱" onPointerDown="{{hb.stop}}" onWheel="{{hb.wheel}}" class="hb-in" data-hb-key="{{hb.app}}" style="position: absolute; left: {{lay.hbL}}px; bottom: 271px; width: 620px; height: 158px; z-index: 5; box-sizing: border-box; border: 1px solid #d8dde5; border-radius: 22px; background: #ffffff; box-shadow: 0 10px 28px rgba(22,25,31,0.16), 0 2px 4px rgba(22,25,31,0.06); display: flex; align-items: stretch; overflow: hidden;">
          <div style="width: 156px; flex-shrink: 0; box-sizing: border-box; padding: 11px 10px 10px 14px; border-right: 1px solid #eef1f5; display: flex; flex-direction: column; gap: 5px;">
            <div style="display: flex; align-items: center; gap: 7px;">
              <img src="{{hb.logo}}" alt="" width="24" height="24" style="width: 24px; height: 24px; image-rendering: pixelated; flex-shrink: 0;">
              <span style="font-size: 13.5px; font-weight: 800; letter-spacing: -0.01em; white-space: nowrap;">{{hb.name}}</span>
            </div>
            <div data-hb-node="1" title="이 바가 다루는 자원의 노드 — 지금 맵의 노드" style="display: flex; align-items: center; gap: 5px; min-width: 0;">
              <span style="height: 16px; padding: 0 5px; border-radius: 4px; background: #16191f; color: #ffffff; font-size: 9.5px; font-weight: 700; display: inline-flex; align-items: center; flex-shrink: 0;">{{hb.nodeTag}}</span>
              <span style="font-size: 12px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0;">{{hb.node}}</span>
            </div>
            <div data-hb-perms="1" style="display: flex; flex-wrap: wrap; gap: 3px;">
              <span title="이 노드에서 내 자리" style="height: 14px; padding: 0 5px; border-radius: 8px; border: 1px solid {{hb.roleC}}; color: {{hb.roleC}}; font-size: 9.5px; font-weight: 700; display: inline-flex; align-items: center; white-space: nowrap;">{{hb.role}}</span>
              <sc-for list="{{hb.perms}}" as="pm" hint-placeholder-count="2">
                <span title="{{pm.tip}}" style="height: 16px; padding: 0 5px; border-radius: 8px; background: {{pm.bg}}; color: {{pm.fg}}; font-size: 9.5px; font-weight: 700; display: inline-flex; align-items: center; gap: 2px; white-space: nowrap;">{{pm.mark}} {{pm.label}}</span>
              </sc-for>
            </div>
            <span data-hb-msg="1" style="font-size: 10.5px; color: {{hb.msgC}}; line-height: 14px; max-height: 28px; overflow: hidden;">{{hb.msg}}</span>
            <sc-if value="{{hb.hasHeads}}" hint-placeholder-val="{{true}}">
              <div style="display: flex; gap: 4px; margin-top: auto;">
                <sc-for list="{{hb.heads}}" as="h" hint-placeholder-count="1">
                  <button type="button" class="hb-btn" onClick="{{h.go}}" title="{{h.tip}}" style="height: 22px; padding: 0 9px; border: 1px solid {{h.line}}; border-radius: 11px; background: {{h.bg}}; color: {{h.fg}}; font: inherit; font-size: 11px; font-weight: 700; cursor: pointer; white-space: nowrap;">{{h.label}}</button>
                </sc-for>
              </div>
            </sc-if>
          </div>
          <sc-if value="{{hb.list}}" hint-placeholder-val="{{true}}">
            <div class="hb-row" style="flex-grow: 1; min-width: 0; display: flex; gap: 8px; padding: 12px 72px 12px 12px; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; align-items: stretch;" data-hb-row="1">
              <sc-for list="{{hb.cards}}" as="d" hint-placeholder-count="4">
                <div class="hb-card" data-hb-card="{{d.id}}" title="{{d.raw}}" onPointerDown="{{d.grab}}" onClick="{{d.stat}}" style="cursor: grab; touch-action: none; animation-delay: {{d.delay}}ms; width: 146px; flex-shrink: 0; box-sizing: border-box; padding: 8px 9px; border: 1px {{d.bstyle}} {{d.bline}}; border-radius: 14px; background: {{d.bg}}; opacity: {{d.op}}; display: flex; flex-direction: column; gap: 4px; position: relative;">
                  <div style="position: absolute; right: 6px; top: 6px; display: flex; gap: 2px;">
                    <sc-for list="{{d.tools}}" as="t" hint-placeholder-count="1">
                      <button type="button" class="hb-tool" data-hb-tool="{{t.key}}" onClick="{{t.go}}" title="{{t.tip}}" aria-label="{{t.tip}}" style="width: 22px; height: 22px; border: 1px solid {{t.line}}; border-radius: 11px; background: {{t.bg}}; color: {{t.fg}}; font: inherit; font-size: 11px; font-weight: 700; cursor: pointer; padding: 0; display: flex; align-items: center; justify-content: center;">{{t.ic}}</button>
                    </sc-for>
                  </div>
                  <div style="display: flex; align-items: center; gap: 6px; min-width: 0; padding-right: {{d.toolsPad}}px;">
                    <img src="{{d.icon}}" alt="" width="22" height="22" style="width: 22px; height: 22px; image-rendering: pixelated; flex-shrink: 0;">
                    <div style="display: flex; flex-direction: column; min-width: 0;">
                      <span style="font-size: 12px; line-height: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{d.name}}</span>
                      <span style="font-size: 9.5px; line-height: 12px; color: #8b95a6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{d.sub}}</span>
                    </div>
                  </div>
                  <span style="align-self: flex-start; height: 18px; padding: 0 7px; border-radius: 9px; background: {{d.cbg}}; color: {{d.cfg}}; font-size: 10.5px; font-weight: 700; display: inline-flex; align-items: center; gap: 4px;"><span style="width: 5px; height: 5px; border-radius: 50%; background: {{d.cfg}};"></span>{{d.chip}}</span>
                  <sc-if value="{{d.progOn}}" hint-placeholder-val="{{false}}">
                    <div style="height: 4px; border-radius: 2px; background: #eef1f5; overflow: hidden;"><div style="width: {{d.prog}}%; height: 4px; background: {{d.cfg}}; transition: width 450ms linear;"></div></div>
                  </sc-if>
                  <sc-if value="{{d.metaOn}}" hint-placeholder-val="{{true}}">
                    <span style="font-size: 10px; line-height: 13px; color: #5b6472; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{d.meta}}</span>
                  </sc-if>
                  <div style="display: flex; gap: 4px; margin-top: auto;">
                    <sc-for list="{{d.acts}}" as="a" hint-placeholder-count="2">
                      <button type="button" class="hb-btn" onClick="{{a.go}}" title="{{a.tip}}" style="flex: 1 1 0; min-width: 0; height: 22px; padding: 0 4px; border: 1px solid {{a.line}}; border-radius: 11px; background: {{a.bg}}; color: {{a.fg}}; font: inherit; font-size: 11px; font-weight: 700; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{a.label}}</button>
                    </sc-for>
                  </div>
                  <sc-if value="{{d.busy}}" hint-placeholder-val="{{false}}">
                    <span aria-hidden="true" style="position: absolute; inset: 0; border-radius: 14px; background: rgba(255,255,255,0.7); display: flex; align-items: center; justify-content: center;"><span style="width: 16px; height: 16px; border-radius: 50%; border: 2px solid #c3cad5; border-top-color: #2563eb; animation: tl-spin 700ms linear infinite;"></span></span>
                  </sc-if>
                </div>
              </sc-for>
            </div>
          </sc-if>
          <sc-if value="{{hb.locked}}" hint-placeholder-val="{{false}}">
            <div data-hb-locked="1" style="flex-grow: 1; display: flex; flex-direction: column; justify-content: center; gap: 6px; padding: 0 48px 0 18px; color: #5b6472; font-size: 12.5px;">
              <span style="font-weight: 700; color: #d33d52;">{{hb.lockMsg}}</span>
              <span>다른 노드의 자원이다 — 그 노드를 관리하는 tree에 로그인하거나 권한을 받아야 보인다</span>
            </div>
          </sc-if>
          <button type="button" data-hb-fs="1" aria-label="{{hb.name}} 전체 화면" title="전체 화면" onClick="{{hb.fsGo}}" style="position: absolute; right: 40px; top: 10px; width: 26px; height: 26px; border: 0; border-radius: 13px; background: #f4f6f9; color: #5b6472; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"></path></svg></button>
          <button type="button" aria-label="{{hb.name}} 바 닫기" onClick="{{hb.close}}" style="position: absolute; right: 10px; top: 10px; width: 26px; height: 26px; border: 0; border-radius: 13px; background: #f4f6f9; color: #5b6472; font: inherit; font-size: 14px; line-height: 1; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0;">×</button>
        </div>
      </sc-if>


      <!-- 관리 노드 창: 지금 로그인한 tree. 프사를 누르고 있거나 Ctrl을 누르고 있으면 로그인할 수 있는 다른 tree가 돌아 나온다 -->
      <div aria-hidden="{{tl.hidden}}" style="position: absolute; left: 0; top: {{lay.dy}}px; width: 560px; height: 760px; overflow: hidden; z-index: 6; pointer-events: none;">
        <div style="position: absolute; left: {{mg.cx}}px; top: 811px; width: 0; height: 0; transition: {{mg.avTrans}};">
         <!-- 부채: 양 끝 긴 눈금 사이만 보인다. 열 때 두 눈금이 반시계로 돌며 펼쳐지고(왼쪽 눈금이 맨 위), 닫을 땐 거꾸로 접힌다 -->
         <div data-tl-fan="1" style="position: absolute; left: -300px; top: -300px; width: 600px; height: 600px; clip-path: polygon(300px 300px, 300px 300px, 300px 300px);">
          <svg width="600" height="600" viewBox="-300 -300 600 600" aria-hidden="true" style="position: absolute; left: 0; top: 0;">
            <g data-tl-ticks="1">
              <sc-for list="{{tl.ticks}}" as="tk" hint-placeholder-count="0">
                <line x1="{{tk.x1}}" y1="{{tk.y1}}" x2="{{tk.x2}}" y2="{{tk.y2}}" stroke="#1c2733" stroke-width="{{tk.w}}" stroke-linecap="round"></line>
              </sc-for>
            </g>
          </svg>
          <sc-for list="{{tl.items}}" as="ti" hint-placeholder-count="0">
            <div data-tl-item="{{ti.i}}" style="position: absolute; left: 270px; top: 270px; width: 60px; height: 60px; transform: translate({{ti.x0}}px, {{ti.y0}}px);">
              <div style="width: 60px; height: 60px; box-sizing: border-box; border-radius: 50%; border: {{ti.border}}; background: #eef3fb; box-shadow: 0 3px 10px rgba(22,25,31,0.18); overflow: hidden; display: flex; align-items: center; justify-content: center;">
                <svg width="50" height="50" viewBox="{{ti.vb}}" aria-hidden="true">
                  <path d="{{ti.shadow}}" fill="#1c2733" opacity="0.2"></path>
                  <image data-anim="{{ti.anim}}" href="{{ti.img}}" x="{{ti.ix}}" y="{{ti.iy}}" width="{{ti.iw}}" height="{{ti.ih}}" preserveAspectRatio="none" style="display: {{ti.imgDisp}};"></image>
                  <sc-for list="{{ti.paths}}" as="p" hint-placeholder-count="0">
                    <path d="{{p.d}}" fill="{{p.edge}}" fill-rule="evenodd" stroke="{{p.edge}}" stroke-width="0.5" stroke-linejoin="round"></path>
                    <path d="{{p.d}}" fill="{{p.fill}}" fill-rule="evenodd"></path>
                  </sc-for>
                </svg>
              </div>
              <span aria-hidden="true" style="position: absolute; right: -2px; bottom: -2px; width: 22px; height: 22px; border-radius: 50%; background: {{ti.lockBg}}; border: 2px solid #ffffff; display: {{ti.lockDisp}}; align-items: center; justify-content: center;">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="{{ti.lockIcon}}"></path></svg>
              </span>
              <span style="position: absolute; left: 50%; top: -24px; transform: translateX(-50%); white-space: nowrap; padding: 1px 8px; border-radius: 10px; background: #2563eb; color: #ffffff; font-size: 11.5px; font-weight: 600; font-family: ui-monospace,'DejaVu Sans Mono',Consolas,Menlo,monospace; opacity: {{ti.tagOp}}; transition: opacity 120ms;">{{ti.name}}</span>
            </div>
          </sc-for>
         </div>
         <sc-for list="{{tl.needles}}" as="nd" hint-placeholder-count="0">
          <div data-tl-needle="{{nd.side}}" style="position: absolute; left: 0; top: 0; width: 0; height: 0; transform-origin: 0 0; transform: rotate(0deg);">
            <svg width="104" height="14" viewBox="0 -7 104 14" aria-hidden="true" style="position: absolute; left: 108px; top: -7px; overflow: visible;">
              <path d="M0 -3.2 L96 -0.8 Q104 0 96 0.8 L0 3.2 Z" fill="{{nd.fill}}"></path>
            </svg>
          </div>
         </sc-for>
        </div>
      </div>

      <!-- 관리 노드 창: 평소엔 이름만 보이게 접혀 있다가, 창을 누르면(클릭) 펼쳐지고 다시 누르거나 밖을 누르면 접힌다. 접혀도 펼쳐도 벽에서 살짝 떨어져 있다 -->
      <!-- 지도 탭: 관리 노드 창 뒤에 깔려 오른쪽 끝만 살짝 튀어나온다 (끝 모양은 창과 같음). 누른 채 끌면 작은 네모가 따라오고, 놓은 자리에 지도 창이 켜진다 -->
      <button type="button" aria-label="지도 — 누른 채 끌어 꺼내기" onPointerDown="{{mg.tabGrab}}" style="position: absolute; left: {{mg.tabL}}px; bottom: {{mg.bottom}}px; width: 140px; height: {{mg.height}}px; box-sizing: border-box; z-index: 4; padding: 0 0 0 {{mg.tabPad}}px; border: 1px solid #9fd8cb; border-radius: {{mg.radius}}; background: #c8efe7; color: #115e59; cursor: grab; touch-action: none; opacity: {{mg.tabOp}}; transform: translateX({{mg.tabX}}px); pointer-events: {{mg.tabPe}}; transition: {{mg.trans}}, opacity 200ms {{mg.tabDelay}}, transform 260ms cubic-bezier(.2,.8,.3,1) {{mg.tabDelay}}; display: flex; align-items: center; justify-content: center; font: inherit;">
        <span style="display: block; transform: rotate(90deg); font-size: 13px; font-weight: 700; letter-spacing: 0.24em; white-space: nowrap;">MAP</span>
      </button>
      <section aria-label="관리 노드 창 — 누르면 펼치기 · 접기" onClick="{{mg.toggle}}" style="cursor: pointer; position: absolute; left: {{mg.left}}px; bottom: {{mg.bottom}}px; width: {{mg.width}}px; height: {{mg.height}}px; box-sizing: border-box; z-index: 5; background: #f6e4c8; border: 3px solid #ffffff; border-radius: {{mg.radius}}; box-shadow: 0 6px 20px rgba(22,25,31,0.10); overflow: hidden; transition: {{mg.trans}};">
        <!-- 배경: 위에서 내려다본 해변. 해안선은 창 너비 2/3 지점을 따라 흐르고, 파도는 좌우로 밀려왔다 빠진다 (mgBeachStart가 캔버스에 직접 그린다) -->
        <canvas data-mg-beach="1" aria-hidden="true" style="position: absolute; left: 0; top: 50%; width: 1000px; height: 128px; transform: translateY(-50%); pointer-events: none;"></canvas>
      </section>
      <!-- 이름 · 설명: 프사(노드)의 정보라 배경(관리 노드 창)이 아니라 프사 층에 둔다 — 배경에 잘리지 않고, 배경 너비도 이름에 맞추지 않는다.
           자리 · 움직임은 예전과 같도록 배경과 같은 틀(같은 위치 · 크기 · 전환)을 투명하게 따라간다. 프사(6)보다 아래 · 배경(5) 위 -->
      <div aria-label="관리 노드 이름 · 설명" style="position: absolute; left: {{mg.left}}px; bottom: {{mg.bottom}}px; width: {{mg.width}}px; height: {{mg.height}}px; box-sizing: border-box; z-index: 5; border: 3px solid transparent; pointer-events: none; transition: {{mg.trans}};">
        <div style="position: absolute; left: {{mg.detL}}px; right: 24px; top: 58px; height: 64px; display: flex; align-items: center; gap: 24px; opacity: {{mg.detailOp}}; transform: translateY({{mg.detailY}}px); transition: opacity 200ms {{mg.detailDelay}}, transform 240ms cubic-bezier(.2,.8,.3,1) {{mg.detailDelay}}; pointer-events: none;">
          <span style="font-size: 12px; color: #0b3440; font-weight: 500; white-space: nowrap;">{{tl.caption}} · {{tl.sub}}</span>
          <span style="font-size: 12.5px; color: #0b3440; line-height: 1.5;">{{tl.hint}}</span>
          <span style="flex-grow: 1;"></span>
          <span style="font-size: 12.5px; color: #ffffff; font-weight: 600; text-align: right;">{{tl.note}}</span>
        </div>
      </div>
      <!-- 이름: 화면 좌표에 따로 둔다 — 배경 틀이 늘고 줄어도 흔들리지 않고, 프사와 함께만 움직인다 -->
      <div aria-label="관리 노드 이름" style="position: absolute; left: {{mg.nameX}}px; top: {{mg.nameTop}}px; height: {{mg.nameH}}px; z-index: 5; pointer-events: none; display: flex; align-items: center; opacity: {{mg.nameOp}}; transition: {{mg.nameTrans}};">
          <span style="font-size: 18px; font-weight: 700; font-family: ui-monospace,'DejaVu Sans Mono',Consolas,Menlo,monospace; white-space: nowrap; color: {{tl.nameColor}};">{{tl.nameShow}}</span>
      </div>

      <!-- 나침반: 큰 바늘(포인터)은 안에서 나오면서 시계 방향으로 한 바퀴 돌고, 나머지 바늘은 큰 바늘이 지나갈 때 안에서 밖으로 나온다 -->
      <div aria-hidden="true" style="position: absolute; left: {{mg.cx}}px; top: {{lay.mgY}}px; width: 0; height: 0; z-index: 6; pointer-events: none; transition: {{mg.avTrans}};">
        <sc-for list="{{tl.spikes}}" as="sp" hint-placeholder-count="0">
          <div data-tl-spike="{{sp.i}}" style="position: absolute; left: 0; top: 0; width: 0; height: 0; transform-origin: 0 0; transform: rotate({{sp.a}}deg) translateY({{sp.len0}}px);">
            <svg width="{{sp.w2}}" height="{{sp.len}}" viewBox="{{sp.vb}}" style="position: absolute; left: {{sp.left}}px; top: {{sp.top}}px; overflow: visible;">
              <path d="{{sp.d}}" fill="{{sp.fill}}"></path>
            </svg>
          </div>
        </sc-for>
      </div>
      <button type="button" aria-label="{{cur.name}} — 누르고 있으면 다른 tree로 로그인" onPointerDown="{{tlDown}}" onPointerUp="{{tlUp}}" onPointerLeave="{{tlLeave}}" style="position: absolute; left: {{mg.avLeft}}px; bottom: 20px; width: 140px; height: 140px; z-index: 6; box-sizing: border-box; border-radius: 50%; border: 6px solid {{tl.avatarRing}}; background: #ffffff; box-shadow: 0 6px 20px rgba(22,25,31,0.18); padding: 6px; cursor: pointer; touch-action: none; transition: border-color 160ms, left {{mg.avDur}};">
        <span style="position: relative; display: block; width: 100%; height: 100%; border-radius: 50%; overflow: hidden; background: #c3c8d0; filter: {{av.filter}}; transition: filter 400ms;">
          <sc-for list="{{av.layers}}" as="ly" hint-placeholder-count="1">

            <div style="display: flex; flex-direction: column; min-width: 0;">
              <span style="font-size: 15px; font-weight: 700; color: #16191f; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{lg.name}}</span>

      <sc-if value="{{rm.open}}" hint-placeholder-val="{{false}}">
        <div role="menu" aria-label="{{rm.title}}" style="position: absolute; left: {{rm.x}}px; top: {{rm.y}}px; width: 0; height: 0; z-index: 20;">
          <div aria-hidden="true" style="position: absolute; left: -{{rm.ring}}px; top: -{{rm.ring}}px; width: {{rm.ring2}}px; height: {{rm.ring2}}px; border-radius: 50%; background: radial-gradient(circle, rgba(22,25,31,0.10) 0%, rgba(22,25,31,0.04) 60%, rgba(22,25,31,0) 72%); pointer-events: none;"></div>
          <sc-for list="{{rm.items}}" as="it" hint-placeholder-count="8">
            <button type="button" role="menuitem" class="rmenu-item" aria-label="{{it.label}}" aria-disabled="{{it.disabledA}}" data-rm-item="{{it.i}}" onClick="{{it.pick}}" style="left: {{it.x}}px; top: {{it.y}}px; width: {{it.size}}px; height: {{it.size}}px; animation-delay: {{it.delay}}; border-radius: 50%; border: {{it.border}}; background: {{it.bg}}; color: {{it.fg}}; box-shadow: {{it.shadow}}; display: flex; align-items: center; justify-content: center; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; padding: 0;">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{it.icon}}"></path></svg>
            </button>
          </sc-for>
          <button type="button" class="rmenu-item" aria-label="닫기" onClick="{{rm.close}}" style="left: 0; top: 0; width: 34px; height: 34px; border-radius: 50%; border: 0; background: {{rm.centerBg}}; color: #ffffff; box-shadow: 0 2px 8px rgba(22,25,31,0.25); font: inherit; font-size: 15px; cursor: pointer; padding: 0;">×</button>
          <div aria-live="polite" style="position: absolute; left: 0; top: {{rm.labelY}}px; transform: translateX(-50%); white-space: nowrap; padding: 3px 10px; border-radius: 12px; background: #16191f; color: #ffffff; font-size: 12px; pointer-events: none; opacity: {{rm.labelOp}};">{{rm.label}}</div>
        </div>
      </sc-if>


      <!-- 서브 창: 속성 · 알림 · 지도 · 편집기. 제목 막대를 누른 채 끌어 옮기고, 오른쪽 아래 서랍 구역에 놓으면 보관된다 -->
      <sc-for list="{{wins}}" as="w" hint-placeholder-count="0">
       <sc-if value="{{w.show}}" hint-placeholder-val="{{false}}">
        <section role="dialog" aria-label="{{w.title}}" class="{{w.cls}}" data-win="{{w.id}}" onPointerDown="{{w.front}}" style="position: absolute; left: {{w.x}}px; top: {{w.y}}px; width: {{w.w}}px; max-height: {{w.maxH}}px; height: {{w.h}}; z-index: {{w.z}}; box-sizing: border-box; display: flex; flex-direction: column; background: {{w.bg}}; border: 1px solid {{w.line}}; border-radius: {{w.rad}}; box-shadow: {{w.shadow}}; overflow: hidden; transform: translateY({{w.ty}}px) scale({{w.sc}}); transform-origin: {{w.origin}}; opacity: {{w.op}}; transition: {{w.trans}};">
          <header onPointerDown="{{w.grab}}" style="height: 38px; flex-shrink: 0; box-sizing: border-box; display: flex; align-items: center; gap: 8px; padding: 0 6px 0 12px; border-bottom: 1px solid #eef1f5; background: {{w.head}}; cursor: grab; touch-action: none; user-select: none;">

            <h2 style="margin: 0; font-size: 13.5px; font-weight: 600;">{{w.title}}</h2>
            <span style="flex-grow: 1;"></span>
            <button type="button" data-fs-btn="{{w.id}}" aria-label="{{w.title}} {{w.fsTip}}" title="{{w.fsTip}}" onPointerDown="{{w.stop}}" onClick="{{w.fsToggle}}" style="width: 28px; height: 28px; border: 0; border-radius: 6px; background: transparent; color: #5b6472; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0;">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{w.fsIcon}}"></path></svg>
            </button>
            <button type="button" aria-label="{{w.title}} 서랍에 넣기" title="서랍에 넣기" onPointerDown="{{w.stop}}" onClick="{{w.store}}" style="width: 28px; height: 28px; border: 0; border-radius: 6px; background: transparent; color: #5b6472; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0;">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 14h16v6H4zM12 3v8M8 7l4 4 4-4"></path></svg>
            </button>
            <button type="button" aria-label="{{w.title}} 닫기" title="{{w.closeTip}}" onPointerDown="{{w.stop}}" onClick="{{w.close}}" style="width: 28px; height: 28px; border: 0; border-radius: 6px; background: transparent; color: #5b6472; cursor: pointer; font: inherit; font-size: 17px; line-height: 1; padding: 0;">×</button>
          </header>
          <sc-if value="{{w.isProps}}" hint-placeholder-val="{{false}}">
      <div style="overflow-y: auto; box-sizing: border-box; padding: 16px; display: flex; flex-direction: column; gap: 16px;">
        <section style="display: flex; flex-direction: column; gap: 6px;">
          <h3 style="margin: 0; font-size: 14px; font-weight: 600;">선택한 타일</h3>
          <sc-if value="{{hasSel}}" hint-placeholder-val="{{true}}">
            <div style="display: flex; flex-direction: column; gap: 4px; font-size: 13px;">
              <span style="font-weight: 600; font-family: ui-monospace,'DejaVu Sans Mono',Consolas,Menlo,monospace;">{{selLabel}}</span>
              <span style="color: #5b6472;">재질 {{selSkin}}</span>
              <span style="color: #5b6472;">그라운드 {{selGround}}</span>
              <div style="display: {{editFlex}}; gap: 6px; flex-wrap: wrap; margin-top: 2px;">
                <button type="button" onClick="{{rotField}}" title="필드 무늬(스킨)를 60°씩 돌립니다" style="display: {{rotFieldDisp}}; height: 28px; padding: 0 10px; border: 1px solid #d8dde5; border-radius: 6px; background: #ffffff; color: #16191f; font: inherit; font-size: 12.5px; cursor: pointer;">필드 무늬 ↻ 60°</button>
                <button type="button" onClick="{{rotGround}}" title="그라운드 무늬를 60°씩 돌립니다" style="height: 28px; padding: 0 10px; border: 1px solid #d8dde5; border-radius: 6px; background: #ffffff; color: #16191f; font: inherit; font-size: 12.5px; cursor: pointer;">그라운드 무늬 ↻ 60°</button>
              </div>
              <sc-if value="{{selIsNode}}" hint-placeholder-val="{{false}}">
                <div style="display: flex; align-items: center; gap: 8px; padding: 6px 8px; border: 1px solid {{selNodeLine}}; border-radius: 6px; background: {{selNodeBg}};">
                  <span style="width: 8px; height: 8px; border-radius: 2px; background: {{selNodeDot}};"></span>
                  <span style="font-weight: 600;">{{selNodeKind}} · {{selNodeName}}</span>
                  <span style="font-size: 12px; color: #5b6472;">{{selNodeRole}}</span>
                  <span style="flex-grow: 1;"></span>
                  <button type="button" onClick="{{unassignNode}}" style="display: {{unassignDisp}}; height: 26px; padding: 0 8px; border: 1px solid #d8dde5; border-radius: 5px; background: #ffffff; color: #16191f; font: inherit; font-size: 12px; cursor: pointer;">지정 해제</button>
                </div>
              </sc-if>
              <sc-if value="{{selHasB}}" hint-placeholder-val="{{true}}">
                <span style="font-weight: 600; color: #2563eb;">{{selNode}}</span>
                <div style="display: {{editFlex}}; gap: 6px; margin-top: 2px;">
                  <button type="button" onClick="{{rotateSel}}" style="height: 30px; padding: 0 10px; border: 1px solid #d8dde5; border-radius: 6px; background: #ffffff; color: #16191f; font: inherit; font-size: 12.5px; cursor: pointer;">↻ 90° 회전 (R)</button>
                  <button type="button" onClick="{{removeSel}}" style="height: 30px; padding: 0 10px; border: 1px solid #d8dde5; border-radius: 6px; background: #ffffff; color: #d33d52; font: inherit; font-size: 12.5px; cursor: pointer;">건물 치우기</button>
                </div>
              </sc-if>
              <sc-if value="{{selEmpty}}" hint-placeholder-val="{{false}}">
                <span style="color: #5b6472;">{{selEmptyText}}</span>
              </sc-if>
            </div>
          </sc-if>
          <sc-if value="{{noSel}}" hint-placeholder-val="{{false}}">
            <span style="font-size: 13px; color: #5b6472;">필드의 타일을 누르면 여기에 나타납니다</span>
          </sc-if>
        </section>
        <sc-if value="{{isLeafMap}}" hint-placeholder-val="{{false}}">
          <section aria-label="이 leaf의 자원" style="display: flex; flex-direction: column; gap: 6px; border-top: 1px solid #d8dde5; padding-top: 12px;">
            <div style="display: flex; align-items: baseline; gap: 8px;">
              <h3 style="margin: 0; font-size: 14px; font-weight: 600;">관리하는 자원</h3>
              <span style="font-size: 12px; color: #5b6472;">{{leafResCount}}개</span>
            </div>
            <sc-for list="{{leafRes}}" as="rs" hint-placeholder-count="3">
              <div style="display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 10px; border: 1px solid #d8dde5; border-radius: 6px; font-size: 13px;">
                <span style="color: {{rs.c}};">{{rs.g}}</span>
                <span style="font-weight: 600;">{{rs.name}}</span>
                <span style="flex-grow: 1;"></span>
                <span style="font-size: 11.5px; color: #5b6472;">{{rs.kind}}</span>
              </div>
            </sc-for>
            <span style="display: {{helpDisp}}; font-size: 12px; color: #5b6472;">leaf 맵에는 노드를 둘 수 없습니다 — 필드 · 건물로 자원을 놓습니다</span>
          </section>
        </sc-if>
      </div>
          </sc-if>
          <sc-if value="{{w.isEdit}}" hint-placeholder-val="{{false}}">
            <div style="overflow-y: auto; box-sizing: border-box; padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 14px;">
              <button type="button" role="switch" aria-checked="{{editChecked}}" onClick="{{toggleEdit}}" style="display: flex; align-items: center; gap: 8px; align-self: flex-start; height: 30px; padding: 0 10px 0 8px; border: 1px solid {{sw.border}}; border-radius: 15px; background: {{sw.bg}}; color: #16191f; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer;">
        <span style="position: relative; width: 34px; height: 20px; border-radius: 10px; background: {{sw.track}}; transition: background 160ms;">
          <span style="position: absolute; top: 2px; left: {{sw.knob}}; width: 16px; height: 16px; border-radius: 50%; background: #ffffff; box-shadow: 0 1px 2px rgba(22,25,31,0.3); transition: left 160ms;"></span>
        </span>
        편집 모드 <span style="font-weight: 400; color: {{sw.stateColor}};">{{sw.state}}</span>
      </button>
      <section aria-label="이벤트 보기 · 도로 표시" style="display: flex; flex-direction: column; gap: 6px;">
        <span style="font-size: 12px; font-weight: 700; color: #16191f;">이벤트 보기 <span style="font-weight: 400; color: #8b95a6;">— 건물 · 도로가 상태에 따라 바뀐 모습</span></span>
        <div role="radiogroup" aria-label="이벤트 보기" style="display: flex; gap: 2px; padding: 2px; border-radius: 8px; background: #eef1f5;">
          <sc-for list="{{evOpts}}" as="eo" hint-placeholder-count="5">
            <button type="button" role="radio" aria-checked="{{eo.on}}" data-ev-opt="{{eo.id}}" onClick="{{eo.pick}}" style="flex: 1 1 0; height: 28px; border: 0; border-radius: 6px; background: {{eo.bg}}; color: {{eo.fg}}; box-shadow: {{eo.sh}}; font: inherit; font-size: 11.5px; font-weight: 600; cursor: pointer; white-space: nowrap;"><span style="display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: {{eo.c}}; margin-right: 4px; vertical-align: 1px;"></span>{{eo.label}}</button>
          </sc-for>
        </div>
        <button type="button" role="switch" aria-checked="{{roadSw.on}}" data-roads-sw="1" onClick="{{roadSw.toggle}}" style="align-self: flex-start; height: 28px; padding: 0 10px; border: 1px solid #d8dde5; border-radius: 14px; background: {{roadSw.bg}}; color: {{roadSw.fg}}; font: inherit; font-size: 12px; font-weight: 600; cursor: pointer;">🛣️ 도로 표시 {{roadSw.label}}</button>
      </section>
