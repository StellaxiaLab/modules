       </sc-if>
      </sc-for>

      <!-- 유틸 서랍: 테이블 오른쪽 위에 붙어 있다. 아래에서 위로 — 손잡이를 홀드해서 올리면(휠도) 기능 칸이 올라온다 — 올라갈수록 느려지고 한계에서 멈춤, 막 나온 칸은 자세히 · 나머지는 겹쳐 보관.
           칸을 홀드해 빼내 놓으면 창이 되고, 그 자리는 창을 닫을 때까지 빈칸으로 기다린다. 손잡이를 누르거나 홀드해 내리면 들어간다.
           좌표는 위에서 내려오던 서랍을 뒤집은 것 — 칸의 y는 '서랍 줄에서 위로 떨어진 거리'다 -->
      <div aria-label="유틸 서랍" onWheel="{{ud.wheel}}" style="position: absolute; left: {{ud.x}}px; top: {{ud.sb}}px; width: {{ud.w}}px; height: 0; z-index: {{ud.z}};">
        <div style="position: absolute; left: -28px; bottom: 40px; width: {{ud.w2}}px; height: {{ud.H}}px; overflow: hidden; transition: height {{ud.tr}};">
          <sc-for list="{{ud.cards}}" as="uc" hint-placeholder-count="0">
            <div style="position: absolute; left: 28px; bottom: 0; transform: translateY({{uc.ny}}px); width: {{ud.w}}px; height: {{uc.h}}px; z-index: {{uc.z}}; transition: transform {{ud.ctr}}, height {{ud.ctr}}; will-change: {{ud.wc}};">
              <sc-if value="{{uc.full}}" hint-placeholder-val="{{true}}">
                <!-- 기능 칸 (창 색 없음 — 색은 로고가 맡는다): 윗줄 · 왼쪽 픽셀 로고 + 큰 이름 · 오른쪽 요약 데이터 2칸 · 알림 칸(알림이 있을 때만) -->
                <button type="button" class="ucard" aria-label="{{uc.title}} — 누르면 창 · 위아래로 끌면 넘기기 · 옆으로 끌어내면 창이 됩니다" onPointerDown="{{uc.grab}}" style="position: absolute; inset: 0; box-sizing: border-box; padding: 0; border: 1px solid #d8dde5; border-radius: 12px; background: #ffffff; color: #16191f; font: inherit; text-align: left; cursor: grab; touch-action: none; box-shadow: 0 4px 14px rgba(22,25,31,0.10), 0 -1px 2px rgba(22,25,31,0.06); overflow: hidden; display: flex; flex-direction: column;">
                  <span aria-hidden="true" style="height: 14px; flex-shrink: 0; background: #eef1f5; border-bottom: 1px solid #e0e5ec; display: flex; align-items: center; justify-content: center;"><span style="width: 26px; height: 3px; border-radius: 2px; background: #c3cad5;"></span></span>
                  <span style="flex-grow: 1; display: flex; gap: 10px; padding: 8px 10px 10px 12px; min-height: 0;">
                    <span style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;">
                      <img src="{{uc.logo}}" alt="" width="48" height="48" draggable="false" style="width: 48px; height: 48px; image-rendering: pixelated; pointer-events: none;">
                      <span style="max-width: 100%; text-align: center; font-size: 19px; font-weight: 800; letter-spacing: -0.02em; line-height: 24px; color: #16191f; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{uc.title}}</span>
                    </span>
                    <span style="width: 136px; flex-shrink: 0; display: flex; flex-direction: column; gap: 6px;">
                      <span style="height: 38px; flex-shrink: 0; box-sizing: border-box; padding: 3px 9px 0; border-radius: 8px; background: #f4f6f9; border: 1px solid #e6eaf0; display: flex; flex-direction: column;">
                        <span style="font-size: 15px; font-weight: 700; line-height: 19px; color: {{uc.s1.c}}; font-family: ui-monospace,'DejaVu Sans Mono',Consolas,Menlo,monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{uc.s1.v}}</span>
                        <span style="font-size: 10.5px; color: #5b6472; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{uc.s1.k}}</span>
                      </span>
                      <span style="height: 38px; flex-shrink: 0; box-sizing: border-box; padding: 3px 9px 0; border-radius: 8px; background: #f4f6f9; border: 1px solid #e6eaf0; display: flex; flex-direction: column;">
                        <span style="font-size: 15px; font-weight: 700; line-height: 19px; color: {{uc.s2.c}}; font-family: ui-monospace,'DejaVu Sans Mono',Consolas,Menlo,monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{uc.s2.v}}</span>
                        <span style="font-size: 10.5px; color: #5b6472; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{uc.s2.k}}</span>
                      </span>
                      <sc-if value="{{uc.nf}}" hint-placeholder-val="{{false}}">
                        <span style="height: 22px; flex-shrink: 0; box-sizing: border-box; padding: 0 8px; border-radius: 6px; background: #16191f; color: #ffffff; display: flex; align-items: center; gap: 6px; font-size: 11px; white-space: nowrap; overflow: hidden;">
                          <span style="flex-shrink: 0; min-width: 16px; height: 16px; box-sizing: border-box; padding: 0 4px; border-radius: 8px; background: {{uc.nfC}}; font-size: 10.5px; font-weight: 800; display: inline-flex; align-items: center; justify-content: center;">{{uc.nfN}}</span>
                          <span style="overflow: hidden; text-overflow: ellipsis;">{{uc.nfT}}</span>
                        </span>
                      </sc-if>
                    </span>
                  </span>
                </button>
              </sc-if>
              <sc-if value="{{uc.empty}}" hint-placeholder-val="{{false}}">
                <!-- 빈칸: 창으로 나간 기능의 자리. 창을 닫으면 돌아온다 -->
                <div onPointerDown="{{uc.scrollGrab}}" style="touch-action: none; cursor: grab; position: absolute; inset: 0; box-sizing: border-box; border: 1.5px dashed {{uc.eLine}}; border-radius: 14px; background: repeating-linear-gradient(135deg, {{uc.eBg}} 0 8px, #eef1f5 8px 16px); transition: border-color 140ms, background 140ms; color: #8b95a6; display: flex; flex-direction: column;">
                  <span style="display: flex; align-items: center; gap: 10px; padding: 12px 12px 0 16px; height: 40px;">
                    <span style="display: flex; flex-direction: column; gap: 2px;">
                      <span style="font-size: 13px; font-weight: 700; color: #5b6472;">{{uc.title}}</span>
                      <span style="font-size: 11px;">{{uc.eMsg}}</span>
                    </span>
                  </span>
                </div>
              </sc-if>
            </div>
          </sc-for>
        </div>
        <div aria-label="알림이 있는 기능" style="position: absolute; left: 0; bottom: 0; width: {{ud.w}}px; height: 0; z-index: 0; pointer-events: none; display: {{ud.bmDisp}};">
          <sc-for list="{{ud.bms}}" as="bk" hint-placeholder-count="0">
            <!-- 서랍이 닫혀 있을 때: 알림이 하나라도 있으면 칸 하나가 줄 위로 비스듬히 삐져나온다 (왼쪽 끝은 줄에 붙고 오른쪽으로 갈수록 드러남). 알림이 있다는 것만 알린다 -->
            <span aria-label="{{bk.label}}" title="{{bk.label}}" style="position: absolute; left: 6px; bottom: 8px; width: {{bk.w}}px; height: 32px; box-sizing: border-box; border-radius: 0 12px 0 0; background: {{bk.c}}; box-shadow: 0 -2px 4px rgba(22,25,31,0.18); transform-origin: 0 0; transform: rotate(-{{bk.a}}deg); z-index: {{bk.z}};"></span>
          </sc-for>
        </div>
        <button type="button" aria-label="유틸 서랍 — 누르거나 홀드해 올리면 열림" onPointerDown="{{ud.grabStrip}}" style="position: absolute; z-index: 2; left: 0; bottom: 0; width: {{ud.w}}px; height: 40px; box-sizing: border-box; border: 1px solid {{ud.stripLine}}; outline: {{ud.stripOutline}}; border-bottom: 0; border-radius: 12px 12px 0 0; background: #ffffff; box-shadow: 0 -4px 14px rgba(22,25,31,0.10); color: #16191f; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; touch-action: none; display: flex; align-items: center; gap: 8px; padding: 0 14px;">
          <!-- 로고 · "유틸" · 개수는 없앴다 -->
          <span style="flex-grow: 1;"></span>
          <span style="font-size: 11.5px; font-weight: 400; color: #8b95a6; white-space: nowrap;">{{ud.hint}}</span>
        </button>
        <button type="button" aria-label="유틸 서랍 손잡이 — 홀드해서 올리기 · 누르면 닫기" onPointerDown="{{ud.grabHandle}}" style="position: absolute; z-index: 3; left: {{ud.hx}}px; bottom: {{ud.hy}}px; width: 76px; height: 38px; box-sizing: border-box; border: 1px solid #d8dde5; border-bottom: 0; border-radius: 38px 38px 0 0; background: #ffffff; box-shadow: 0 -4px 10px rgba(22,25,31,0.12); cursor: grab; touch-action: none; padding: 8px 0 0; display: flex; align-items: center; justify-content: center; transition: bottom {{ud.tr}};">
          <span aria-hidden="true" style="width: 22px; height: 4px; border-radius: 2px; background: #b6bfcc; box-shadow: 0 5px 0 #d8dde5;"></span>
        </button>
      </div>

      <sc-if value="{{pullSq.on}}" hint-placeholder-val="{{false}}">
        <div aria-hidden="true" style="position: absolute; left: {{pullSq.x}}px; top: {{pullSq.y}}px; width: 48px; height: 48px; box-sizing: border-box; z-index: 60; border: 1px solid #9fd8cb; border-radius: 10px; background: #c8efe7; color: #115e59; box-shadow: 0 8px 20px rgba(22,25,31,0.22); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; letter-spacing: 0.12em; pointer-events: none; transform: scale({{pullSq.sc}}); transition: transform 140ms;">MAP</div>
      </sc-if>
      <!-- 서랍: 오른쪽 아래. 보관된 창은 그리지 않고 색 · 이모지 카드로만. 평소 30% · 마우스가 다가오면 70% · 카드 위면 그 카드만 90%(나머지는 양옆으로 비킴) -->
      <div aria-label="서랍 구역" style="position: absolute; left: {{dz.x}}px; top: {{dz.y}}px; width: {{dz.w}}px; height: {{dz.h}}px; box-sizing: border-box; border: 2px dashed {{dz.line}}; border-radius: 14px 14px 0 0; background: {{dz.bg}}; opacity: {{dz.op}}; transition: opacity 160ms, background 160ms; pointer-events: none; z-index: 8; display: flex; align-items: flex-start; justify-content: center; padding-top: 10px; font-size: 12.5px; font-weight: 600; color: #2563eb;">{{dz.label}}</div>
      <nav aria-label="서랍 — 보관된 창" style="position: absolute; left: 0; top: 0; width: 0; height: 0; z-index: {{drawerZ}}; pointer-events: {{drawerPe}};">
        <sc-for list="{{cards}}" as="cd" hint-placeholder-count="0">
          <!-- 책갈피: 카드 윗가장자리에 꽂힌 리본 (위쪽 V 홈) -->
          <span aria-label="{{cd.bmLabel}}" style="position: absolute; left: {{cd.bmx}}px; top: {{cd.bmy}}px; width: 22px; height: 36px; box-sizing: border-box; clip-path: polygon(0 0, 50% 7px, 100% 0, 100% 100%, 0 100%); background: linear-gradient(90deg, rgba(255,255,255,0.22) 0 3px, rgba(0,0,0,0) 3px), {{cd.bmC}}; filter: drop-shadow(0 -1px 2px rgba(22,25,31,0.25)); color: #ffffff; font-size: 11px; font-weight: 800; display: {{cd.bmDisp}}; align-items: flex-start; justify-content: center; padding-top: 9px; z-index: {{cd.z}}; transition: left 240ms cubic-bezier(.2,.8,.3,1), top 360ms cubic-bezier(.2,.8,.3,1);">{{cd.bmN}}</span>
          <!-- 서랍 카드: 기능 칸과 같은 흰 카드를 세로로. 30%면 머리(아이콘 · 제목), 70%면 수치, 90%면 최근 줄까지 보인다 -->
          <button type="button" aria-label="{{cd.title}} — 누른 채 끌어 꺼내기" onPointerDown="{{cd.grab}}" onPointerEnter="{{cd.enter}}" onPointerLeave="{{cd.leave}}" style="position: absolute; left: {{cd.x}}px; top: {{cd.y}}px; width: {{cd.w}}px; height: {{cd.h}}px; box-sizing: border-box; padding: 0; border: 1px solid {{cd.line}}; border-radius: 14px; background: #ffffff; box-shadow: {{cd.shadow}}; cursor: grab; touch-action: none; z-index: {{cd.z}}; transition: left 240ms cubic-bezier(.2,.8,.3,1), top 360ms cubic-bezier(.2,.8,.3,1), box-shadow 200ms, border-color 200ms; display: flex; flex-direction: column; align-items: stretch; text-align: left; font: inherit; color: #16191f; overflow: hidden;">
            <span aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 0; height: 4px; background: {{cd.color}};"></span>
            <span aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 4px; height: 72px; background: linear-gradient(180deg, {{cd.c1}} 0%, rgba(255,255,255,0) 100%); opacity: 0.8;"></span>
            <span style="position: relative; display: flex; align-items: center; gap: 8px; padding: 14px 10px 0 10px; flex-shrink: 0;">
              <img src="{{cd.logo}}" alt="" width="32" height="32" draggable="false" style="width: 32px; height: 32px; flex-shrink: 0; image-rendering: pixelated; pointer-events: none;">
              <span style="display: flex; flex-direction: column; gap: 1px; min-width: 0;">
                <span style="font-size: 12.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{cd.title}}</span>
                <span style="font-size: 10.5px; color: {{cd.chipFg}}; font-weight: 600; white-space: nowrap; display: {{cd.chipDisp}}; align-items: center; gap: 4px;"><span style="width: 6px; height: 6px; border-radius: 50%; background: {{cd.chipFg}};"></span>{{cd.chip}}</span>
              </span>
            </span>
            <span style="position: relative; padding: 8px 10px 0; font-size: 10.5px; color: #5b6472; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex-shrink: 0;">{{cd.sub}}</span>
            <span style="position: relative; display: flex; flex-direction: column; gap: 4px; padding: 8px 10px 0; flex-shrink: 0;">
              <sc-for list="{{cd.stats}}" as="st" hint-placeholder-count="3">
                <span style="display: flex; align-items: center; gap: 6px; height: 24px; padding: 0 8px; border-radius: 7px; background: #f4f6f9; border: 1px solid #e6eaf0;">
                  <span style="font-size: 10.5px; color: #5b6472; white-space: nowrap;">{{st.k}}</span>
                  <span style="flex-grow: 1;"></span>
                  <span style="font-size: 12px; font-weight: 700; color: {{st.c}}; font-family: ui-monospace,'DejaVu Sans Mono',Consolas,Menlo,monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 88px;">{{st.v}}</span>
                </span>
              </sc-for>
            </span>
            <span style="position: relative; display: flex; gap: 5px; margin: 8px 10px 0; padding-top: 6px; border-top: 1px dashed #e0e5ec; font-size: 10.5px; line-height: 14px; color: #3a4049;">
              <span style="color: {{cd.foot.c}}; flex-shrink: 0;">{{cd.foot.g}}</span><span style="overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;">{{cd.foot.t}}</span>
            </span>
          </button>
        </sc-for>
      </nav>
    </div>
  </div>
</div>
</script>
<script type="module">
import './src/api/frame-boot.js';   // 첫 import — Terra 안이면 마운트보다 먼저 frame에 hello를 보낸다
import { mount, fit } from './src/runtime/dc.js';
import Screen from './src/screens/node.js';
import * as Boot from './src/boot/module.js';
const stage = document.getElementById('stage');
const View = (Boot.prep && Boot.prep('node', Screen)) || Screen;   // 프로필이 예시를 지운 클래스를 돌려주면 그것을 띄운다
window.__screen = mount(View, { template: document.getElementById('view').textContent, target: stage, props: {"skin": "grass"} });

Boot.boot && Boot.boot('node', window.__screen);
</script>
</body>
</html>
