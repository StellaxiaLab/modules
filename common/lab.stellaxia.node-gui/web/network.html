<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Terra · 네트워크</title>
<style>
body{margin:0;font-family: 'Noto Sans KR','Noto Sans CJK KR',system-ui,sans-serif;background:#07090c;color-scheme:dark}
a{color:#b4bac3}a:hover{color:#ede9e1}
*{scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.18) transparent}
*::-webkit-scrollbar{width:8px;height:8px}
*::-webkit-scrollbar-thumb{background:rgba(255,255,255,.16);border-radius:4px}
*::-webkit-scrollbar-track{background:transparent}
::selection{background:rgba(255,216,77,.35)}
:focus-visible{outline:2px solid #ffd84d;outline-offset:2px}
select option{background:#15181d;color:#ede9e1}
input::placeholder{color:#6b7280}
button{transition:background 140ms,border-color 140ms,color 140ms,filter 140ms}
.ghost:hover{background:rgba(255,255,255,.09)!important;border-color:rgba(255,255,255,.28)!important}
.tg:hover{color:#ede9e1}
.acg:not(.spin):has(.act:empty){display:none!important}
.acg .acs{display:none}.acg.spin .acs{display:block}.acg.spin .act{display:none}.acg:empty{display:none}
[data-ic="loader"] svg{animation:spin 900ms linear infinite}
.bx button:hover{filter:brightness(1.15)}
.mono{font-family: 'JetBrains Mono',ui-monospace,'DejaVu Sans Mono',Consolas,Menlo,monospace}
.nv:hover{background:rgba(255,255,255,.05)}
.rw:hover{background:rgba(255,255,255,.03)}
.gn{cursor:pointer}
.gn:hover .gn-c{stroke:#ffd84d}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{display:inline-block;animation:spin 900ms linear infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.pulse{animation:pulse 1.4s ease-in-out infinite}
@keyframes pop{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.pop{animation:pop 180ms cubic-bezier(.2,.8,.3,1) both}
</style>
<style>
html,body{margin:0;background:#dfe3ea}
.frame{margin:12px auto;overflow:hidden;box-shadow:0 6px 24px rgba(22,25,31,0.16);border-radius:6px}
#stage{width:1440px;height:900px;transform-origin:0 0;background:#ffffff}
</style>
</head>
<body>
<div class="frame"><div id="stage"></div></div>
<script type="text/x-template" id="view">
<!-- 네트워크 화면 v2 — 입력: terra-gui-network-requirements (main fc74e28)
     묶음 넷(§3): 사설망(T) · 연결 진단·라우팅(T) · 서비스 터널(T+L) · 로컬 WireGuard(L) + 조작 이력(T)
     화면은 노드 역할을 선언하지 않고 관측한다(health · catalog). 역할(tree · leaf)은 카탈로그로 정하고, 데이터는 이 노드의 게이트웨이에서 읽는다(src/data/network-live.js) -->
<div style="position: relative; width: 1440px; height: 900px; display: flex; flex-direction: column; background: radial-gradient(1100px 520px at 12% -12%, #18202b 0%, rgba(24,32,43,0) 60%), radial-gradient(900px 600px at 100% 110%, #10161d 0%, rgba(16,22,29,0) 60%), #0b0d11; color: #ede9e1; color-scheme: dark; font-family: 'Noto Sans KR','Noto Sans CJK KR',system-ui,sans-serif; font-size: 14px; line-height: 1.55; overflow: hidden;">

<svg aria-hidden="true" width="0" height="0" style="position: absolute; width: 0; height: 0; overflow: hidden;"><defs><symbol id="n-net" viewBox="0 0 24 24"><circle cx="12" cy="5" r="2.5"/><circle cx="5" cy="19" r="2.5"/><circle cx="19" cy="19" r="2.5"/><path d="M12 7.5v4M12 11.5L6.5 17M12 11.5l5.5 5.5"/></symbol><symbol id="n-route" viewBox="0 0 24 24"><circle cx="6" cy="19" r="2"/><circle cx="18" cy="5" r="2"/><path d="M8 19h7a3 3 0 0 0 0-6H9a3 3 0 0 1 0-6h7"/></symbol><symbol id="n-tunnel" viewBox="0 0 24 24"><path d="M4 20V11a8 8 0 0 1 16 0v9"/><path d="M8 20v-8a4 4 0 0 1 8 0v8"/></symbol><symbol id="n-shield" viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/></symbol><symbol id="n-doc" viewBox="0 0 24 24"><path d="M6 3h9l3 3v15H6z"/><path d="M9 9h6M9 13h6M9 17h4"/></symbol><symbol id="n-back" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></symbol><symbol id="n-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></symbol><symbol id="n-warn" viewBox="0 0 24 24"><path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18v.01"/></symbol><symbol id="n-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.01"/></symbol><symbol id="n-lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></symbol><symbol id="n-link" viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></symbol><symbol id="n-loader" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9"/></symbol><symbol id="n-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol><symbol id="n-half" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3v18"/></symbol><symbol id="n-compass" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></symbol><symbol id="n-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol></defs></svg>
  <header style="height: 54px; flex-shrink: 0; box-sizing: border-box; padding: 0 16px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid rgba(255,255,255,0.10); background: rgba(15,17,21,0.92); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);">
    <a href="node.html" class="tg" style="display: inline-flex; align-items: center; gap: 4px; height: 28px; padding: 0 9px 0 5px; border-radius: 8px; font-size: 12.5px; color: #9aa1ab; text-decoration: none; border: 1px solid rgba(255,255,255,0.10);"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" style="flex-shrink: 0; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;"><use href="#n-back"></use></svg> 노드 화면</a>
    <h1 style="margin: 0; display: inline-flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600; color: #ede9e1;"><svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true" style="flex-shrink: 0; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;"><use href="#n-net"></use></svg>네트워크</h1>
    <span title="{{hdr.gwTip}}" style="display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 9px; border-radius: 11px; background: {{hdr.roleBg}}; color: {{hdr.roleFg}}; border: 1px solid color-mix(in srgb, {{hdr.roleFg}} 50%, transparent); font-size: 11.5px; font-weight: 600;"><span style="width: 7px; height: 7px; border-radius: 50%; background: {{hdr.roleDot}}; box-shadow: 0 0 6px {{hdr.roleDot}};"></span>{{hdr.roleText}}</span>
    <span style="display: inline-flex; align-items: center; gap: 7px; height: 28px; padding: 0 11px; border-radius: 14px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.10); font-size: 11.5px; color: {{hdr.pollFg}};"><span class="{{hdr.pollCls}}" style="width: 7px; height: 7px; border-radius: 50%; background: {{hdr.pollDot}}; box-shadow: 0 0 6px {{hdr.pollDot}};"></span>{{hdr.pollText}}</span>
    <button type="button" onClick="{{hdr.refresh}}" class="ghost" style="height: 28px; padding: 0 10px 0 8px; border: 1px solid rgba(255,255,255,0.18); border-radius: 8px; background: rgba(255,255,255,0.04); color: #ede9e1; font: inherit; font-size: 12px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 5px;"><svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true" style="flex-shrink: 0; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;"><use href="#n-refresh"></use></svg>지금</button>
    <span style="flex-grow: 1;"></span>
  </header>

  <div style="flex-grow: 1; display: flex; min-height: 0;">
    <!-- 왼쪽: 묶음. 로컬 노드의 카탈로그에 없는 묶음은 잠그고 이유를 적는다 -->
    <nav aria-label="네트워크 묶음" style="width: 232px; flex-shrink: 0; box-sizing: border-box; border-right: 1px solid rgba(255,255,255,0.10); background: rgba(13,15,19,0.55); padding: 12px 10px; display: flex; flex-direction: column; gap: 4px; overflow-y: auto;">
      <sc-for list="{{nav}}" as="nv" hint-placeholder-count="5">
        <button type="button" class="nv" aria-current="{{nv.cur}}" onClick="{{nv.pick}}" style="display: flex; gap: 10px; align-items: flex-start; padding: 9px 10px; border: 1px solid {{nv.ring}}; border-radius: 12px; background: {{nv.bg}}; color: {{nv.fg}}; font: inherit; text-align: left; cursor: pointer;">
          <span aria-hidden="true" style="width: 30px; height: 30px; flex-shrink: 0; box-sizing: border-box; border-radius: 9px; background: {{nv.tint}}; border: 1px solid {{nv.tintLine}}; color: {{nv.ic}}; display: flex; align-items: center; justify-content: center; filter: {{nv.gray}};"><svg viewBox="0 0 24 24" width="16" height="16" style="fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;"><use href="#n-{{nv.icon}}"></use></svg></span>
          <span style="display: flex; flex-direction: column; gap: 1px; min-width: 0;">
            <span style="display: flex; align-items: center; gap: 6px;"><span style="font-size: 13px; font-weight: 700;">{{nv.label}}</span><span class="mono" style="font-size: 10px; font-weight: 600; color: {{nv.roleFg}}; border: 1px solid {{nv.roleLine}}; border-radius: 5px; padding: 0 4px; line-height: 15px;">{{nv.role}}</span></span>
            <span style="display: {{nv.subDisp}}; font-size: 11px; color: {{nv.subFg}}; line-height: 1.45;">{{nv.sub}}</span>
          </span>
        </button>
      </sc-for>
      <div style="margin-top: auto; padding: 11px 12px; border-radius: 12px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); font-size: 11.5px; color: #9aa1ab; line-height: 1.6;">
        <div style="font-size: 10px; font-weight: 600; letter-spacing: 0.28em; color: #9aa1ab; margin-bottom: 4px;">세션</div>
        <div>{{sess.who}}</div>
        <div>{{sess.perm}}</div>
        <div style="display: {{helpBlock}}; color: #6b7280;">네트워크 45건은 이 두 기본 권한으로 모두 열린다</div>
      </div>
    </nav>

    <main style="flex-grow: 1; min-width: 0; background: transparent; overflow-y: auto; box-sizing: border-box; padding: 16px 18px 24px;">
      <div style="display: flex; align-items: flex-end; gap: 12px; margin-bottom: 12px;">
        <div style="display: flex; flex-direction: column; gap: 2px;">
          <h2 style="margin: 0; font-size: 19px; font-weight: 700; color: #ede9e1; letter-spacing: -0.01em;">{{page.title}}</h2>
          <span style="display: {{page.subDisp}}; font-size: 12px; color: #9aa1ab;">{{page.sub}}</span>
        </div>
        <span style="flex-grow: 1;"></span>
        <div role="tablist" style="display: {{page.tabDisp}}; gap: 2px; padding: 3px; border-radius: 10px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08);">
          <sc-for list="{{page.tabs}}" as="tb" hint-placeholder-count="3">
            <button type="button" role="tab" aria-selected="{{tb.on}}" onClick="{{tb.pick}}" style="height: 28px; padding: 0 12px; border: 0; border-radius: 7px; background: {{tb.bg}}; color: {{tb.fg}}; box-shadow: {{tb.sh}}; font: inherit; font-size: 12.5px; font-weight: 600; cursor: pointer;">{{tb.label}}</button>
          </sc-for>
        </div>
      </div>

      <!-- 블록: 12칸 격자에 폭(span)만큼. type = banner · table · kv · graph · form · steps · locked · state -->
      <div style="display: grid; grid-template-columns: repeat(12, 1fr); gap: 12px; align-items: start;">
        <sc-for list="{{blocks}}" as="bk" hint-placeholder-count="4">
          <section class="bx" style="grid-column: span {{bk.span}}; box-sizing: border-box; background: {{bk.bg}}; border: 1px solid {{bk.line}}; border-radius: 14px; overflow: hidden; min-width: 0; box-shadow: 0 10px 30px rgba(0,0,0,0.30);">
            <sc-if value="{{bk.hasHead}}" hint-placeholder-val="{{true}}">
              <div style="display: flex; align-items: center; gap: 8px; padding: 11px 14px; border-bottom: 1px solid rgba(255,255,255,0.08); flex-wrap: wrap;">
                <h3 style="margin: 0; font-size: 13.5px; font-weight: 700; color: #ede9e1;">{{bk.title}}</h3>
                <span class="mono" style="font-size: 11px; color: #9aa1ab;">{{bk.sub}}</span>
                <sc-for list="{{bk.tags}}" as="tg" hint-placeholder-count="0">
                  <span title="{{tg.tip}}" style="display: inline-flex; align-items: center; gap: 4px; height: 20px; box-sizing: border-box; padding: 0 8px; border-radius: 10px; background: {{tg.bg}}; color: {{tg.fg}}; border: 1px solid color-mix(in srgb, {{tg.fg}} 50%, transparent); font-size: 11px; font-weight: 600;">{{tg.t}}</span>
                </sc-for>
                <span style="flex-grow: 1;"></span>
                <sc-for list="{{bk.acts}}" as="ac" hint-placeholder-count="0">
                  <button type="button" title="{{ac.tip}}" aria-disabled="{{ac.dis}}" onClick="{{ac.run}}" style="height: 30px; padding: 0 12px; border: 1px solid {{ac.line}}; border-radius: 9px; background: {{ac.bg}}; color: {{ac.fg}}; font: inherit; font-size: 12px; font-weight: 600; cursor: {{ac.cur}}; opacity: {{ac.op}}; display: inline-flex; align-items: center; gap: 6px;"><span class="{{ac.spin}} acg" style="display: inline-flex;"><svg class="acs" viewBox="0 0 24 24" width="14" height="14" style="fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round;"><use href="#n-loader"></use></svg><span class="act">{{ac.g}}</span></span>{{ac.label}}</button>
                </sc-for>
              </div>
            </sc-if>

            <sc-if value="{{bk.isBanner}}" hint-placeholder-val="{{false}}">
              <div style="display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; background: transparent; color: {{bk.fg}}; font-size: 12.5px; line-height: 1.6;">
                <span data-ic="{{bk.icon}}" style="display: flex; padding-top: 1px;"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;"><use href="#n-{{bk.icon}}"></use></svg></span>
                <span style="flex-grow: 1; color: #b4bac3;"><b style="color: #ede9e1; font-weight: 600;">{{bk.bTitle}}</b> {{bk.text}}</span>
                <sc-for list="{{bk.bActs}}" as="ac" hint-placeholder-count="0">
                  <button type="button" onClick="{{ac.run}}" class="ghost" style="height: 30px; padding: 0 11px; border: 1px solid {{ac.line}}; border-radius: 9px; background: rgba(255,255,255,0.04); color: {{ac.fg}}; font: inherit; font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px;">{{ac.label}}</button>
                </sc-for>
              </div>
            </sc-if>

            <sc-if value="{{bk.isTable}}" hint-placeholder-val="{{false}}">
              <div style="display: grid; grid-template-columns: {{bk.cols}}; font-size: 12.5px;">
                <sc-for list="{{bk.head}}" as="hd" hint-placeholder-count="4">
                  <span style="padding: 8px 12px; background: rgba(255,255,255,0.03); border-bottom: 1px solid rgba(255,255,255,0.06); color: #9aa1ab; font-size: 11.5px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{hd.t}}</span>
                </sc-for>
                <sc-for list="{{bk.cells}}" as="cl" hint-placeholder-count="8">
                  <span style="padding: {{cl.pad}}; border-top: 1px solid rgba(255,255,255,0.06); background: {{cl.rowBg}}; min-width: 0; display: flex; align-items: center; gap: 6px; opacity: {{cl.op}};">
                    <sc-if value="{{cl.isT}}" hint-placeholder-val="{{true}}">
                      <span class="{{cl.cls}}" title="{{cl.tip}}" style="color: {{cl.c}}; font-weight: {{cl.fw}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{cl.t}}</span>
                      <span style="font-size: 11px; color: #6b7280; white-space: nowrap;">{{cl.sub}}</span>
                    </sc-if>
                    <sc-if value="{{cl.isB}}" hint-placeholder-val="{{false}}">
                      <span title="{{cl.tip}}" style="display: inline-flex; align-items: center; gap: 4px; height: 20px; box-sizing: border-box; padding: 0 8px; border-radius: 10px; background: {{cl.bb}}; color: {{cl.bf}}; border: 1px solid color-mix(in srgb, {{cl.bf}} 50%, transparent); font-size: 11px; font-weight: 600; white-space: nowrap;"><span class="{{cl.cls}}">{{cl.g}}</span>{{cl.t}}</span>
                      <span style="font-size: 11px; color: #6b7280; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{cl.sub}}</span>
                    </sc-if>
                    <sc-if value="{{cl.isBtn}}" hint-placeholder-val="{{false}}">
                      <span style="flex-grow: 1;"></span>
                      <sc-for list="{{cl.btns}}" as="bt" hint-placeholder-count="1">
                        <button type="button" title="{{bt.tip}}" onClick="{{bt.run}}" aria-disabled="{{bt.dis}}" class="ghost" style="height: 26px; padding: 0 9px; border: 1px solid {{bt.line}}; border-radius: 8px; background: rgba(255,255,255,0.04); color: {{bt.fg}}; font: inherit; font-size: 11.5px; font-weight: 600; cursor: {{bt.cur}}; opacity: {{bt.op}}; white-space: nowrap;">{{bt.label}}</button>
                      </sc-for>
                    </sc-if>
                  </span>
                </sc-for>
              </div>
              <sc-if value="{{bk.isEmpty}}" hint-placeholder-val="{{false}}">
                <div style="padding: 24px 14px; text-align: center; font-size: 12.5px; color: #9aa1ab;">{{bk.empty}}</div>
              </sc-if>
              <sc-if value="{{bk.hasFoot}}" hint-placeholder-val="{{false}}">
                <div style="padding: 9px 14px; border-top: 1px solid rgba(255,255,255,0.06); background: rgba(255,255,255,0.015); font-size: 11.5px; color: #9aa1ab; line-height: 1.6;">{{bk.foot}}</div>
              </sc-if>
            </sc-if>

            <sc-if value="{{bk.isKv}}" hint-placeholder-val="{{false}}">
              <div style="display: grid; grid-template-columns: repeat({{bk.kvCols}}, 1fr); gap: 6px; padding: 12px 14px;">
                <sc-for list="{{bk.items}}" as="kv" hint-placeholder-count="4">
                  <span title="{{kv.tip}}" style="box-sizing: border-box; padding: 9px 11px; border-radius: 9px; background: {{kv.bg}}; border: 1px solid {{kv.line}}; display: flex; flex-direction: column-reverse; gap: 2px; min-width: 0;">
                    <span style="font-size: 10.5px; color: #9aa1ab;">{{kv.k}}</span>
                    <span class="{{kv.cls}}" style="font-size: 15px; font-weight: 600; color: {{kv.c}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{kv.v}}</span>
                  </span>
                </sc-for>
              </div>
              <sc-if value="{{bk.hasFoot}}" hint-placeholder-val="{{false}}">
                <div style="padding: 0 14px 12px; font-size: 11.5px; color: #9aa1ab; line-height: 1.6;">{{bk.foot}}</div>
              </sc-if>
            </sc-if>

            <sc-if value="{{bk.isGraph}}" hint-placeholder-val="{{false}}">
              <svg width="100%" height="{{bk.gh}}" viewBox="0 0 {{bk.gw}} {{bk.gh}}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="라우트 그래프" style="display: block; background: radial-gradient(circle at 50% 40%, #121922 0%, #0a0d11 100%);">
                <sc-for list="{{bk.edges}}" as="ed" hint-placeholder-count="6">
                  <line x1="{{ed.x1}}" y1="{{ed.y1}}" x2="{{ed.x2}}" y2="{{ed.y2}}" stroke="{{ed.c}}" stroke-width="{{ed.w}}" stroke-dasharray="{{ed.dash}}" stroke-linecap="round" opacity="{{ed.op}}"></line>
                </sc-for>
                <sc-for list="{{bk.gnodes}}" as="gn" hint-placeholder-count="6">
                  <g class="gn" transform="translate({{gn.x}} {{gn.y}})" onClick="{{gn.pick}}" opacity="{{gn.op}}">
                    <title>{{gn.name}}</title>
                    <circle class="gn-c" r="{{gn.r}}" fill="#14181e" stroke="{{gn.line}}" stroke-width="{{gn.lw}}" style="transition: stroke 140ms;"></circle>
                    <rect x="-6" y="-6" width="12" height="12" rx="3" fill="{{gn.c}}"></rect>
                    <text y="{{gn.ty}}" text-anchor="middle" font-size="11" font-weight="{{gn.fw}}" fill="#ede9e1" class="mono" style="paint-order: stroke; stroke: rgba(10,13,17,0.92); stroke-width: 3px;">{{gn.name}}</text>
                    <text y="{{gn.ty2}}" text-anchor="middle" font-size="9.5" fill="{{gn.tagC}}" font-weight="700">{{gn.tag}}</text>
                  </g>
                </sc-for>
              </svg>
              <div style="display: flex; gap: 12px; flex-wrap: wrap; padding: 9px 14px; border-top: 1px solid rgba(255,255,255,0.06); font-size: 11.5px; color: #b4bac3;">
                <sc-for list="{{bk.legend}}" as="lg" hint-placeholder-count="4">
                  <span style="display: inline-flex; align-items: center; gap: 6px;"><span style="width: 20px; height: 0; border-top: 3px {{lg.style}} {{lg.c}};"></span><span class="mono">{{lg.t}}</span></span>
                </sc-for>
              </div>
            </sc-if>

            <sc-if value="{{bk.isForm}}" hint-placeholder-val="{{false}}">
              <div style="display: grid; grid-template-columns: repeat({{bk.fCols}}, 1fr); gap: 10px 12px; padding: 12px 14px;">
                <sc-for list="{{bk.fields}}" as="fd" hint-placeholder-count="4">
                  <label style="display: flex; flex-direction: column; gap: 5px; font-size: 11.5px; color: #b4bac3; min-width: 0;">
                    <span>{{fd.label}} <span style="color: #ff5d5d;">{{fd.req}}</span></span>
                    <sc-if value="{{fd.isSel}}" hint-placeholder-val="{{true}}">
                      <select onChange="{{fd.set}}" style="height: 36px; box-sizing: border-box; padding: 0 9px; border: 1px solid rgba(255,255,255,0.18); border-radius: 9px; background: #0e1013; font: inherit; font-size: 12.5px; color: #ede9e1; outline: none;">
                        <sc-for list="{{fd.opts}}" as="op" hint-placeholder-count="3">
                          <option value="{{op.v}}" selected="{{op.sel}}">{{op.t}}</option>
                        </sc-for>
                      </select>
                    </sc-if>
                    <sc-if value="{{fd.isIn}}" hint-placeholder-val="{{false}}">
                      <input type="text" value="{{fd.val}}" onChange="{{fd.set}}" class="mono" style="height: 36px; box-sizing: border-box; padding: 0 11px; border: 1px solid rgba(255,255,255,0.18); border-radius: 9px; background: #0e1013; font-size: 12.5px; color: #ede9e1; outline: none;">
                    </sc-if>
                    <span style="font-size: 10.5px; color: #9aa1ab;">{{fd.hint}}</span>
                  </label>
                </sc-for>
              </div>
              <sc-if value="{{bk.hasFoot}}" hint-placeholder-val="{{false}}">
                <div style="padding: 0 14px 12px; font-size: 11.5px; color: #9aa1ab; line-height: 1.6;">{{bk.foot}}</div>
              </sc-if>
            </sc-if>

            <sc-if value="{{bk.isSteps}}" hint-placeholder-val="{{false}}">
              <div style="display: flex; flex-direction: column; gap: 6px; padding: 12px 14px;">
                <sc-for list="{{bk.steps}}" as="sp" hint-placeholder-count="3">
                  <div style="display: flex; gap: 10px; align-items: baseline; font-size: 12.5px;">
                    <span class="mono" style="width: 22px; height: 22px; flex-shrink: 0; box-sizing: border-box; border-radius: 50%; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.18); color: #ede9e1; font-size: 11px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center;">{{sp.n}}</span>
                    <span style="display: flex; flex-direction: column; gap: 3px; min-width: 0;">
                      <span style="color: #ede9e1;">{{sp.d}} <span style="font-size: 11px; color: #f5b83d;">{{sp.admin}}</span></span>
                      <code class="mono" style="padding: 6px 10px; border-radius: 8px; background: #0e1013; border: 1px solid rgba(255,255,255,0.12); color: #ede9e1; font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;"><span style="color: #6b7280;">$ </span>{{sp.cmd}}</code>
                    </span>
                  </div>
                </sc-for>
              </div>
              <sc-if value="{{bk.hasFoot}}" hint-placeholder-val="{{false}}">
                <div style="padding: 0 14px 12px; font-size: 11.5px; color: #9aa1ab; line-height: 1.6;">{{bk.foot}}</div>
              </sc-if>
            </sc-if>

            <sc-if value="{{bk.isActs}}" hint-placeholder-val="{{false}}">
              <sc-if value="{{bk.running}}" hint-placeholder-val="{{false}}">
                <div style="display: flex; align-items: center; gap: 8px; padding: 10px 14px; background: rgba(122,167,255,0.08); border-bottom: 1px solid rgba(122,167,255,0.2); color: #7aa7ff; font-size: 12.5px; font-weight: 600;"><span class="spin" style="display: inline-flex;"><svg viewBox="0 0 24 24" width="15" height="15" style="display: block; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round;"><use href="#n-loader"></use></svg></span>{{bk.runText}}<span style="flex-grow: 1;"></span><span style="width: 90px; height: 5px; border-radius: 3px; background: rgba(255,255,255,0.08); overflow: hidden;"><span style="display: block; height: 100%; width: {{bk.runPct}}%; background: #7aa7ff; border-radius: 3px; transition: width 420ms cubic-bezier(.22,1,.36,1);"></span></span></div>
              </sc-if>
              <div style="display: flex; flex-direction: column;">
                <sc-for list="{{bk.rows}}" as="ar" hint-placeholder-count="4">
                  <div class="rw" style="display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-top: 1px solid rgba(255,255,255,0.06);">
                    <span style="display: flex; flex-direction: column; gap: 1px; min-width: 0; flex-grow: 1;">
                      <span style="display: flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 700; color: #ede9e1;">{{ar.label}}<span style="font-size: 10px; font-weight: 600; color: {{ar.kFg}}; background: {{ar.kBg}}; border: 1px solid color-mix(in srgb, {{ar.kFg}} 45%, transparent); border-radius: 8px; padding: 0 6px; line-height: 15px;">{{ar.kind}}</span></span>
                      <span style="font-size: 11px; color: #9aa1ab; line-height: 1.5;">{{ar.desc}}</span>
                    </span>
                    <button type="button" onClick="{{ar.run}}" aria-disabled="{{ar.dis}}" class="ghost" style="height: 28px; padding: 0 11px; flex-shrink: 0; border: 1px solid {{ar.line}}; border-radius: 8px; background: rgba(255,255,255,0.04); color: {{ar.fg}}; font: inherit; font-size: 12px; font-weight: 600; cursor: {{ar.cur}}; opacity: {{ar.op}};">{{ar.btn}}</button>
                  </div>
                </sc-for>
              </div>
            </sc-if>

            <sc-if value="{{bk.isState}}" hint-placeholder-val="{{false}}">
              <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 36px 20px; text-align: center;">
                <span data-ic="{{bk.icon}}" style="width: 48px; height: 48px; box-sizing: border-box; border-radius: 14px; background: {{bk.tint}}; border: 1px solid color-mix(in srgb, {{bk.fg}} 40%, transparent); color: {{bk.fg}}; display: flex; align-items: center; justify-content: center;"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;"><use href="#n-{{bk.icon}}"></use></svg></span>
                <span style="font-size: 15px; font-weight: 700; color: #ede9e1;">{{bk.sTitle}}</span>
                <span style="max-width: 560px; font-size: 12.5px; color: #9aa1ab; line-height: 1.7;">{{bk.text}}</span>
                <div style="display: flex; gap: 6px; margin-top: 4px;">
                  <sc-for list="{{bk.bActs}}" as="ac" hint-placeholder-count="0">
                    <button type="button" onClick="{{ac.run}}" class="ghost" style="height: 34px; padding: 0 13px; border: 1px solid {{ac.line}}; border-radius: 9px; background: rgba(255,255,255,0.04); color: {{ac.fg}}; font: inherit; font-size: 12.5px; font-weight: 600; cursor: pointer;">{{ac.label}}</button>
                  </sc-for>
                </div>
              </div>
            </sc-if>
          </section>
        </sc-for>
      </div>
    </main>
  </div>

  <!-- 위험 확인: 대상 · 방향 · 되돌릴 수 있는지를 적는다 (위험 10건은 모두 계약에 확인이 선언돼 있다 — confirmationMode) -->
  <sc-if value="{{dlg.open}}" hint-placeholder-val="{{false}}">
    <div style="position: absolute; inset: 0; z-index: 30; background: rgba(0,0,0,0.50); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); display: flex; align-items: center; justify-content: center;">
      <div class="pop" role="alertdialog" aria-label="{{dlg.title}}" style="width: 460px; box-sizing: border-box; background: rgba(18,20,25,0.96); border: 1px solid rgba(255,255,255,0.12); border-radius: 14px; box-shadow: 0 30px 80px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.05); overflow: hidden;">
        <div style="display: flex; gap: 12px; padding: 18px 20px 12px;">
          <span style="width: 38px; height: 38px; flex-shrink: 0; box-sizing: border-box; border-radius: 10px; background: rgba(255,93,93,0.12); border: 1px solid rgba(255,93,93,0.4); color: #ff5d5d; display: flex; align-items: center; justify-content: center;"><svg viewBox="0 0 24 24" width="19" height="19" aria-hidden="true" style="flex-shrink: 0; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;"><use href="#n-warn"></use></svg></span>
          <span style="display: flex; flex-direction: column; gap: 3px;">
            <span style="font-size: 15px; font-weight: 700; color: #ede9e1;">{{dlg.title}}</span>
            <span class="mono" style="font-size: 11.5px; color: #9aa1ab;">{{dlg.op}}</span>
          </span>
        </div>
        <div style="display: flex; flex-direction: column; gap: 6px; padding: 0 20px 14px;">
          <sc-for list="{{dlg.rows}}" as="dr" hint-placeholder-count="3">
            <div style="display: flex; gap: 10px; font-size: 12.5px;"><span style="width: 92px; flex-shrink: 0; color: #9aa1ab;">{{dr.k}}</span><span style="font-weight: 600; color: {{dr.c}};">{{dr.v}}</span></div>
          </sc-for>
          <div style="margin-top: 4px; padding: 9px 11px; border-radius: 9px; background: rgba(245,184,61,0.08); border: 1px solid rgba(245,184,61,0.30); color: #f5c76a; font-size: 12px; line-height: 1.6;">{{dlg.warn}}</div>
        </div>
        <div style="display: flex; justify-content: flex-end; gap: 6px; padding: 12px 20px; border-top: 1px solid rgba(255,255,255,0.08); background: rgba(255,255,255,0.02);">
          <button type="button" onClick="{{dlg.cancel}}" class="ghost" style="height: 34px; padding: 0 14px; border: 1px solid rgba(255,255,255,0.18); border-radius: 9px; background: rgba(255,255,255,0.04); color: #ede9e1; font: inherit; font-size: 12.5px; font-weight: 600; cursor: pointer;">취소</button>
          <button type="button" onClick="{{dlg.ok}}" style="height: 34px; padding: 0 14px; border: 1px solid #ff5d5d; border-radius: 9px; background: #ff5d5d; color: #1a0707; font: inherit; font-size: 12.5px; font-weight: 700; cursor: pointer;">{{dlg.okLabel}}</button>
        </div>
      </div>
    </div>
  </sc-if>

  <!-- 결과 알림 -->
  <div aria-live="polite" style="position: absolute; right: 18px; bottom: 18px; z-index: 20; display: flex; flex-direction: column; gap: 6px; width: 380px;">
    <sc-for list="{{toasts}}" as="ts" hint-placeholder-count="0">
      <div class="pop" style="display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 12px; background: rgba(13,15,19,0.92); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border: 1px solid color-mix(in srgb, {{ts.c}} 45%, transparent); box-shadow: 0 10px 30px rgba(0,0,0,0.40), inset 0 1px 0 rgba(255,255,255,0.05); font-size: 12.5px; line-height: 1.55; color: #ede9e1;">
        <span style="width: 22px; height: 22px; flex-shrink: 0; border-radius: 50%; background: color-mix(in srgb, {{ts.c}} 16%, transparent); color: {{ts.c}}; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center;">{{ts.g}}</span>
        <span style="flex-grow: 1;"><b style="font-weight: 600;">{{ts.title}}</b><br><span style="color: #9aa1ab; font-size: 11.5px;">{{ts.text}}</span></span>
      </div>
    </sc-for>
  </div>
</div>
</script>
<script type="module">
import './src/api/frame-boot.js';   // 첫 import — Terra 안이면 마운트보다 먼저 frame에 hello를 보낸다
import { mount, fit } from './src/runtime/dc.js';
import Screen from './src/screens/network.js';
import * as Boot from './src/boot/module.js';
const stage = document.getElementById('stage');
const View = (Boot.prep && Boot.prep('network', Screen)) || Screen;   // 프로필이 예시를 지운 클래스를 돌려주면 그것을 띄운다
window.__screen = mount(View, { template: document.getElementById('view').textContent, target: stage, props: {} });
fit(stage, 1440, 900);
Boot.boot && Boot.boot('network', window.__screen);
</script>
</body>
</html>
