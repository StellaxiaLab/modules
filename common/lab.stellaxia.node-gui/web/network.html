<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Terra · 네트워크</title>
<style>
body{margin:0;font-family:'Noto Sans KR','Noto Sans',system-ui,'Segoe UI',-apple-system,sans-serif;background:#ffffff}
a{color:#2563eb}a:hover{color:#1d4ed8}
.mono{font-family:ui-monospace,'DejaVu Sans Mono',Consolas,Menlo,monospace}
.nv:hover{background:#f3f6fb}
.rw:hover{background:#f8fafd}
.gn{cursor:pointer}
.gn:hover .gn-c{stroke:#2563eb}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{display:inline-block;animation:spin 900ms linear infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.pulse{animation:pulse 1.4s ease-in-out infinite}
@keyframes pop{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.pop{animation:pop 180ms cubic-bezier(.2,.8,.3,1) both}
</style>
<style>
html,body{margin:0;background:#dfe3ea}
.frame{margin:12px auto;overflow:hidden;box-shadow:0 6px 24px rgba(22,25,31,0.16);border-radius:6px}
#stage{width:1440px;height:900px;transform-origin:0 0;background:#ffffff}
</style>
</head>
<body>
<div class="frame"><div id="stage"></div></div>
<script type="text/x-template" id="view">
<!-- 네트워크 화면 v2 — 입력: terra-gui-network-requirements (main fc74e28)
     묶음 넷(§3): 사설망(T) · 연결 진단·라우팅(T) · 서비스 터널(T+L) · 로컬 WireGuard(L) + 조작 이력(T)
     화면은 노드 역할을 선언하지 않고 관측한다(health · catalog). 역할(tree · leaf)은 카탈로그로 정하고, 데이터는 이 노드의 게이트웨이에서 읽는다(src/data/network-live.js) -->
<div style="position: relative; width: 1440px; height: 900px; display: flex; flex-direction: column; background: #ffffff; color: #16191f; font-family: 'Noto Sans KR','Noto Sans',system-ui,'Segoe UI',-apple-system,sans-serif; font-size: 14px; line-height: 1.55; overflow: hidden;">

  <header style="height: 52px; flex-shrink: 0; box-sizing: border-box; padding: 0 18px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #d8dde5;">
    <a href="node.html" style="font-size: 13px; color: #5b6472; text-decoration: none;">← 노드 화면</a>
    <h1 style="margin: 0; font-size: 17px; font-weight: 600;">네트워크</h1>
    <span title="{{hdr.gwTip}}" style="display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 13px; background: {{hdr.roleBg}}; color: {{hdr.roleFg}}; font-size: 12px; font-weight: 600;"><span style="width: 8px; height: 8px; border-radius: 2px; background: {{hdr.roleDot}};"></span>{{hdr.roleText}}</span>
    <span style="display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: {{hdr.pollFg}};"><span class="{{hdr.pollCls}}" style="width: 7px; height: 7px; border-radius: 50%; background: {{hdr.pollDot}};"></span>{{hdr.pollText}}</span>
    <button type="button" onClick="{{hdr.refresh}}" style="height: 26px; padding: 0 9px; border: 1px solid #d8dde5; border-radius: 6px; background: #ffffff; color: #16191f; font: inherit; font-size: 12px; cursor: pointer;">↻ 지금</button>
    <span style="flex-grow: 1;"></span>
  </header>

  <div style="flex-grow: 1; display: flex; min-height: 0;">
    <!-- 왼쪽: 묶음. 로컬 노드의 카탈로그에 없는 묶음은 잠그고 이유를 적는다 -->
    <nav aria-label="네트워크 묶음" style="width: 232px; flex-shrink: 0; box-sizing: border-box; border-right: 1px solid #d8dde5; padding: 14px 10px; display: flex; flex-direction: column; gap: 4px; overflow-y: auto;">
      <sc-for list="{{nav}}" as="nv" hint-placeholder-count="5">
        <button type="button" class="nv" aria-current="{{nv.cur}}" onClick="{{nv.pick}}" style="display: flex; gap: 10px; align-items: flex-start; padding: 9px 10px; border: 0; border-radius: 9px; background: {{nv.bg}}; color: {{nv.fg}}; font: inherit; text-align: left; cursor: pointer;">
          <span aria-hidden="true" style="width: 30px; height: 30px; flex-shrink: 0; box-sizing: border-box; border-radius: 8px; background: {{nv.tint}}; border: 1px solid {{nv.tintLine}}; display: flex; align-items: center; justify-content: center; font-size: 14px; filter: {{nv.gray}};">{{nv.icon}}</span>
          <span style="display: flex; flex-direction: column; gap: 1px; min-width: 0;">
            <span style="display: flex; align-items: center; gap: 6px;"><span style="font-size: 13px; font-weight: 700;">{{nv.label}}</span><span style="font-size: 10px; font-weight: 700; color: {{nv.roleFg}}; border: 1px solid {{nv.roleLine}}; border-radius: 4px; padding: 0 4px; line-height: 15px;">{{nv.role}}</span></span>
            <span style="display: {{nv.subDisp}}; font-size: 11px; color: {{nv.subFg}}; line-height: 1.45;">{{nv.sub}}</span>
          </span>
        </button>
      </sc-for>
      <div style="margin-top: auto; padding: 10px; border-radius: 9px; background: #f7f8fb; font-size: 11.5px; color: #5b6472; line-height: 1.6;">
        <div style="font-weight: 700; color: #16191f; margin-bottom: 2px;">세션</div>
        <div>{{sess.who}}</div>
        <div>{{sess.perm}}</div>
        <div style="display: {{helpBlock}}; color: #8b95a6;">네트워크 45건은 이 두 기본 권한으로 모두 열린다</div>
      </div>
    </nav>

    <main style="flex-grow: 1; min-width: 0; background: #eef1f5; overflow-y: auto; box-sizing: border-box; padding: 16px 18px 24px;">
      <div style="display: flex; align-items: flex-end; gap: 12px; margin-bottom: 12px;">
        <div style="display: flex; flex-direction: column; gap: 2px;">
          <h2 style="margin: 0; font-size: 18px; font-weight: 700;">{{page.title}}</h2>
          <span style="display: {{page.subDisp}}; font-size: 12.5px; color: #5b6472;">{{page.sub}}</span>
        </div>
        <span style="flex-grow: 1;"></span>
        <div role="tablist" style="display: {{page.tabDisp}}; gap: 2px; padding: 3px; border-radius: 9px; background: #e2e7ee;">
          <sc-for list="{{page.tabs}}" as="tb" hint-placeholder-count="3">
            <button type="button" role="tab" aria-selected="{{tb.on}}" onClick="{{tb.pick}}" style="height: 28px; padding: 0 12px; border: 0; border-radius: 7px; background: {{tb.bg}}; color: {{tb.fg}}; box-shadow: {{tb.sh}}; font: inherit; font-size: 12.5px; font-weight: 600; cursor: pointer;">{{tb.label}}</button>
          </sc-for>
        </div>
      </div>

      <!-- 블록: 12칸 격자에 폭(span)만큼. type = banner · table · kv · graph · form · steps · locked · state -->
      <div style="display: grid; grid-template-columns: repeat(12, 1fr); gap: 12px; align-items: start;">
        <sc-for list="{{blocks}}" as="bk" hint-placeholder-count="4">
          <section style="grid-column: span {{bk.span}}; box-sizing: border-box; background: {{bk.bg}}; border: 1px solid {{bk.line}}; border-radius: 12px; overflow: hidden; min-width: 0;">
            <sc-if value="{{bk.hasHead}}" hint-placeholder-val="{{true}}">
              <div style="display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid #eef1f5; flex-wrap: wrap;">
                <h3 style="margin: 0; font-size: 13.5px; font-weight: 700;">{{bk.title}}</h3>
                <span style="font-size: 11.5px; color: #5b6472;">{{bk.sub}}</span>
                <sc-for list="{{bk.tags}}" as="tg" hint-placeholder-count="0">
                  <span title="{{tg.tip}}" style="display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 7px; border-radius: 10px; background: {{tg.bg}}; color: {{tg.fg}}; font-size: 11px; font-weight: 700;">{{tg.t}}</span>
                </sc-for>
                <span style="flex-grow: 1;"></span>
                <sc-for list="{{bk.acts}}" as="ac" hint-placeholder-count="0">
                  <button type="button" title="{{ac.tip}}" aria-disabled="{{ac.dis}}" onClick="{{ac.run}}" style="height: 28px; padding: 0 11px; border: 1px solid {{ac.line}}; border-radius: 7px; background: {{ac.bg}}; color: {{ac.fg}}; font: inherit; font-size: 12px; font-weight: 600; cursor: {{ac.cur}}; opacity: {{ac.op}}; display: inline-flex; align-items: center; gap: 5px;"><span class="{{ac.spin}}">{{ac.g}}</span>{{ac.label}}</button>
                </sc-for>
              </div>
            </sc-if>

            <sc-if value="{{bk.isBanner}}" hint-placeholder-val="{{false}}">
              <div style="display: flex; gap: 10px; align-items: flex-start; padding: 10px 14px; background: {{bk.tint}}; color: {{bk.fg}}; font-size: 12.5px; line-height: 1.6;">
                <span style="font-size: 14px; line-height: 1.4;">{{bk.icon}}</span>
                <span style="flex-grow: 1;"><b>{{bk.bTitle}}</b> {{bk.text}}</span>
                <sc-for list="{{bk.bActs}}" as="ac" hint-placeholder-count="0">
                  <button type="button" onClick="{{ac.run}}" style="height: 26px; padding: 0 10px; border: 1px solid {{ac.line}}; border-radius: 6px; background: #ffffff; color: {{ac.fg}}; font: inherit; font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap;">{{ac.label}}</button>
                </sc-for>
              </div>
            </sc-if>

            <sc-if value="{{bk.isTable}}" hint-placeholder-val="{{false}}">
              <div style="display: grid; grid-template-columns: {{bk.cols}}; font-size: 12.5px;">
                <sc-for list="{{bk.head}}" as="hd" hint-placeholder-count="4">
                  <span style="padding: 7px 12px; background: #f7f8fb; color: #5b6472; font-size: 11.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{hd.t}}</span>
                </sc-for>
                <sc-for list="{{bk.cells}}" as="cl" hint-placeholder-count="8">
                  <span style="padding: {{cl.pad}}; border-top: 1px solid #eef1f5; background: {{cl.rowBg}}; min-width: 0; display: flex; align-items: center; gap: 6px; opacity: {{cl.op}};">
                    <sc-if value="{{cl.isT}}" hint-placeholder-val="{{true}}">
                      <span class="{{cl.cls}}" title="{{cl.tip}}" style="color: {{cl.c}}; font-weight: {{cl.fw}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{cl.t}}</span>
                      <span style="font-size: 11px; color: #8b95a6; white-space: nowrap;">{{cl.sub}}</span>
                    </sc-if>
                    <sc-if value="{{cl.isB}}" hint-placeholder-val="{{false}}">
                      <span title="{{cl.tip}}" style="display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 8px; border-radius: 10px; background: {{cl.bb}}; color: {{cl.bf}}; font-size: 11px; font-weight: 700; white-space: nowrap;"><span class="{{cl.cls}}">{{cl.g}}</span>{{cl.t}}</span>
                      <span style="font-size: 11px; color: #8b95a6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{cl.sub}}</span>
                    </sc-if>
                    <sc-if value="{{cl.isBtn}}" hint-placeholder-val="{{false}}">
                      <span style="flex-grow: 1;"></span>
                      <sc-for list="{{cl.btns}}" as="bt" hint-placeholder-count="1">
                        <button type="button" title="{{bt.tip}}" onClick="{{bt.run}}" aria-disabled="{{bt.dis}}" style="height: 25px; padding: 0 9px; border: 1px solid {{bt.line}}; border-radius: 6px; background: #ffffff; color: {{bt.fg}}; font: inherit; font-size: 11.5px; font-weight: 600; cursor: {{bt.cur}}; opacity: {{bt.op}}; white-space: nowrap;">{{bt.label}}</button>
                      </sc-for>
                    </sc-if>
                  </span>
                </sc-for>
              </div>
              <sc-if value="{{bk.isEmpty}}" hint-placeholder-val="{{false}}">
                <div style="padding: 22px 14px; text-align: center; font-size: 12.5px; color: #8b95a6;">{{bk.empty}}</div>
              </sc-if>
              <sc-if value="{{bk.hasFoot}}" hint-placeholder-val="{{false}}">
                <div style="padding: 8px 14px; border-top: 1px solid #eef1f5; background: #fbfcfd; font-size: 11.5px; color: #5b6472; line-height: 1.6;">{{bk.foot}}</div>
              </sc-if>
            </sc-if>

            <sc-if value="{{bk.isKv}}" hint-placeholder-val="{{false}}">
              <div style="display: grid; grid-template-columns: repeat({{bk.kvCols}}, 1fr); gap: 6px; padding: 12px 14px;">
                <sc-for list="{{bk.items}}" as="kv" hint-placeholder-count="4">
                  <span title="{{kv.tip}}" style="box-sizing: border-box; padding: 7px 10px; border-radius: 8px; background: {{kv.bg}}; border: 1px solid {{kv.line}}; display: flex; flex-direction: column; gap: 1px; min-width: 0;">
                    <span style="font-size: 10.5px; color: #5b6472;">{{kv.k}}</span>
                    <span class="{{kv.cls}}" style="font-size: 13px; font-weight: 700; color: {{kv.c}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{kv.v}}</span>
                  </span>
                </sc-for>
              </div>
              <sc-if value="{{bk.hasFoot}}" hint-placeholder-val="{{false}}">
                <div style="padding: 0 14px 12px; font-size: 11.5px; color: #5b6472; line-height: 1.6;">{{bk.foot}}</div>
              </sc-if>
            </sc-if>

            <sc-if value="{{bk.isGraph}}" hint-placeholder-val="{{false}}">
              <svg width="100%" height="{{bk.gh}}" viewBox="0 0 {{bk.gw}} {{bk.gh}}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="라우트 그래프" style="display: block; background: radial-gradient(circle at 50% 40%, #fbfcfe 0%, #f2f5f9 100%);">
                <sc-for list="{{bk.edges}}" as="ed" hint-placeholder-count="6">
                  <line x1="{{ed.x1}}" y1="{{ed.y1}}" x2="{{ed.x2}}" y2="{{ed.y2}}" stroke="{{ed.c}}" stroke-width="{{ed.w}}" stroke-dasharray="{{ed.dash}}" stroke-linecap="round" opacity="{{ed.op}}"></line>
                </sc-for>
                <sc-for list="{{bk.gnodes}}" as="gn" hint-placeholder-count="6">
                  <g class="gn" transform="translate({{gn.x}} {{gn.y}})" onClick="{{gn.pick}}" opacity="{{gn.op}}">
                    <title>{{gn.name}}</title>
                    <circle class="gn-c" r="{{gn.r}}" fill="#ffffff" stroke="{{gn.line}}" stroke-width="{{gn.lw}}"></circle>
                    <rect x="-6" y="-6" width="12" height="12" rx="3" fill="{{gn.c}}"></rect>
                    <text y="{{gn.ty}}" text-anchor="middle" font-size="11" font-weight="{{gn.fw}}" fill="#16191f" class="mono" style="paint-order: stroke; stroke: #f4f6f9; stroke-width: 3px;">{{gn.name}}</text>
                    <text y="{{gn.ty2}}" text-anchor="middle" font-size="9.5" fill="{{gn.tagC}}" font-weight="700">{{gn.tag}}</text>
                  </g>
                </sc-for>
              </svg>
              <div style="display: flex; gap: 12px; flex-wrap: wrap; padding: 8px 14px; border-top: 1px solid #eef1f5; font-size: 11.5px; color: #3a4049;">
                <sc-for list="{{bk.legend}}" as="lg" hint-placeholder-count="4">
                  <span style="display: inline-flex; align-items: center; gap: 6px;"><span style="width: 20px; height: 0; border-top: 3px {{lg.style}} {{lg.c}};"></span><span class="mono">{{lg.t}}</span></span>
                </sc-for>
              </div>
            </sc-if>

            <sc-if value="{{bk.isForm}}" hint-placeholder-val="{{false}}">
              <div style="display: grid; grid-template-columns: repeat({{bk.fCols}}, 1fr); gap: 10px 12px; padding: 12px 14px;">
                <sc-for list="{{bk.fields}}" as="fd" hint-placeholder-count="4">
                  <label style="display: flex; flex-direction: column; gap: 4px; font-size: 11.5px; color: #5b6472; min-width: 0;">
                    <span>{{fd.label}} <span style="color: #d33d52;">{{fd.req}}</span></span>
                    <sc-if value="{{fd.isSel}}" hint-placeholder-val="{{true}}">
                      <select onChange="{{fd.set}}" style="height: 32px; box-sizing: border-box; padding: 0 8px; border: 1px solid #d8dde5; border-radius: 7px; background: #ffffff; font: inherit; font-size: 12.5px; color: #16191f;">
                        <sc-for list="{{fd.opts}}" as="op" hint-placeholder-count="3">
                          <option value="{{op.v}}" selected="{{op.sel}}">{{op.t}}</option>
                        </sc-for>
                      </select>
                    </sc-if>
                    <sc-if value="{{fd.isIn}}" hint-placeholder-val="{{false}}">
                      <input type="text" value="{{fd.val}}" onChange="{{fd.set}}" class="mono" style="height: 32px; box-sizing: border-box; padding: 0 9px; border: 1px solid #d8dde5; border-radius: 7px; font-size: 12.5px; color: #16191f;">
                    </sc-if>
                    <span style="font-size: 10.5px; color: #8b95a6;">{{fd.hint}}</span>
                  </label>
                </sc-for>
              </div>
              <sc-if value="{{bk.hasFoot}}" hint-placeholder-val="{{false}}">
                <div style="padding: 0 14px 12px; font-size: 11.5px; color: #5b6472; line-height: 1.6;">{{bk.foot}}</div>
              </sc-if>
            </sc-if>

            <sc-if value="{{bk.isSteps}}" hint-placeholder-val="{{false}}">
              <div style="display: flex; flex-direction: column; gap: 6px; padding: 12px 14px;">
                <sc-for list="{{bk.steps}}" as="sp" hint-placeholder-count="3">
                  <div style="display: flex; gap: 10px; align-items: baseline; font-size: 12.5px;">
                    <span style="width: 20px; height: 20px; flex-shrink: 0; border-radius: 50%; background: #eef1f5; color: #3a4049; font-size: 11px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center;">{{sp.n}}</span>
                    <span style="display: flex; flex-direction: column; gap: 3px; min-width: 0;">
                      <span>{{sp.d}} <span style="font-size: 11px; color: #a65f00;">{{sp.admin}}</span></span>
                      <code class="mono" style="padding: 5px 8px; border-radius: 6px; background: #16191f; color: #e5e9f0; font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{sp.cmd}}</code>
                    </span>
                  </div>
                </sc-for>
              </div>
              <sc-if value="{{bk.hasFoot}}" hint-placeholder-val="{{false}}">
                <div style="padding: 0 14px 12px; font-size: 11.5px; color: #5b6472; line-height: 1.6;">{{bk.foot}}</div>
              </sc-if>
            </sc-if>

            <sc-if value="{{bk.isActs}}" hint-placeholder-val="{{false}}">
              <sc-if value="{{bk.running}}" hint-placeholder-val="{{false}}">
                <div style="display: flex; align-items: center; gap: 8px; padding: 9px 14px; background: #dde8fd; color: #1d4ed8; font-size: 12.5px; font-weight: 600;"><span class="spin">⟳</span>{{bk.runText}}<span style="flex-grow: 1;"></span><span style="width: 90px; height: 5px; border-radius: 3px; background: rgba(29,78,216,0.18); overflow: hidden;"><span style="display: block; height: 100%; width: {{bk.runPct}}%; background: #2563eb;"></span></span></div>
              </sc-if>
              <div style="display: flex; flex-direction: column;">
                <sc-for list="{{bk.rows}}" as="ar" hint-placeholder-count="4">
                  <div class="rw" style="display: flex; align-items: center; gap: 10px; padding: 9px 14px; border-top: 1px solid #eef1f5;">
                    <span style="display: flex; flex-direction: column; gap: 1px; min-width: 0; flex-grow: 1;">
                      <span style="display: flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 700;">{{ar.label}}<span style="font-size: 10px; font-weight: 700; color: {{ar.kFg}}; background: {{ar.kBg}}; border-radius: 4px; padding: 0 5px; line-height: 16px;">{{ar.kind}}</span></span>
                      <span style="font-size: 11px; color: #5b6472; line-height: 1.5;">{{ar.desc}}</span>
                    </span>
                    <button type="button" onClick="{{ar.run}}" aria-disabled="{{ar.dis}}" style="height: 28px; padding: 0 11px; flex-shrink: 0; border: 1px solid {{ar.line}}; border-radius: 7px; background: #ffffff; color: {{ar.fg}}; font: inherit; font-size: 12px; font-weight: 600; cursor: {{ar.cur}}; opacity: {{ar.op}};">{{ar.btn}}</button>
                  </div>
                </sc-for>
              </div>
            </sc-if>

            <sc-if value="{{bk.isState}}" hint-placeholder-val="{{false}}">
              <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 36px 20px; text-align: center;">
                <span style="width: 48px; height: 48px; border-radius: 12px; background: {{bk.tint}}; display: flex; align-items: center; justify-content: center; font-size: 22px;">{{bk.icon}}</span>
                <span style="font-size: 15px; font-weight: 700;">{{bk.sTitle}}</span>
                <span style="max-width: 560px; font-size: 12.5px; color: #5b6472; line-height: 1.7;">{{bk.text}}</span>
                <div style="display: flex; gap: 6px; margin-top: 4px;">
                  <sc-for list="{{bk.bActs}}" as="ac" hint-placeholder-count="0">
                    <button type="button" onClick="{{ac.run}}" style="height: 30px; padding: 0 12px; border: 1px solid {{ac.line}}; border-radius: 7px; background: #ffffff; color: {{ac.fg}}; font: inherit; font-size: 12.5px; font-weight: 600; cursor: pointer;">{{ac.label}}</button>
                  </sc-for>
                </div>
              </div>
            </sc-if>
          </section>
        </sc-for>
      </div>
    </main>
  </div>

  <!-- 위험 확인: 대상 · 방향 · 되돌릴 수 있는지를 적는다 (위험 10건은 모두 계약에 확인이 선언돼 있다 — confirmationMode) -->
  <sc-if value="{{dlg.open}}" hint-placeholder-val="{{false}}">
    <div style="position: absolute; inset: 0; z-index: 30; background: rgba(22,25,31,0.32); display: flex; align-items: center; justify-content: center;">
      <div class="pop" role="alertdialog" aria-label="{{dlg.title}}" style="width: 460px; box-sizing: border-box; background: #ffffff; border-radius: 14px; box-shadow: 0 20px 50px rgba(22,25,31,0.28); overflow: hidden;">
        <div style="display: flex; gap: 12px; padding: 18px 20px 12px;">
          <span style="width: 38px; height: 38px; flex-shrink: 0; border-radius: 10px; background: #fde1e5; color: #d33d52; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 700;">!</span>
          <span style="display: flex; flex-direction: column; gap: 3px;">
            <span style="font-size: 15px; font-weight: 700;">{{dlg.title}}</span>
            <span class="mono" style="font-size: 11.5px; color: #5b6472;">{{dlg.op}}</span>
          </span>
        </div>
        <div style="display: flex; flex-direction: column; gap: 6px; padding: 0 20px 14px;">
          <sc-for list="{{dlg.rows}}" as="dr" hint-placeholder-count="3">
            <div style="display: flex; gap: 10px; font-size: 12.5px;"><span style="width: 92px; flex-shrink: 0; color: #5b6472;">{{dr.k}}</span><span style="font-weight: 600; color: {{dr.c}};">{{dr.v}}</span></div>
          </sc-for>
          <div style="margin-top: 4px; padding: 8px 10px; border-radius: 8px; background: #fbf0cc; color: #7a4a06; font-size: 12px; line-height: 1.6;">{{dlg.warn}}</div>
        </div>
        <div style="display: flex; justify-content: flex-end; gap: 6px; padding: 12px 20px; border-top: 1px solid #eef1f5; background: #fbfcfd;">
          <button type="button" onClick="{{dlg.cancel}}" style="height: 32px; padding: 0 14px; border: 1px solid #d8dde5; border-radius: 7px; background: #ffffff; color: #16191f; font: inherit; font-size: 13px; cursor: pointer;">취소</button>
          <button type="button" onClick="{{dlg.ok}}" style="height: 32px; padding: 0 14px; border: 1px solid #d33d52; border-radius: 7px; background: #d33d52; color: #ffffff; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer;">{{dlg.okLabel}}</button>
        </div>
      </div>
    </div>
  </sc-if>

  <!-- 결과 알림 -->
  <div aria-live="polite" style="position: absolute; right: 18px; bottom: 18px; z-index: 20; display: flex; flex-direction: column; gap: 6px; width: 380px;">
    <sc-for list="{{toasts}}" as="ts" hint-placeholder-count="0">
      <div class="pop" style="display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 10px; background: #ffffff; border: 1px solid #d8dde5; border-left: 4px solid {{ts.c}}; box-shadow: 0 8px 24px rgba(22,25,31,0.14); font-size: 12.5px; line-height: 1.55;">
        <span style="color: {{ts.c}}; font-weight: 700;">{{ts.g}}</span>
        <span style="flex-grow: 1;"><b>{{ts.title}}</b><br><span style="color: #5b6472;">{{ts.text}}</span></span>
      </div>
    </sc-for>
  </div>
</div>
</script>
<script type="module">
import './src/api/frame-boot.js';   // 첫 import — Terra 안이면 마운트보다 먼저 frame에 hello를 보낸다
import { mount, fit } from './src/runtime/dc.js';
import Screen from './src/screens/network.js';
import * as Boot from './src/boot/module.js';
const stage = document.getElementById('stage');
const View = (Boot.prep && Boot.prep('network', Screen)) || Screen;   // 프로필이 예시를 지운 클래스를 돌려주면 그것을 띄운다
window.__screen = mount(View, { template: document.getElementById('view').textContent, target: stage, props: {} });
fit(stage, 1440, 900);
Boot.boot && Boot.boot('network', window.__screen);
</script>
</body>
</html>
