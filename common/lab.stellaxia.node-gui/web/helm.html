<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Terra · 조타륜 (디자인 노트)</title>
<style>
body{margin:0;background:#ffffff}
.hm-drag{cursor:grab;touch-action:none;outline:none}
.hm-drag:active{cursor:grabbing}
.hm-drag:focus-visible{box-shadow:0 0 0 2px #b08d57 inset;border-radius:10px}
</style>
<style>
html,body{margin:0;background:#dfe3ea}
.frame{margin:12px auto;overflow:hidden;box-shadow:0 6px 24px rgba(22,25,31,0.16);border-radius:6px}
#stage{width:1064px;height:461px;transform-origin:0 0;background:#ffffff}
</style>
</head>
<body>
<div class="frame"><div id="stage"></div></div>
<script type="text/x-template" id="view">
<!-- 나침반 조타륜 (테스트): 새긴 선 느낌의 눈금 고리. 홀드하고 좌우로 끌면 돈다 (놓으면 관성으로 돌다 1°에 멈춘다)
     눈금 그림은 한 번만 만들어 붙이고, 돌릴 때는 그룹의 transform만 바꾼다 (다시 그리지 않음) -->
<div style="width: 1064px; height: 461px; display: flex; gap: 20px; padding: 18px 22px; box-sizing: border-box; background: #efe8d8; color: #6b5230; font-family: 'Noto Sans KR','Noto Sans',system-ui,sans-serif; border: 1px solid #d9ccb0; border-radius: 12px; overflow: hidden;">
  <div style="width: 680px; flex-shrink: 0; display: flex; flex-direction: column; gap: 6px;">
    <div style="display: flex; align-items: baseline; gap: 10px;">
      <b style="font-size: 15px; color: #5a4526; white-space: nowrap;">나침반 조타륜</b>
      <span style="font-size: 12px; color: #9c7a45; white-space: nowrap;">끌어 돌리기 · ← → 1° · Shift 10°</span>
      <span style="flex-grow: 1;"></span>
      <label style="display: flex; align-items: center; gap: 8px; white-space: nowrap; font-size: 12px; font-weight: 600; color: #6b5230; align-self: center;">곡률
        <input data-hm-curve="1" type="range" min="0" max="100" value="54" aria-label="눈금 원호의 곡률 — 왼쪽은 납작하게, 오른쪽은 둥글게" onInput="{{curve}}" style="width: 120px; accent-color: #9c7a45;">
        <span data-hm-rv="1" style="width: 58px; font-weight: 500; color: #9c7a45; font-variant-numeric: tabular-nums;">R 1313</span>
      </label>
    </div>
    <div data-hm-arcwrap="1" class="hm-drag" tabindex="0" role="slider" aria-label="방위 — 좌우로 끌어 돌리기" aria-valuemin="0" aria-valuemax="359" onPointerDown="{{down}}" onPointerMove="{{move}}" onPointerUp="{{up}}" onPointerCancel="{{up}}" onKeyDown="{{key}}" style="position: relative; width: 680px; height: 392px; border-radius: 10px; overflow: hidden;">
      <svg data-hm-arc="1" width="680" height="392" viewBox="0 0 680 392" aria-hidden="true" style="display: block;"></svg>
    </div>
  </div>
  <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;">
    <div class="hm-drag" tabindex="-1" onPointerDown="{{downWheel}}" onPointerMove="{{move}}" onPointerUp="{{up}}" onPointerCancel="{{up}}" style="width: 320px; height: 320px;">
      <svg data-hm-wheel="1" width="320" height="320" viewBox="0 0 320 320" aria-hidden="true" style="display: block;"></svg>
    </div>
    <div style="display: flex; align-items: baseline; gap: 10px;">
      <span data-hm-deg="1" style="font-family: 'Cormorant Garamond', Georgia, serif; font-size: 38px; font-weight: 700; color: #5a4526; font-variant-numeric: tabular-nums; min-width: 92px; text-align: right;">000°</span>
      <span data-hm-dir="1" style="font-size: 14px; font-weight: 600; color: #9c7a45; min-width: 76px;">북 N</span>
    </div>
  </div>
</div>
</script>
<script type="module">
import './src/api/frame-boot.js';   // 첫 import — Terra 안이면 마운트보다 먼저 frame에 hello를 보낸다
import { mount, fit } from './src/runtime/dc.js';
import Screen from './src/screens/helm.js';
const stage = document.getElementById('stage');
window.__screen = mount(Screen, { template: document.getElementById('view').textContent, target: stage, props: {} });
fit(stage, 1064, 461);

</script>
</body>
</html>
