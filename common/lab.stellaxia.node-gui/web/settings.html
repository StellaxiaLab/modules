<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Terra · 설정</title>
<style>
body{margin:0;font-family:'Noto Sans KR','Noto Sans',system-ui,'Segoe UI',-apple-system,sans-serif;background:#ffffff}
a{color:#2563eb}a:hover{color:#1d4ed8}
.mono{font-family:ui-monospace,'DejaVu Sans Mono',Consolas,Menlo,monospace}
.nv:hover{background:#f3f6fb}
.kr:hover{background:#fbfcfe}
@keyframes pop{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.pop{animation:pop 180ms cubic-bezier(.2,.8,.3,1) both}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{display:inline-block;animation:spin 900ms linear infinite}
</style>
<style>
html,body{margin:0;background:#dfe3ea}
.frame{margin:12px auto;overflow:hidden;box-shadow:0 6px 24px rgba(22,25,31,0.16);border-radius:6px}
#stage{width:1440px;height:900px;transform-origin:0 0;background:#ffffff}
</style>
</head>
<body>
<div class="frame"><div id="stage"></div></div>
<script type="text/x-template" id="view">
<!-- 설정 화면 — 입력: terra-gui-settings (설정 저장 위치 6종). 탭은 관측으로 연다(catalog) · 키 한 줄의 상태 9가지(§8.2) · 데이터는 이 노드의 게이트웨이에서 읽는다(src/data/settings-live.js) -->
<div style="position: relative; width: 1440px; height: 900px; display: flex; flex-direction: column; background: #ffffff; color: #16191f; font-family: 'Noto Sans KR','Noto Sans',system-ui,'Segoe UI',-apple-system,sans-serif; font-size: 14px; line-height: 1.55; overflow: hidden;">

  <header style="height: 52px; flex-shrink: 0; box-sizing: border-box; padding: 0 18px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #d8dde5;">
    <a href="node.html" style="font-size: 13px; color: #5b6472; text-decoration: none;">← 노드 화면</a>
    <h1 style="margin: 0; font-size: 17px; font-weight: 600;">설정</h1>
    <span title="{{hdr.gwTip}}" style="display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 13px; background: {{hdr.roleBg}}; color: {{hdr.roleFg}}; font-size: 12px; font-weight: 600;"><span style="width: 8px; height: 8px; border-radius: 2px; background: {{hdr.roleDot}};"></span>{{hdr.roleText}}</span>
    <span style="font-size: 12px; color: #5b6472;">{{hdr.who}}</span>
    <span style="flex-grow: 1;"></span>
    <span title="node.config★는 기본 권한 밖 — 관리자도 명시해야 열린다" style="display: inline-flex; align-items: center; height: 30px; box-sizing: border-box; padding: 0 10px; border: 1px solid {{hdr.permLine}}; border-radius: 6px; background: {{hdr.permBg}}; color: {{hdr.permFg}}; font-size: 12px; font-weight: 600;">{{hdr.permLabel}}</span>
  </header>

  <div style="flex-grow: 1; display: flex; min-height: 0;">
    <!-- 탭 여섯 (§8.1) — 카탈로그에 필요한 operation이 있을 때만 선다 -->
    <nav aria-label="설정 탭" style="width: 216px; flex-shrink: 0; box-sizing: border-box; border-right: 1px solid #d8dde5; padding: 14px 10px; display: flex; flex-direction: column; gap: 3px;">
      <sc-for list="{{tabs}}" as="tb" hint-placeholder-count="6">
        <button type="button" class="nv" aria-current="{{tb.cur}}" onClick="{{tb.pick}}" style="display: flex; gap: 10px; align-items: flex-start; padding: 8px 10px; border: 0; border-radius: 9px; background: {{tb.bg}}; color: {{tb.fg}}; font: inherit; text-align: left; cursor: pointer;">
          <span aria-hidden="true" style="width: 28px; height: 28px; flex-shrink: 0; box-sizing: border-box; border-radius: 8px; background: {{tb.tint}}; border: 1px solid {{tb.tintLine}}; display: flex; align-items: center; justify-content: center; font-size: 13px; filter: {{tb.gray}};">{{tb.icon}}</span>
          <span style="display: flex; flex-direction: column; gap: 1px; min-width: 0;">
            <span style="display: flex; align-items: center; gap: 6px;"><span style="font-size: 13px; font-weight: 700;">{{tb.label}}</span><span style="font-size: 10px; font-weight: 700; color: {{tb.roleFg}}; border: 1px solid {{tb.roleLine}}; border-radius: 4px; padding: 0 4px; line-height: 15px;">{{tb.role}}</span><span style="display: {{tb.dotDisp}}; min-width: 16px; height: 16px; box-sizing: border-box; padding: 0 4px; border-radius: 8px; background: #a65f00; color: #ffffff; font-size: 10px; font-weight: 700; line-height: 16px; text-align: center;">{{tb.dot}}</span></span>
            <span style="display: {{tb.subDisp}}; font-size: 11px; color: {{tb.subFg}}; line-height: 1.45;">{{tb.sub}}</span>
          </span>
        </button>
      </sc-for>
      <div style="display: {{helpBox}}; margin-top: auto; padding: 10px; border-radius: 9px; background: #f7f8fb; font-size: 11px; color: #5b6472; line-height: 1.6;">
        <b style="color: #16191f;">설정 저장 위치 6종</b><br>GUI 환경설정 · 계정 · 로컬 노드 설정 · 로컬 자원 · 클러스터 정책 · tree 서버 설정. 층마다 저장되는 곳과 쓰는 길이 다르다.
      </div>
    </nav>

    <!-- 로컬 노드: 6분류 목록 (분류 안에 섹션) -->
    <aside style="display: {{grp.disp}}; width: 228px; flex-shrink: 0; box-sizing: border-box; border-right: 1px solid #e3e7ed; background: #fbfcfd; padding: 12px 8px; flex-direction: column; gap: 2px; overflow-y: auto;">
      <input type="text" value="{{grp.q}}" onChange="{{grp.setQ}}" placeholder="키 · 뜻 찾기" aria-label="설정 키 찾기" style="height: 32px; box-sizing: border-box; margin: 0 2px 8px; padding: 0 10px; border: 1px solid #d8dde5; border-radius: 8px; font: inherit; font-size: 12.5px;">
      <div style="display: flex; gap: 4px; flex-wrap: wrap; margin: 0 2px 8px;">
        <sc-for list="{{grp.filters}}" as="fl" hint-placeholder-count="3">
          <button type="button" aria-pressed="{{fl.on}}" onClick="{{fl.pick}}" style="height: 24px; padding: 0 8px; border-radius: 12px; border: 1px solid {{fl.line}}; background: {{fl.bg}}; color: {{fl.fg}}; font: inherit; font-size: 11px; font-weight: 600; cursor: pointer;">{{fl.label}} <span style="opacity: 0.7;">{{fl.n}}</span></button>
        </sc-for>
      </div>
      <sc-for list="{{grp.items}}" as="gi" hint-placeholder-count="14">
        <button type="button" class="nv" onClick="{{gi.pick}}" style="display: flex; align-items: center; gap: 8px; padding: 7px 10px; border: 0; border-radius: 8px; background: {{gi.bg}}; color: {{gi.fg}}; font: inherit; text-align: left; cursor: pointer;">
          <span style="display: flex; flex-direction: column; min-width: 0; flex-grow: 1;">
            <span style="font-size: 12.5px; font-weight: {{gi.fw}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{gi.name}}</span>
            <span style="font-size: 10.5px; color: #8b95a6;">{{gi.meta}}</span>
          </span>
          <span title="수정됨 · 미저장" style="display: {{gi.draftDisp}}; width: 8px; height: 8px; border-radius: 50%; background: #2563eb;"></span>
          <span title="저장됨 · 재시작 대기" style="display: {{gi.pendDisp}}; width: 8px; height: 8px; border-radius: 2px; background: #a65f00;"></span>
        </button>
        <div style="display: {{gi.secDisp}}; flex-direction: column; margin: 0 0 6px 10px; padding-left: 8px; border-left: 2px solid #d6e2f8;">
          <sc-for list="{{gi.secs}}" as="sc" hint-placeholder-count="0">
            <button type="button" class="nv" onClick="{{sc.go}}" style="display: flex; justify-content: space-between; gap: 8px; padding: 4px 8px; border: 0; border-radius: 6px; background: transparent; color: #3b4452; font: inherit; font-size: 11.5px; text-align: left; cursor: pointer;"><span>{{sc.t}}</span><span style="color: #a0a8b5;">{{sc.n}}</span></button>
          </sc-for>
        </div>
      </sc-for>
    </aside>

    <main style="flex-grow: 1; min-width: 0; background: #eef1f5; display: flex; flex-direction: column; min-height: 0;">
        <!-- 재시작 대기 배너 — terra.daemon.restart.post (정상 종료 → 서비스 관리자가 다시 띄운다). 두 번 눌러 확인 -->
        <sc-if value="{{pend.show}}" hint-placeholder-val="{{false}}">
          <div style="margin: 12px 20px 0; border-radius: 12px; border: 1px solid #e8c78f; background: #fffaf0; overflow: hidden; flex-shrink: 0;">
            <div style="display: flex; gap: 10px; align-items: flex-start; padding: 11px 14px;">
              <span style="width: 26px; height: 26px; flex-shrink: 0; border-radius: 7px; background: #fbf0cc; color: #8a5a00; display: flex; align-items: center; justify-content: center; font-weight: 700;">↻</span>
              <span style="display: flex; flex-direction: column; gap: 3px; flex-grow: 1; font-size: 12.5px; color: #5a3d00; line-height: 1.6;">
                <b style="font-size: 13.5px; color: #3d2a00;">저장됨 · 재시작 대기 — 키 {{pend.n}}개</b>
                <span>파일에는 썼지만 실행 중인 데몬은 아직 옛 값입니다. <span class="mono" style="font-size: 11.5px;">{{pend.keys}}</span></span>
                <span style="color: #7a5a1a;">오른쪽 단추로 Daemon을 다시 시작합니다(정상 종료 뒤 systemd · 작업 스케줄러 · launchd가 다시 띄운다). 다시 띄울 관리자가 없으면 로컬 기기에서 <code class="mono" style="padding: 1px 6px; border-radius: 5px; background: #16191f; color: #e5e9f0; font-size: 11.5px;">terra daemon restart</code> — 또는 Linux는 systemd, Windows는 서비스 관리자에서 Terra 데몬을 다시 시작하세요.<span style="display: {{pend.helpDisp}};"> 환경 변수(TERRA_DAEMON_*)가 있으면 재시작 뒤 그 값이 이깁니다.</span></span>
              </span>
              <button type="button" data-restart="1" onClick="{{pend.done}}" title="terra.daemon.restart.post — 두 번 눌러 확인" style="height: 28px; padding: 0 10px; flex-shrink: 0; border: 1px solid {{pend.line}}; border-radius: 7px; background: {{pend.bg}}; color: {{pend.fg}}; font: inherit; font-size: 12px; font-weight: 700; cursor: pointer;">{{pend.label}}</button>
            </div>
          </div>
        </sc-if>

      <div style="flex-grow: 1; overflow-y: auto; box-sizing: border-box; padding: 16px 20px 20px;">
        <div style="display: flex; align-items: flex-end; gap: 12px; margin-bottom: 12px;">
          <div style="display: flex; flex-direction: column; gap: 2px;">
            <h2 style="margin: 0; font-size: 18px; font-weight: 700;">{{page.title}}</h2>
            <span style="display: {{page.subDisp}}; font-size: 12.5px; color: #5b6472;">{{page.sub}}</span>
          </div>
          <span style="flex-grow: 1;"></span>
          <sc-for list="{{page.chips}}" as="pc" hint-placeholder-count="0">
            <span title="{{pc.tip}}" style="display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 8px; border-radius: 11px; background: {{pc.bg}}; color: {{pc.fg}}; font-size: 11px; font-weight: 700;">{{pc.t}}</span>
          </sc-for>
        </div>

        <!-- 키 목록 -->
        <sc-if value="{{keys.show}}" hint-placeholder-val="{{true}}">
          <section style="background: #ffffff; border: 1px solid #d8dde5; border-radius: 12px; overflow: hidden;">
            <sc-for list="{{keys.rows}}" as="kr" hint-placeholder-count="8">
              <sc-if value="{{kr.isFold}}" hint-placeholder-val="{{false}}">
                <button type="button" onClick="{{kr.toggle}}" style="width: 100%; display: flex; align-items: center; gap: 8px; padding: 9px 16px; border: 0; border-top: 1px solid #eef1f5; background: #f7f8fb; color: #5b6472; font: inherit; font-size: 12px; text-align: left; cursor: pointer;"><span>{{kr.arrow}}</span>{{kr.text}}</button>
              </sc-if>
              <sc-if value="{{kr.isHead}}" hint-placeholder-val="{{false}}">
                <div id="{{kr.hid}}" style="display: flex; align-items: baseline; gap: 8px; padding: 12px 16px 8px; border-top: 1px solid #e3e7ed; background: #f7f8fb; scroll-margin-top: 8px;"><span style="font-size: 12.5px; font-weight: 700; color: #16191f;">{{kr.text}}</span><span style="font-size: 11px; color: #8b95a6;">{{kr.n}}</span></div>
              </sc-if>
              <sc-if value="{{kr.isKey}}" hint-placeholder-val="{{true}}">
                <div class="kr" style="display: flex; gap: 16px; align-items: flex-start; padding: 11px 16px; border-top: 1px solid #eef1f5; border-left: 3px solid {{kr.edge}}; background: {{kr.bg}};">
                  <div style="display: flex; flex-direction: column; gap: 3px; min-width: 0; flex-grow: 1;">
                    <span style="display: flex; align-items: center; gap: 6px; flex-wrap: wrap;">
                      <span style="font-size: 13px; font-weight: 700; color: {{kr.labelFg}};">{{kr.label}}</span>
                      <span title="{{kr.tip}}" aria-label="도움말: {{kr.tip}}" style="display: {{kr.tipDisp}}; width: 15px; height: 15px; border-radius: 50%; border: 1px solid #c3cad5; color: #8b95a6; font-size: 10px; font-weight: 700; align-items: center; justify-content: center; cursor: help;">i</span>
                      <sc-for list="{{kr.badges}}" as="bd" hint-placeholder-count="2">
                        <span title="{{bd.tip}}" style="display: inline-flex; align-items: center; height: 18px; padding: 0 6px; border-radius: 9px; background: {{bd.bg}}; color: {{bd.fg}}; font-size: 10.5px; font-weight: 700; white-space: nowrap;">{{bd.t}}</span>
                      </sc-for>
                    </span>
                    <span class="mono" style="font-size: 11.5px; color: #5b6472;">{{kr.key}}</span>
                    <span style="display: {{kr.noteDisp}}; font-size: 11.5px; color: {{kr.noteFg}}; line-height: 1.5;">{{kr.note}}</span>
                  </div>
                  <div style="width: 300px; flex-shrink: 0; display: flex; flex-direction: column; align-items: flex-end; gap: 4px;">
                    <sc-if value="{{kr.isToggle}}" hint-placeholder-val="{{false}}">
                      <button type="button" role="switch" aria-label="{{kr.key}}" aria-checked="{{kr.onA}}" onClick="{{kr.flip}}" style="display: inline-flex; align-items: center; gap: 8px; height: 28px; padding: 0 4px 0 10px; border: 1px solid #d8dde5; border-radius: 14px; background: #ffffff; font: inherit; font-size: 12px; color: #3a4049; cursor: pointer;">{{kr.onText}}<span style="position: relative; width: 36px; height: 20px; border-radius: 10px; background: {{kr.track}}; transition: background 140ms;"><span style="position: absolute; top: 2px; left: {{kr.knob}}; width: 16px; height: 16px; border-radius: 50%; background: #ffffff; box-shadow: 0 1px 2px rgba(22,25,31,0.3); transition: left 140ms;"></span></span></button>
                    </sc-if>
                    <sc-if value="{{kr.isSelect}}" hint-placeholder-val="{{false}}">
                      <select onChange="{{kr.set}}" aria-label="{{kr.key}}" class="mono" style="height: 30px; min-width: 150px; box-sizing: border-box; padding: 0 8px; border: 1px solid {{kr.line}}; border-radius: 7px; background: #ffffff; font-size: 12.5px; color: #16191f;">
                        <sc-for list="{{kr.opts}}" as="op" hint-placeholder-count="3">
                          <option value="{{op.v}}" selected="{{op.sel}}">{{op.v}}</option>
                        </sc-for>
                      </select>
                    </sc-if>
                    <sc-if value="{{kr.isInput}}" hint-placeholder-val="{{false}}">
                      <input type="text" value="{{kr.val}}" onChange="{{kr.set}}" aria-label="{{kr.key}}" placeholder="{{kr.ph}}" class="mono" style="height: 30px; width: {{kr.w}}; box-sizing: border-box; padding: 0 9px; border: 1px solid {{kr.line}}; border-radius: 7px; font-size: 12.5px; color: #16191f; text-align: {{kr.align}};">
                    </sc-if>
                    <sc-if value="{{kr.isMulti}}" hint-placeholder-val="{{false}}">
                      <div style="display: flex; gap: 4px;">
                        <sc-for list="{{kr.chips}}" as="ch" hint-placeholder-count="3">
                          <button type="button" aria-pressed="{{ch.on}}" onClick="{{ch.pick}}" class="mono" style="height: 26px; padding: 0 9px; border-radius: 13px; border: 1px solid {{ch.line}}; background: {{ch.bg}}; color: {{ch.fg}}; font-size: 11.5px; cursor: pointer;">{{ch.v}}</button>
                        </sc-for>
                      </div>
                    </sc-if>
                    <sc-if value="{{kr.isRO}}" hint-placeholder-val="{{false}}">
                      <span class="mono" title="{{kr.roTip}}" style="max-width: 300px; display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 7px; background: #f4f6f9; border: 1px dashed #d8dde5; color: #3a4049; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;"><span style="font-family: inherit; color: #8b95a6;">{{kr.roIcon}}</span>{{kr.val}}</span>
                    </sc-if>
                    <span style="display: {{kr.subDisp}}; font-size: 11px; color: {{kr.subFg}}; text-align: right;">{{kr.sub}}</span>
                    <span style="display: {{kr.actDisp}};"><button type="button" onClick="{{kr.act}}" style="height: 22px; padding: 0 8px; border: 1px solid #d8dde5; border-radius: 6px; background: #ffffff; color: #3a4049; font: inherit; font-size: 11px; cursor: pointer;">{{kr.actLabel}}</button></span>
                  </div>
                </div>
              </sc-if>
            </sc-for>
            <sc-if value="{{keys.empty}}" hint-placeholder-val="{{false}}">
              <div style="padding: 28px; text-align: center; color: #8b95a6; font-size: 12.5px;">맞는 키가 없습니다</div>
            </sc-if>
          </section>
        </sc-if>

        <!-- 카드 (다른 탭) -->
        <div style="display: grid; grid-template-columns: repeat(12, 1fr); gap: 12px; align-items: start;">
          <sc-for list="{{cards}}" as="cd" hint-placeholder-count="0">
            <section style="grid-column: span {{cd.span}}; background: #ffffff; border: 1px solid #d8dde5; border-radius: 12px; overflow: hidden; min-width: 0;">
              <div style="display: {{cd.headDisp}}; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid #eef1f5; flex-wrap: wrap;">
                <h3 style="margin: 0; font-size: 13.5px; font-weight: 700;">{{cd.title}}</h3>
                <span style="display: {{cd.subDisp}}; font-size: 11.5px; color: #5b6472;">{{cd.sub}}</span>
                <span style="flex-grow: 1;"></span>
                <sc-for list="{{cd.acts}}" as="ac" hint-placeholder-count="0">
                  <button type="button" onClick="{{ac.run}}" title="{{ac.tip}}" aria-disabled="{{ac.dis}}" style="height: 28px; padding: 0 11px; border: 1px solid {{ac.line}}; border-radius: 7px; background: {{ac.bg}}; color: {{ac.fg}}; font: inherit; font-size: 12px; font-weight: 600; cursor: {{ac.cur}}; opacity: {{ac.op}};">{{ac.label}}</button>
                </sc-for>
              </div>
              <sc-for list="{{cd.rows}}" as="rw" hint-placeholder-count="0">
                <div class="kr" style="display: flex; gap: 12px; align-items: center; padding: 10px 14px; border-top: 1px solid #f1f3f6; opacity: {{rw.op}};">
                  <span style="display: flex; flex-direction: column; gap: 2px; min-width: 0; flex-grow: 1;">
                    <span style="display: flex; align-items: center; gap: 6px; flex-wrap: wrap;"><span class="{{rw.cls}}" style="font-size: 13px; font-weight: 700;">{{rw.t}}</span>
                      <sc-for list="{{rw.badges}}" as="bd" hint-placeholder-count="0">
                        <span title="{{bd.tip}}" style="display: inline-flex; align-items: center; height: 18px; padding: 0 6px; border-radius: 9px; background: {{bd.bg}}; color: {{bd.fg}}; font-size: 10.5px; font-weight: 700;">{{bd.t}}</span>
                      </sc-for>
                    </span>
                    <span style="display: {{rw.dDisp}}; font-size: 11.5px; color: #5b6472; line-height: 1.5;">{{rw.d}}</span>
                  </span>
                  <span class="{{rw.vcls}}" style="font-size: 12.5px; color: {{rw.vc}}; white-space: nowrap;">{{rw.v}}</span>
                  <sc-for list="{{rw.btns}}" as="bt" hint-placeholder-count="0">
                    <button type="button" onClick="{{bt.run}}" title="{{bt.tip}}" aria-disabled="{{bt.dis}}" style="height: 26px; padding: 0 10px; flex-shrink: 0; border: 1px solid {{bt.line}}; border-radius: 6px; background: {{bt.bg}}; color: {{bt.fg}}; font: inherit; font-size: 11.5px; font-weight: 600; cursor: {{bt.cur}}; opacity: {{bt.op}};">{{bt.label}}</button>
                  </sc-for>
                </div>
              </sc-for>
              <sc-if value="{{cd.showText}}" hint-placeholder-val="{{false}}">
                <div style="padding: {{cd.textPad}}; font-size: 12.5px; color: #3a4049; line-height: 1.7; text-align: {{cd.textAlign}};">
                  <div style="display: {{cd.iconDisp}}; justify-content: center; margin-bottom: 8px;"><span style="width: 46px; height: 46px; border-radius: 12px; background: {{cd.iconBg}}; display: flex; align-items: center; justify-content: center; font-size: 21px;">{{cd.icon}}</span></div>
                  <div style="display: {{cd.bigDisp}}; font-size: 15px; font-weight: 700; color: #16191f; margin-bottom: 4px;">{{cd.big}}</div>
                  {{cd.text}}
                </div>
              </sc-if>
              <sc-if value="{{cd.hasCode}}" hint-placeholder-val="{{false}}">
                <div style="display: flex; flex-direction: column; gap: 6px; padding: 0 14px 14px;">
                  <sc-for list="{{cd.code}}" as="cl" hint-placeholder-count="0">
                    <div style="display: flex; gap: 10px; align-items: center; font-size: 12px;"><code class="mono" style="flex-shrink: 0; padding: 5px 9px; border-radius: 6px; background: #16191f; color: #e5e9f0; font-size: 11.5px;">{{cl.c}}</code><span style="color: #5b6472;">{{cl.d}}</span></div>
                  </sc-for>
                </div>
              </sc-if>
            </section>
          </sc-for>
        </div>
      </div>

      <!-- 저장 막대 (로컬 노드) — 초안은 GUI가 들고 있다. 선행 키 → *.enabled 순서로 PATCH를 나눠 보낸다 -->
      <div style="display: {{bar.disp}}; flex-shrink: 0; align-items: center; gap: 12px; padding: 10px 20px; border-top: 1px solid #d8dde5; background: #ffffff; box-shadow: 0 -4px 14px rgba(22,25,31,0.06);">
        <span style="width: 9px; height: 9px; border-radius: 50%; background: {{bar.dot}};"></span>
        <span style="display: flex; flex-direction: column; gap: 1px; min-width: 0; flex-grow: 1;">
          <b style="font-size: 13px; color: {{bar.fg}};">{{bar.title}}</b>
          <span class="mono" style="font-size: 11px; color: #5b6472; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{bar.order}}</span>
        </span>
        <button type="button" onClick="{{bar.discard}}" style="height: 32px; padding: 0 14px; border: 1px solid #d8dde5; border-radius: 7px; background: #ffffff; color: #16191f; font: inherit; font-size: 13px; cursor: pointer;">되돌리기</button>
        <button type="button" onClick="{{bar.save}}" aria-disabled="{{bar.dis}}" style="height: 32px; padding: 0 16px; border: 1px solid {{bar.btnLine}}; border-radius: 7px; background: {{bar.btnBg}}; color: #ffffff; font: inherit; font-size: 13px; font-weight: 600; cursor: {{bar.cur}}; opacity: {{bar.op}}; display: inline-flex; align-items: center; gap: 6px;"><span class="{{bar.spin}}">{{bar.g}}</span>{{bar.saveLabel}}</button>
      </div>
    </main>
  </div>

  <sc-if value="{{dlg.open}}" hint-placeholder-val="{{false}}">
    <div style="position: absolute; inset: 0; z-index: 30; background: rgba(22,25,31,0.32); display: flex; align-items: center; justify-content: center;">
      <div class="pop" role="alertdialog" aria-label="{{dlg.title}}" style="width: 480px; box-sizing: border-box; background: #ffffff; border-radius: 14px; box-shadow: 0 20px 50px rgba(22,25,31,0.28); overflow: hidden;">
        <div style="display: flex; gap: 12px; padding: 18px 20px 12px;">
          <span style="width: 38px; height: 38px; flex-shrink: 0; border-radius: 10px; background: #fde1e5; color: #d33d52; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 700;">!</span>
          <span style="display: flex; flex-direction: column; gap: 3px;"><span style="font-size: 15px; font-weight: 700;">{{dlg.title}}</span><span class="mono" style="font-size: 11.5px; color: #5b6472;">{{dlg.op}}</span></span>
        </div>
        <div style="display: flex; flex-direction: column; gap: 6px; padding: 0 20px 14px;">
          <sc-for list="{{dlg.rows}}" as="dr" hint-placeholder-count="3">
            <div style="display: flex; gap: 12px; align-items: baseline; font-size: 12.5px;"><span class="mono" style="color: #5b6472; font-size: 12px;">{{dr.k}}</span><span style="flex-grow: 1; border-bottom: 1px dotted #d8dde5;"></span><span class="mono" style="font-weight: 700;">{{dr.v}}</span></div>
          </sc-for>
          <div style="margin-top: 4px; padding: 8px 10px; border-radius: 8px; background: #fbf0cc; color: #7a4a06; font-size: 12px; line-height: 1.6;">{{dlg.warn}}</div>
        </div>
        <div style="display: flex; justify-content: flex-end; gap: 6px; padding: 12px 20px; border-top: 1px solid #eef1f5; background: #fbfcfd;">
          <button type="button" onClick="{{dlg.cancel}}" style="height: 32px; padding: 0 14px; border: 1px solid #d8dde5; border-radius: 7px; background: #ffffff; color: #16191f; font: inherit; font-size: 13px; cursor: pointer;">취소</button>
          <button type="button" onClick="{{dlg.ok}}" style="height: 32px; padding: 0 14px; border: 1px solid #d33d52; border-radius: 7px; background: #d33d52; color: #ffffff; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer;">{{dlg.okLabel}}</button>
        </div>
      </div>
    </div>
  </sc-if>

  <div aria-live="polite" style="position: absolute; right: 18px; bottom: 70px; z-index: 20; display: flex; flex-direction: column; gap: 6px; width: 400px;">
    <sc-for list="{{toasts}}" as="ts" hint-placeholder-count="0">
      <div class="pop" style="display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 10px; background: #ffffff; border: 1px solid #d8dde5; border-left: 4px solid {{ts.c}}; box-shadow: 0 8px 24px rgba(22,25,31,0.14); font-size: 12.5px; line-height: 1.55;">
        <span style="color: {{ts.c}}; font-weight: 700;">{{ts.g}}</span>
        <span style="flex-grow: 1;"><b>{{ts.title}}</b><br><span style="color: #5b6472;">{{ts.text}}</span></span>
      </div>
    </sc-for>
  </div>
</div>
</script>
<script type="module">
import './src/api/frame-boot.js';   // 첫 import — Terra 안이면 마운트보다 먼저 frame에 hello를 보낸다
import { mount, fit } from './src/runtime/dc.js';
import Screen from './src/screens/settings.js';
import * as Boot from './src/boot/module.js';
const stage = document.getElementById('stage');
const View = (Boot.prep && Boot.prep('settings', Screen)) || Screen;   // 프로필이 예시를 지운 클래스를 돌려주면 그것을 띄운다
window.__screen = mount(View, { template: document.getElementById('view').textContent, target: stage, props: {} });
fit(stage, 1440, 900);
Boot.boot && Boot.boot('settings', window.__screen);
</script>
</body>
</html>
