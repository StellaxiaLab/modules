<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Terra · 설정</title>
<style>
body{margin:0;font-family: 'Noto Sans KR','Noto Sans CJK KR',system-ui,sans-serif;background:#07090c;color-scheme:dark}
a{color:#b4bac3}a:hover{color:#ede9e1}
*{scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.18) transparent}
*::-webkit-scrollbar{width:8px;height:8px}
*::-webkit-scrollbar-thumb{background:rgba(255,255,255,.16);border-radius:4px}
*::-webkit-scrollbar-track{background:transparent}
::selection{background:rgba(255,216,77,.35)}
:focus-visible{outline:2px solid #ffd84d;outline-offset:2px}
select option{background:#15181d;color:#ede9e1}
input::placeholder{color:#6b7280}
button{transition:background 140ms,border-color 140ms,color 140ms,filter 140ms}
.ghost:hover{background:rgba(255,255,255,.09)!important;border-color:rgba(255,255,255,.28)!important}
.pri:hover{background:#ffffff!important}
.tg:hover{color:#ede9e1}
.cd:not(:has(> :not([style*="display: none"]))){display:none}
.mono{font-family: 'JetBrains Mono',ui-monospace,'DejaVu Sans Mono',Consolas,Menlo,monospace}
.nv:hover{background:rgba(255,255,255,.05)}
.kr:hover{background:rgba(255,255,255,.025)}
@keyframes pop{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.pop{animation:pop 180ms cubic-bezier(.2,.8,.3,1) both}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{display:inline-block;animation:spin 900ms linear infinite}
</style>
<style>
html,body{margin:0;background:#dfe3ea}
.frame{margin:12px auto;overflow:hidden;box-shadow:0 6px 24px rgba(22,25,31,0.16);border-radius:6px}
#stage{width:1440px;height:900px;transform-origin:0 0;background:#ffffff}
</style>
</head>
<body>
<div class="frame"><div id="stage"></div></div>
<script type="text/x-template" id="view">
<svg aria-hidden="true" width="0" height="0" style="position: absolute; width: 0; height: 0; overflow: hidden;"><defs><symbol id="s-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></symbol><symbol id="s-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></symbol><symbol id="s-cpu" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1"/><path d="M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4"/></symbol><symbol id="s-box" viewBox="0 0 24 24"><path d="M3 7l9-4 9 4v10l-9 4-9-4z"/><path d="M3 7l9 4 9-4M12 11v10"/></symbol><symbol id="s-tree" viewBox="0 0 24 24"><path d="M12 21v-7"/><path d="M12 3a6 6 0 0 0-5 9h10a6 6 0 0 0-5-9z"/></symbol><symbol id="s-archive" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="5" rx="1"/><path d="M5 9v11h14V9M10 13h4"/></symbol><symbol id="s-warn" viewBox="0 0 24 24"><path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18v.01"/></symbol><symbol id="s-key" viewBox="0 0 24 24"><circle cx="8" cy="14" r="4"/><path d="M11 11l9-9M16 6l3 3M14 8l2 2"/></symbol><symbol id="s-link" viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></symbol><symbol id="s-lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></symbol><symbol id="s-shield" viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/></symbol><symbol id="s-down" viewBox="0 0 24 24"><path d="M12 5v14M5 12l7 7 7-7"/></symbol><symbol id="s-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.01"/></symbol><symbol id="s-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></symbol><symbol id="s-rotate" viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.3-5.7M4 4v5h5"/></symbol><symbol id="s-back" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></symbol><symbol id="s-loader" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9"/></symbol><symbol id="s-check" viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></symbol><symbol id="s-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol><symbol id="s-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol></defs></svg>
<!-- 설정 화면 — 입력: terra-gui-settings (설정 저장 위치 6종). 탭은 관측으로 연다(catalog) · 키 한 줄의 상태 9가지(§8.2) · 데이터는 이 노드의 게이트웨이에서 읽는다(src/data/settings-live.js) -->
<div style="position: relative; width: 1440px; height: 900px; display: flex; flex-direction: column; background: radial-gradient(1100px 520px at 12% -12%, #18202b 0%, rgba(24,32,43,0) 60%), radial-gradient(900px 600px at 100% 110%, #10161d 0%, rgba(16,22,29,0) 60%), #0b0d11; color: #ede9e1; color-scheme: dark; font-family: 'Noto Sans KR','Noto Sans CJK KR',system-ui,sans-serif; font-size: 14px; line-height: 1.55; overflow: hidden;">

  <header style="height: 54px; flex-shrink: 0; box-sizing: border-box; padding: 0 16px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid rgba(255,255,255,0.10); background: rgba(15,17,21,0.92); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);">
    <a href="node.html" class="tg" style="display: inline-flex; align-items: center; gap: 4px; height: 28px; padding: 0 9px 0 5px; border-radius: 8px; font-size: 12.5px; color: #9aa1ab; text-decoration: none; border: 1px solid rgba(255,255,255,0.10);"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" style="flex-shrink: 0; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;"><use href="#s-back"></use></svg> 노드 화면</a>
    <h1 style="margin: 0; display: inline-flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600; color: #ede9e1;"><svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true" style="flex-shrink: 0; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;"><use href="#s-gear"></use></svg>설정</h1>
    <span title="{{hdr.gwTip}}" style="display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 9px; border-radius: 11px; background: {{hdr.roleBg}}; color: {{hdr.roleFg}}; border: 1px solid color-mix(in srgb, {{hdr.roleFg}} 50%, transparent); font-size: 11.5px; font-weight: 600;"><span style="width: 7px; height: 7px; border-radius: 50%; background: {{hdr.roleDot}}; box-shadow: 0 0 6px {{hdr.roleDot}};"></span>{{hdr.roleText}}</span>
    <span class="mono" style="font-size: 11.5px; color: #9aa1ab;">{{hdr.who}}</span>
    <span style="flex-grow: 1;"></span>
    <span title="node.config★는 기본 권한 밖 — 관리자도 명시해야 열린다" style="display: inline-flex; align-items: center; gap: 6px; height: 30px; box-sizing: border-box; padding: 0 11px; border: 1px solid {{hdr.permLine}}; border-radius: 9px; background: {{hdr.permBg}}; color: {{hdr.permFg}}; font-size: 12px; font-weight: 600;"><svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true" style="flex-shrink: 0; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;"><use href="#s-key"></use></svg>{{hdr.permLabel}}</span>
  </header>

  <div style="flex-grow: 1; display: flex; min-height: 0;">
    <!-- 탭 여섯 (§8.1) — 카탈로그에 필요한 operation이 있을 때만 선다 -->
    <nav aria-label="설정 탭" style="width: 216px; flex-shrink: 0; box-sizing: border-box; border-right: 1px solid rgba(255,255,255,0.10); background: rgba(13,15,19,0.55); padding: 12px 10px; display: flex; flex-direction: column; gap: 4px;">
      <sc-for list="{{tabs}}" as="tb" hint-placeholder-count="6">
        <button type="button" class="nv" aria-current="{{tb.cur}}" onClick="{{tb.pick}}" style="display: flex; gap: 10px; align-items: flex-start; padding: 9px 10px; border: 1px solid {{tb.ring}}; border-radius: 12px; background: {{tb.bg}}; color: {{tb.fg}}; font: inherit; text-align: left; cursor: pointer;">
          <span aria-hidden="true" style="width: 30px; height: 30px; flex-shrink: 0; box-sizing: border-box; border-radius: 9px; background: {{tb.tint}}; border: 1px solid {{tb.tintLine}}; color: {{tb.ic}}; display: flex; align-items: center; justify-content: center; filter: {{tb.gray}};"><svg viewBox="0 0 24 24" width="16" height="16" style="fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;"><use href="#s-{{tb.icon}}"></use></svg></span>
          <span style="display: flex; flex-direction: column; gap: 1px; min-width: 0;">
            <span style="display: flex; align-items: center; gap: 6px;"><span style="font-size: 13px; font-weight: 700;">{{tb.label}}</span><span class="mono" style="font-size: 10px; font-weight: 600; color: {{tb.roleFg}}; border: 1px solid {{tb.roleLine}}; border-radius: 5px; padding: 0 4px; line-height: 15px;">{{tb.role}}</span><span class="mono" style="display: {{tb.dotDisp}}; min-width: 16px; height: 16px; box-sizing: border-box; padding: 0 4px; border-radius: 8px; background: #f5b83d; color: #111111; font-size: 10px; font-weight: 700; line-height: 16px; text-align: center;">{{tb.dot}}</span></span>
            <span style="display: {{tb.subDisp}}; font-size: 11px; color: {{tb.subFg}}; line-height: 1.45;">{{tb.sub}}</span>
          </span>
        </button>
      </sc-for>
      <div style="display: {{helpBox}}; margin-top: auto; padding: 11px 12px; border-radius: 12px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); font-size: 11px; color: #9aa1ab; line-height: 1.6;">
        <b style="color: #ede9e1;">설정 저장 위치 6종</b><br>GUI 환경설정 · 계정 · 로컬 노드 설정 · 로컬 자원 · 클러스터 정책 · tree 서버 설정. 층마다 저장되는 곳과 쓰는 길이 다르다.
      </div>
    </nav>

    <!-- 로컬 노드: 6분류 목록 (분류 안에 섹션) -->
    <aside style="display: {{grp.disp}}; width: 228px; flex-shrink: 0; box-sizing: border-box; border-right: 1px solid rgba(255,255,255,0.10); background: rgba(255,255,255,0.015); padding: 12px 8px; flex-direction: column; gap: 2px; overflow-y: auto;">
      <span style="position: relative; display: flex; flex-shrink: 0; margin: 0 2px 8px; color: #6b7280;"><span style="position: absolute; left: 10px; top: 9px; display: flex; pointer-events: none;"><svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true" style="flex-shrink: 0; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;"><use href="#s-search"></use></svg></span><input type="text" value="{{grp.q}}" onChange="{{grp.setQ}}" placeholder="키 · 뜻 찾기" aria-label="설정 키 찾기" style="flex-grow: 1; min-width: 0; height: 34px; box-sizing: border-box; padding: 0 10px 0 32px; border: 1px solid rgba(255,255,255,0.18); border-radius: 9px; background: #0e1013; color: #ede9e1; font: inherit; font-size: 12.5px; outline: none;"></span>
      <div style="display: flex; gap: 4px; flex-wrap: wrap; margin: 0 2px 8px;">
        <sc-for list="{{grp.filters}}" as="fl" hint-placeholder-count="3">
          <button type="button" aria-pressed="{{fl.on}}" onClick="{{fl.pick}}" style="height: 24px; padding: 0 9px; border-radius: 12px; border: 1px solid {{fl.line}}; background: {{fl.bg}}; color: {{fl.fg}}; font: inherit; font-size: 11px; font-weight: 600; cursor: pointer;">{{fl.label}} <span class="mono" style="opacity: 0.7; font-size: 10.5px;">{{fl.n}}</span></button>
        </sc-for>
      </div>
      <sc-for list="{{grp.items}}" as="gi" hint-placeholder-count="14">
        <button type="button" class="nv" onClick="{{gi.pick}}" style="display: flex; align-items: center; gap: 8px; padding: 8px 10px; border: 1px solid {{gi.ring}}; border-radius: 10px; background: {{gi.bg}}; color: {{gi.fg}}; font: inherit; text-align: left; cursor: pointer;">
          <span style="display: flex; flex-direction: column; min-width: 0; flex-grow: 1;">
            <span style="font-size: 12.5px; font-weight: {{gi.fw}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{gi.name}}</span>
            <span style="font-size: 10.5px; color: #9aa1ab;">{{gi.meta}}</span>
          </span>
          <span title="수정됨 · 미저장" style="display: {{gi.draftDisp}}; width: 8px; height: 8px; border-radius: 50%; background: #ede9e1;"></span>
          <span title="저장됨 · 재시작 대기" style="display: {{gi.pendDisp}}; width: 8px; height: 8px; border-radius: 2px; background: #f5b83d;"></span>
        </button>
        <div style="display: {{gi.secDisp}}; flex-direction: column; margin: 0 0 6px 10px; padding-left: 8px; border-left: 1px solid rgba(255,255,255,0.12);">
          <sc-for list="{{gi.secs}}" as="sc" hint-placeholder-count="0">
            <button type="button" class="nv" onClick="{{sc.go}}" style="display: flex; justify-content: space-between; gap: 8px; padding: 4px 8px; border: 0; border-radius: 6px; background: transparent; color: #b4bac3; font: inherit; font-size: 11.5px; text-align: left; cursor: pointer;"><span>{{sc.t}}</span><span class="mono" style="color: #6b7280; font-size: 10.5px;">{{sc.n}}</span></button>
          </sc-for>
        </div>
      </sc-for>
    </aside>

    <main style="flex-grow: 1; min-width: 0; background: transparent; display: flex; flex-direction: column; min-height: 0;">
        <!-- 재시작 대기 배너 — terra.daemon.restart.post (정상 종료 → 서비스 관리자가 다시 띄운다). 두 번 눌러 확인 -->
        <sc-if value="{{pend.show}}" hint-placeholder-val="{{false}}">
          <div style="margin: 12px 20px 0; border-radius: 12px; border: 1px solid rgba(245,184,61,0.35); background: rgba(245,184,61,0.07); overflow: hidden; flex-shrink: 0;">
            <div style="display: flex; gap: 10px; align-items: flex-start; padding: 11px 14px;">
              <span style="width: 28px; height: 28px; flex-shrink: 0; border-radius: 8px; background: rgba(245,184,61,0.14); color: #f5b83d; display: flex; align-items: center; justify-content: center;"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" style="flex-shrink: 0; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;"><use href="#s-rotate"></use></svg></span>
              <span style="display: flex; flex-direction: column; gap: 3px; flex-grow: 1; font-size: 12.5px; color: #c9c3b6; line-height: 1.6;">
                <b style="font-size: 13.5px; color: #f5c76a;">저장됨 · 재시작 대기 — 키 {{pend.n}}개</b>
                <span>파일에는 썼지만 실행 중인 데몬은 아직 옛 값입니다. <span class="mono" style="font-size: 11.5px;">{{pend.keys}}</span></span>
                <span style="color: #d7b271;">오른쪽 단추로 Daemon을 다시 시작합니다(정상 종료 뒤 systemd · 작업 스케줄러 · launchd가 다시 띄운다). 다시 띄울 관리자가 없으면 로컬 기기에서 <code class="mono" style="padding: 1px 6px; border-radius: 5px; background: #ede9e1; color: #111111; font-size: 11.5px;">terra daemon restart</code> — 또는 Linux는 systemd, Windows는 서비스 관리자에서 Terra 데몬을 다시 시작하세요.<span style="display: {{pend.helpDisp}};"> 환경 변수(TERRA_DAEMON_*)가 있으면 재시작 뒤 그 값이 이깁니다.</span></span>
              </span>
              <button type="button" data-restart="1" onClick="{{pend.done}}" title="terra.daemon.restart.post — 두 번 눌러 확인" style="height: 28px; padding: 0 10px; flex-shrink: 0; border: 1px solid {{pend.line}}; border-radius: 8px; background: {{pend.bg}}; color: {{pend.fg}}; font: inherit; font-size: 12px; font-weight: 700; cursor: pointer;">{{pend.label}}</button>
            </div>
          </div>
        </sc-if>

      <div style="flex-grow: 1; overflow-y: auto; box-sizing: border-box; padding: 16px 20px 20px;">
        <div style="display: flex; align-items: flex-end; gap: 12px; margin-bottom: 12px;">
          <div style="display: flex; flex-direction: column; gap: 2px;">
            <h2 style="margin: 0; font-size: 19px; font-weight: 700; color: #ede9e1; letter-spacing: -0.01em;">{{page.title}}</h2>
            <span class="mono" style="display: {{page.subDisp}}; font-size: 11.5px; color: #9aa1ab;">{{page.sub}}</span>
          </div>
          <span style="flex-grow: 1;"></span>
          <sc-for list="{{page.chips}}" as="pc" hint-placeholder-count="0">
            <span title="{{pc.tip}}" style="display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 8px; border-radius: 10px; background: {{pc.bg}}; color: {{pc.fg}}; border: 1px solid color-mix(in srgb, {{pc.fg}} 50%, transparent); font-size: 11px; font-weight: 600;">{{pc.t}}</span>
          </sc-for>
        </div>

        <!-- 키 목록 -->
        <sc-if value="{{keys.show}}" hint-placeholder-val="{{true}}">
          <section style="background: rgba(13,15,19,0.70); border: 1px solid rgba(255,255,255,0.10); border-radius: 14px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.30);">
            <sc-for list="{{keys.rows}}" as="kr" hint-placeholder-count="8">
              <sc-if value="{{kr.isFold}}" hint-placeholder-val="{{false}}">
                <button type="button" onClick="{{kr.toggle}}" style="width: 100%; display: flex; align-items: center; gap: 8px; padding: 9px 16px; border: 0; border-top: 1px solid rgba(255,255,255,0.07); background: rgba(255,255,255,0.025); color: #9aa1ab; font: inherit; font-size: 12px; text-align: left; cursor: pointer;"><span style="color: #6b7280;">{{kr.arrow}}</span>{{kr.text}}</button>
              </sc-if>
              <sc-if value="{{kr.isHead}}" hint-placeholder-val="{{false}}">
                <div id="{{kr.hid}}" style="display: flex; align-items: baseline; gap: 8px; padding: 12px 16px 8px; border-top: 1px solid rgba(255,255,255,0.07); background: rgba(255,255,255,0.035); scroll-margin-top: 8px;"><span style="font-size: 12.5px; font-weight: 700; color: #ede9e1;">{{kr.text}}</span><span class="mono" style="font-size: 10.5px; color: #9aa1ab;">{{kr.n}}</span></div>
              </sc-if>
              <sc-if value="{{kr.isKey}}" hint-placeholder-val="{{true}}">
                <div class="kr" style="display: flex; gap: 16px; align-items: flex-start; padding: 12px 16px; border-top: 1px solid rgba(255,255,255,0.07); border-left: 3px solid {{kr.edge}}; background: {{kr.bg}};">
                  <div style="display: flex; flex-direction: column; gap: 3px; min-width: 0; flex-grow: 1;">
                    <span style="display: flex; align-items: center; gap: 6px; flex-wrap: wrap;">
                      <span style="font-size: 13px; font-weight: 700; color: {{kr.labelFg}};">{{kr.label}}</span>
                      <span title="{{kr.tip}}" aria-label="도움말: {{kr.tip}}" style="display: {{kr.tipDisp}}; width: 16px; height: 16px; color: #6b7280; align-items: center; justify-content: center; cursor: help;"><svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true" style="flex-shrink: 0; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;"><use href="#s-info"></use></svg></span>
                      <sc-for list="{{kr.badges}}" as="bd" hint-placeholder-count="2">
                        <span title="{{bd.tip}}" style="display: inline-flex; align-items: center; height: 20px; padding: 0 8px; box-sizing: border-box; border-radius: 10px; background: {{bd.bg}}; color: {{bd.fg}}; border: 1px solid color-mix(in srgb, {{bd.fg}} 50%, transparent); font-size: 10.5px; font-weight: 600; white-space: nowrap;">{{bd.t}}</span>
                      </sc-for>
                    </span>
                    <span class="mono" style="font-size: 11.5px; color: #9aa1ab;">{{kr.key}}</span>
                    <span style="display: {{kr.noteDisp}}; font-size: 11.5px; color: {{kr.noteFg}}; line-height: 1.5;">{{kr.note}}</span>
                  </div>
                  <div style="width: 300px; flex-shrink: 0; display: flex; flex-direction: column; align-items: flex-end; gap: 4px;">
                    <sc-if value="{{kr.isToggle}}" hint-placeholder-val="{{false}}">
                      <button type="button" role="switch" aria-label="{{kr.key}}" aria-checked="{{kr.onA}}" onClick="{{kr.flip}}" class="ghost" style="display: inline-flex; align-items: center; gap: 8px; height: 30px; padding: 0 5px 0 11px; border: 1px solid rgba(255,255,255,0.18); border-radius: 15px; background: rgba(255,255,255,0.04); font: inherit; font-size: 12px; color: #b4bac3; cursor: pointer;">{{kr.onText}}<span style="position: relative; width: 36px; height: 20px; box-sizing: border-box; border-radius: 10px; background: {{kr.track}}; border: 1px solid rgba(255,255,255,0.14); transition: background 260ms;"><span style="position: absolute; top: 1px; left: {{kr.knob}}; width: 16px; height: 16px; border-radius: 50%; background: {{kr.knobC}}; box-shadow: 0 1px 2px rgba(0,0,0,0.5); transition: left 260ms cubic-bezier(.34,1.56,.64,1), background 260ms;"></span></span></button>
                    </sc-if>
                    <sc-if value="{{kr.isSelect}}" hint-placeholder-val="{{false}}">
                      <select onChange="{{kr.set}}" aria-label="{{kr.key}}" class="mono" style="height: 34px; min-width: 150px; box-sizing: border-box; padding: 0 9px; border: 1px solid {{kr.line}}; border-radius: 9px; background: #0e1013; font-size: 12.5px; color: #ede9e1; outline: none;">
                        <sc-for list="{{kr.opts}}" as="op" hint-placeholder-count="3">
                          <option value="{{op.v}}" selected="{{op.sel}}">{{op.v}}</option>
                        </sc-for>
                      </select>
                    </sc-if>
                    <sc-if value="{{kr.isInput}}" hint-placeholder-val="{{false}}">
                      <input type="text" value="{{kr.val}}" onChange="{{kr.set}}" aria-label="{{kr.key}}" placeholder="{{kr.ph}}" class="mono" style="height: 34px; width: {{kr.w}}; box-sizing: border-box; padding: 0 11px; border: 1px solid {{kr.line}}; border-radius: 9px; background: #0e1013; font-size: 12.5px; color: #ede9e1; text-align: {{kr.align}}; outline: none;">
                    </sc-if>
                    <sc-if value="{{kr.isMulti}}" hint-placeholder-val="{{false}}">
                      <div style="display: flex; gap: 4px;">
                        <sc-for list="{{kr.chips}}" as="ch" hint-placeholder-count="3">
                          <button type="button" aria-pressed="{{ch.on}}" onClick="{{ch.pick}}" class="mono" style="height: 26px; padding: 0 9px; border-radius: 13px; border: 1px solid {{ch.line}}; background: {{ch.bg}}; color: {{ch.fg}}; font-size: 11.5px; cursor: pointer;">{{ch.v}}</button>
                        </sc-for>
                      </div>
                    </sc-if>
                    <sc-if value="{{kr.isRO}}" hint-placeholder-val="{{false}}">
                      <span class="mono" title="{{kr.roTip}}" style="max-width: 300px; box-sizing: border-box; display: inline-flex; align-items: center; gap: 7px; height: 30px; padding: 0 12px 0 10px; border-radius: 15px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.14); color: #b4bac3; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;"><svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true" style="flex-shrink: 0; color: #6b7280; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;"><use href="#s-{{kr.roIcon}}"></use></svg>{{kr.val}}</span>
                    </sc-if>
                    <span style="display: {{kr.subDisp}}; font-size: 11px; color: {{kr.subFg}}; text-align: right;">{{kr.sub}}</span>
                    <span style="display: {{kr.actDisp}};"><button type="button" onClick="{{kr.act}}" class="ghost" style="height: 24px; padding: 0 9px; border: 1px solid rgba(255,255,255,0.18); border-radius: 7px; background: rgba(255,255,255,0.04); color: #b4bac3; font: inherit; font-size: 11px; cursor: pointer;">{{kr.actLabel}}</button></span>
                  </div>
                </div>
              </sc-if>
            </sc-for>
            <sc-if value="{{keys.empty}}" hint-placeholder-val="{{false}}">
              <div style="padding: 36px; display: flex; flex-direction: column; align-items: center; gap: 8px; color: #9aa1ab; font-size: 12.5px;"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" style="flex-shrink: 0; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;"><use href="#s-search"></use></svg>맞는 키가 없습니다</div>
            </sc-if>
          </section>
        </sc-if>

        <!-- 카드 (다른 탭) -->
        <div style="display: grid; grid-template-columns: repeat(12, 1fr); gap: 12px; align-items: start;">
          <sc-for list="{{cards}}" as="cd" hint-placeholder-count="0">
            <section class="cd" style="grid-column: span {{cd.span}}; background: rgba(13,15,19,0.70); border: 1px solid rgba(255,255,255,0.10); border-radius: 14px; overflow: hidden; min-width: 0; box-shadow: 0 10px 30px rgba(0,0,0,0.30);">
              <div style="display: {{cd.headDisp}}; align-items: center; gap: 8px; padding: 11px 14px; border-bottom: 1px solid rgba(255,255,255,0.08); flex-wrap: wrap;">
                <h3 style="margin: 0; font-size: 13.5px; font-weight: 700; color: #ede9e1;">{{cd.title}}</h3>
                <span class="mono" style="display: {{cd.subDisp}}; font-size: 11px; color: #9aa1ab;">{{cd.sub}}</span>
                <span style="flex-grow: 1;"></span>
                <sc-for list="{{cd.acts}}" as="ac" hint-placeholder-count="0">
                  <button type="button" onClick="{{ac.run}}" title="{{ac.tip}}" aria-disabled="{{ac.dis}}" class="{{ac.cls}}" style="height: 28px; padding: 0 11px; border: 1px solid {{ac.line}}; border-radius: 8px; background: {{ac.bg}}; color: {{ac.fg}}; font: inherit; font-size: 12px; font-weight: 600; cursor: {{ac.cur}}; opacity: {{ac.op}};">{{ac.label}}</button>
                </sc-for>
              </div>
              <sc-for list="{{cd.rows}}" as="rw" hint-placeholder-count="0">
                <div class="kr" style="display: flex; gap: 12px; align-items: center; padding: 11px 14px; border-top: 1px solid rgba(255,255,255,0.07); opacity: {{rw.op}};">
                  <span style="display: flex; flex-direction: column; gap: 2px; min-width: 0; flex-grow: 1;">
                    <span style="display: flex; align-items: center; gap: 6px; flex-wrap: wrap;"><span class="{{rw.cls}}" style="font-size: 13px; font-weight: 700; color: #ede9e1;">{{rw.t}}</span>
                      <sc-for list="{{rw.badges}}" as="bd" hint-placeholder-count="0">
                        <span title="{{bd.tip}}" style="display: inline-flex; align-items: center; height: 20px; padding: 0 8px; box-sizing: border-box; border-radius: 10px; background: {{bd.bg}}; color: {{bd.fg}}; border: 1px solid color-mix(in srgb, {{bd.fg}} 50%, transparent); font-size: 10.5px; font-weight: 600; white-space: nowrap;">{{bd.t}}</span>
                      </sc-for>
                    </span>
                    <span style="display: {{rw.dDisp}}; font-size: 11.5px; color: #9aa1ab; line-height: 1.5;">{{rw.d}}</span>
                  </span>
                  <sc-if value="{{rw.hasSl}}" hint-placeholder-val="{{false}}">
                    <span style="display: flex; align-items: center; gap: 12px; flex-shrink: 0;">
                      <span aria-hidden="true" style="position: relative; width: 112px; height: 40px; border-radius: 9px; overflow: hidden; border: 1px solid rgba(255,255,255,0.14); background: linear-gradient(135deg, #2aa7b8 0%, #7ac55a 55%, #e9d9a8 100%);"><span style="position: absolute; inset: 7px 9px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.12); background: {{rw.slPrev}}; transition: background-color 120ms linear; display: flex; align-items: center; padding: 0 8px; font-size: 10.5px; color: #ede9e1;">창</span></span>
                      <input type="range" min="30" max="100" step="1" value="{{rw.slV}}" onInput="{{rw.slSet}}" aria-label="창 불투명도" style="width: 170px; accent-color: #5aa8ff; cursor: pointer;">
                    </span>
                  </sc-if>
                  <span class="{{rw.vcls}}" style="font-size: 12.5px; color: {{rw.vc}}; white-space: nowrap;">{{rw.v}}</span>
                  <sc-for list="{{rw.btns}}" as="bt" hint-placeholder-count="0">
                    <button type="button" onClick="{{bt.run}}" title="{{bt.tip}}" aria-disabled="{{bt.dis}}" class="{{bt.cls}}" style="height: 28px; padding: 0 10px; flex-shrink: 0; border: 1px solid {{bt.line}}; border-radius: 8px; background: {{bt.bg}}; color: {{bt.fg}}; font: inherit; font-size: 11.5px; font-weight: 600; cursor: {{bt.cur}}; opacity: {{bt.op}};">{{bt.label}}</button>
                  </sc-for>
                </div>
              </sc-for>
              <sc-if value="{{cd.hasForm}}" hint-placeholder-val="{{false}}">
                <div data-st-form="{{cd.formId}}" style="display: flex; flex-direction: column; gap: 10px; padding: 12px 14px 14px; border-top: 1px solid rgba(255,255,255,0.07); background: rgba(255,255,255,0.025);">
                  <b style="font-size: 12.5px; color: #ede9e1;">{{cd.formTitle}}</b>
                  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;">
                    <sc-for list="{{cd.fields}}" as="fd" hint-placeholder-count="0">
                      <label style="display: flex; flex-direction: column; gap: 4px; grid-column: span {{fd.span}}; min-width: 0;">
                        <span style="font-size: 11.5px; font-weight: 600; color: #b4bac3;">{{fd.label}}</span>
                        <sc-if value="{{fd.isIn}}" hint-placeholder-val="{{false}}">
                          <input type="{{fd.type}}" data-st-field="{{fd.key}}" value="{{fd.v}}" onChange="{{fd.set}}" placeholder="{{fd.ph}}" autocomplete="off" class="mono" style="height: 34px; width: 100%; box-sizing: border-box; padding: 0 11px; border: 1px solid rgba(255,255,255,0.18); border-radius: 9px; background: #0e1013; font-size: 12.5px; color: #ede9e1; outline: none;">
                        </sc-if>
                        <sc-if value="{{fd.isSel}}" hint-placeholder-val="{{false}}">
                          <select data-st-field="{{fd.key}}" onChange="{{fd.set}}" class="mono" style="height: 34px; width: 100%; box-sizing: border-box; padding: 0 9px; border: 1px solid rgba(255,255,255,0.18); border-radius: 9px; background: #0e1013; font-size: 12.5px; color: #ede9e1; outline: none;">
                            <sc-for list="{{fd.opts}}" as="op" hint-placeholder-count="2">
                              <option value="{{op.v}}" selected="{{op.sel}}">{{op.t}}</option>
                            </sc-for>
                          </select>
                        </sc-if>
                        <sc-if value="{{fd.isChips}}" hint-placeholder-val="{{false}}">
                          <span data-st-field="{{fd.key}}" style="display: flex; flex-wrap: wrap; gap: 5px;">
                            <sc-for list="{{fd.chips}}" as="ch" hint-placeholder-count="0">
                              <button type="button" data-st-chip="{{ch.v}}" aria-pressed="{{ch.on}}" onClick="{{ch.run}}" title="{{ch.tip}}" class="mono" style="height: 26px; padding: 0 9px; border: 1px solid {{ch.line}}; border-radius: 13px; background: {{ch.bg}}; color: {{ch.fg}}; font-size: 11.5px; font-weight: 600; cursor: pointer;">{{ch.v}}</button>
                            </sc-for>
                          </span>
                        </sc-if>
                      </label>
                    </sc-for>
                  </div>
                  <span data-st-form-msg="1" style="display: {{cd.fmsgDisp}}; font-size: 12px; font-weight: 600; line-height: 1.5; color: {{cd.fmsgC}};">{{cd.fmsg}}</span>
                  <div style="display: flex; gap: 8px; justify-content: flex-end;">
                    <button type="button" data-st-form-cancel="1" onClick="{{cd.fcancel}}" class="ghost" style="height: 30px; padding: 0 13px; border: 1px solid rgba(255,255,255,0.18); border-radius: 8px; background: rgba(255,255,255,0.04); color: #ede9e1; font: inherit; font-size: 12px; font-weight: 600; cursor: pointer;">취소</button>
                    <button type="button" data-st-form-ok="1" onClick="{{cd.fok}}" aria-disabled="{{cd.fbusy}}" class="pri" style="height: 30px; padding: 0 15px; border: 1px solid #ede9e1; border-radius: 8px; background: #ede9e1; color: #111111; font: inherit; font-size: 12px; font-weight: 700; cursor: pointer; opacity: {{cd.fop}};">{{cd.fokLabel}}</button>
                  </div>
                </div>
              </sc-if>
              <sc-if value="{{cd.showText}}" hint-placeholder-val="{{false}}">
                <div style="padding: {{cd.textPad}}; font-size: 12.5px; color: #b4bac3; line-height: 1.7; text-align: {{cd.textAlign}};">
                  <div style="display: {{cd.iconDisp}}; justify-content: center; margin-bottom: 8px;"><span style="width: 48px; height: 48px; box-sizing: border-box; border-radius: 14px; background: color-mix(in srgb, {{cd.iconBg}} 12%, transparent); border: 1px solid color-mix(in srgb, {{cd.iconBg}} 40%, transparent); color: {{cd.iconBg}}; display: flex; align-items: center; justify-content: center;"><svg viewBox="0 0 24 24" width="22" height="22" style="fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;"><use href="#s-{{cd.icon}}"></use></svg></span></div>
                  <div style="display: {{cd.bigDisp}}; font-size: 15px; font-weight: 700; color: #ede9e1; margin-bottom: 4px;">{{cd.big}}</div>
                  {{cd.text}}
                </div>
              </sc-if>
              <sc-if value="{{cd.hasCode}}" hint-placeholder-val="{{false}}">
                <div style="display: flex; flex-direction: column; gap: 6px; padding: 0 14px 14px;">
                  <sc-for list="{{cd.code}}" as="cl" hint-placeholder-count="0">
                    <div style="display: flex; gap: 10px; align-items: center; font-size: 12px;"><code class="mono" style="flex-shrink: 0; padding: 5px 10px; border-radius: 8px; background: #0e1013; border: 1px solid rgba(255,255,255,0.12); color: #ede9e1; font-size: 11.5px;"><span style="color: #6b7280;">$ </span>{{cl.c}}</code><span style="color: #9aa1ab;">{{cl.d}}</span></div>
                  </sc-for>
                </div>
              </sc-if>
            </section>
          </sc-for>
        </div>
      </div>

      <!-- 저장 막대 (로컬 노드) — 초안은 GUI가 들고 있다. 선행 키 → *.enabled 순서로 PATCH를 나눠 보낸다 -->
      <div style="display: {{bar.disp}}; flex-shrink: 0; align-items: center; gap: 12px; padding: 10px 20px; border-top: 1px solid rgba(255,255,255,0.10); background: rgba(15,17,21,0.94); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); box-shadow: 0 -10px 30px rgba(0,0,0,0.35); animation: pop 220ms cubic-bezier(.22,1,.36,1) both;">
        <span style="width: 9px; height: 9px; border-radius: 50%; background: {{bar.dot}}; box-shadow: 0 0 0 4px color-mix(in srgb, {{bar.dot}} 18%, transparent);"></span>
        <span style="display: flex; flex-direction: column; gap: 1px; min-width: 0; flex-grow: 1;">
          <b style="font-size: 13px; color: {{bar.fg}};">{{bar.title}}</b>
          <span class="mono" style="font-size: 11px; color: #9aa1ab; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{bar.order}}</span>
        </span>
        <button type="button" onClick="{{bar.discard}}" class="ghost" style="height: 34px; padding: 0 13px; border: 1px solid rgba(255,255,255,0.18); border-radius: 9px; background: rgba(255,255,255,0.04); color: #ede9e1; font: inherit; font-size: 12.5px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 6px;"><svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true" style="flex-shrink: 0; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;"><use href="#s-rotate"></use></svg>되돌리기</button>
        <button type="button" onClick="{{bar.save}}" aria-disabled="{{bar.dis}}" class="pri" style="height: 34px; padding: 0 16px; border: 1px solid {{bar.btnLine}}; border-radius: 9px; background: {{bar.btnBg}}; color: #111111; font: inherit; font-size: 12.5px; font-weight: 700; cursor: {{bar.cur}}; opacity: {{bar.op}}; display: inline-flex; align-items: center; gap: 6px;"><span class="{{bar.spin}}" style="display: {{bar.gDisp}};"><svg viewBox="0 0 24 24" width="15" height="15" style="display: block; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round;"><use href="#s-loader"></use></svg></span>{{bar.saveLabel}}</button>
      </div>
    </main>
  </div>

  <sc-if value="{{dlg.open}}" hint-placeholder-val="{{false}}">
    <div style="position: absolute; inset: 0; z-index: 30; background: rgba(0,0,0,0.50); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); display: flex; align-items: center; justify-content: center;">
      <div class="pop" role="alertdialog" aria-label="{{dlg.title}}" style="width: 480px; box-sizing: border-box; background: rgba(18,20,25,0.96); border: 1px solid rgba(255,255,255,0.12); border-radius: 14px; box-shadow: 0 30px 80px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.05); overflow: hidden;">
        <div style="display: flex; gap: 12px; padding: 18px 20px 12px;">
          <span style="width: 38px; height: 38px; flex-shrink: 0; box-sizing: border-box; border-radius: 10px; background: rgba(255,93,93,0.12); border: 1px solid rgba(255,93,93,0.4); color: #ff5d5d; display: flex; align-items: center; justify-content: center;"><svg viewBox="0 0 24 24" width="19" height="19" aria-hidden="true" style="flex-shrink: 0; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;"><use href="#s-warn"></use></svg></span>
          <span style="display: flex; flex-direction: column; gap: 3px;"><span style="font-size: 15px; font-weight: 700; color: #ede9e1;">{{dlg.title}}</span><span class="mono" style="font-size: 11.5px; color: #9aa1ab;">{{dlg.op}}</span></span>
        </div>
        <div style="display: flex; flex-direction: column; gap: 6px; padding: 0 20px 14px;">
          <sc-for list="{{dlg.rows}}" as="dr" hint-placeholder-count="3">
            <div style="display: flex; gap: 12px; align-items: baseline; font-size: 12.5px;"><span class="mono" style="color: #9aa1ab; font-size: 12px;">{{dr.k}}</span><span style="flex-grow: 1; border-bottom: 1px dotted rgba(255,255,255,0.14);"></span><span class="mono" style="font-weight: 600; color: #ede9e1;">{{dr.v}}</span></div>
          </sc-for>
          <div style="margin-top: 4px; padding: 9px 11px; border-radius: 9px; background: rgba(245,184,61,0.08); border: 1px solid rgba(245,184,61,0.30); color: #f5c76a; font-size: 12px; line-height: 1.6;">{{dlg.warn}}</div>
        </div>
        <div style="display: flex; justify-content: flex-end; gap: 6px; padding: 12px 20px; border-top: 1px solid rgba(255,255,255,0.08); background: rgba(255,255,255,0.02);">
          <button type="button" onClick="{{dlg.cancel}}" class="ghost" style="height: 34px; padding: 0 14px; border: 1px solid rgba(255,255,255,0.18); border-radius: 9px; background: rgba(255,255,255,0.04); color: #ede9e1; font: inherit; font-size: 12.5px; font-weight: 600; cursor: pointer;">취소</button>
          <button type="button" onClick="{{dlg.ok}}" style="height: 34px; padding: 0 14px; border: 1px solid #ff5d5d; border-radius: 9px; background: #ff5d5d; color: #1a0707; font: inherit; font-size: 12.5px; font-weight: 700; cursor: pointer;">{{dlg.okLabel}}</button>
        </div>
      </div>
    </div>
  </sc-if>

  <div aria-live="polite" style="position: absolute; right: 18px; bottom: 70px; z-index: 20; display: flex; flex-direction: column; gap: 6px; width: 400px;">
    <sc-for list="{{toasts}}" as="ts" hint-placeholder-count="0">
      <div class="pop" style="display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 12px; background: rgba(13,15,19,0.92); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border: 1px solid color-mix(in srgb, {{ts.c}} 45%, transparent); box-shadow: 0 10px 30px rgba(0,0,0,0.40), inset 0 1px 0 rgba(255,255,255,0.05); font-size: 12.5px; line-height: 1.55; color: #ede9e1;">
        <span style="width: 22px; height: 22px; flex-shrink: 0; border-radius: 50%; background: color-mix(in srgb, {{ts.c}} 16%, transparent); color: {{ts.c}}; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center;">{{ts.g}}</span>
        <span style="flex-grow: 1;"><b style="font-weight: 600;">{{ts.title}}</b><br><span style="color: #9aa1ab; font-size: 11.5px;">{{ts.text}}</span></span>
      </div>
    </sc-for>
  </div>
</div>
</script>
<script type="module">
import './src/api/frame-boot.js';   // 첫 import — Terra 안이면 마운트보다 먼저 frame에 hello를 보낸다
import { mount, fit } from './src/runtime/dc.js';
import Screen from './src/screens/settings.js';
import * as Boot from './src/boot/module.js';
const stage = document.getElementById('stage');
const View = (Boot.prep && Boot.prep('settings', Screen)) || Screen;   // 프로필이 예시를 지운 클래스를 돌려주면 그것을 띄운다
window.__screen = mount(View, { template: document.getElementById('view').textContent, target: stage, props: {} });
fit(stage, 1440, 900);
Boot.boot && Boot.boot('settings', window.__screen);
</script>
</body>
</html>
