<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Terra · 필드 편집기</title>
<style>
body{margin:0;font-family:'Noto Sans KR','Noto Sans',system-ui,'Segoe UI',-apple-system,sans-serif;background:#ffffff}
a{color:#2563eb}a:hover{color:#1d4ed8}
.px:hover{stroke:#2563eb;stroke-width:1.5}
@keyframes ants{to{stroke-dashoffset:-8}}
.sel-rect{animation:ants 600ms linear infinite}
</style>
<style>
html,body{margin:0;background:#dfe3ea}
.frame{margin:12px auto;overflow:hidden;box-shadow:0 6px 24px rgba(22,25,31,0.16);border-radius:6px}
#stage{width:1440px;height:900px;transform-origin:0 0;background:#ffffff}
</style>
</head>
<body>
<div class="frame"><div id="stage"></div></div>
<script type="text/x-template" id="view">
<div style="width: 1440px; height: 900px; display: flex; flex-direction: column; background: #ffffff; color: #16191f; font-family: 'Noto Sans KR','Noto Sans',system-ui,'Segoe UI',-apple-system,sans-serif; font-size: 14px; line-height: 1.5; overflow: hidden;">

  <header style="height: 52px; flex-shrink: 0; box-sizing: border-box; padding: 0 20px; display: flex; align-items: center; gap: 14px; border-bottom: 1px solid #d8dde5;">
    <a href="node.html" style="font-size: 13px; color: #5b6472; text-decoration: none;">← 노드 화면</a>
    <h1 style="margin: 0; font-size: 17px; font-weight: 600;">필드 편집기</h1>
    <select value="{{curId}}" onChange="{{pickSkin}}" aria-label="편집할 필드 스킨" style="height: 30px; padding: 0 8px; border: 1px solid #d8dde5; border-radius: 6px; background: #ffffff; font: inherit; font-size: 13px; color: #16191f;">
      <sc-for list="{{skinOptions}}" as="o" hint-placeholder-count="4">
        <option value="{{o.id}}">{{o.label}}</option>
      </sc-for>
    </select>
    <input type="text" value="{{name}}" onChange="{{setName}}" aria-label="필드 스킨 이름" style="height: 30px; width: 140px; box-sizing: border-box; padding: 0 10px; border: 1px solid #d8dde5; border-radius: 6px; font: inherit; font-size: 13px; color: #16191f;">
    <div role="radiogroup" aria-label="{{an.typeLabel}} 타입" style="display: flex; gap: 2px; padding: 2px; border-radius: 7px; background: #eef1f5;">
      <sc-for list="{{an.types}}" as="ty" hint-placeholder-count="2">
        <button type="button" role="radio" aria-checked="{{ty.on}}" onClick="{{ty.pick}}" style="height: 26px; padding: 0 10px; border: 0; border-radius: 5px; background: {{ty.bg}}; color: {{ty.fg}}; box-shadow: {{ty.sh}}; font: inherit; font-size: 12.5px; font-weight: {{ty.fw}}; cursor: pointer;">{{ty.label}}</button>
      </sc-for>
    </div>
    <span style="font-size: 12px; color: {{saveColor}};">{{saveText}}</span>
    <span style="flex-grow: 1;"></span>
    <nav aria-label="필드 편집기 메뉴" style="display: flex; align-items: center; gap: 4px;">
      <button type="button" onClick="{{save}}" style="height: 32px; padding: 0 12px; border: 1px solid #2563eb; border-radius: 6px; background: #2563eb; color: #ffffff; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer;">필드 저장</button>
      <button type="button" style="height: 32px; padding: 0 12px; border: 1px solid #d8dde5; border-radius: 6px; background: #ffffff; color: #16191f; font: inherit; font-size: 13px; cursor: pointer;">내보내기</button>
      <button type="button" style="height: 32px; padding: 0 12px; border: 1px solid #d8dde5; border-radius: 6px; background: #ffffff; color: #16191f; font: inherit; font-size: 13px; cursor: pointer;">불러오기</button>
      <button type="button" onClick="{{saveAs}}" style="height: 32px; padding: 0 12px; border: 1px solid #d8dde5; border-radius: 6px; background: #ffffff; color: #16191f; font: inherit; font-size: 13px; cursor: pointer;">다른 이름으로 저장</button>
      <button type="button" onClick="{{newSkin}}" style="height: 32px; padding: 0 12px; border: 1px solid #d8dde5; border-radius: 6px; background: #ffffff; color: #16191f; font: inherit; font-size: 13px; cursor: pointer;">새로 만들기</button>
    </nav>
  </header>

  <div style="flex-grow: 1; display: flex; min-height: 0;">

    <!-- 모니터링 -->
    <section aria-label="미리보기" style="position: relative; flex-grow: 1; min-width: 0; box-sizing: border-box; background: #eef1f5; border-right: 1px solid #d8dde5; padding: 14px 16px; display: flex; gap: 14px; align-items: flex-start;">
     <div style="width: 370px; flex-shrink: 0; display: flex; flex-direction: column; gap: 10px;">
      <div style="display: flex; align-items: center; gap: 8px;">
        <h3 style="margin: 0; font-size: 14px; font-weight: 600;">3D 타일</h3>
        <span style="font-size: 12px; color: #5b6472;">끌어서 돌려 보기 · {{yawLabel}} · {{pitchLabel}}</span>
      </div>
      <div role="group" aria-label="보기" style="display: flex; gap: 4px;">
        <sc-for list="{{roleTabs}}" as="rt" hint-placeholder-count="4">
          <button type="button" aria-pressed="{{rt.pressed}}" onClick="{{rt.pick}}" style="height: 28px; padding: 0 8px; white-space: nowrap; flex-shrink: 0; border: {{rt.border}}; border-radius: 6px; background: {{rt.bg}}; color: #16191f; font: inherit; font-size: 12.5px; font-weight: {{rt.fw}}; cursor: pointer;">{{rt.label}}</button>
        </sc-for>
        <span style="flex-grow: 1;"></span>
        <button type="button" onClick="{{resetView}}" style="height: 28px; padding: 0 8px; white-space: nowrap; flex-shrink: 0; border: 1px solid #d8dde5; border-radius: 6px; background: #ffffff; color: #16191f; font: inherit; font-size: 12.5px; cursor: pointer;">필드 시점</button>
      </div>
      <svg width="370" height="440" viewBox="-185 -210 370 440" role="img" aria-label="3D 타일 — 끌어서 돌려 봄" style="background: #f7f8fa; border: 1px solid #d8dde5; border-radius: 10px; cursor: grab; touch-action: none;" onPointerDown="{{oDown}}" onPointerMove="{{oMove}}" onPointerUp="{{oUp}}" onPointerLeave="{{oUp}}">
        <defs>
          <pattern id="{{b3.topPat.id}}" patternUnits="userSpaceOnUse" width="{{b3.topPat.w}}" height="{{b3.topPat.h}}" patternTransform="{{b3.topPat.m}}">
            <sc-for list="{{b3.topPat.rects}}" as="r" hint-placeholder-count="0">
              <rect x="{{r.x}}" y="{{r.y}}" width="{{r.w}}" height="{{r.h}}" fill="{{r.fill}}"></rect>
            </sc-for>
          </pattern>
        </defs>
        <g transform="translate(0 -45)">
          <polygon points="{{b3.base}}" fill="{{b3.baseFill}}"></polygon>
          <sc-for list="{{b3.paths}}" as="pp" hint-placeholder-count="0">
            <path d="{{pp.d}}" fill="{{pp.c}}" stroke="{{pp.c}}" stroke-width="0.35" stroke-linejoin="round"></path>
          </sc-for>
          <polygon points="{{b3.top}}" fill="url(#fe3-top)"></polygon>
          <sc-for list="{{b3.rim}}" as="rp" hint-placeholder-count="0">
            <path d="{{rp.d}}" fill="{{rp.c}}" stroke="{{rp.c}}" stroke-width="0.35" stroke-linejoin="round"></path>
          </sc-for>
        </g>
      </svg>
     </div>
     <div style="width: 370px; flex-shrink: 0; display: flex; flex-direction: column; gap: 10px;">
      <div style="display: flex; align-items: baseline; gap: 8px; height: 66px;">
        <h3 style="margin: 0; font-size: 14px; font-weight: 600;">필드에 깔린 모습</h3>
        <span style="font-size: 12px; color: #5b6472;">2D 데이터 · 노드 화면과 같음</span>
      </div>
      <svg width="370" height="440" viewBox="-205 -262 410 488" role="img" aria-label="2D로 구운 타일 7장 — 가운데는 부모 필드, 둘레는 자식 노드 필드(Leaf · Tree · Tree·Leaf)와 빈 필드" style="background: #f7f8fa; border: 1px solid #d8dde5; border-radius: 10px;">
        <defs>
          <pattern id="{{b2.topPat.id}}" patternUnits="userSpaceOnUse" width="{{b2.topPat.w}}" height="{{b2.topPat.h}}" patternTransform="{{b2.topPat.m}}">
            <sc-for list="{{b2.topPat.rects}}" as="r" hint-placeholder-count="0">
              <rect x="{{r.x}}" y="{{r.y}}" width="{{r.w}}" height="{{r.h}}" fill="{{r.fill}}"></rect>
            </sc-for>
          </pattern>
          <sc-for list="{{fieldDefs}}" as="fd" hint-placeholder-count="0">
            <g id="{{fd.id}}">
              <polygon points="{{fd.base}}" fill="{{fd.baseFill}}"></polygon>
              <sc-for list="{{fd.paths}}" as="pp" hint-placeholder-count="0">
                <path d="{{pp.d}}" fill="{{pp.c}}" stroke="{{pp.c}}" stroke-width="0.35" stroke-linejoin="round"></path>
              </sc-for>
              <polygon points="{{fd.top}}" fill="url(#fe2-top)"></polygon>
              <sc-for list="{{fd.rim}}" as="rp" hint-placeholder-count="0">
                <path d="{{rp.d}}" fill="{{rp.c}}" stroke="{{rp.c}}" stroke-width="0.35" stroke-linejoin="round"></path>
              </sc-for>
            </g>
          </sc-for>
        </defs>
        <g transform="scale(0.9)">
          <sc-for list="{{cluster}}" as="c" hint-placeholder-count="7">
            <use href="{{c.href}}" transform="{{c.T}}"></use>
          </sc-for>
        </g>
        <text x="-117" y="160" text-anchor="middle" font-size="12" fill="#5b6472">Leaf</text>
        <text x="0" y="118" text-anchor="middle" font-size="12" font-weight="600" fill="#6d28d9">부모</text>
        <text x="117" y="160" text-anchor="middle" font-size="12" fill="#5b6472">Tree</text>
        <text x="-117" y="-150" text-anchor="middle" font-size="12" fill="#5b6472">Tree·Leaf</text>
      </svg>
      <span style="font-size: 12px; color: #5b6472;">보이는 픽셀 {{b2.cells}}칸 → 다각형 {{b2.count}} → 색별 경로 {{b2.els}} + 윗면 무늬 1</span>
     </div>
      <!-- 애니메이션 확장: 1초 = 16칸 고정. 칸마다 프레임을 넣거나 비워 두고, 빈 칸은 앞 프레임을 그대로 보인다 (한 줄 = 1초) -->
      <section aria-label="애니메이션 칸" style="position: absolute; left: 16px; right: 16px; bottom: 14px; display: {{an.disp}}; flex-direction: column; gap: 8px; box-sizing: border-box; background: #ffffff; border: 1px solid #d8dde5; border-radius: 10px; padding: 10px 12px;">
        <div style="display: flex; align-items: center; gap: 6px 8px; flex-wrap: wrap; font-size: 12.5px;">
          <button type="button" onClick="{{an.toggle}}" aria-label="{{an.playLabel}}" title="{{an.playLabel}}" style="width: 32px; height: 28px; border: 1px solid {{an.playLine}}; border-radius: 6px; background: {{an.playBg}}; color: {{an.playFg}}; font: inherit; font-size: 13px; cursor: pointer;">{{an.playIcon}}</button>
          <b style="font-size: 13px; font-variant-numeric: tabular-nums;">칸 {{an.cur}} / {{an.len}}</b>
          <span style="color: {{an.slotFg}};">{{an.slotInfo}}</span>
          <span style="flex-grow: 1;"></span>
          <label style="display: {{an.lenDisp}}; align-items: center; gap: 4px; color: #5b6472;">길이
            <select value="{{an.lenVal}}" onChange="{{an.setLen}}" aria-label="애니메이션 길이" style="height: 26px; padding: 0 4px; border: 1px solid #d8dde5; border-radius: 6px; background: #ffffff; font: inherit; font-size: 12.5px; color: #16191f;">
              <sc-for list="{{an.lens}}" as="lo" hint-placeholder-count="4"><option value="{{lo.v}}">{{lo.t}}</option></sc-for>
            </select></label>
          <span style="display: {{an.lenFixDisp}}; color: #5b6472;">길이 1초 고정 (16칸)</span>
        </div>
        <div style="display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 12px;">
          <span style="color: #5b6472;">복제 간격</span>
          <div role="radiogroup" aria-label="복제 간격" style="display: flex; gap: 2px; padding: 2px; border-radius: 6px; background: #eef1f5;">
            <sc-for list="{{an.steps}}" as="sp" hint-placeholder-count="3">
              <button type="button" role="radio" aria-checked="{{sp.on}}" title="{{sp.tip}}" onClick="{{sp.pick}}" style="height: 22px; padding: 0 7px; border: 0; border-radius: 4px; background: {{sp.bg}}; color: {{sp.fg}}; box-shadow: {{sp.sh}}; font: inherit; font-size: 11.5px; font-weight: {{sp.fw}}; cursor: pointer;">{{sp.label}}</button>
            </sc-for>
          </div>
          <button type="button" onClick="{{an.dup}}" title="{{an.dupTip}}" style="height: 26px; padding: 0 8px; border: 1px solid #2563eb; border-radius: 6px; background: #ffffff; color: {{an.dupFg}}; font: inherit; font-size: 12px; font-weight: 600; cursor: pointer;">+ 복제 → {{an.stepLabel}} 뒤</button>
          <button type="button" onClick="{{an.fill}}" title="{{an.fillTip}}" style="height: 26px; padding: 0 8px; border: 1px solid #d8dde5; border-radius: 6px; background: #ffffff; color: #16191f; font: inherit; font-size: 12px; cursor: pointer;">{{an.fillLabel}}</button>
          <span style="flex-grow: 1;"></span>
          <button type="button" onClick="{{an.left}}" title="이 프레임을 한 칸 앞으로" style="height: 26px; padding: 0 7px; border: 1px solid #d8dde5; border-radius: 6px; background: #ffffff; color: {{an.leftFg}}; font: inherit; font-size: 12px; cursor: pointer;">◀</button>
          <button type="button" onClick="{{an.right}}" title="이 프레임을 한 칸 뒤로" style="height: 26px; padding: 0 7px; border: 1px solid #d8dde5; border-radius: 6px; background: #ffffff; color: {{an.rightFg}}; font: inherit; font-size: 12px; cursor: pointer;">▶</button>
        </div>
        <div role="listbox" aria-label="칸 (한 줄 = 1초)" style="display: grid; grid-template-columns: repeat(16, minmax(0, 1fr)); gap: 3px;">
          <sc-for list="{{an.slots}}" as="fs" hint-placeholder-count="16">
            <button type="button" role="option" aria-selected="{{fs.sel}}" aria-label="{{fs.label}}" title="{{fs.label}}" onClick="{{fs.pick}}" style="position: relative; height: {{an.slotH}}px; padding: 0; box-sizing: border-box; border: {{fs.border}}; border-radius: 5px; background: {{fs.bg}}; cursor: pointer; overflow: hidden; box-shadow: {{fs.ring}};">
              <img src="{{fs.img}}" alt="" style="display: {{fs.imgDisp}}; width: 100%; height: 100%; object-fit: contain; image-rendering: pixelated;">
              <span style="display: {{fs.holdDisp}}; position: absolute; left: 0; right: 0; top: 50%; height: 3px; margin-top: -1px; background: #b9cdf5;"></span>
              <span style="position: absolute; left: 3px; top: 0; font-size: 9.5px; font-weight: 700; color: {{fs.numFg}};">{{fs.num}}</span>
            </button>
          </sc-for>
        </div>
        <div style="display: {{an.confirmDisp}}; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 8px; background: #fff7e6; border: 1px solid #f0d59a; font-size: 12.5px; color: #7a4d00;">
          <span style="flex-grow: 1;">일반 타입은 프레임 하나 · 1초입니다 — 지금 보이는 프레임만 남기고 나머지 프레임 {{an.dropN}}개를 지웁니다.</span>
          <button type="button" onClick="{{an.confirmYes}}" style="height: 26px; padding: 0 10px; border: 1px solid #d33d52; border-radius: 6px; background: #ffffff; color: #b4283c; font: inherit; font-size: 12px; font-weight: 600; cursor: pointer;">지우고 일반으로</button>
          <button type="button" onClick="{{an.confirmNo}}" style="height: 26px; padding: 0 10px; border: 1px solid #d8dde5; border-radius: 6px; background: #ffffff; color: #16191f; font: inherit; font-size: 12px; cursor: pointer;">취소</button>
        </div>
      </section>
    </section>

    <!-- 편집 -->
    <main onKeyDown="{{key}}" style="width: 256px; flex-shrink: 0; display: flex; flex-direction: column; gap: 8px; padding: 12px; box-sizing: border-box; overflow-y: auto; outline: none;">
      <!-- 부모 필드 디자인: 클러스터의 부모 노드가 놓인 필드. 기본 디자인을 따르거나, 이 필드만 따로 -->
      <section aria-label="부모 필드 디자인" style="display: flex; flex-direction: column; gap: 8px; border: 1px solid {{pc.chipLine}}; border-radius: 10px; padding: 10px; background: {{pc.chipBg}};">
        <div style="display: flex; align-items: center; gap: 8px;">
          <span style="width: 8px; height: 8px; border-radius: 2px; background: #7c3aed;"></span>
          <h3 style="margin: 0; font-size: 13.5px; font-weight: 600;">부모 필드</h3>
          <span style="flex-grow: 1;"></span>
          <span style="height: 22px; box-sizing: border-box; padding: 0 8px; border-radius: 11px; border: 1px solid {{pc.chipLine}}; background: #ffffff; color: {{pc.chipFg}}; font-size: 11.5px; font-weight: 600; display: flex; align-items: center;">{{pc.chip}}</span>
        </div>
        <div style="display: grid; grid-template-columns: 44px 1fr; gap: 6px 8px; align-items: center; font-size: 12px; color: #5b6472;">
          <span>띠</span>
          <button type="button" onClick="{{pc.editBand}}" aria-label="부모 띠 편집" style="padding: 0; border: 0; background: transparent; cursor: pointer; justify-self: start;">
            <svg width="112" height="14" viewBox="0 0 112 14" aria-hidden="true" style="display: block; border-radius: 2px;"><sc-for list="{{pc.band}}" as="b" hint-placeholder-count="0"><rect x="{{b.x}}" y="{{b.y}}" width="7.2" height="7.2" fill="{{b.c}}"></rect></sc-for></svg>
          </button>
          <span>테두리</span>
          <button type="button" onClick="{{pc.editRim}}" aria-label="부모 테두리 편집" style="padding: 0; border: 0; background: transparent; cursor: pointer; justify-self: start;">
            <svg width="112" height="14" viewBox="0 0 112 14" aria-hidden="true" style="display: block; border-radius: 2px;"><sc-for list="{{pc.rim}}" as="b" hint-placeholder-count="0"><rect x="{{b.x}}" y="{{b.y}}" width="7.2" height="7.2" fill="{{b.c}}"></rect></sc-for></svg>
          </button>
          <span>높이</span>
          <label style="display: flex; align-items: center; gap: 6px;"><input type="range" min="26" max="96" step="2" value="{{pc.lift}}" onChange="{{pc.setLift}}" aria-label="부모 필드 높이" style="flex-grow: 1; min-width: 0; accent-color: #7c3aed;"><span style="width: 36px; text-align: right; font-family: ui-monospace,monospace; color: #16191f;">+{{pc.lift}}</span></label>
        </div>
        <span style="font-size: 11.5px; color: #5b6472; line-height: 1.45;">{{pc.note}}</span>
        <div style="display: flex; gap: 4px;">
          <button type="button" onClick="{{pc.reset}}" style="flex: 1; height: 28px; padding: 0 6px; border: 1px solid #d8dde5; border-radius: 6px; background: #ffffff; color: {{pc.resetFg}}; font: inherit; font-size: 12px; cursor: pointer;">기본 따르기</button>
          <button type="button" onClick="{{pc.makeDefault}}" style="flex: 1; height: 28px; padding: 0 6px; border: 1px solid #d8dde5; border-radius: 6px; background: #ffffff; color: {{pc.makeFg}}; font: inherit; font-size: 12px; cursor: pointer;">기본으로 지정</button>
        </div>
        <span style="font-size: 11px; color: #8b95a6; line-height: 1.4;">기본을 따르는 필드: {{pc.users}}</span>
      </section>
      <sc-for list="{{comps}}" as="cp" hint-placeholder-count="4">
        <section aria-label="{{cp.label}}" aria-current="{{cp.cur}}" onPointerDown="{{cp.activate}}" title="{{cp.tip}}" style="display: flex; flex-direction: column; gap: 6px; border: {{cp.border}}; border-radius: 10px; padding: 8px 10px; background: {{cp.bg}}; cursor: {{cp.cardCursor}};">
          <div style="display: flex; align-items: center; gap: 8px;">
            <span style="width: 8px; height: 8px; border-radius: 50%; background: {{cp.dot}};"></span>
            <h3 style="margin: 0; font-size: 13.5px; font-weight: 600; color: {{cp.fg}};">{{cp.label}}</h3>
            <span style="font-size: 12px; color: #5b6472;">{{cp.size}} · {{cp.state}}</span>
          </div>
          <sc-if value="{{cp.hasKinds}}" hint-placeholder-val="{{false}}">
            <div role="tablist" style="display: flex; gap: 2px; background: #f4f6f9; border-radius: 6px; padding: 2px;">
              <sc-for list="{{cp.kinds}}" as="k" hint-placeholder-count="0">
                <button type="button" role="tab" aria-selected="{{k.sel}}" onClick="{{k.pick}}" style="flex: 1; height: 26px; padding: 0 6px; border: 0; border-radius: 5px; background: {{k.bg}}; color: {{k.fg}}; font: inherit; font-size: 12.5px; font-weight: {{k.fw}}; cursor: pointer; box-shadow: {{k.sh}};">{{k.label}}</button>
              </sc-for>
            </div>
          </sc-if>
          <svg width="{{cp.gw}}" height="{{cp.gh}}" viewBox="0 0 {{cp.gw}} {{cp.gh}}" role="img" aria-label="{{cp.label}} 픽셀" style="flex-shrink: 0; touch-action: none; user-select: none; cursor: {{cp.cursor}}; opacity: {{cp.op}};" onPointerDown="{{down}}" onPointerMove="{{move}}" onPointerUp="{{up}}" onPointerLeave="{{up}}">
            <sc-for list="{{cp.px}}" as="p" hint-placeholder-count="32">
              <rect class="{{cp.pxClass}}" x="{{p.x}}" y="{{p.y}}" width="{{cp.cell}}" height="{{cp.cell}}" fill="{{p.c}}" opacity="{{p.op}}" stroke="rgba(22,25,31,0.08)" stroke-width="0.5" data-px="{{p.key}}"></rect>
            </sc-for>
            <rect class="sel-rect" x="{{cp.sx}}" y="{{cp.sy}}" width="{{cp.sw}}" height="{{cp.sh}}" fill="rgba(37,99,235,0.08)" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="4 4" opacity="{{cp.sop}}" style="pointer-events: none;"></rect>
          </svg>
        </section>
      </sc-for>
    </main>

    <nav aria-label="편집 도구" style="width: 96px; flex-shrink: 0; box-sizing: border-box; border-left: 1px solid #d8dde5; padding: 12px 8px; display: flex; flex-direction: column; gap: 4px;">
      <sc-for list="{{tools}}" as="t" hint-placeholder-count="5">
        <button type="button" aria-pressed="{{t.pressed}}" onClick="{{t.pick}}" title="{{t.tip}}" style="height: 32px; padding: 0 6px; border: {{t.border}}; border-radius: 6px; background: {{t.bg}}; color: #16191f; font: inherit; font-size: 12.5px; font-weight: {{t.fw}}; cursor: pointer;">{{t.label}}</button>
      </sc-for>
      <span style="height: 1px; background: #d8dde5; margin: 6px 0;"></span>
      <button type="button" onClick="{{copy}}" title="Ctrl+C" style="height: 32px; padding: 0 6px; border: 1px solid #d8dde5; border-radius: 6px; background: #ffffff; color: {{copyColor}}; font: inherit; font-size: 12.5px; cursor: pointer;">복사</button>
      <button type="button" onClick="{{pasteMode}}" title="Ctrl+V — 누른 뒤 놓을 칸을 클릭" style="height: 32px; padding: 0 6px; border: {{pasteBorder}}; border-radius: 6px; background: {{pasteBg}}; color: {{pasteColor}}; font: inherit; font-size: 12.5px; cursor: pointer;">붙여넣기</button>
      <button type="button" onClick="{{fillSel}}" title="선택 영역을 지금 색으로 칠하기" style="height: 44px; padding: 0 6px; border: 1px solid #d8dde5; border-radius: 6px; background: #ffffff; color: {{copyColor}}; font: inherit; font-size: 12.5px; line-height: 1.25; cursor: pointer;">선택 영역<br>칠하기</button>
      <button type="button" onClick="{{undo}}" title="Ctrl+Z" style="height: 32px; padding: 0 6px; border: 1px solid #d8dde5; border-radius: 6px; background: #ffffff; color: {{undoColor}}; font: inherit; font-size: 12.5px; cursor: pointer;">되돌리기</button>
      <span style="font-size: 11.5px; line-height: 1.4; color: #5b6472; margin-top: 6px; word-break: keep-all;">{{status}}</span>
    </nav>

    <aside style="width: 280px; flex-shrink: 0; box-sizing: border-box; border-left: 1px solid #d8dde5; padding: 14px; display: flex; flex-direction: column; gap: 10px; overflow-y: auto;">
      <h3 style="margin: 0; font-size: 14px; font-weight: 600;">팔레트</h3>
      <div style="display: flex; align-items: center; gap: 10px;">
        <span style="width: 36px; height: 36px; border-radius: 8px; border: 1px solid #d8dde5; background: {{color}};"></span>
        <span style="font-family: ui-monospace,'DejaVu Sans Mono',Consolas,Menlo,monospace; font-size: 13px;">{{color}}</span>
        <label style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: #5b6472;">직접 <input type="color" value="{{color}}" onChange="{{setColor}}" aria-label="색 직접 고르기" style="width: 34px; height: 22px; padding: 0; border: 1px solid #d8dde5; border-radius: 4px; background: #ffffff;"></label>
      </div>
      <div style="display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); gap: 4px;">
        <sc-for list="{{palette}}" as="c" hint-placeholder-count="36">
          <button type="button" aria-label="{{c.hex}}" aria-pressed="{{c.pressed}}" onClick="{{c.pick}}" style="height: 24px; border: {{c.border}}; border-radius: 5px; background: {{c.hex}}; cursor: pointer; padding: 0;"></button>
        </sc-for>
      </div>
      <div style="display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); gap: 4px; min-height: 22px;">
        <sc-for list="{{recent}}" as="c" hint-placeholder-count="0">
          <button type="button" aria-label="최근 색 {{c.hex}}" onClick="{{c.pick}}" style="height: 22px; border: 1px solid #d8dde5; border-radius: 5px; background: {{c.hex}}; cursor: pointer; padding: 0;"></button>
        </sc-for>
      </div>

      <section aria-label="{{actLabel}} 기능" style="display: flex; flex-direction: column; gap: 8px; border-top: 1px solid #d8dde5; padding-top: 12px; font-size: 12.5px;">
        <div style="display: flex; align-items: baseline; gap: 6px;">
          <h3 style="margin: 0; font-size: 14px; font-weight: 600;">{{actLabel}}</h3>
          <span style="color: #5b6472;">활성 컴포넌트 기능</span>
        </div>

        <span style="font-weight: 600;">색 한꺼번에 바꾸기 <span style="font-weight: 400; color: #5b6472;">— {{actScope}}</span></span>
        <div style="display: flex; gap: 4px;">
          <sc-for list="{{hues}}" as="hu" hint-placeholder-count="8">
            <button type="button" aria-label="{{hu.name}}으로" title="{{hu.name}}" onClick="{{hu.pick}}" style="flex: 1; height: 22px; border: 1px solid rgba(22,25,31,0.15); border-radius: 4px; background: {{hu.c}}; cursor: pointer; padding: 0;"></button>
          </sc-for>
        </div>
        <label style="display: flex; align-items: center; gap: 8px;"><span style="color: #5b6472; width: 30px;">색상</span><input type="range" min="-180" max="180" step="2" value="{{adjH}}" onChange="{{setH}}" style="flex-grow: 1; min-width: 0; accent-color: #2563eb;"><span style="width: 40px; text-align: right; font-family: ui-monospace,monospace;">{{adjH}}°</span></label>
        <label style="display: flex; align-items: center; gap: 8px;"><span style="color: #5b6472; width: 30px;">채도</span><input type="range" min="-100" max="100" step="2" value="{{adjS}}" onChange="{{setS}}" style="flex-grow: 1; min-width: 0; accent-color: #2563eb;"><span style="width: 40px; text-align: right; font-family: ui-monospace,monospace;">{{adjS}}%</span></label>
        <label style="display: flex; align-items: center; gap: 8px;"><span style="color: #5b6472; width: 30px;">명도</span><input type="range" min="-50" max="50" step="1" value="{{adjL}}" onChange="{{setL}}" style="flex-grow: 1; min-width: 0; accent-color: #2563eb;"><span style="width: 40px; text-align: right; font-family: ui-monospace,monospace;">{{adjL}}</span></label>
        <div style="display: flex; gap: 6px;">
          <button type="button" onClick="{{commitAdj}}" style="height: 28px; padding: 0 10px; border: 1px solid #d8dde5; border-radius: 6px; background: #ffffff; color: {{adjBtn}}; font: inherit; font-size: 12.5px; cursor: pointer;">확정</button>
          <button type="button" onClick="{{cancelAdj}}" style="height: 28px; padding: 0 10px; border: 1px solid #d8dde5; border-radius: 6px; background: #ffffff; color: {{adjBtn}}; font: inherit; font-size: 12.5px; cursor: pointer;">원래대로</button>
        </div>

        <sc-if value="{{showPattern}}" hint-placeholder-val="{{false}}">
          <div style="display: flex; flex-direction: column; gap: 8px; border-top: 1px dashed #d8dde5; padding-top: 10px;">
            <span style="font-weight: 600;">윗면 패턴</span>
            <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px;">
              <sc-for list="{{patTypes}}" as="pt" hint-placeholder-count="4">
                <button type="button" aria-pressed="{{pt.pressed}}" onClick="{{pt.pick}}" style="height: 28px; border: {{pt.border}}; border-radius: 6px; background: {{pt.bg}}; color: #16191f; font: inherit; font-size: 12.5px; font-weight: {{pt.fw}}; cursor: pointer;">{{pt.label}}</button>
              </sc-for>
            </div>
            <label style="display: flex; align-items: center; gap: 8px;"><span style="color: #5b6472; width: 30px;">크기</span><input type="range" min="0.5" max="3" step="0.25" value="{{patScale}}" onChange="{{setPatScale}}" style="flex-grow: 1; min-width: 0; accent-color: #2563eb;"><span style="width: 40px; text-align: right; font-family: ui-monospace,monospace;">×{{patScale}}</span></label>
            <span style="color: #5b6472;">{{patHint}}</span>
          </div>
        </sc-if>

        <sc-if value="{{showLift}}" hint-placeholder-val="{{false}}">
          <div style="display: flex; flex-direction: column; gap: 6px; border-top: 1px dashed #d8dde5; padding-top: 10px;">
            <span style="font-weight: 600;">노드 필드 높이</span>
            <label style="display: flex; align-items: center; gap: 8px;"><input type="range" min="0" max="56" step="2" value="{{lift}}" onChange="{{setLift}}" style="flex-grow: 1; min-width: 0; accent-color: #2563eb;"><span style="width: 44px; text-align: right; font-family: ui-monospace,monospace;">+{{lift}}px</span></label>
            <span style="color: #5b6472;">노드 필드가 솟는 만큼 확장면이 16줄씩 되풀이되어 메웁니다</span>
          </div>
        </sc-if>
      </section>
    </aside>
  </div>
</div>
</script>
<script type="module">
import './src/api/frame-boot.js';   // 첫 import — Terra 안이면 마운트보다 먼저 frame에 hello를 보낸다
import { mount, fit } from './src/runtime/dc.js';
import Screen from './src/screens/field.js';
import { realField } from './src/data/editors-live.js';   // 실데이터 층 — 이 노드의 게이트웨이에서 읽은 값만 보인다
const stage = document.getElementById('stage');
window.__screen = mount(realField(Screen), { template: document.getElementById('view').textContent, target: stage, props: {} });
fit(stage, 1440, 900);

</script>
</body>
</html>
