<style>
body{margin:0;font-family:'Noto Sans KR','Noto Sans',system-ui,'Segoe UI',-apple-system,sans-serif;background:#f4f6f9}
@keyframes ring-march{to{stroke-dashoffset:-24}}
.cp-march{animation:ring-march 900ms linear infinite}
@keyframes cp-spin{to{transform:rotate(360deg)}}
.cp-spin{animation:cp-spin 900ms linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes lg-pop{0%{transform:translateY(105%)}70%{transform:translateY(-4%)}100%{transform:translateY(0)}}
.cp-pop{animation:lg-pop 360ms cubic-bezier(.2,.8,.3,1) both}
@keyframes cp-in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.cp-in{animation:cp-in 220ms cubic-bezier(.2,.8,.3,1) both}
.cp-btn{transition:background 120ms,border-color 120ms,color 120ms,box-shadow 120ms}
.cp-btn:hover{box-shadow:0 2px 8px rgba(22,25,31,0.10)}
.cp-badge{transition:transform 220ms cubic-bezier(.2,.8,.3,1),opacity 180ms}
</style>
<style>
html,body{margin:0;background:#dfe3ea}
.frame{margin:12px auto;overflow:hidden;box-shadow:0 6px 24px rgba(22,25,31,0.16);border-radius:6px}
#stage{width:1600px;height:2600px;transform-origin:0 0;background:#ffffff}
</style>

  <!-- ─────────── 1행: 잠김 · 작업 진행 ─────────── -->
  <div style="display: flex; gap: 20px;">

    <!-- 1. 권한 잠금 -->
    <section aria-label="권한 잠금" style="flex: 1 1 0; min-width: 0; background: #ffffff; border: 1px solid #d8dde5; border-radius: 12px; padding: 20px 24px; display: flex; flex-direction: column; gap: 18px;">
      <div style="display: flex; align-items: center; gap: 10px;">
        <span style="width: 24px; height: 24px; border-radius: 50%; background: #16191f; color: #ffffff; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center;">1</span>
        <h2 style="margin: 0; font-size: 16px; font-weight: 600;">권한 잠금</h2>
        <span style="font-size: 12.5px; color: #5b6472;">카탈로그에 없으면 그리지 않고, 있는데 권한이 모자라면 자물쇠</span>
        <span style="flex-grow: 1;"></span>
        <button type="button" class="cp-btn" onClick="{{toggleGrant}}" style="height: 30px; padding: 0 12px; border: 1px solid {{grantBorder}}; border-radius: 15px; background: {{grantBg}}; color: {{grantFg}}; font: inherit; font-size: 12.5px; cursor: pointer; display: flex; align-items: center; gap: 6px;"><span style="width: 8px; height: 8px; border-radius: 50%; background: {{grantDot}};"></span>module.manage {{grantLabel}}</button>
      </div>

      <!-- 버튼 5상태 -->
      <div style="display: flex; flex-direction: column; gap: 8px;">
        <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.06em; color: #5b6472;">버튼</span>
        <div style="display: flex; gap: 20px; align-items: flex-start;">
          <sc-for list="{{btns}}" as="b" hint-placeholder-count="5">
            <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; position: relative;">
              <div style="position: relative;" onPointerEnter="{{b.enter}}" onPointerLeave="{{b.leave}}">
                <button type="button" class="cp-btn" aria-disabled="{{b.dis}}" style="height: 36px; min-width: 104px; padding: 0 14px; border: {{b.border}}; border-radius: 8px; background: {{b.bg}}; color: {{b.fg}}; font: inherit; font-size: 13px; font-weight: {{b.fw}}; cursor: {{b.cursor}}; display: flex; align-items: center; justify-content: center; gap: 6px;">{{b.text}}</button>
                <span class="cp-badge" aria-hidden="true" style="position: absolute; right: -7px; top: -7px; width: 20px; height: 20px; box-sizing: border-box; border-radius: 50%; background: #a65f00; border: 2px solid #ffffff; display: flex; align-items: center; justify-content: center; transform: scale({{b.badgeS}}); opacity: {{b.badgeO}};">
                  <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M7 11V8a5 5 0 0 1 10 0v3M5 11h14v10H5z"></path></svg>
                </span>
                <sc-if value="{{b.tipOn}}" hint-placeholder-val="{{false}}">
                  <div class="cp-in" role="tooltip" style="position: absolute; left: 50%; top: 44px; transform: translateX(-50%); z-index: 3; white-space: nowrap; padding: 5px 10px; border-radius: 12px; background: #16191f; color: #ffffff; font-size: 12px; pointer-events: none;">{{b.tip}}</div>
                </sc-if>
              </div>
              <span style="font-size: 12px; color: #5b6472; margin-top: {{b.capGap}}px;">{{b.cap}}</span>
            </div>
          </sc-for>
        </div>
      </div>

      <div style="display: flex; gap: 28px; align-items: stretch;">
        <!-- 원형 메뉴에 적용 -->
        <div style="display: flex; flex-direction: column; gap: 8px;">
          <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.06em; color: #5b6472;">원형 메뉴</span>
          <div style="position: relative; width: 236px; height: 236px;">
            <div aria-hidden="true" style="position: absolute; left: 10px; top: 10px; width: 216px; height: 216px; border-radius: 50%; background: radial-gradient(circle, rgba(22,25,31,0.10) 0%, rgba(22,25,31,0.04) 60%, rgba(22,25,31,0) 72%);"></div>
            <sc-for list="{{rmItems}}" as="it" hint-placeholder-count="6">
              <div style="position: absolute; left: {{it.x}}px; top: {{it.y}}px; width: {{it.size}}px; height: {{it.size}}px; transform: translate(-50%,-50%);">
                <span style="width: 100%; height: 100%; box-sizing: border-box; border-radius: 50%; border: {{it.border}}; background: {{it.bg}}; color: {{it.fg}}; box-shadow: {{it.shadow}}; display: flex; align-items: center; justify-content: center;">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{it.icon}}"></path></svg>
                </span>
                <span class="cp-badge" aria-hidden="true" style="position: absolute; right: -4px; bottom: -4px; width: 18px; height: 18px; box-sizing: border-box; border-radius: 50%; background: {{it.badgeBg}}; border: 2px solid #ffffff; display: flex; align-items: center; justify-content: center; transform: scale({{it.badgeS}}); opacity: {{it.badgeO}};">
                  <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="{{it.badgeIcon}}"></path></svg>
                </span>
              </div>
            </sc-for>
            <span style="position: absolute; left: 118px; top: 118px; width: 34px; height: 34px; transform: translate(-50%,-50%); border-radius: 50%; background: #c0303f; color: #ffffff; box-shadow: 0 2px 8px rgba(22,25,31,0.25); display: flex; align-items: center; justify-content: center; font-size: 15px;">×</span>
          </div>
          <span style="align-self: center; margin-top: -6px; white-space: nowrap; padding: 3px 10px; border-radius: 12px; background: #16191f; color: #ffffff; font-size: 12px;">{{rmLabel}}</span>
        </div>

        <!-- 권한 칩 + 규칙 -->
        <div style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 14px;">
          <div style="display: flex; flex-direction: column; gap: 8px;">
            <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.06em; color: #5b6472;">권한 칩 — 관리 노드 창 펼침 영역</span>
            <div style="display: flex; flex-wrap: wrap; gap: 6px;">
              <sc-for list="{{perms}}" as="p" hint-placeholder-count="6">
                <span style="height: 26px; box-sizing: border-box; padding: 0 10px; border-radius: 13px; border: 1px solid {{p.border}}; background: {{p.bg}}; color: {{p.fg}}; font-size: 12px; font-family: ui-monospace,'DejaVu Sans Mono',Consolas,Menlo,monospace; display: flex; align-items: center; gap: 6px; transition: background 200ms, border-color 200ms, color 200ms;">
                  <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{p.icon}}"></path></svg>{{p.name}}
                </span>
              </sc-for>
            </div>
          </div>
          <div style="display: flex; flex-direction: column; gap: 6px; padding: 12px 14px; border-radius: 8px; background: #f4f6f9; font-size: 12.5px; color: #16191f;">
            <sc-for list="{{lockRules}}" as="r" hint-placeholder-count="4">
              <div style="display: flex; gap: 8px;"><span style="flex-shrink: 0; width: 64px; color: {{r.c}}; font-weight: 600;">{{r.k}}</span><span style="color: #5b6472;">{{r.v}}</span></div>
            </sc-for>
          </div>
        </div>
      </div>
    </section>

    <!-- 3. 작업 진행 -->
    <section aria-label="작업 진행" style="width: 620px; flex-shrink: 0; background: #ffffff; border: 1px solid #d8dde5; border-radius: 12px; padding: 20px 24px; display: flex; flex-direction: column; gap: 18px;">
      <div style="display: flex; align-items: center; gap: 10px;">
        <span style="width: 24px; height: 24px; border-radius: 50%; background: #16191f; color: #ffffff; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center;">3</span>
        <h2 style="margin: 0; font-size: 16px; font-weight: 600;">작업 진행</h2>
        <span style="font-size: 12.5px; color: #5b6472;">로그인 링을 작게 — 접수 뒤엔 링이 결과를 들고 온다</span>
      </div>
      <div style="display: flex; justify-content: space-between;">
        <sc-for list="{{rings}}" as="r" hint-placeholder-count="5">
          <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; width: 96px;">
            <svg width="64" height="64" viewBox="-32 -32 64 64" aria-hidden="true">
              <circle r="26" fill="none" stroke="{{r.track}}" stroke-width="5"></circle>
              <g class="{{r.spin}}"><circle r="26" fill="none" stroke="{{r.c}}" stroke-width="5" stroke-linecap="round" stroke-dasharray="{{r.dash}}" class="{{r.march}}" transform="rotate(-90)"></circle></g>
              <path d="{{r.glyph}}" fill="none" stroke="{{r.c}}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path>
              <text x="0" y="4.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="{{r.c}}" font-family="ui-monospace,'DejaVu Sans Mono',Consolas,Menlo,monospace">{{r.txt}}</text>
            </svg>
            <span style="font-size: 13px; font-weight: 600;">{{r.name}}</span>
            <span style="font-size: 11.5px; color: #5b6472; text-align: center; line-height: 1.4;">{{r.say}}</span>
          </div>
        </sc-for>
      </div>

      <div style="display: flex; gap: 16px; align-items: center; padding: 14px 16px; border: 1px solid #d8dde5; border-radius: 10px;">
        <svg width="72" height="72" viewBox="-36 -36 72 72" aria-label="작업 진행률">
          <circle r="30" fill="none" stroke="{{job.track}}" stroke-width="6"></circle>
          <g class="{{job.spin}}"><circle r="30" fill="none" stroke="{{job.c}}" stroke-width="6" stroke-linecap="round" stroke-dasharray="{{job.dash}}" class="{{job.march}}" transform="rotate(-90)" style="transition: stroke-dasharray 260ms ease-out, stroke 200ms;"></circle></g>
          <path d="{{job.glyph}}" fill="none" stroke="{{job.c}}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path>
          <text x="0" y="5" text-anchor="middle" font-size="14" font-weight="700" fill="{{job.c}}" font-family="ui-monospace,'DejaVu Sans Mono',Consolas,Menlo,monospace">{{job.txt}}</text>
        </svg>
        <div style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 2px;">
          <span style="font-size: 12px; color: #5b6472; font-family: ui-monospace,'DejaVu Sans Mono',Consolas,Menlo,monospace;">modules.by-module-id.restart.post · #J-2032</span>
          <span style="font-weight: 600;">chat 재시작 — <span style="color: {{job.c}};">{{job.state}}</span></span>
          <span style="font-size: 12.5px; color: #5b6472;">{{job.say}}</span>
        </div>
        <div style="display: flex; flex-direction: column; gap: 6px;">
          <button type="button" class="cp-btn" onClick="{{runJob}}" style="height: 32px; padding: 0 14px; border: 0; border-radius: 8px; background: #2563eb; color: #ffffff; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer;">{{job.runLabel}}</button>
          <button type="button" class="cp-btn" onClick="{{toggleFail}}" style="height: 28px; padding: 0 10px; border: 1px solid #d8dde5; border-radius: 8px; background: #ffffff; color: {{failFg}}; font: inherit; font-size: 12px; cursor: pointer;">{{failLabel}}</button>
          <button type="button" class="cp-btn" onClick="{{cancelJob}}" style="display: {{job.cancelDisp}}; height: 28px; padding: 0 10px; border: 1px solid #d8dde5; border-radius: 8px; background: #ffffff; color: #d33d52; font: inherit; font-size: 12px; cursor: pointer;">취소</button>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px;">
        <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.06em; color: #5b6472;">목록 안의 작은 표시 · 최근 알림 줄</span>
        <div style="display: flex; gap: 8px; flex-wrap: wrap;">
          <sc-for list="{{chips}}" as="c" hint-placeholder-count="4">
            <span style="height: 26px; box-sizing: border-box; padding: 0 10px 0 6px; border-radius: 13px; border: 1px solid #d8dde5; background: #ffffff; font-size: 12px; display: flex; align-items: center; gap: 6px;">
              <svg width="16" height="16" viewBox="-8 -8 16 16" aria-hidden="true"><circle r="6" fill="none" stroke="{{c.track}}" stroke-width="2.4"></circle><circle r="6" fill="none" stroke="{{c.c}}" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="{{c.dash}}" class="{{c.march}}" transform="rotate(-90)"></circle></svg>
              <span style="font-family: ui-monospace,'DejaVu Sans Mono',Consolas,Menlo,monospace; color: #5b6472;">{{c.id}}</span><span style="color: {{c.c}}; font-weight: 600;">{{c.t}}</span>
            </span>
          </sc-for>
        </div>
        <div aria-live="polite" style="border-top: 1px solid #d8dde5; padding-top: 8px; display: flex; flex-direction: column; gap: 3px; font-size: 12.5px; min-height: 84px;">
          <sc-for list="{{log}}" as="l" hint-placeholder-count="3">
            <span class="cp-in"><span style="color: #5b6472; font-family: ui-monospace,'DejaVu Sans Mono',Consolas,Menlo,monospace;">{{l.t}}</span>&nbsp;&nbsp;<span style="color: {{l.c}};">{{l.g}}</span> {{l.m}}</span>
          </sc-for>
        </div>
      </div>
    </section>
  </div>

  <!-- ─────────── 2. 위험 확인 창 ─────────── -->
  <section aria-label="위험 확인 창" style="background: #ffffff; border: 1px solid #d8dde5; border-radius: 12px; padding: 20px 24px; display: flex; flex-direction: column; gap: 16px;">
    <div style="display: flex; align-items: center; gap: 10px;">
      <span style="width: 24px; height: 24px; border-radius: 50%; background: #16191f; color: #ffffff; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center;">2</span>
      <h2 style="margin: 0; font-size: 16px; font-weight: 600;">위험 확인 창</h2>
      <span style="font-size: 12.5px; color: #5b6472;">로그인 창과 같은 창 — 누른 자리 뒤에서 위로 튀어 나오고, 닫으면 다시 내려간다. 무게에 따라 확인 방식만 바뀐다</span>
      <span style="flex-grow: 1;"></span>
      <button type="button" class="cp-btn" onClick="{{replayPop}}" style="height: 30px; padding: 0 12px; border: 1px solid #d8dde5; border-radius: 15px; background: #ffffff; color: #16191f; font: inherit; font-size: 12.5px; cursor: pointer;">↻ 등장 다시 보기</button>
    </div>
    <div style="display: flex; gap: 24px; align-items: flex-end; padding: 24px 24px 0; border-radius: 10px; background: linear-gradient(#f4f6f9, #eef1f5); overflow: hidden;">
      <sc-for list="{{dialogs}}" as="d" hint-placeholder-count="3">
        <div style="display: flex; flex-direction: column; gap: 10px; width: 336px; flex-shrink: 0;">
          <div style="display: flex; align-items: center; gap: 8px;">
            <span style="font-size: 13px; font-weight: 600;">{{d.mode}}</span>
            <span style="font-size: 12px; color: #5b6472;">{{d.when}}</span>
          </div>
          <div style="height: {{d.boxH}}px; position: relative; overflow: hidden;">
            <div class="{{popClass}}" role="dialog" aria-label="{{d.title}}" style="position: absolute; left: 0; bottom: 0; width: 336px; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px; padding: 16px 20px 20px; background: #ffffff; border: 1px solid #d8dde5; border-bottom: 0; border-radius: 12px 12px 0 0; box-shadow: 0 12px 32px rgba(22,25,31,0.18); animation-delay: {{d.delay}};">
              <div style="display: flex; align-items: center; gap: 10px; padding-right: 24px;">
                <span style="width: 28px; height: 28px; flex-shrink: 0; border-radius: 50%; background: {{d.iconBg}}; color: #ffffff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px;">!</span>
                <span style="font-size: 15px; font-weight: 700;">{{d.title}}</span>
              </div>
              <span style="position: absolute; right: 8px; top: 8px; width: 28px; height: 28px; border-radius: 6px; color: #5b6472; font-size: 18px; display: flex; align-items: center; justify-content: center;">×</span>
              <div style="display: grid; grid-template-columns: 64px 1fr; row-gap: 6px; column-gap: 10px; font-size: 13px;">
                <sc-for list="{{d.rows}}" as="r" hint-placeholder-count="4">
                  <span style="color: #5b6472; font-size: 12px; padding-top: 1px;">{{r.k}}</span>
                  <span><span style="color: {{r.gc}};">{{r.g}}</span> {{r.v}}</span>
                </sc-for>
              </div>

              <sc-if value="{{d.isA}}" hint-placeholder-val="{{true}}">
                <div style="display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px;">
                  <sc-if value="{{d.accepted}}" hint-placeholder-val="{{false}}">
                    <span class="cp-in" style="flex-grow: 1; align-self: center; font-size: 12.5px; color: #2563eb;">◇ 접수됨 — 작업 #J-2033</span>
                  </sc-if>
                  <button type="button" class="cp-btn" style="height: 44px; padding: 0 16px; border: 1px solid #d8dde5; border-radius: 8px; background: #ffffff; color: #16191f; font: inherit; font-size: 14px; cursor: pointer;">취소</button>
                  <button type="button" class="cp-btn" onClick="{{d.go}}" style="height: 44px; min-width: 104px; padding: 0 18px; border: 0; border-radius: 8px; background: #d33d52; color: #ffffff; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer;">{{d.action}}</button>
                </div>
              </sc-if>

              <sc-if value="{{d.isB}}" hint-placeholder-val="{{false}}">
                <label style="display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; color: #5b6472;">
                  <span>확인하려면 <b style="color: #16191f; font-family: ui-monospace,'DejaVu Sans Mono',Consolas,Menlo,monospace;">agent</b> 입력</span>
                  <input type="text" value="{{typed}}" onChange="{{setTyped}}" spellcheck="false" style="height: 44px; box-sizing: border-box; padding: 0 12px; border: 1px solid {{typedBorder}}; border-radius: 8px; font: inherit; font-size: 14px; font-family: ui-monospace,'DejaVu Sans Mono',Consolas,Menlo,monospace; color: #16191f; outline: none;">
                </label>
                <div style="display: flex; justify-content: flex-end; gap: 8px;">
                  <button type="button" class="cp-btn" style="height: 44px; padding: 0 16px; border: 1px solid #d8dde5; border-radius: 8px; background: #ffffff; color: #16191f; font: inherit; font-size: 14px; cursor: pointer;">취소</button>
                  <button type="button" class="cp-btn" aria-disabled="{{typedDis}}" style="height: 44px; min-width: 104px; padding: 0 18px; border: 0; border-radius: 8px; background: #d33d52; color: #ffffff; font: inherit; font-size: 14px; font-weight: 600; cursor: {{typedCursor}}; opacity: {{typedOp}}; transition: opacity 160ms;">{{d.action}}</button>
                </div>
              </sc-if>

              <sc-if value="{{d.isC}}" hint-placeholder-val="{{false}}">
                <button type="button" onPointerDown="{{holdDown}}" onPointerUp="{{holdUp}}" onPointerLeave="{{holdUp}}" style="position: relative; overflow: hidden; height: 48px; width: 100%; border: 1px solid #d33d52; border-radius: 8px; background: #ffffff; color: {{holdFg}}; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; touch-action: none; margin-top: 4px;">
                  <span aria-hidden="true" style="position: absolute; left: 0; top: 0; bottom: 0; width: {{holdW}}; background: #d33d52; transition: {{holdTrans}};"></span>
                  <span style="position: relative;">{{holdText}}</span>
                </button>
                <span style="font-size: 12px; color: #5b6472; margin-top: -4px;">손을 떼면 멈추고 처음으로 돌아간다</span>
              </sc-if>
            </div>
          </div>
        </div>
      </sc-for>

      <div style="flex: 1 1 0; min-width: 0; align-self: stretch; display: flex; flex-direction: column; gap: 10px; padding-bottom: 24px; font-size: 12.5px;">
        <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.06em; color: #5b6472;">창 안의 네 줄 — 항상 같은 순서</span>
        <sc-for list="{{confirmRules}}" as="r" hint-placeholder-count="4">
          <div style="display: flex; gap: 8px;"><span style="flex-shrink: 0; width: 64px; font-weight: 600;">{{r.k}}</span><span style="color: #5b6472;">{{r.v}}</span></div>
        </sc-for>
        <div style="margin-top: 6px; padding: 10px 12px; border-radius: 8px; background: #ffffff; border: 1px solid #d8dde5; color: #5b6472; line-height: 1.6;">
          확인 방식은 카탈로그의 <span style="font-family: ui-monospace,'DejaVu Sans Mono',Consolas,Menlo,monospace; color: #16191f;">confirmationMode</span>로 고른다. 선언이 없는 위험 operation <b style="color: #16191f;">8건</b>은 GUI가 기본으로 <b style="color: #16191f;">확인 한 번</b>을 붙인다.
        </div>
      </div>
    </div>
  </section>

  <!-- ─────────── 4. 빈 상태 · 오류 상태 ─────────── -->
  <section aria-label="빈 상태와 오류 상태" style="background: #ffffff; border: 1px solid #d8dde5; border-radius: 12px; padding: 20px 24px; display: flex; flex-direction: column; gap: 16px;">
    <div style="display: flex; align-items: center; gap: 10px;">
      <span style="width: 24px; height: 24px; border-radius: 50%; background: #16191f; color: #ffffff; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center;">4</span>
      <h2 style="margin: 0; font-size: 16px; font-weight: 600;">빈 상태 · 오류 상태</h2>
      <span style="font-size: 12.5px; color: #5b6472;">필드의 빈 타일 자리 — 왜 비었는지와 할 수 있는 한 가지만 적는다</span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px;">
      <sc-for list="{{empties}}" as="e" hint-placeholder-count="6">
        <div style="display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px; padding: 22px 14px 18px; border: 1px {{e.lineStyle}} {{e.line}}; border-radius: 10px; background: {{e.bg}};">
          <svg width="64" height="64" viewBox="-32 -32 64 64" aria-hidden="true">
            <path d="M0 -27 L23.4 -13.5 L23.4 13.5 L0 27 L-23.4 13.5 L-23.4 -13.5 Z" fill="{{e.hexFill}}" stroke="{{e.c}}" stroke-width="2" stroke-dasharray="{{e.hexDash}}" stroke-linejoin="round"></path>
            <path d="{{e.icon}}" fill="none" stroke="{{e.c}}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" transform="translate(-12 -12)"></path>
          </svg>
          <span style="font-size: 14px; font-weight: 600;">{{e.title}}</span>
          <span style="font-size: 11.5px; font-family: ui-monospace,'DejaVu Sans Mono',Consolas,Menlo,monospace; color: {{e.c}};">{{e.code}}</span>
          <span style="font-size: 12.5px; color: #5b6472; line-height: 1.5; min-height: 56px;">{{e.say}}</span>
          <button type="button" class="cp-btn" style="display: {{e.btnDisp}}; height: 30px; padding: 0 12px; border: 1px solid #d8dde5; border-radius: 6px; background: #ffffff; color: {{e.btnFg}}; font: inherit; font-size: 12.5px; cursor: pointer;">{{e.btn}}</button>
        </div>
      </sc-for>
    </div>
  </section>

  <!-- ─────────── 5. 스키마 기반 자동 폼 ─────────── -->
  <section aria-label="자동 폼" style="flex-grow: 1; background: #ffffff; border: 1px solid #d8dde5; border-radius: 12px; padding: 20px 24px; display: flex; flex-direction: column; gap: 16px;">
    <div style="display: flex; align-items: center; gap: 10px;">
      <span style="width: 24px; height: 24px; border-radius: 50%; background: #16191f; color: #ffffff; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center;">5</span>
      <h2 style="margin: 0; font-size: 16px; font-weight: 600;">스키마 기반 자동 폼</h2>
      <span style="font-size: 12.5px; color: #5b6472;">config.schema · catalog 입력 스키마 · cli 명령 명세를 같은 부품으로 그린다</span>
    </div>
    <div style="display: flex; gap: 24px; align-items: flex-start;">

      <div style="width: 700px; flex-shrink: 0; border: 1px solid #d8dde5; border-radius: 10px; box-shadow: 0 4px 16px rgba(22,25,31,0.08); display: flex; flex-direction: column;">
        <div style="display: flex; align-items: center; gap: 10px; padding: 14px 20px; border-bottom: 1px solid #d8dde5;">
          <span style="font-size: 15px; font-weight: 700;">Daemon 설정</span>
          <span style="font-size: 12px; color: #5b6472; font-family: ui-monospace,'DejaVu Sans Mono',Consolas,Menlo,monospace;">leaf-desk-01 · config.get</span>
          <span style="flex-grow: 1;"></span>
          <span style="font-size: 12px; color: {{f.changedC}};">{{f.changedTxt}}</span>
        </div>

        <div style="display: flex; flex-direction: column; gap: 14px; padding: 16px 20px;">
          <!-- string -->
          <div style="display: grid; grid-template-columns: 150px 1fr; gap: 12px; align-items: start; padding-left: 10px; border-left: 3px solid {{f.name.bar}};">
            <span style="font-size: 13px; padding-top: 8px;">장치 이름 <span style="color: #d33d52;">*</span></span>
            <div style="display: flex; flex-direction: column; gap: 4px;">
              <input type="text" value="{{f.name.v}}" onChange="{{f.name.set}}" spellcheck="false" style="height: 36px; box-sizing: border-box; padding: 0 12px; border: 1px solid {{f.name.border}}; border-radius: 8px; font: inherit; font-size: 14px; color: #16191f; outline: none;">
              <span style="font-size: 12px; color: {{f.name.msgC}};">{{f.name.msg}}</span>
            </div>
          </div>
          <!-- integer + unit -->
          <div style="display: grid; grid-template-columns: 150px 1fr; gap: 12px; align-items: start; padding-left: 10px; border-left: 3px solid {{f.port.bar}};">
            <span style="font-size: 13px; padding-top: 8px;">Local API 포트</span>
            <div style="display: flex; flex-direction: column; gap: 4px;">
              <div style="display: flex; align-items: center; gap: 8px;">
                <div style="display: flex; height: 36px; box-sizing: border-box; border: 1px solid {{f.port.border}}; border-radius: 8px; overflow: hidden;">
                  <button type="button" onClick="{{f.port.dec}}" style="width: 32px; border: 0; border-right: 1px solid #d8dde5; background: #f4f6f9; color: #5b6472; font: inherit; font-size: 16px; cursor: pointer;">−</button>
                  <input type="text" inputmode="numeric" value="{{f.port.v}}" onChange="{{f.port.set}}" style="width: 88px; border: 0; padding: 0 10px; font: inherit; font-size: 14px; font-family: ui-monospace,'DejaVu Sans Mono',Consolas,Menlo,monospace; color: #16191f; text-align: center; outline: none;">
                  <button type="button" onClick="{{f.port.inc}}" style="width: 32px; border: 0; border-left: 1px solid #d8dde5; background: #f4f6f9; color: #5b6472; font: inherit; font-size: 16px; cursor: pointer;">+</button>
                </div>
                <span style="font-size: 12px; color: #5b6472;">1024 – 65535</span>
                <span style="flex-grow: 1;"></span>
                <button type="button" onClick="{{f.port.reset}}" style="display: {{f.port.resetDisp}}; height: 26px; padding: 0 8px; border: 0; background: transparent; color: #2563eb; font: inherit; font-size: 12px; cursor: pointer;">기본값 7780으로</button>
              </div>
              <span style="font-size: 12px; color: {{f.port.msgC}};">{{f.port.msg}}</span>
            </div>
          </div>
          <!-- enum -->
          <div style="display: grid; grid-template-columns: 150px 1fr; gap: 12px; align-items: center; padding-left: 10px; border-left: 3px solid {{f.level.bar}};">
            <span style="font-size: 13px;">로그 수준</span>
            <div role="radiogroup" aria-label="로그 수준" style="display: flex; width: fit-content; height: 36px; box-sizing: border-box; border: 1px solid #c3cad5; border-radius: 8px; padding: 3px; gap: 2px; background: #f4f6f9;">
              <sc-for list="{{f.level.opts}}" as="o" hint-placeholder-count="4">
                <button type="button" role="radio" aria-checked="{{o.on}}" onClick="{{o.pick}}" style="height: 28px; padding: 0 14px; border: 0; border-radius: 6px; background: {{o.bg}}; color: {{o.fg}}; font: inherit; font-size: 13px; font-weight: {{o.fw}}; box-shadow: {{o.sh}}; cursor: pointer; transition: background 140ms, color 140ms;">{{o.v}}</button>
              </sc-for>
            </div>
          </div>
          <!-- boolean -->
          <div style="display: grid; grid-template-columns: 150px 1fr; gap: 12px; align-items: center; padding-left: 10px; border-left: 3px solid {{f.auto.bar}};">
            <span style="font-size: 13px;">자동 재연결</span>
            <div style="display: flex; align-items: center; gap: 10px;">
              <button type="button" role="switch" aria-checked="{{f.auto.on}}" onClick="{{f.auto.toggle}}" style="position: relative; width: 40px; height: 22px; border: 0; border-radius: 11px; background: {{f.auto.bg}}; cursor: pointer; padding: 0; transition: background 160ms;">
                <span style="position: absolute; top: 3px; left: {{f.auto.x}}px; width: 16px; height: 16px; border-radius: 50%; background: #ffffff; box-shadow: 0 1px 3px rgba(22,25,31,0.3); transition: left 160ms cubic-bezier(.2,.8,.3,1);"></span>
              </button>
              <span style="font-size: 13px; color: #5b6472;">{{f.auto.txt}}</span>
            </div>
          </div>
          <!-- array -->
          <div style="display: grid; grid-template-columns: 150px 1fr; gap: 12px; align-items: start; padding-left: 10px; border-left: 3px solid {{f.hosts.bar}};">
            <span style="font-size: 13px; padding-top: 8px;">허용 주소</span>
            <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px; min-height: 36px; box-sizing: border-box; padding: 4px 6px; border: 1px solid #c3cad5; border-radius: 8px;">
              <sc-for list="{{f.hosts.items}}" as="h" hint-placeholder-count="2">
                <span style="height: 26px; box-sizing: border-box; padding: 0 4px 0 10px; border-radius: 6px; background: #eef3fb; border: 1px solid #c7d7f5; font-size: 12.5px; font-family: ui-monospace,'DejaVu Sans Mono',Consolas,Menlo,monospace; display: flex; align-items: center; gap: 4px;">{{h.v}}<button type="button" aria-label="{{h.v}} 빼기" onClick="{{h.rm}}" style="width: 20px; height: 20px; border: 0; border-radius: 4px; background: transparent; color: #5b6472; font: inherit; font-size: 14px; cursor: pointer; padding: 0;">×</button></span>
              </sc-for>
              <input type="text" value="{{f.hosts.draft}}" onChange="{{f.hosts.setDraft}}" onKeyDown="{{f.hosts.key}}" placeholder="주소 입력 후 Enter" spellcheck="false" style="flex: 1 1 120px; min-width: 120px; height: 26px; border: 0; padding: 0 4px; font: inherit; font-size: 13px; font-family: ui-monospace,'DejaVu Sans Mono',Consolas,Menlo,monospace; color: #16191f; outline: none;">
            </div>
          </div>
          <!-- secret -->
          <div style="display: grid; grid-template-columns: 150px 1fr; gap: 12px; align-items: center; padding-left: 10px; border-left: 3px solid transparent;">
            <span style="font-size: 13px;">등록 토큰</span>
            <div style="display: flex; align-items: center; gap: 8px;">
              <span style="height: 36px; flex: 1 1 0; box-sizing: border-box; padding: 0 12px; border: 1px solid #c3cad5; border-radius: 8px; background: #f4f6f9; display: flex; align-items: center; font-size: 13.5px; font-family: ui-monospace,'DejaVu Sans Mono',Consolas,Menlo,monospace; color: #5b6472; letter-spacing: {{f.secret.ls}};">{{f.secret.v}}</span>
              <button type="button" onClick="{{f.secret.toggle}}" style="height: 36px; padding: 0 12px; border: 1px solid #d8dde5; border-radius: 8px; background: #ffffff; color: #16191f; font: inherit; font-size: 12.5px; cursor: pointer;">{{f.secret.btn}}</button>
              <button type="button" style="height: 36px; padding: 0 12px; border: 1px solid #d8dde5; border-radius: 8px; background: #ffffff; color: #16191f; font: inherit; font-size: 12.5px; cursor: pointer;">새로 쓰기</button>
            </div>
          </div>
          <!-- object group + managed(read-only) -->
          <fieldset style="margin: 0; padding: 10px 14px 12px; border: 1px solid #d8dde5; border-radius: 8px; display: flex; flex-direction: column; gap: 10px;">
            <legend style="padding: 0 6px; font-size: 12px; color: #5b6472; font-family: ui-monospace,'DejaVu Sans Mono',Consolas,Menlo,monospace;">heartbeat</legend>
            <div style="display: grid; grid-template-columns: 136px 1fr; gap: 12px; align-items: center;">
              <span style="font-size: 13px;">주기</span>
              <div style="display: flex; align-items: center; gap: 8px;">
                <span style="height: 36px; width: 96px; box-sizing: border-box; padding: 0 12px; border: 1px solid #c3cad5; border-radius: 8px; display: flex; align-items: center; font-size: 14px; font-family: ui-monospace,'DejaVu Sans Mono',Consolas,Menlo,monospace;">15</span>
                <span style="font-size: 13px; color: #5b6472;">초</span>
              </div>
            </div>
            <div style="display: grid; grid-template-columns: 136px 1fr; gap: 12px; align-items: center;">
              <span style="font-size: 13px; color: #5b6472;">보고 대상</span>
              <div style="display: flex; align-items: center; gap: 8px;">
                <span style="height: 36px; flex: 1 1 0; box-sizing: border-box; padding: 0 12px; border: 1px dashed #c3cad5; border-radius: 8px; display: flex; align-items: center; font-size: 13.5px; font-family: ui-monospace,'DejaVu Sans Mono',Consolas,Menlo,monospace; color: #5b6472;">상위 tree (Master가 정함)</span>
                <span style="font-size: 12px; color: #5b6472; white-space: nowrap;">읽기 전용</span>
              </div>
            </div>
          </fieldset>
        </div>

        <sc-if value="{{f.applyAsk}}" hint-placeholder-val="{{false}}">
          <div class="cp-in" style="margin: 0 20px 12px; padding: 10px 14px; border: 1px solid #d33d52; border-radius: 8px; background: #fcf1f2; display: flex; align-items: center; gap: 10px; font-size: 13px;">
            <span style="color: #d33d52; font-weight: 700;">!</span>
            <span style="flex-grow: 1;">적용하면 런타임에 바로 반영됩니다 — Local API가 잠깐 끊길 수 있음</span>
            <button type="button" onClick="{{f.applyNo}}" style="height: 30px; padding: 0 12px; border: 1px solid #d8dde5; border-radius: 6px; background: #ffffff; color: #16191f; font: inherit; font-size: 12.5px; cursor: pointer;">취소</button>
            <button type="button" onClick="{{f.applyYes}}" style="height: 30px; padding: 0 12px; border: 0; border-radius: 6px; background: #d33d52; color: #ffffff; font: inherit; font-size: 12.5px; font-weight: 600; cursor: pointer;">적용</button>
          </div>
        </sc-if>

        <div style="display: flex; align-items: center; gap: 12px; padding: 12px 20px; border-top: 1px solid #d8dde5; background: #f4f6f9; border-radius: 0 0 10px 10px;">
          <div style="display: flex; align-items: center; gap: 4px;">
            <sc-for list="{{f.steps}}" as="s" hint-placeholder-count="4">
              <span style="display: flex; align-items: center; gap: 4px; font-size: 12.5px; color: {{s.fg}}; font-weight: {{s.fw}};"><span style="width: 18px; height: 18px; border-radius: 50%; background: {{s.dotBg}}; color: {{s.dotFg}}; font-size: 11px; display: flex; align-items: center; justify-content: center; border: 1px solid {{s.dotLine}};">{{s.n}}</span>{{s.label}}<span style="color: #c3cad5; margin: 0 4px; display: {{s.sepDisp}};">—</span></span>
            </sc-for>
          </div>
          <span style="flex-grow: 1;"></span>
          <button type="button" onClick="{{f.revert}}" style="height: 32px; padding: 0 12px; border: 0; background: transparent; color: #5b6472; font: inherit; font-size: 13px; cursor: pointer;">모두 되돌리기</button>
          <button type="button" class="cp-btn" onClick="{{f.validate}}" style="height: 32px; padding: 0 14px; border: 1px solid #d8dde5; border-radius: 8px; background: #ffffff; color: #16191f; font: inherit; font-size: 13px; cursor: pointer;">검증</button>
          <button type="button" class="cp-btn" onClick="{{f.save}}" aria-disabled="{{f.saveDis}}" style="height: 32px; padding: 0 14px; border: 0; border-radius: 8px; background: #2563eb; color: #ffffff; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; opacity: {{f.saveOp}};">저장</button>
          <button type="button" class="cp-btn" onClick="{{f.apply}}" aria-disabled="{{f.applyDis}}" style="height: 32px; padding: 0 14px; border: 1px solid #d33d52; border-radius: 8px; background: #ffffff; color: #d33d52; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; opacity: {{f.applyOp}};">적용</button>
        </div>
      </div>

      <div style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 16px;">
        <div style="display: flex; flex-direction: column; gap: 8px;">
          <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.06em; color: #5b6472;">스키마 → 부품</span>
          <table style="width: 100%; border-collapse: collapse; font-size: 13px;">
            <sc-for list="{{schemaMap}}" as="m" hint-placeholder-count="8">
              <tr>
                <td style="padding: 6px 10px 6px 0; border-top: 1px solid #eef1f5; width: 190px; font-family: ui-monospace,'DejaVu Sans Mono',Consolas,Menlo,monospace; font-size: 12px; color: #5b6472;">{{m.k}}</td>
                <td style="padding: 6px 0; border-top: 1px solid #eef1f5;">{{m.v}}</td>
              </tr>
            </sc-for>
          </table>
        </div>
        <div style="display: flex; flex-direction: column; gap: 8px;">
          <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.06em; color: #5b6472;">칸의 표식</span>
          <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px;">
            <sc-for list="{{marks}}" as="m" hint-placeholder-count="6">
              <div style="display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: 1px solid #eef1f5; border-radius: 8px; font-size: 12.5px;">
                <span style="width: 3px; height: 22px; border-radius: 2px; background: {{m.c}};"></span>
                <span style="font-weight: 600; width: 64px; flex-shrink: 0;">{{m.k}}</span>
                <span style="color: #5b6472;">{{m.v}}</span>
              </div>
            </sc-for>
          </div>
        </div>
        <div style="padding: 10px 12px; border-radius: 8px; background: #f4f6f9; color: #5b6472; font-size: 12.5px; line-height: 1.6;">
          <b style="color: #16191f;">node.config★</b>가 없으면 폼 전체가 읽기 전용이 되고, 아래 막대의 저장·적용 자리에 자물쇠 버튼(1번)이 선다. 검증은 권한 없이(node.read) 부를 수 있어 그대로 남는다.
        </div>
      </div>
    </div>
  </section>
</div>
</script>
<script type="module">
import './src/api/frame-boot.js';   // 첫 import — Terra 안이면 마운트보다 먼저 frame에 hello를 보낸다
import { mount, fit } from './src/runtime/dc.js';
import Screen from './src/screens/components.js';
const stage = document.getElementById('stage');
window.__screen = mount(Screen, { template: document.getElementById('view').textContent, target: stage, props: {} });
fit(stage, 1600, 2600);

</script>
</body>
</html>
