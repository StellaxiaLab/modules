<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Terra — 전역 틀 레퍼런스</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;family=Noto+Sans+KR:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1440px; height: 1700px; box-sizing: border-box; padding: 64px; background: #040614; color: #e6eaf7; font-family: Geist, 'Noto Sans KR', system-ui, sans-serif; display: flex; flex-direction: column; gap: 32px">
<header style="display: flex; align-items: baseline; justify-content: space-between; gap: 24px">
<h1 style="margin: 0; font-size: 28px; font-weight: 600">전역 틀 레퍼런스</h1>
<span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 13px; color: #9aa4c7">업로드 이미지 5장 · 2026-10-27</span>
</header>
<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 32px">
<sc-for list="{{refs}}" as="r" hint-placeholder-count="5">
<figure style="margin: 0; grid-column: {{r.span}}; display: flex; flex-direction: column; gap: 10px">
<div style="height: {{r.h}}; border-radius: 8px; background: #0b1024; display: flex; align-items: center; justify-content: center; overflow: hidden">
<img src="{{r.src}}" alt="{{r.alt}}" style="max-width: 100%; max-height: 100%; object-fit: contain; display: block">
</div>
<figcaption style="display: flex; gap: 12px; align-items: baseline; font-size: 14px; color: #c3cae3"><span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 12px; color: #9aa4c7">{{r.no}}</span>{{r.alt}}</figcaption>
</figure>
</sc-for>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1700}}'>
class Component extends DCLogic {
  renderVals() {
    const R = [
      ['01', '/_blob/3973d833b99c740b420fec88cc7a4122', '터미널 — 픽셀 블록 로고(층별 명도) · 회색 안내문 · 명령 줄', 'auto', '440px'],
      ['02', '/_blob/0a9841f705cf66d84cf15b294230c435', '터미널 — 픽셀 로고 · 코너 괄호 틀 · 상태 점 · 입력 칸 · 단축키 줄', 'auto', '440px'],
      ['03', '/_blob/fa961af15987d4272b57d01d322a1040', 'HUD — 점 · 사각 눈금 · 코너 마크 · 원형 게이지 · 숫자 판독', 'auto', '440px'],
      ['04', '/_blob/d777cb312435f2798e676f7d28d66834', '포스터형 HUD — 큰 숫자 · 사선 패턴 · 가는 선 칸 · 작은 메타 글자', 'auto', '440px'],
      ['05', '/_blob/9a25afde9e348bffe2721477e22f19f5', '터미널 표 — 글자 테두리 그리드 · 머리줄 · 색 강조 줄', '1 / -1', '420px']
    ];
    return { refs: R.map(([no, src, alt, span, h]) => ({ no, src, alt, span, h })) };
  }
}
</script>
</body>
</html>
