<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Terra — 스타메이커</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;family=Noto+Sans+KR:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#040614;color:#e6eaf7}
::selection{background:#e6eaf7;color:#070b1c}
@font-face{font-family:GmarketSans;font-weight:300;font-display:swap;unicode-range:U+1100-11FF,U+3130-318F,U+A960-A97F,U+AC00-D7A3,U+D7B0-D7FF;src:url("/_blob/4d9a12c31d0dc860dfda9402c6a1081a") format("truetype")}
@font-face{font-family:GmarketSans;font-weight:500;font-display:swap;unicode-range:U+1100-11FF,U+3130-318F,U+A960-A97F,U+AC00-D7A3,U+D7B0-D7FF;src:url("/_blob/6f9581f507168432b9814a59b66b9ae8") format("truetype")}
@font-face{font-family:GmarketSans;font-weight:700;font-display:swap;unicode-range:U+1100-11FF,U+3130-318F,U+A960-A97F,U+AC00-D7A3,U+D7B0-D7FF;src:url("/_blob/d17b297ecdc8a118884e4708e4dbfcf4") format("truetype")}
.sm-side{scrollbar-width:thin;scrollbar-color:rgba(70,160,108,.4) transparent}
.sm-h{display:flex;align-items:center;gap:8px;margin:0 0 8px;font:700 12px GmarketSans,'Geist Mono',sans-serif;color:#78e89c}
.sm-hl{display:inline-block;width:14px;height:1px;background:rgba(70,160,108,.85);flex:none}
.sm-hr{flex:1;height:1px;background:rgba(70,160,108,.45)}
.sm-n{font:500 11px 'Geist Mono',monospace;color:#548064}
.sm-note{font:500 11px GmarketSans,'Geist Mono',sans-serif;color:#709c80;line-height:1.45}
.sm-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:28px;padding:0 10px;border:1px solid rgba(70,160,108,.45);background:transparent;color:#d6f4de;font:600 12px GmarketSans,'Geist Mono',sans-serif;cursor:pointer;white-space:nowrap}
.sm-btn:hover{background:rgba(70,170,110,.16);border-color:rgba(110,236,156,.8)}
.sm-btn:focus-visible,.sm-row:focus-visible,.sm-seg button:focus-visible,.sm-chip:focus-visible,.sm-libb:focus-visible{outline:1px solid #d0ff96;outline-offset:2px}
.sm-pri{background:rgba(70,170,110,.22);border-color:rgba(110,236,156,.85);color:#d0ff96}
.sm-row{display:flex;align-items:flex-start;gap:8px;width:100%;padding:6px 6px;border:0;background:transparent;color:#d6f4de;font:500 12px GmarketSans,'Geist Mono',sans-serif;cursor:pointer}
.sm-row:hover{background:rgba(70,170,110,.1)}
.sm-row.on{background:rgba(70,170,110,.2);box-shadow:inset 2px 0 0 rgba(70,160,108,.95)}
.sm-dot{font:700 12px 'Geist Mono',monospace;color:#78e89c;width:12px;flex:none;line-height:1.5}
.sm-kv{display:grid;grid-template-columns:52px 1fr auto;align-items:center;gap:8px;min-height:28px;color:#709c80}
.sm-kv input[type=range]{width:100%;accent-color:#6eec9c}
.sm-val{font:500 11px 'Geist Mono',monospace;color:#d6f4de;min-width:38px;text-align:right}
.sm-col{width:32px;height:22px;border:1px solid rgba(70,160,108,.45);background:transparent;padding:0;cursor:pointer}
.sm-seg{display:inline-flex;border:1px solid rgba(70,160,108,.45)}
.sm-seg button{border:0;background:transparent;color:#709c80;font:600 11px GmarketSans,'Geist Mono',sans-serif;padding:4px 9px;cursor:pointer}
.sm-seg button.on{background:rgba(70,170,110,.25);color:#d0ff96}
.sm-in{display:flex;align-items:center;gap:8px;border-bottom:1px solid rgba(56,128,88,.55);padding:3px 0 5px}
.sm-in span{font:700 12px 'Geist Mono',monospace;color:#78e89c}
.sm-in input{flex:1;min-width:0;border:0;outline:none;background:transparent;color:#d6f4de;font:500 12px GmarketSans,'Geist Mono',sans-serif;caret-color:#96f0aa;padding:0}
.sm-in input::placeholder{color:#548064}
.sm-in:focus-within{border-bottom-color:rgba(110,236,156,.9)}
.sm-chip{border:1px solid rgba(70,160,108,.35);background:transparent;color:#709c80;font:500 11px 'Geist Mono',GmarketSans,monospace;padding:3px 7px;cursor:pointer}
.sm-chip.on{border-color:rgba(110,236,156,.85);color:#d0ff96;background:rgba(70,170,110,.18)}
.sm-lib{display:flex;align-items:center;gap:4px;margin:0 -6px}
.sm-lib.on{background:rgba(70,170,110,.16)}
.sm-libb{flex:1;min-width:0;display:flex;align-items:center;gap:8px;padding:4px 6px;border:0;background:transparent;color:#d6f4de;font:500 12px GmarketSans,'Geist Mono',sans-serif;cursor:pointer}
.sm-libb:hover{background:rgba(70,170,110,.1)}
.sm-libb img{flex:none;background:#020308;border:1px solid rgba(70,160,108,.3)}
.sm-x{border:0;background:transparent;color:#548064;font:600 13px 'Geist Mono',monospace;width:26px;height:26px;cursor:pointer}
.sm-x:hover{color:#ffb2a6;background:rgba(220,90,80,.18)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.sm-algo{display:flex;flex-wrap:wrap;gap:4px}
.sm-algo button{border:1px solid rgba(70,160,108,.4);background:rgba(4,6,20,.82);color:#9cc4a8;font:600 11px GmarketSans,'Geist Mono',sans-serif;padding:4px 9px;cursor:pointer}
.sm-algo button:hover{border-color:rgba(110,236,156,.8)}
.sm-algo button.on{background:rgba(24,58,40,.9);border-color:rgba(110,236,156,.9);color:#d0ff96}
.sm-algo-d{max-width:360px;background:rgba(4,6,20,.72);padding:2px 6px;margin-left:-6px}
.sm-help{display:flex;align-items:center;gap:8px;width:100%;padding:5px 8px;border:1px solid rgba(70,160,108,.3);background:transparent;color:#9cc4a8;font:600 12px GmarketSans,'Geist Mono',sans-serif;cursor:pointer}
.sm-help.on{border-color:rgba(110,236,156,.75);color:#d0ff96;background:rgba(70,170,110,.12)}
.sm-kvi{grid-template-columns:52px 1fr 20px auto}
.sm-ic{display:block}
.sm-icl{fill:none;stroke:rgba(110,236,156,.45);stroke-width:1}
.sm-ica{fill:none;stroke:#96f0aa;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.sm-icf{fill:#d0ff96}
.sm-warn{background:rgba(220,90,80,.22)!important;border-color:rgba(255,170,150,.85)!important;color:#ffb2a6!important}
</style>
</helmet>
<div data-smroot="1" onDragOver="{{dragOver}}" onDrop="{{drop}}" style="position: relative; width: 100%; height: {{rootH}}; box-sizing: border-box; display: grid; grid-template-columns: 300px minmax(0, 1fr); background: #040614; color: #d6f4de; font: 500 12px GmarketSans, 'Geist Mono', 'Noto Sans KR', sans-serif; overflow: hidden;">

  <!-- 왼쪽 — 단계: 원본 · 구 형성 · 표면 · 렌더 · 저장 · 보관함 -->
  <aside class="sm-side" aria-label="스타메이커 설정" style="overflow-y: auto; border-right: 1px solid rgba(70,160,108,0.32); padding: 12px 14px 16px; display: flex; flex-direction: column; gap: 14px;">

    <button type="button" class="sm-help {{helpCls}}" aria-pressed="{{helpOn}}" onClick="{{toggleHelp}}"><span class="sm-dot">{{helpDot}}</span>도움말<span class="sm-note" style="margin-left: auto;">{{helpT}}</span></button>
    <section aria-label="원본">
      <h2 class="sm-h"><span class="sm-hl"></span>원본<span class="sm-hr"></span><span class="sm-n">1</span></h2>
      <div style="display: flex; gap: 6px;">
        <label class="sm-btn" style="flex: 1;">이미지 · GIF<input type="file" accept="image/*" onChange="{{pickImg}}" style="display: none;"></label>
        <label class="sm-btn" style="flex: 1;">구 데이터<input type="file" accept=".json,application/json" onChange="{{pickSphere}}" style="display: none;"></label>
      </div>
      <p class="sm-note" style="margin: 8px 0 0;">{{srcLabel}}</p>
    </section>

    <section aria-label="표면">
      <h2 class="sm-h"><span class="sm-hl"></span>표면<span class="sm-hr"></span><span class="sm-n">2</span></h2>
      <div class="sm-kv"><span>해상도</span><span class="sm-seg"><sc-for list="{{resList}}" as="r" hint-placeholder-count="3"><button type="button" aria-pressed="{{r.on}}" onClick="{{r.pick}}" class="{{r.cls}}">{{r.name}}</button></sc-for></span></div>
      <label class="sm-kv"><span>밝기</span><input type="range" min="0.4" max="1.8" step="0.05" value="{{gain}}" onInput="{{setGain}}"><span class="sm-val">{{gainT}}</span></label>
      <label class="sm-kv sm-kvi"><span>자전</span><input type="range" min="-0.4" max="0.4" step="0.01" value="{{spin}}" onInput="{{setSpin}}"><svg viewBox="0 0 20 20" width="20" height="20" aria-hidden="true" class="sm-ic"><g transform="rotate({{tiltIc}} 10 10)"><ellipse cx="10" cy="10" rx="7.5" ry="2.8" class="sm-icl"/><g transform="translate(10 10) scale({{spinDir}} 1) translate(-10 -10)"><path d="M12 11.2 L9.4 12.8 L12 14.4" class="sm-ica"/></g></g></svg><span class="sm-val">{{spinT}}</span></label>
      <label class="sm-kv sm-kvi"><span>기울기</span><input type="range" min="-40" max="40" step="1" value="{{tilt}}" onInput="{{setTilt}}"><svg viewBox="0 0 20 20" width="20" height="20" aria-hidden="true" class="sm-ic"><circle cx="10" cy="10" r="5.5" class="sm-icl"/><g transform="rotate({{tiltIc}} 10 10)"><line x1="10" y1="1.5" x2="10" y2="18.5" class="sm-ica"/><circle cx="10" cy="2.5" r="1.4" class="sm-icf"/></g></svg><span class="sm-val">{{tiltT}}</span></label>
      <sc-if value="{{isAnim}}" hint-placeholder-val="{{ false }}">
        <label class="sm-kv"><span>프레임</span><input type="range" min="2" max="30" step="1" value="{{fps}}" onInput="{{setFps}}"><span class="sm-val">{{fpsT}}</span></label>
      </sc-if>
    </section>

    <section aria-label="렌더">
      <h2 class="sm-h"><span class="sm-hl"></span>렌더<span class="sm-hr"></span><span class="sm-n">3</span></h2>
      <div class="sm-kv"><span>종류</span><span class="sm-seg"><sc-for list="{{kinds}}" as="k" hint-placeholder-count="2"><button type="button" aria-pressed="{{k.on}}" onClick="{{k.pick}}" class="{{k.cls}}">{{k.name}}</button></sc-for></span></div>
      <label class="sm-kv"><span>가장자리</span><input type="range" min="0" max="1" step="0.05" value="{{limb}}" onInput="{{setLimb}}"><span class="sm-val">{{limbT}}</span></label>
      <sc-if value="{{isPlanet}}" hint-placeholder-val="{{ false }}">
        <label class="sm-kv sm-kvi"><span>빛 방향</span><input type="range" min="0" max="360" step="5" value="{{light}}" onInput="{{setLight}}"><svg viewBox="0 0 20 20" width="20" height="20" aria-hidden="true" class="sm-ic"><circle cx="10" cy="10" r="4.5" class="sm-icl"/><g transform="rotate({{lightIc}} 10 10)"><circle cx="18" cy="10" r="1.8" class="sm-icf"/><line x1="16" y1="10" x2="15" y2="10" class="sm-ica"/><path d="M10 5.5 A4.5 4.5 0 0 1 10 14.5 Z" class="sm-icf" opacity="0.55"/></g></svg><span class="sm-val">{{lightT}}</span></label>
      </sc-if>
    </section>

    <section aria-label="저장">
      <h2 class="sm-h"><span class="sm-hl"></span>저장<span class="sm-hr"></span><span class="sm-n">4</span></h2>
      <label class="sm-in"><span>&gt;</span><input type="text" placeholder="이름" value="{{name}}" onInput="{{setName}}" spellcheck="false" aria-label="이름"></label>
      <div class="sm-note" style="margin: 8px 0 4px;">폴더</div>
      <div style="display: flex; flex-wrap: wrap; gap: 4px;">
        <sc-for list="{{folders}}" as="f" hint-placeholder-count="2"><button type="button" aria-pressed="{{f.on}}" onClick="{{f.pick}}" class="sm-chip {{f.cls}}">{{f.name}}</button></sc-for>
      </div>
      <label class="sm-in" style="margin-top: 6px;"><span>+</span><input type="text" placeholder="{{nfHolder}}" value="{{newFolder}}" onInput="{{setNewFolder}}" onKeyDown="{{newFolderKey}}" spellcheck="false" aria-label="새 폴더"></label>
      <div style="display: flex; gap: 6px; margin-top: 10px;">
        <button type="button" class="sm-btn sm-pri {{saveCls}}" onClick="{{save}}" style="flex: 1;">{{saveT}}</button>
        <button type="button" class="sm-btn" onClick="{{exportFile}}">내보내기</button>
      </div>
      <p class="sm-note" aria-live="polite" style="margin: 8px 0 0; color: {{msgCol}};">{{msg}}</p>
    </section>

    <section aria-label="보관함">
      <h2 class="sm-h"><span class="sm-hl"></span>보관함 · star<span class="sm-hr"></span><span class="sm-n">{{libN}}</span></h2>
      <sc-for list="{{lib}}" as="L" hint-placeholder-count="2">
        <div class="sm-lib {{L.cls}}"><button type="button" onClick="{{L.load}}" class="sm-libb"><img src="{{L.thumb}}" alt="" width="28" height="28"><span style="display: flex; flex-direction: column; gap: 1px; min-width: 0; text-align: left;"><b style="font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">{{L.name}}</b><span class="sm-note">{{L.path}} · {{L.kind}} · {{L.size}}</span></span></button><button type="button" onClick="{{L.del}}" aria-label="{{L.name}} 지우기" class="sm-x">×</button></div>
      </sc-for>
      <sc-if value="{{libEmpty}}" hint-placeholder-val="{{ true }}"><p class="sm-note" style="margin: 0;">{{libEmptyT}}</p></sc-if>
    </section>
  </aside>

  <!-- 오른쪽 — 미리보기 (구) + 표면 지도(등장방형) -->
  <main style="position: relative; display: flex; flex-direction: column; min-width: 0; min-height: 0;">
    <div style="display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid rgba(70,160,108,0.22);">
      <span class="sm-hl"></span><b style="color: #78e89c; font-weight: 700;">미리보기</b><span class="sm-note">{{prevNote}}</span>
      <span style="flex: 1;"></span>
      <span class="sm-seg"><sc-for list="{{views}}" as="v" hint-placeholder-count="2"><button type="button" aria-pressed="{{v.on}}" onClick="{{v.pick}}" class="{{v.cls}}">{{v.name}}</button></sc-for></span>
      <button type="button" class="sm-btn" onClick="{{togglePlay}}" aria-label="{{playLabel}}" style="min-width: 54px;">{{playT}}</button>
    </div>
    <div data-smstage="1" style="position: relative; flex: 1; min-height: 0;">
      <canvas data-smprev="1" aria-label="구 미리보기" role="img" style="position: absolute; inset: 0; width: 100%; height: 100%; display: block;"></canvas>
      <sc-if value="{{dropOn}}" hint-placeholder-val="{{ false }}"><div style="position: absolute; inset: 12px; border: 1px dashed rgba(110,236,156,0.7); display: flex; align-items: center; justify-content: center; color: #d0ff96; background: rgba(4,6,20,0.6); pointer-events: none;">놓으면 불러와요 — 이미지 · GIF · 구 데이터(.json)</div></sc-if>
    </div>
    <!-- 표면 지도 — 구 형성 방법을 지도 위에 띄운다. 지도는 지구본 고어(오렌지 껍질처럼 자른 조각)로 — 펴진 표면이 어떻게 구를 감싸는지 그대로 보인다 -->
    <section aria-label="구 형성 · 표면 지도" style="position: relative; border-top: 1px solid rgba(70,160,108,0.22); height: 196px; flex: none;">
      <canvas data-smtex="1" aria-label="표면 지도" role="img" style="position: absolute; inset: 0; width: 100%; height: 100%; display: block;"></canvas>
      <div style="position: absolute; left: 12px; top: 10px; right: 12px; display: flex; align-items: flex-start; gap: 10px; pointer-events: none;">
        <div style="display: flex; flex-direction: column; gap: 6px; pointer-events: auto;">
          <div style="display: flex; align-items: center; gap: 8px;"><span class="sm-hl"></span><b style="color: #78e89c; font-weight: 700;">구 형성</b><span class="sm-n">1 · 2</span></div>
          <div role="radiogroup" aria-label="구 형성 방법" class="sm-algo">
            <sc-for list="{{algos}}" as="a" hint-placeholder-count="4"><button type="button" role="radio" aria-checked="{{a.on}}" onClick="{{a.pick}}" title="{{a.desc}}" class="{{a.cls}}">{{a.dot}} {{a.name}}</button></sc-for>
          </div>
          <sc-if value="{{help}}" hint-placeholder-val="{{ false }}"><span class="sm-note sm-algo-d">{{algoDesc}}</span></sc-if>
        </div>
        <span style="flex: 1;"></span>
        <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 6px; pointer-events: auto;">
          <span class="sm-seg"><sc-for list="{{maps}}" as="g" hint-placeholder-count="3"><button type="button" aria-pressed="{{g.on}}" onClick="{{g.pick}}" class="{{g.cls}}">{{g.name}}</button></sc-for></span>
          <span class="sm-note">{{texNote}}</span>
        </div>
      </div>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"winW":{"editor":null},"winH":{"editor":null},"load":{"editor":null},"onSaved":{"editor":null},"$preview":{"width":1100,"height":720}}'>
// 스타메이커 — 항성 · 행성(구) 컴포넌트를 만들고 · 저장하고 · 내보내고 · 받아오는 창 (유틸 › 스타메이커)
//   ① 원본: 사진 · GIF(프레임마다) 또는 미리 만든 구 데이터(terra.sphere JSON)
//   ② 구 형성: 원본을 구의 표면 지도(등장방형, 가로 = 경도 360° · 세로 = 위도 180°)로 펴는 방법 4가지
//   ③ 표면: 해상도 · 밝기 · 자전 · 기울기 · (GIF) 프레임 빠르기   ④ 렌더: 항성(스스로 빛남 · 가장자리 어두워짐) / 행성(빛 방향 · 밤). 발광(코로나 · 대기)은 쓰지 않는다
//   구 형성 방법은 아래 표면 지도 위에 — 지도는 지구본 고어(12 · 8 조각) 또는 펼친 등장방형, 자전과 함께 흐른다
//   ⑤ 저장: 구 데이터(terra.sphere v1) → 보관함 star/… (폴더로 정리). 내보내기 = .sphere.json 파일
//   구 데이터 형식 — 확장을 염두에 둔 JSON: format · version · 이름 · 종류 · 원본 · 형성 · 표면(투영 + 프레임 이미지들) · 렌더 값 · 미리보기 · ext(앞으로 붙일 것)
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { algo: 'equirect', res: 256, gain: 1, spin: 0.06, tilt: 12, fps: 12, kind: 'star', limb: 0.55, light: 225, map: 'gore12', view: 'px', play: true, name: '', folder: 'star', newFolder: '', msg: '', msgErr: false, drop: false, srcLabel: '', help: false, saveWarn: null, srcType: 'none', nFrames: 1, texW: 256, cur: null, rev: 0 };
  }
  componentDidMount() {
    this._live = true; this._t0 = performance.now(); this._spinA = 0;
    this._src = null; this._tex = null; this.buildDefault();
    // 다른 화면과 같은 규칙 — 30fps, 탭이 숨겨졌거나 창이 안 보이면(최소화 · 닫힘 — frame 안에서 크기 0) 쉰다
    const loop = (now) => { if (!this._live) return; if (!document.hidden && now - (this._tick || 0) >= 32) { this._tick = now; this.frame(now); } this._raf = requestAnimationFrame(loop); };
    this._raf = requestAnimationFrame(loop);
  }
  componentWillUnmount() { this._live = false; cancelAnimationFrame(this._raf); }

  // ───── 보관함 — 브라우저 저장소(색인 + 파일마다 한 칸). 전역 틀의 유틸 › 스타메이커 › star 가 같은 색인을 읽는다 ─────
  IDX() { return 'terra.star.index'; }
  lib() { try { const v = JSON.parse(localStorage.getItem(this.IDX()) || 'null'); if (v && Array.isArray(v.files)) { if (!v.folders || !v.folders.includes('star')) v.folders = ['star'].concat(v.folders || []); return v; } } catch (e) {} return { v: 1, folders: ['star'], files: [] }; }
  libPut(L) { localStorage.setItem(this.IDX(), JSON.stringify(L)); }
  // ───── 원본 → 표면 지도(등장방형) ─────
  ALGOS() { return [
