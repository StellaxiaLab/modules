    ctx.font = FN; ctx.textBaseline = 'top';

    const nz = (x, y) => {
      const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi, a0 = xi & 255, b0 = yi & 255;

    };

    const heat = this._heat, hc = this._hc, hd = this._hd; heat.fill(0);

    const TR = (this.props.trail ?? 0.6) * v;

      const hx = cx + s.x / s.z * F, hy = cy + s.y / s.z * F, zt = Math.min(1.3, s.z + TR * (0.6 + s.z) * this.radK(s)), tx = cx + s.x / zt * F, ty = cy + s.y / zt * F;

      const layer = (s) => { const gx = gcx + (x * this._cw / 15 - gcx) * s, gy = gcy + (y * this._ch / 15 - gcy) * s, a = nz(gx * 0.045 - t * 0.09, gy * 0.045 + t * 0.012), b = nz(gx * 0.11 - t * 0.17 + 31.7, gy * 0.11 - t * 0.02 + 12.3); return [a, a * 0.62 + b * 0.38]; };

      const cloud = Math.max(0, n - 0.42) / 0.58, dust = cloud * cloud;
      const u = Math.min(0.999, Math.max(0, y / rows * 0.85 + (n1 - 0.5) * 0.3));
      let lv = (0.05 + W * 0.13 + dust * (0.18 + 0.62 * W)) * DIM, star = false;

      if (st && e <= 0) { const tw = this.twinkle(i, now), sl = 0.36 + tw * 0.58; if (sl > lv) { lv = sl; star = true; } }

      let b = buckets.get(key); if (!b) { b = []; buckets.set(key, b); } b.push(i);
    }
    buckets.forEach((list, key) => {
      const s = styleOf(key);
      ctx.fillStyle = 'rgba(' + Math.round(s[0]) + ',' + Math.round(s[1]) + ',' + Math.round(s[2]) + ',' + s[3].toFixed(3) + ')';
      for (let k = 0; k < list.length; k++) { const i = list[k]; ctx.fillText(G[g[i]], (i % cols) * cw, ((i / cols) | 0) * ch); }
    });
    // ── 어두운 화면 — 보이는 명도 × holeDim (검은 막 = 1 − holeDim), 가운데 소실점은 더 어둡게

  renderVals() {
    const S = this.state || {}, on = this._tgt === 1;

      label: '글자 장 워프 전환 — ' + (S.phase || '대기'),
