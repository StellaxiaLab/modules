<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Terra — 리프 뷰</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;700&amp;family=Noto+Sans+KR:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#040614;color:#e6eaf7}
::selection{background:#e6eaf7;color:#040614}
:root{--ease-out:cubic-bezier(0.23,1,0.32,1)}
.stage{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center;min-height:28px;padding:0 10px;border-radius:6px;font-size:13px;color:#7682ab}
.stage .no{font-family:GmarketSans,"Geist Mono",monospace;font-size:12px}
.stage .ms{font-family:GmarketSans,"Geist Mono",monospace;font-size:11.5px}
.stage.on{color:#e6eaf7}
.stage.now{color:#040614;background:#e6eaf7}
.stage.off{color:#46507a;text-decoration:line-through}
.replay{font:inherit;cursor:pointer;display:inline-flex;align-items:center;min-height:36px;padding:0 14px;border-radius:7px;font-size:13px;color:#e6eaf7;background:transparent;border:1px solid #2c3558;transition:transform 160ms var(--ease-out),border-color 150ms ease}
.replay:active{transform:scale(0.97)}
.type{flex:1;font:inherit;cursor:pointer;min-height:32px;padding:0 6px;border-radius:6px;font-size:12px;color:#7682ab;background:transparent;border:1px solid #1c2442;transition:transform 160ms var(--ease-out),border-color 150ms ease,color 150ms ease}
.type.sel{color:#040614;background:#e6eaf7;border-color:#e6eaf7}
.type:active{transform:scale(0.97)}
.type:focus-visible{outline:1px solid #e6eaf7;outline-offset:2px}
@media (hover:hover) and (pointer:fine){.type:not(.sel):hover{border-color:#56628f;color:#e6eaf7}}
.replay:focus-visible{outline:1px solid #e6eaf7;outline-offset:3px}
@media (hover:hover) and (pointer:fine){.replay:hover{border-color:#56628f}}
@media (prefers-reduced-motion:reduce){.replay{transition:border-color 150ms ease}.replay:active{transform:none}}
@font-face{font-family:GmarketSans;font-weight:300;font-display:swap;unicode-range:U+1100-11FF,U+3130-318F,U+A960-A97F,U+AC00-D7A3,U+D7B0-D7FF;src:url("/_blob/4d9a12c31d0dc860dfda9402c6a1081a") format("truetype")}
@font-face{font-family:GmarketSans;font-weight:500;font-display:swap;unicode-range:U+1100-11FF,U+3130-318F,U+A960-A97F,U+AC00-D7A3,U+D7B0-D7FF;src:url("/_blob/6f9581f507168432b9814a59b66b9ae8") format("truetype")}
@font-face{font-family:GmarketSans;font-weight:700;font-display:swap;unicode-range:U+1100-11FF,U+3130-318F,U+A960-A97F,U+AC00-D7A3,U+D7B0-D7FF;src:url("/_blob/d17b297ecdc8a118884e4708e4dbfcf4") format("truetype")}
</style>
</helmet>
<div onPointerUp="{{tap}}" onPointerMove="{{pmove}}" onPointerLeave="{{pleave}}" style="position: relative; min-height: 100vh; background: radial-gradient(42% 70% at 62% 58%, rgba(150, 110, 200, 0.08), transparent 70%), linear-gradient(118deg, transparent 22%, rgba(110, 130, 220, 0.05) 42%, rgba(170, 120, 210, 0.06) 56%, rgba(230, 150, 150, 0.04) 70%, transparent 84%), linear-gradient(178deg, #060a1d 0%, #040614 46%, #020308 100%); font-family: GmarketSans, Geist, 'Noto Sans KR', system-ui, sans-serif; color: #e6eaf7; overflow: hidden; isolation: isolate; cursor: crosshair">
<canvas data-under="leaf" aria-hidden="true" style="position: absolute; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; z-index: 0"></canvas>
<canvas data-scene="leaf" aria-hidden="true" style="position: absolute; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; z-index: 0; visibility: hidden"></canvas>
<canvas data-field="leaf" role="img" aria-label="{{sceneLabel}}" style="position: absolute; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; z-index: 1"></canvas>
<section aria-label="리프 뷰" onPointerUp="{{stopProp}}" style="position: absolute; z-index: 3; left: 32px; bottom: 32px; width: 320px; box-sizing: border-box; padding: 16px; border-radius: 10px; background: #040614; border: 1px solid #1c2442; display: flex; flex-direction: column; gap: 10px; cursor: default">
<h1 style="margin: 0; font-size: 14px; font-weight: 600">리프 뷰 — 트리 {{leafName}}</h1>
<div style="display: {{res.disp}}; flex-direction: column; gap: 4px; padding: 10px 12px; border-radius: 8px; border: 1px solid #2c3558">
<span style="font-size: 13px; font-weight: 600">리소스 뷰 — 행성 {{res.name}}</span>
<span style="font-size: 12px; line-height: 1.5; color: #7682ab">여기서부터는 리소스 뷰 보드에서 이어진다</span>
<button class="replay" type="button" onClick="{{res.back}}" style="align-self: flex-start">리프 뷰로 돌아가기 · ESC</button>
</div>
<span style="font-size: 12px; line-height: 1.5; color: #7682ab">트리 뷰가 배경을 열고 트리를 어둠 상태로 둔 자리에서 이어받는다 — 항성을 놓고 닫은 뒤 행성이 궤도 작은 순서로 · 행성을 누르면 리소스 뷰로</span>
<div role="group" aria-label="항성 레퍼런스" style="display: flex; flex-wrap: wrap; gap: 4px">
<sc-for list="{{stars}}" as="st" hint-placeholder-count="4">
<button class="type {{st.cls}}" type="button" aria-pressed="{{st.pressed}}" onClick="{{st.pick}}">{{st.name}}</button>
</sc-for>
</div>
<div role="group" aria-label="배경 이동" style="display: flex; gap: 4px; align-items: center">
<span style="font-size: 12px; color: #7682ab; white-space: nowrap; padding-right: 4px">배경 이동</span>
<sc-for list="{{bgm}}" as="bm" hint-placeholder-count="5">
<button class="type {{bm.cls}}" type="button" aria-pressed="{{bm.pressed}}" onClick="{{bm.pick}}">{{bm.name}}</button>
</sc-for>
</div>
<div style="display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px">
<button class="replay" type="button" aria-pressed="{{tr.pressed}}" onClick="{{tr.toggle}}" style="background: {{tr.bg}}; color: {{tr.fg}}">{{tr.label}}</button>
<button class="replay" type="button" aria-pressed="{{mk.pressed}}" onClick="{{mk.toggle}}" style="background: {{mk.bg}}; color: {{mk.fg}}">{{mk.label}}</button>
<button class="replay" type="button" onClick="{{entry}}">진입 다시</button>
</div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;stage1_create&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;section&quot;:&quot;단계&quot;},&quot;stage2_dissolve&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;section&quot;:&quot;단계&quot;},&quot;stage3_rise&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;section&quot;:&quot;단계&quot;},&quot;holeDim&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;min&quot;:0.1,&quot;max&quot;:0.9,&quot;step&quot;:0.05,&quot;default&quot;:0.6,&quot;section&quot;:&quot;단계&quot;},&quot;hitBand&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;min&quot;:4,&quot;max&quot;:28,&quot;step&quot;:1,&quot;default&quot;:12,&quot;unit&quot;:&quot;px&quot;,&quot;section&quot;:&quot;단계&quot;},&quot;overlap&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;min&quot;:0,&quot;max&quot;:0.85,&quot;step&quot;:0.05,&quot;default&quot;:0.5,&quot;section&quot;:&quot;재생&quot;},&quot;tempo&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;min&quot;:0.25,&quot;max&quot;:2,&quot;step&quot;:0.05,&quot;default&quot;:1,&quot;section&quot;:&quot;재생&quot;},&quot;glowMs&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;min&quot;:50,&quot;max&quot;:1500,&quot;step&quot;:10,&quot;default&quot;:200,&quot;unit&quot;:&quot;ms&quot;,&quot;section&quot;:&quot;재생&quot;},&quot;preset&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;자식 2&quot;,&quot;자식 3&quot;,&quot;자식 5&quot;,&quot;깊이 3&quot;],&quot;default&quot;:&quot;깊이 3&quot;,&quot;section&quot;:&quot;트리&quot;},&quot;speed&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;min&quot;:0,&quot;max&quot;:4,&quot;step&quot;:0.1,&quot;default&quot;:1,&quot;section&quot;:&quot;트리&quot;},&quot;palette&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;은하수&quot;,&quot;성운&quot;,&quot;단색&quot;],&quot;default&quot;:&quot;은하수&quot;,&quot;section&quot;:&quot;글자 장&quot;},&quot;cell&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;min&quot;:9,&quot;max&quot;:24,&quot;default&quot;:11,&quot;unit&quot;:&quot;px&quot;,&quot;section&quot;:&quot;글자 장&quot;},&quot;bgMove&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;없음&quot;,&quot;상&quot;,&quot;하&quot;,&quot;좌&quot;,&quot;우&quot;],&quot;default&quot;:&quot;없음&quot;,&quot;section&quot;:&quot;글자 장&quot;},&quot;bgSpeed&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;min&quot;:0.5,&quot;max&quot;:12,&quot;step&quot;:0.5,&quot;default&quot;:3,&quot;unit&quot;:&quot;칸/초&quot;,&quot;section&quot;:&quot;글자 장&quot;},&quot;motion&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;section&quot;:&quot;글자 장&quot;},&quot;regionFocus&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;min&quot;:2,&quot;max&quot;:12,&quot;step&quot;:0.5,&quot;default&quot;:4,&quot;section&quot;:&quot;인식 영역&quot;},&quot;regionLeaf&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;min&quot;:1,&quot;max&quot;:3,&quot;step&quot;:0.1,&quot;default&quot;:2.3,&quot;section&quot;:&quot;인식 영역&quot;},&quot;regionPlanet&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;min&quot;:4,&quot;max&quot;:24,&quot;step&quot;:0.5,&quot;default&quot;:16,&quot;section&quot;:&quot;인식 영역&quot;},&quot;regionChild&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;min&quot;:2,&quot;max&quot;:20,&quot;step&quot;:0.5,&quot;default&quot;:8,&quot;section&quot;:&quot;인식 영역&quot;},&quot;showRegion&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;section&quot;:&quot;인식 영역&quot;},&quot;parallaxCenter&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;min&quot;:1,&quot;max&quot;:4,&quot;step&quot;:0.1,&quot;default&quot;:2,&quot;section&quot;:&quot;트리&quot;},&quot;leaf&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;01&quot;,&quot;02&quot;,&quot;03&quot;,&quot;04&quot;,&quot;01.02&quot;,&quot;03.01&quot;],&quot;default&quot;:&quot;01&quot;,&quot;section&quot;:&quot;리프&quot;},&quot;star&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;청백 거성&quot;,&quot;태양&quot;,&quot;청록 왜성&quot;,&quot;백색 별&quot;],&quot;default&quot;:&quot;청백 거성&quot;,&quot;section&quot;:&quot;리프&quot;},&quot;glowGap&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;min&quot;:0,&quot;max&quot;:0.6,&quot;step&quot;:0.05,&quot;default&quot;:0.2,&quot;section&quot;:&quot;리프&quot;},&quot;starMix&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;min&quot;:0,&quot;max&quot;:1,&quot;step&quot;:0.05,&quot;default&quot;:0.5,&quot;section&quot;:&quot;리프&quot;},&quot;planets&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;min&quot;:1,&quot;max&quot;:12,&quot;default&quot;:6,&quot;section&quot;:&quot;항성계&quot;},&quot;viewTilt&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;min&quot;:0,&quot;max&quot;:85,&quot;step&quot;:1,&quot;default&quot;:68,&quot;unit&quot;:&quot;°&quot;,&quot;section&quot;:&quot;항성계&quot;},&quot;orbitSpread&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;min&quot;:0,&quot;max&quot;:8,&quot;step&quot;:0.5,&quot;default&quot;:4,&quot;unit&quot;:&quot;°&quot;,&quot;section&quot;:&quot;항성계&quot;},&quot;trailScale&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;min&quot;:0.25,&quot;max&quot;:3,&quot;step&quot;:0.05,&quot;default&quot;:1.5,&quot;section&quot;:&quot;항성계&quot;},&quot;leafSat&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;min&quot;:0,&quot;max&quot;:1,&quot;step&quot;:0.05,&quot;default&quot;:0.55,&quot;section&quot;:&quot;항성계&quot;},&quot;orbitScale&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;min&quot;:0.5,&quot;max&quot;:2.5,&quot;step&quot;:0.05,&quot;default&quot;:1.5,&quot;section&quot;:&quot;항성계&quot;},&quot;planetSize&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;min&quot;:0.01,&quot;max&quot;:0.08,&quot;step&quot;:0.005,&quot;default&quot;:0.0225,&quot;section&quot;:&quot;항성계&quot;},&quot;trails&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;section&quot;:&quot;항성계&quot;},&quot;starMask&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;section&quot;:&quot;리프&quot;},&quot;satRestore&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;어두운 화면 복원&quot;,&quot;어두운 배경 복원&quot;,&quot;배경 복원&quot;,&quot;복원 안 함&quot;],&quot;default&quot;:&quot;어두운 화면 복원&quot;,&quot;section&quot;:&quot;리소스&quot;},&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:900}}">
// 리프 뷰 — 트리 뷰에서 고른 트리를 한 번 더 눌러 들어온 상태(그 트리만 남고 커진 상태)에서 시작한다. 트리 뷰 엔진을 그대로 쓴다.
// (아래는 트리 뷰 설명) 트리 뷰 — 항성계. 계정이 항성, 자식 트리가 그 둘레 궤도를 돌고, 각 트리는 다시 자기 자식의 궤도를 가진다.
// 컴포넌트 타입·속성은 컴포넌트 융기 보드와 같다: 레거시 · 마스크 · 혼합 · 텍스트, 단계(생성·소거·부상·복원), 겹침·빠르기,
// 배경 복원, 확장 방향, 레거시 배경(어둡게·비움), 비운 자리(혼합), 다시 생긴 칸의 발광 지연, 전파 방향(텍스트), 마스크↔레거시 전환
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { preset: null, focus: 0, hidden: true, top: false, cur: -1, dir: '', mode: 'mask', ready: false, kind: null };
  }
  componentDidMount() {
    this._live = true;
    this.startScene();
    this.startField('leaf');
    this.enterNowAt();
    if (this.ENTRY()) this.startEntry(); else setTimeout(() => { if (this._live) this.play(); }, 400);
    this._onKey = (e) => {
      if (e.key !== 'Escape') return;
      if (this.goBack()) e.preventDefault();
    };
    window.addEventListener('keydown', this._onKey);
  }
  // ───── 중앙 항성 — 3D 구 (임시 레거시 모델) ─────
  // 표면: 구 위 3D 값 노이즈를 미리 등장방형 텍스처로 구워 두고, 매 프레임 자전 각만 더해 찾는다 (거친 무늬 · 잔 알갱이가 다른 빠르기로 돈다 — 끓는 느낌)
  // 색: 짙은 파랑 → 하늘 → 흰빛, 가장자리는 오히려 밝게(뜨거운 별의 흰 테), 둘레엔 보라 코로나 · 가는 필라멘트 · 회절 십자
  starTex() {
    if (this._stx) return this._stx;
    const TW = 384, TH = 192, P = this._perm || (() => { const a = new Uint8Array(512); for (let i = 0; i < 512; i++) a[i] = (Math.random() * 256) | 0; return a; })();
    const h3 = (x, y, z) => P[(P[(P[x & 255] + y) & 255] + z) & 255] / 255;
    const n3 = (x, y, z) => {
      const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z), xf = x - xi, yf = y - yi, zf = z - zi;
      const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf), w = zf * zf * (3 - 2 * zf);
      const L = (a, b, k) => a + (b - a) * k;
      return L(L(L(h3(xi, yi, zi), h3(xi + 1, yi, zi), u), L(h3(xi, yi + 1, zi), h3(xi + 1, yi + 1, zi), u), v),
               L(L(h3(xi, yi, zi + 1), h3(xi + 1, yi, zi + 1), u), L(h3(xi, yi + 1, zi + 1), h3(xi + 1, yi + 1, zi + 1), u), v), w);
    };
    const fbm = (x, y, z, o) => { let a = 0, f = 1, m = 0.5, s = 0; for (let k = 0; k < o; k++) { a += n3(x * f, y * f, z * f) * m; s += m; f *= 2.03; m *= 0.5; } return a / s; };
    const SPOT = 5;   // 얼룩·반점 크기 배율
    const big = new Float32Array(TW * TH), fine = new Float32Array(TW * TH);
    for (let j = 0; j < TH; j++) {
      const lat = (j / (TH - 1) - 0.5) * Math.PI, cl = Math.cos(lat), sl = Math.sin(lat);
      for (let i = 0; i < TW; i++) {
        const lon = i / TW * Math.PI * 2, x = cl * Math.cos(lon), y = sl, z = cl * Math.sin(lon);
        // 거친 무늬 — 큰 얼룩 + 비스듬히 늘인 줄무늬(필라멘트)
        // 얼룩·반점 크기 5배 (주파수 1/5) — SPOT 으로 조절
        const b = fbm(x * 2.2 / SPOT + 11, y * 2.2 / SPOT, z * 2.2 / SPOT, 4), st = fbm((x * 1.5 + y * 5.5) / SPOT, y * 1.2 / SPOT, (z * 1.5 - y * 5.5) / SPOT, 3);
        big[j * TW + i] = b * 0.7 + Math.pow(Math.abs(st - 0.5) * 2, 3) * 0.6;
        // 잔 알갱이
        fine[j * TW + i] = fbm(x * 14 / SPOT + 3, y * 14 / SPOT, z * 14 / SPOT, 3);
      }
    }
    return (this._stx = { TW, TH, big, fine });
  }
  // 항성 레퍼런스 — 색표(stops) · 가장자리(limb: + 밝아짐 / − 어두워짐) · 무늬 대비(con) · 밝은 알갱이(spk) · 자전 빠르기(rot)
  STAR_TYPES() {
    return {
      '청백 거성': { stops: [[0, [24, 40, 150]], [0.45, [70, 110, 235]], [0.7, [140, 175, 255]], [0.88, [215, 228, 255]], [1, [255, 255, 255]]], limb: 0.75, con: 1, spk: 2.2, base: 0.02, rot: 1 },
      '태양': { stops: [[0, [70, 8, 0]], [0.35, [170, 40, 4]], [0.6, [235, 105, 15]], [0.82, [255, 170, 50]], [1, [255, 240, 190]]], limb: -0.55, con: 1.15, spk: 2.6, base: 0.12, rot: 0.6 },
      '청록 왜성': { stops: [[0, [30, 110, 150]], [0.4, [90, 200, 230]], [0.7, [180, 240, 250]], [1, [255, 255, 255]]], limb: 0.45, con: 0.8, spk: 1.6, base: 0.06, rot: 1.6 },
      '백색 별': { stops: [[0, [80, 90, 170]], [0.4, [160, 172, 235]], [0.7, [215, 222, 250]], [1, [255, 255, 255]]], limb: 0.3, con: 0.9, spk: 1.4, base: 0.0, rot: 1.2 }

        : [],
      optsLabel: K === 'data' ? '전파' : K === 'mix' ? '비운 자리' : '', optsDisp: K === 'data' || K === 'mix' ? 'flex' : 'none',
      ex: { disp: legView ? 'flex' : 'none', opts: [['중', '중앙'], ['상', '위'], ['하', '아래'], ['좌', '왼쪽'], ['우', '오른쪽']].map(([name, val]) => {
        const sel = this.EXPAND() === val;
        return { name, cls: sel ? 'sel' : '', pressed: sel ? 'true' : 'false', label: val + '에서 확장', pick: () => { if (!sel) pick({ expand: val, mode: S.mode }); } };
      }) },
      rs: { disp: legView ? 'block' : 'none', cls: this.RESTORE() ? 'sel' : '', pressed: this.RESTORE() ? 'true' : 'false', label: '배경 복원 — ' + (this.RESTORE() ? '켬' : '끔'), toggle: () => pick({ restore: !this.RESTORE(), mode: S.mode }) },
      tr: { disp: legView ? 'flex' : 'none', cls: this.TRAIL() ? 'sel' : '', pressed: this.TRAIL() ? 'true' : 'false', label: '잔상 — ' + (this.TRAIL() ? '켬' : '끔'), toggle: () => this.setState({ trail: !this.TRAIL() }) },
      te: { cls: this.TRAIL_EDGE() ? 'sel' : '', pressed: this.TRAIL_EDGE() ? 'true' : 'false', label: '가지 잔상 — ' + (this.TRAIL_EDGE() ? '켬' : '끔'), toggle: () => this.setState({ trailEdge: !this.TRAIL_EDGE() }) },
      hb: { disp: legView ? 'block' : 'none', cls: this.HOLEBACK() === '어둡게' ? 'sel' : '', pressed: this.HOLEBACK() === '어둡게' ? 'true' : 'false', label: '레거시 배경 — ' + this.HOLEBACK(), toggle: () => this.setState({ holeBack: this.HOLEBACK() === '어둡게' ? '비움' : '어둡게' }) },
      stages, total: Math.round(this.timeline(K, S.mode).endAll) + 'ms',
      replay: () => { this._seq = null; this.setState({ hidden: true }); setTimeout(() => { if (this._live) this.play(); }, 30); },
      entry: () => { if (this._res && this._res.dir === 'in') return; this.startEntry(); },
      sinkIt: () => this.sink(),
      sw: { disp: K === 'mask' ? 'inline-flex' : 'none', label: S.mode === 'legacy' ? '마스크로' : '레거시로', go: () => this.switchMode() },
      presets: Object.keys(this.SPECS()).map((name) => ({
        name: name.replace('자식 ', ''), cls: name === cur ? 'sel' : '', pressed: name === cur ? 'true' : 'false',
        pick: () => { if (name !== cur) this.setState({ preset: name, focus: 0 }); }
      })),
      stopProp: (e) => { if (e && e.stopPropagation) e.stopPropagation(); },
      pmove: (e) => { if (!e || !this._cv) return; const rc = this._cv.getBoundingClientRect(); this._mouse = { x: e.clientX - rc.left, y: e.clientY - rc.top }; },
      pleave: () => { this._mouse = null; },
      tap: (e) => {
        if (!e || !this._cv || !this._hits) return;
        const rc = this._cv.getBoundingClientRect(), mx = e.clientX - rc.left, my = e.clientY - rc.top;
        // 리소스 뷰로 들어가 있으면(가는 중 포함) 어디를 눌러도 리프 뷰로 돌아온다 (ESC 와 같다)
        if (this._res && this._res.dir === 'in') { this.exitRes(); return; }
        const best = this.pickHit(mx, my);
        if (best && typeof best.id === 'string' && best.id.startsWith('p:')) this.enterRes(best.id.slice(2));   // 행성을 누르면 리소스 뷰로
      }
    };
  }

}
</script>
