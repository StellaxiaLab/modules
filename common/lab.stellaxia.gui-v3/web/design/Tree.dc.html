<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Terra — 트리 뷰</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;700&amp;family=Noto+Sans+KR:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#040614;color:#e6eaf7}
::selection{background:#e6eaf7;color:#040614}
:root{--ease-out:cubic-bezier(0.23,1,0.32,1)}
.stage{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center;min-height:28px;padding:0 10px;border-radius:6px;font-size:13px;color:#7682ab}
.stage .no{font-family:GmarketSans,"Geist Mono",monospace;font-size:12px}
.stage .ms{font-family:GmarketSans,"Geist Mono",monospace;font-size:11.5px}
.stage.on{color:#e6eaf7}
.stage.now{color:#040614;background:#e6eaf7}
.stage.off{color:#46507a;text-decoration:line-through}
.replay{font:inherit;cursor:pointer;display:inline-flex;align-items:center;min-height:36px;padding:0 14px;border-radius:7px;font-size:13px;color:#e6eaf7;background:transparent;border:1px solid #2c3558;transition:transform 160ms var(--ease-out),border-color 150ms ease}
.replay:active{transform:scale(0.97)}
.type{flex:1;font:inherit;cursor:pointer;min-height:32px;padding:0 6px;border-radius:6px;font-size:12px;color:#7682ab;background:transparent;border:1px solid #1c2442;transition:transform 160ms var(--ease-out),border-color 150ms ease,color 150ms ease}
.type.sel{color:#040614;background:#e6eaf7;border-color:#e6eaf7}
.type:active{transform:scale(0.97)}
.type:focus-visible{outline:1px solid #e6eaf7;outline-offset:2px}
@media (hover:hover) and (pointer:fine){.type:not(.sel):hover{border-color:#56628f;color:#e6eaf7}}
.replay:focus-visible{outline:1px solid #e6eaf7;outline-offset:3px}
@media (hover:hover) and (pointer:fine){.replay:hover{border-color:#56628f}}
@media (prefers-reduced-motion:reduce){.replay{transition:border-color 150ms ease}.replay:active{transform:none}}
@font-face{font-family:GmarketSans;font-weight:300;font-display:swap;unicode-range:U+1100-11FF,U+3130-318F,U+A960-A97F,U+AC00-D7A3,U+D7B0-D7FF;src:url("/_blob/4d9a12c31d0dc860dfda9402c6a1081a") format("truetype")}
@font-face{font-family:GmarketSans;font-weight:500;font-display:swap;unicode-range:U+1100-11FF,U+3130-318F,U+A960-A97F,U+AC00-D7A3,U+D7B0-D7FF;src:url("/_blob/6f9581f507168432b9814a59b66b9ae8") format("truetype")}
@font-face{font-family:GmarketSans;font-weight:700;font-display:swap;unicode-range:U+1100-11FF,U+3130-318F,U+A960-A97F,U+AC00-D7A3,U+D7B0-D7FF;src:url("/_blob/d17b297ecdc8a118884e4708e4dbfcf4") format("truetype")}
</style>
</helmet>
<div onPointerUp="{{tap}}" onPointerMove="{{pmove}}" onPointerLeave="{{pleave}}" style="position: relative; min-height: 100vh; background: radial-gradient(42% 70% at 62% 58%, rgba(150, 110, 200, 0.08), transparent 70%), linear-gradient(118deg, transparent 22%, rgba(110, 130, 220, 0.05) 42%, rgba(170, 120, 210, 0.06) 56%, rgba(230, 150, 150, 0.04) 70%, transparent 84%), linear-gradient(178deg, #060a1d 0%, #040614 46%, #020308 100%); font-family: GmarketSans, Geist, 'Noto Sans KR', system-ui, sans-serif; color: #e6eaf7; overflow: hidden; isolation: isolate; cursor: crosshair">
<canvas data-under="tree" aria-hidden="true" style="position: absolute; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; z-index: 0"></canvas>
<canvas data-scene="tree" aria-hidden="true" style="position: absolute; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; z-index: 0; visibility: hidden"></canvas>
<canvas data-field="tree" role="img" aria-label="{{sceneLabel}}" style="position: absolute; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; z-index: 1"></canvas>
<button class="replay" type="button" aria-label="뒤로 (ESC)" onPointerUp="{{stopProp}}" onClick="{{back.go}}" style="display: {{backD}}; position: absolute; z-index: 3; left: 32px; top: 32px; gap: 8px; opacity: {{back.op}}; cursor: {{back.cur}}; background: #040614"><span style="font-family: GmarketSans, 'Geist Mono', monospace; font-size: 11px; padding: 1px 6px; border: 1px solid #2c3558; border-radius: 4px">ESC</span>뒤로</button>
<section aria-label="트리 뷰" onPointerUp="{{stopProp}}" style="position: absolute; z-index: 3; left: 32px; bottom: 32px; width: 320px; box-sizing: border-box; padding: 16px; border-radius: 10px; background: #040614; border: 1px solid #1c2442; display: {{secD}}; flex-direction: column; gap: 10px; cursor: default">
<div style="display: flex; align-items: baseline; justify-content: space-between; gap: 8px">
<h1 style="margin: 0; font-size: 14px; font-weight: 600">{{heading}}</h1>
<span style="font-family: GmarketSans, 'Geist Mono', monospace; font-size: 11.5px; color: #7682ab; white-space: nowrap">{{total}}</span>
</div>
<div style="display: {{leaf.disp}}; flex-direction: column; gap: 4px; padding: 10px 12px; border-radius: 8px; border: 1px solid #2c3558">
<span style="font-size: 13px; font-weight: 600">리프 뷰 — 트리 {{leaf.name}}</span>
<span style="font-size: 12px; line-height: 1.5; color: #7682ab">배경이 열리고 트리가 어둠 상태가 된 자리 — 리프 뷰 보드가 이어받아 항성을 놓고 닫는다</span>
<button class="replay" type="button" onClick="{{leaf.back}}" style="align-self: flex-start">트리 뷰로 돌아가기 · ESC</button>
</div>
<span style="font-size: 12px; line-height: 1.5; color: #7682ab">트리를 누르면 그 계로 · 한 번 더 누르면 리프 뷰로</span>
<span style="font-size: 12px; line-height: 1.5; color: #7682ab">레거시 · 확장 중앙 · 복원 끔 · 배경 어둡게 · 잔상 끔</span>
<ol style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 2px">
<sc-for list="{{stages}}" as="s" hint-placeholder-count="4">
<li class="stage {{s.cls}}"><span class="no">{{s.no}}</span><span>{{s.name}}</span><span class="ms">{{s.ms}}</span></li>
</sc-for>
</ol>
<div style="display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px">
<button class="replay" type="button" onClick="{{replay}}">솟기</button>
<button class="replay" type="button" onClick="{{sinkIt}}">들어가기</button>
<button class="replay" type="button" onClick="{{sw.go}}" style="display: {{sw.disp}}">{{sw.label}}</button>
</div>
<div role="group" aria-label="예시 트리" style="display: flex; gap: 4px; align-items: center">
<span style="font-size: 12px; color: #7682ab; white-space: nowrap; padding-right: 4px">{{stat}}</span>
<sc-for list="{{presets}}" as="p" hint-placeholder-count="4">
<button class="type {{p.cls}}" type="button" aria-pressed="{{p.pressed}}" onClick="{{p.pick}}">{{p.name}}</button>
</sc-for>
</div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;bare&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;section&quot;:&quot;삽입&quot;},&quot;stage1_create&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;section&quot;:&quot;단계&quot;},&quot;stage2_dissolve&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;section&quot;:&quot;단계&quot;},&quot;stage3_rise&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;section&quot;:&quot;단계&quot;},&quot;holeDim&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;min&quot;:0.1,&quot;max&quot;:0.9,&quot;step&quot;:0.05,&quot;default&quot;:0.6,&quot;section&quot;:&quot;단계&quot;},&quot;hitBand&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;min&quot;:4,&quot;max&quot;:28,&quot;step&quot;:1,&quot;default&quot;:12,&quot;unit&quot;:&quot;px&quot;,&quot;section&quot;:&quot;단계&quot;},&quot;overlap&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;min&quot;:0,&quot;max&quot;:0.85,&quot;step&quot;:0.05,&quot;default&quot;:0.5,&quot;section&quot;:&quot;재생&quot;},&quot;tempo&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;min&quot;:0.25,&quot;max&quot;:2,&quot;step&quot;:0.05,&quot;default&quot;:1,&quot;section&quot;:&quot;재생&quot;},&quot;glowMs&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;min&quot;:50,&quot;max&quot;:1500,&quot;step&quot;:10,&quot;default&quot;:200,&quot;unit&quot;:&quot;ms&quot;,&quot;section&quot;:&quot;재생&quot;},&quot;preset&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;자식 2&quot;,&quot;자식 3&quot;,&quot;자식 5&quot;,&quot;깊이 3&quot;],&quot;default&quot;:&quot;깊이 3&quot;,&quot;section&quot;:&quot;트리&quot;},&quot;speed&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;min&quot;:0,&quot;max&quot;:4,&quot;step&quot;:0.1,&quot;default&quot;:1,&quot;section&quot;:&quot;트리&quot;},&quot;palette&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;은하수&quot;,&quot;성운&quot;,&quot;단색&quot;],&quot;default&quot;:&quot;은하수&quot;,&quot;section&quot;:&quot;글자 장&quot;},&quot;cell&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;min&quot;:9,&quot;max&quot;:24,&quot;default&quot;:11,&quot;unit&quot;:&quot;px&quot;,&quot;section&quot;:&quot;글자 장&quot;},&quot;bgMove&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;없음&quot;,&quot;상&quot;,&quot;하&quot;,&quot;좌&quot;,&quot;우&quot;],&quot;default&quot;:&quot;없음&quot;,&quot;section&quot;:&quot;글자 장&quot;},&quot;bgSpeed&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;min&quot;:0.5,&quot;max&quot;:12,&quot;step&quot;:0.5,&quot;default&quot;:3,&quot;unit&quot;:&quot;칸/초&quot;,&quot;section&quot;:&quot;글자 장&quot;},&quot;motion&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;section&quot;:&quot;글자 장&quot;},&quot;regionFocus&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;min&quot;:2,&quot;max&quot;:12,&quot;step&quot;:0.5,&quot;default&quot;:4,&quot;section&quot;:&quot;인식 영역&quot;},&quot;regionChild&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;min&quot;:2,&quot;max&quot;:20,&quot;step&quot;:0.5,&quot;default&quot;:8,&quot;section&quot;:&quot;인식 영역&quot;},&quot;showRegion&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;section&quot;:&quot;인식 영역&quot;},&quot;parallaxCenter&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;min&quot;:1,&quot;max&quot;:4,&quot;step&quot;:0.1,&quot;default&quot;:2,&quot;section&quot;:&quot;트리&quot;},&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:900}}">
// 트리 뷰 — 항성계. 계정이 항성, 자식 트리가 그 둘레 궤도를 돌고, 각 트리는 다시 자기 자식의 궤도를 가진다.
// 컴포넌트 타입·속성은 컴포넌트 융기 보드와 같다: 레거시 · 마스크 · 혼합 · 텍스트, 단계(생성·소거·부상·복원), 겹침·빠르기,
// 배경 복원, 확장 방향, 레거시 배경(어둡게·비움), 비운 자리(혼합), 다시 생긴 칸의 발광 지연, 전파 방향(텍스트), 마스크↔레거시 전환
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { preset: null, focus: 0, hidden: true, top: false, cur: -1, dir: '', mode: 'mask', ready: false, kind: null };
  }
  componentDidMount() {
    this._live = true;
    this.startScene();
    this.startField('tree');
    setTimeout(() => { if (this._live) this.play(); }, 400);
    this._onKey = (e) => {
      if (e.key !== 'Escape' || this.props.bare) return;   // 다른 씬에 들어가 있을 땐(bare) 그 씬이 Esc 를 쓴다
      if (this.goBack()) e.preventDefault();
    };
    window.addEventListener('keydown', this._onKey);
  }
  componentWillUnmount() {
    this._live = false;
    window.removeEventListener('keydown', this._onKey);
    this.stopField();
  }

  // ───── 트리 데이터 (예시) ─────
  // 자식 배열의 중첩. [] = 자식 없음. 가장 바깥 = 계정(항성)
  PRESET() { return this.state.preset ?? this.props.preset ?? '깊이 3'; }
  SPECS() {
    return {
      '자식 2': [[], []],
      '자식 3': [[[], []], [], [[]]],
      '자식 5': [[[]], [[], []], [], [[], [], []], [[]]],
      '깊이 3': [[[], [[], []], [[]]], [[], []], [[[], [], []]], [[], [], [], []]]
    };
  }

  // ───── 항성계 배치 ─────
  // 계정 = 가운데 항성. 자식은 부모 둘레의 궤도를 돈다 — 형제끼리는 궤도 반지름이 모두 다르다.
  // 노드마다 '계'(자기 자식들이 도는 범위)의 최대 반지름 R 을 가진다.
  //   형제 궤도는 R 의 안쪽 30% ~ 바깥 끝 사이에 고르게 놓는다.
  //   자식의 계 반지름 = 형제 궤도 간격의 절반 (부모 R 의 30% 를 넘지 않는다) → 이웃 계와 겹치지 않고, 깊이마다 크기·범위가 확연히 다르다.
  // 공전 주기는 궤도 반지름^1.5 에 비례(케플러) × 노드마다 다른 비율. 노드 자신도 따로 자전한다.
  SIZES() { return [15, 8, 4, 2.2]; }   // 깊이별 노드 반지름(px, 배율 1) — 한눈에 구분되게
  build() {
    const spec = this.SPECS()[this.PRESET()] || this.SPECS()['깊이 3'];
    const key = this.PRESET();
    if (this._sys && this._sys.key === key) return this._sys;
    const nodes = [], rnd = (() => { let s = 7; for (const c of key) s = (s * 31 + c.charCodeAt(0)) >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; })();
    const root = { id: 0, depth: 0, parent: null, R: 1, orbit: 0, phase: 0, period: 1, spin: 0, spinP: 30, label: '계정' };
    nodes.push(root);
    const place = (nd, kids, path) => {
      const k = kids.length; if (!k) return;
      const rIn = k === 1 ? nd.R * 0.62 : nd.R * 0.3, rOut = nd.R;
      const bin = k === 1 ? nd.R * 0.55 : (rOut - rIn) / k, gap = bin;
      // 궤도 반지름 — 단계적 정규분포. [안쪽, 바깥] 을 형제 수로 나눈 칸마다 가운데를 평균으로 정규분포 난수
      // 칸을 넘지 않게 자른다(이웃 형제와 순서가 뒤바뀌지 않는다). 형제 순서는 섞는다 — 큰 가지가 늘 바깥에만 몰리지 않게
      const gauss = () => { const u = Math.max(1e-6, rnd()), v = rnd(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
      const order = kids.map((_, j) => j).sort(() => rnd() - 0.5);
      kids.forEach((sub, j) => {
        const lo = rIn + bin * order[j], mid = lo + bin / 2;
        // 표준편차를 칸 너비의 32% 로 — 칸 가운데에 몰리지 않게. 칸 끝 5% 까지만 (이웃과 순서는 지킨다)
        const orbit = k === 1 ? Math.min(nd.R * 0.98, Math.max(nd.R * 0.35, nd.R * 0.66 + gauss() * nd.R * 0.14)) : Math.min(lo + bin * 0.95, Math.max(lo + bin * 0.05, mid + gauss() * bin * 0.32));
        const c = {
          id: nodes.length, depth: nd.depth + 1, parent: nd, orbit,
          R: Math.min(gap * 0.36, nd.R * 0.3),   // 이웃 칸의 계와 겹치지 않을 만큼
          phase: rnd() * Math.PI * 2,
          period: 70 * Math.pow(0.55, nd.depth) * Math.pow(orbit / nd.R, 1.5) * (0.8 + rnd() * 0.45) * (rnd() < 0.2 ? -1 : 1),   // 계 안에서 바깥일수록 느리다(케플러). 깊이마다 기준 주기는 짧아진다. 몇몇은 거꾸로
          spin: rnd() * Math.PI * 2, spinP: (4 + rnd() * 10) * (rnd() < 0.5 ? -1 : 1),
          label: path.concat(j + 1).map((n) => String(n).padStart(2, '0')).join('.'),
          gaps: [rnd(), rnd(), rnd()]   // 궤도 선의 끊긴 자리 (손으로 그린 도면처럼)
        };
        nodes.push(c);
        place(c, sub, path.concat(j + 1));
      });
    };
    place(root, spec, []);
    let depth = 0; for (const n of nodes) depth = Math.max(depth, n.depth);
    this._sys = { key, nodes, depth };
    this._focus = { id: 0, from: null };
    return this._sys;
  }
  // 시각 t(초)에서 노드의 세계 좌표 (계정 = 0,0 · 계정 계 반지름 = 1)
  posAt(nd, t) {
    if (!nd.parent) return [0, 0];
    const p = this.posAt(nd.parent, t), a = nd.phase + (t / (nd.period * 2)) * Math.PI * 2;   // 공전 — 주기의 2배로 (느리게)
    return [p[0] + Math.cos(a) * nd.orbit, p[1] + Math.sin(a) * nd.orbit];
  }

  // ───── 초점 — 노드를 누르면 그 노드의 계가 화면을 채우도록 옮겨 가며 확대 ─────
  focusNow(now, sys, t) {
    const Fc = this._focus || (this._focus = { id: 0, from: null });
    const nd = sys.nodes[Fc.id] || sys.nodes[0];
    const to = { p: this.posAt(nd, t), Z: 1 / Math.max(nd.R, 1e-4) };   // 그 트리의 계가 화면을 채우게 (깊은 트리도 같은 비율)
    if (!nd.parent) to.Z = 1;
    if (!Fc.from) return to;
    const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const k = reduce ? 1 : Math.min(1, (now - Fc.at) / 900);
    if (k >= 1) { Fc.from = null; return to; }
    const e = 1 - Math.pow(1 - k, 4);
    const lz = Math.log(Fc.from.Z) + (Math.log(to.Z) - Math.log(Fc.from.Z)) * e;
    return { p: [Fc.from.p[0] + (to.p[0] - Fc.from.p[0]) * e, Fc.from.p[1] + (to.p[1] - Fc.from.p[1]) * e], Z: Math.exp(lz) };
  }
  // 뒤로 — ESC 키와 화면의 [ESC] 버튼이 같이 쓴다. 리프 뷰에 들어가 있으면 나오고, 아니면 직전 초점으로
  goBack() {
    if (this._enter && this._enter.dir === 'in') { this.exitLeaf(); return true; }
    if (this._hist && this._hist.length) { this.focusTo(this._hist.pop(), true); return true; }
    return false;
  }
  // ───── 리프 뷰로 들어가기 — 초점 트리를 한 번 더 누르면 그 트리가 커지며 항성이 되고, 나머지는 흐려진다 ─────

        // 어둡게 = 그 칸에 지금 '보였을' 글자 색의 명도(V)를 DIM 배로. 배경 글자만이 아니라 마스크 투영 색 · 하이라이트 색도 그대로 반영한다
        const dimOf = (c) => { const h = this.rgb2hsv(c[0], c[1], c[2]); return this.hsv2rgb(h[0], h[1], h[2] * DIM); };
        const css = (c) => 'rgb(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ')';

  }


  // ───── HSV ─────
  rgb2hsv(r, g, b) {
    r /= 255; g /= 255; b /= 255;

  }
  hsv2rgb(h, s, v) {
    const c = v * s, x = c * (1 - Math.abs(((h / 60) % 2) - 1)), m = v - c;
    const [r, g, b] = h < 60 ? [c, x, 0] : h < 120 ? [x, c, 0] : h < 180 ? [0, c, x] : h < 240 ? [0, x, c] : h < 300 ? [x, 0, c] : [c, 0, x];
    return [(r + m) * 255, (g + m) * 255, (b + m) * 255];
  }
  lerpHsv(a, b, p) {

    if (A[1] < 0.02) A[0] = B[0]; if (B[1] < 0.02) B[0] = A[0];
    let dh = B[0] - A[0]; if (dh > 180) dh -= 360; if (dh < -180) dh += 360;
    return this.hsv2rgb((A[0] + dh * p + 360) % 360, A[1] + (B[1] - A[1]) * p, A[2] + (B[2] - A[2]) * p);
  }

  // ───── 화면 값 ─────
  renderVals() {
    const S = this.state, sys = this.build(), cur = this.PRESET(), K = this.KIND(), out = S.dir === 'out';
    const legView = K === 'legacy' || K === 'mix' || (K === 'mask' && S.mode === 'legacy');
    const plan = this.plan(), M = this.maskPlan(), D = this.dataPlan();
    const legStages = this.STAGES().map((s, k) => ({ no: s.no, name: out ? s.back : s.name, ms: plan[k].on ? Math.round(plan[k].dur) + 'ms' : '생략', cls: !plan[k].on ? 'off' : S.cur === k ? 'now' : 'on' }));
    const mStage = { no: 'M', name: out ? '걷힘 — 바깥부터 원래 색으로' : '투영 — 중심에서 바깥으로 번짐', ms: Math.round(M.spread) + 'ms', cls: 'on' };
    const mCell = { no: '·', name: '글자 하나가 바뀌는 시간 (HSV)', ms: Math.round(M.cellDur) + 'ms', cls: 'on' };
    const tStage = { no: 'T', name: out ? '풀림 — 이름표가 다시 글자 장으로' : '갱신 — 이름표가 점점 빨라지며 데이터로', ms: Math.round(D.endAll) + 'ms', cls: 'on' };

    const heading = { legacy: '레거시', mask: S.mode === 'legacy' ? '마스크 → 레거시' : '마스크', mix: '혼합 — 궤도 마스크 · 행성 레거시', data: '텍스트 — 궤도 마스크 · 이름표 텍스트' }[K];
    const BARE = !!this.props.bare;   // bare — 다른 씬(로그인 전환 등)에 들어가 장면만 보일 때: 뒤로 버튼 · 패널을 숨긴다
    return {
      backD: BARE ? 'none' : 'inline-flex', secD: BARE ? 'none' : 'flex',
      stat: '트리 ' + (sys.nodes.length - 1) + ' · 깊이 ' + sys.depth,
      // 화면의 ESC 버튼 — 키 입력이 보드에 닿지 않는 환경을 위해. 돌아갈 곳이 없으면 흐리게
      back: { go: () => this.goBack(), op: S.entered || this._enter || (this._hist && this._hist.length) ? '1' : '0.4', cur: S.entered || (this._hist && this._hist.length) ? 'pointer' : 'default' },
      leaf: { disp: S.entered ? 'flex' : 'none', name: S.entered && this._enter ? (sys.nodes[this._enter.id] || {}).label : '', back: () => this.exitLeaf() },
      heading: heading + (S.hidden ? '' : out ? ' — 들어가는 중' : ''),
      sceneLabel: '계정을 항성으로 한 트리 ' + (sys.nodes.length - 1) + '개의 항성계',
      kinds: [['legacy', '레거시'], ['mask', '마스크'], ['mix', '혼합'], ['data', '텍스트']].map(([id, name]) => ({
        name, cls: K === id ? 'sel' : '', pressed: K === id ? 'true' : 'false', pick: () => { if (K !== id) pick({ kind: name, mode: 'mask' }); }
      })),
      // 타입마다 붙는 줄 — 텍스트: 전파 방향 · 혼합: 비운 자리
      opts: K === 'data' ? ['좌', '우', '중', '동시'].map((name) => ({ name, cls: this.DDIR() === name ? 'sel' : '', pressed: this.DDIR() === name ? 'true' : 'false', pick: () => { if (this.DDIR() !== name) pick({ ddir: name }); } }))
        : K === 'mix' ? ['원본 컴포넌트', '배경'].map((name) => ({ name, cls: this.MIXBACK() === name ? 'sel' : '', pressed: this.MIXBACK() === name ? 'true' : 'false', pick: () => { if (this.MIXBACK() !== name) this.setState({ mixBack: name }); } }))
        : [],
      optsLabel: K === 'data' ? '전파' : K === 'mix' ? '비운 자리' : '', optsDisp: K === 'data' || K === 'mix' ? 'flex' : 'none',
      ex: { disp: legView ? 'flex' : 'none', opts: [['중', '중앙'], ['상', '위'], ['하', '아래'], ['좌', '왼쪽'], ['우', '오른쪽']].map(([name, val]) => {

      }) },
      rs: { disp: legView ? 'block' : 'none', cls: this.RESTORE() ? 'sel' : '', pressed: this.RESTORE() ? 'true' : 'false', label: '배경 복원 — ' + (this.RESTORE() ? '켬' : '끔'), toggle: () => pick({ restore: !this.RESTORE(), mode: S.mode }) },
      tr: { disp: legView ? 'flex' : 'none', cls: this.TRAIL() ? 'sel' : '', pressed: this.TRAIL() ? 'true' : 'false', label: '잔상 — ' + (this.TRAIL() ? '켬' : '끔'), toggle: () => this.setState({ trail: !this.TRAIL() }) },
      te: { cls: this.TRAIL_EDGE() ? 'sel' : '', pressed: this.TRAIL_EDGE() ? 'true' : 'false', label: '가지 잔상 — ' + (this.TRAIL_EDGE() ? '켬' : '끔'), toggle: () => this.setState({ trailEdge: !this.TRAIL_EDGE() }) },
      hb: { disp: legView ? 'block' : 'none', cls: this.HOLEBACK() === '어둡게' ? 'sel' : '', pressed: this.HOLEBACK() === '어둡게' ? 'true' : 'false', label: '레거시 배경 — ' + this.HOLEBACK(), toggle: () => this.setState({ holeBack: this.HOLEBACK() === '어둡게' ? '비움' : '어둡게' }) },
      stages, total: Math.round(this.timeline(K, S.mode).endAll) + 'ms',
      replay: () => { this._seq = null; this.setState({ hidden: true }); setTimeout(() => { if (this._live) this.play(); }, 30); },
      sinkIt: () => this.sink(),
      sw: { disp: K === 'mask' ? 'inline-flex' : 'none', label: S.mode === 'legacy' ? '마스크로' : '레거시로', go: () => this.switchMode() },
      presets: Object.keys(this.SPECS()).map((name) => ({
