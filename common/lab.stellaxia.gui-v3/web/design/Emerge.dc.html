<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Terra — 컴포넌트 융기</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;700&amp;family=Noto+Sans+KR:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#040614;color:#e6eaf7}
::selection{background:#e6eaf7;color:#040614}
:root{--ease-out:cubic-bezier(0.23,1,0.32,1)}
.stage{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center;min-height:28px;padding:0 10px;border-radius:6px;font-size:13px;color:#7682ab}
.stage .no{font-family:GmarketSans,"Geist Mono",monospace;font-size:12px}
.stage .ms{font-family:GmarketSans,"Geist Mono",monospace;font-size:11.5px}
.stage.on{color:#e6eaf7}
.stage.now{color:#040614;background:#e6eaf7}
.stage.off{color:#46507a;text-decoration:line-through}
.replay{font:inherit;cursor:pointer;display:inline-flex;align-items:center;min-height:36px;padding:0 14px;border-radius:7px;font-size:13px;color:#e6eaf7;background:transparent;border:1px solid #2c3558;transition:transform 160ms var(--ease-out),border-color 150ms ease}
.replay:active{transform:scale(0.97)}
.type{flex:1;font:inherit;cursor:pointer;min-height:32px;padding:0 6px;border-radius:6px;font-size:12px;color:#7682ab;background:transparent;border:1px solid #1c2442;transition:transform 160ms var(--ease-out),border-color 150ms ease,color 150ms ease}
.type.sel{color:#040614;background:#e6eaf7;border-color:#e6eaf7}
.type:active{transform:scale(0.97)}
.type:focus-visible{outline:1px solid #e6eaf7;outline-offset:2px}
@media (hover:hover) and (pointer:fine){.type:not(.sel):hover{border-color:#56628f;color:#e6eaf7}}
.replay:focus-visible{outline:1px solid #e6eaf7;outline-offset:3px}
@media (hover:hover) and (pointer:fine){.replay:hover{border-color:#56628f}}
@media (prefers-reduced-motion:reduce){.replay{transition:border-color 150ms ease}.replay:active{transform:none}}
@font-face{font-family:GmarketSans;font-weight:300;font-display:swap;unicode-range:U+1100-11FF,U+3130-318F,U+A960-A97F,U+AC00-D7A3,U+D7B0-D7FF;src:url("/_blob/4d9a12c31d0dc860dfda9402c6a1081a") format("truetype")}
@font-face{font-family:GmarketSans;font-weight:500;font-display:swap;unicode-range:U+1100-11FF,U+3130-318F,U+A960-A97F,U+AC00-D7A3,U+D7B0-D7FF;src:url("/_blob/6f9581f507168432b9814a59b66b9ae8") format("truetype")}
@font-face{font-family:GmarketSans;font-weight:700;font-display:swap;unicode-range:U+1100-11FF,U+3130-318F,U+A960-A97F,U+AC00-D7A3,U+D7B0-D7FF;src:url("/_blob/d17b297ecdc8a118884e4708e4dbfcf4") format("truetype")}
</style>
</helmet>
<div onPointerDown="{{spawnAt}}" style="position: relative; min-height: 100vh; background: linear-gradient(178deg, #060a1d 0%, #040614 46%, #020308 100%); font-family: GmarketSans, Geist, 'Noto Sans KR', system-ui, sans-serif; color: #e6eaf7; overflow: hidden; isolation: isolate; cursor: crosshair">

<canvas data-under="emerge" aria-hidden="true" style="position: absolute; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; z-index: 0"></canvas>
<div data-comp="1" aria-hidden="{{compHidden}}" onPointerDown="{{dragStart}}" onPointerMove="{{dragMove}}" onPointerUp="{{dragEnd}}" onPointerCancel="{{dragEnd}}" style="touch-action: none; cursor: {{comp.cursor}}; position: absolute; left: {{comp.left}}; top: {{comp.top}}; width: {{comp.w}}; height: {{comp.h}}; z-index: {{comp.z}}; visibility: {{comp.vis}}; box-sizing: border-box; background: {{comp.bg}}; border: {{comp.border}}; border-radius: 10px; padding: {{comp.pad}}; display: flex; flex-direction: column; justify-content: space-between">
<canvas data-comp-text="1" role="img" aria-label="{{comp.text}}" style="display: {{comp.textDisp}}; position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none"></canvas>
<div style="display: {{comp.rectDisp}}; flex-direction: column; gap: 6px">
<span style="font-size: 16px; font-weight: 500">사각형 컴포넌트</span>
<span style="font-size: 13px; color: #9ba6c9">글자 장 아래에서 솟아오른다</span>
</div>
<span style="display: {{comp.labelDisp}}; font-family: GmarketSans, 'Geist Mono', monospace; font-size: 12px; color: #7682ab">{{comp.label}}</span>
</div>

<sc-for list="{{parts}}" as="pt" hint-placeholder-count="0">
<canvas data-part="{{pt.id}}" role="img" aria-label="{{pt.text}}" style="position: absolute; left: {{pt.left}}; top: {{pt.top}}; width: {{pt.w}}; height: {{pt.h}}; z-index: {{pt.z}}; visibility: {{pt.vis}}; pointer-events: none"></canvas>
</sc-for>
<canvas data-field="emerge" aria-hidden="true" style="position: absolute; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; z-index: 1"></canvas>

<section aria-label="융기 단계" onPointerDown="{{stopProp}}" style="position: absolute; left: 32px; bottom: 32px; z-index: 3; width: 320px; box-sizing: border-box; padding: 16px; border-radius: 10px; background: #040614; border: 1px solid #1c2442; display: flex; flex-direction: column; gap: 12px; cursor: default">
<div style="display: flex; align-items: baseline; justify-content: space-between">
<h1 style="margin: 0; font-size: 14px; font-weight: 600">{{heading}}</h1>
<span style="font-family: GmarketSans, 'Geist Mono', monospace; font-size: 11.5px; color: #7682ab">{{total}}</span>
</div>
<div role="group" aria-label="컴포넌트 종류" style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px">
<sc-for list="{{kinds}}" as="kd" hint-placeholder-count="4">
<button class="type {{kd.cls}}" type="button" aria-pressed="{{kd.pressed}}" onClick="{{kd.pick}}">{{kd.name}}</button>
</sc-for>
</div>
<div role="group" aria-label="원본" style="display: flex; gap: 4px">
<sc-for list="{{types}}" as="ty" hint-placeholder-count="3">
<button class="type {{ty.cls}}" type="button" aria-pressed="{{ty.pressed}}" onClick="{{ty.pick}}">{{ty.name}}</button>
</sc-for>
</div>
<button class="type {{rs.cls}}" type="button" aria-pressed="{{rs.pressed}}" onClick="{{rs.toggle}}" style="display: {{rs.disp}}">{{rs.label}}</button>
<button class="type {{hb.cls}}" type="button" aria-pressed="{{hb.pressed}}" onClick="{{hb.toggle}}" style="display: {{hb.disp}}">{{hb.label}}</button>
<button class="type {{tr.cls}}" type="button" aria-pressed="{{tr.pressed}}" onClick="{{tr.toggle}}" style="display: {{tr.disp}}">{{tr.label}}</button>
<button class="type {{gl.cls}}" type="button" aria-pressed="{{gl.pressed}}" onClick="{{gl.toggle}}" style="display: {{gl.disp}}">{{gl.label}}</button>
<div role="group" aria-label="텍스트 모션" style="display: {{tm.disp}}; gap: 4px; align-items: center">
<span style="font-size: 12px; color: #7682ab; white-space: nowrap; padding-right: 4px">모션</span>
<sc-for list="{{tm.opts}}" as="to" hint-placeholder-count="3">
<button class="type {{to.cls}}" type="button" aria-pressed="{{to.pressed}}" onClick="{{to.pick}}">{{to.name}}</button>
</sc-for>
</div>
<div role="group" aria-label="랜덤 갱신 주기" style="display: {{tc.disp}}; gap: 4px; align-items: center">
<span style="font-size: 12px; color: #7682ab; white-space: nowrap; padding-right: 4px">갱신 주기</span>
<sc-for list="{{tc.opts}}" as="tq" hint-placeholder-count="2">
<button class="type {{tq.cls}}" type="button" aria-pressed="{{tq.pressed}}" onClick="{{tq.pick}}">{{tq.name}}</button>
</sc-for>
</div>
<div role="group" aria-label="영역 확장 방향" style="display: {{ex.disp}}; gap: 4px; align-items: center">
<span style="font-size: 12px; color: #7682ab; white-space: nowrap; padding-right: 4px">{{ex.label}}</span>
<sc-for list="{{ex.opts}}" as="eo" hint-placeholder-count="5">
<button class="type {{eo.cls}}" type="button" aria-pressed="{{eo.pressed}}" aria-label="{{eo.label}}" onClick="{{eo.pick}}">{{eo.name}}</button>
</sc-for>
</div>
<div role="group" aria-label="비운 자리에 보일 것" style="display: {{mb.disp}}; gap: 4px; align-items: center">
<span style="font-size: 12px; color: #7682ab; white-space: nowrap; padding-right: 4px">비운 자리</span>
<sc-for list="{{mb.opts}}" as="mo" hint-placeholder-count="2">
<button class="type {{mo.cls}}" type="button" aria-pressed="{{mo.pressed}}" onClick="{{mo.pick}}">{{mo.name}}</button>
</sc-for>
</div>
<ol style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 2px">
<sc-for list="{{stages}}" as="s" hint-placeholder-count="4">
<li class="stage {{s.cls}}"><span class="no">{{s.no}}</span><span>{{s.name}}</span><span class="ms">{{s.ms}}</span></li>
</sc-for>
</ol>
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
<span style="font-size: 12px; line-height: 1.5; color: #7682ab">끌어 옮기기<br>빈 곳을 누르면 새로</span>
<div style="display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px">
<button class="replay" type="button" onClick="{{replay}}">솟기</button>
<button class="replay" type="button" onClick="{{sinkIt}}">들어가기</button>
<button class="replay" type="button" onClick="{{switchIt}}" style="display: {{sw.disp}}">{{sw.label}}</button>
</div>
</div>
</section>
</div>
</x-dc>

        if (e.currentTarget.setPointerCapture && e.pointerId != null) e.currentTarget.setPointerCapture(e.pointerId);
      },
      dragMove: (e) => {
        const D = this._drag; if (!D || !e) return;
        const Z = this.SIZE(), mx = Z.w / 2 / D.r.width, my = Z.h / 2 / D.r.height;
        const cx = Math.min(1 - mx, Math.max(mx, (e.clientX - D.dx - D.r.left) / D.r.width));
        const cy = Math.min(1 - my, Math.max(my, (e.clientY - D.dy - D.r.top) / D.r.height));
        this._dragPos = { cx, cy };   // 다시 그리지 않는다 — 다음 글자 장 프레임이 DOM 과 함께 옮긴다
      },
      dragEnd: (e) => {
        if (!this._drag) return;
        this.endDrag();
        if (e && e.currentTarget && e.currentTarget.releasePointerCapture && e.pointerId != null) { try { e.currentTarget.releasePointerCapture(e.pointerId); } catch (_) {} }
      }
    };
  }
}
</script>
