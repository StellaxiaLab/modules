<!doctype html>
<html lang="ko">
<head>

<x-dc>
<helmet>

<style>
body{margin:0;background:#040614;color:#e6eaf7}
::selection{background:#e6eaf7;color:#040614}
:root{--ease-out:cubic-bezier(0.23,1,0.32,1)}
.stage{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center;min-height:28px;padding:0 10px;border-radius:6px;font-size:13px;color:#7682ab}
.stage .no{font-family:GmarketSans,"Geist Mono",monospace;font-size:12px}
.stage .ms{font-family:GmarketSans,"Geist Mono",monospace;font-size:11.5px}
.stage.on{color:#e6eaf7}
.stage.now{color:#040614;background:#e6eaf7}
.stage.off{color:#46507a;text-decoration:line-through}
.replay{font:inherit;cursor:pointer;display:inline-flex;align-items:center;min-height:36px;padding:0 14px;border-radius:7px;font-size:13px;color:#e6eaf7;background:transparent;border:1px solid #2c3558;transition:transform 160ms var(--ease-out),border-color 150ms ease}
.replay:active{transform:scale(0.97)}
.type{flex:1;font:inherit;cursor:pointer;min-height:32px;padding:0 6px;border-radius:6px;font-size:12px;color:#7682ab;background:transparent;border:1px solid #1c2442;transition:transform 160ms var(--ease-out),border-color 150ms ease,color 150ms ease}
.type.sel{color:#040614;background:#e6eaf7;border-color:#e6eaf7}
.type:active{transform:scale(0.97)}
.type:focus-visible{outline:1px solid #e6eaf7;outline-offset:2px}
@media (hover:hover) and (pointer:fine){.type:not(.sel):hover{border-color:#56628f;color:#e6eaf7}}
.replay:focus-visible{outline:1px solid #e6eaf7;outline-offset:3px}
@media (hover:hover) and (pointer:fine){.replay:hover{border-color:#56628f}}
@media (prefers-reduced-motion:reduce){.replay{transition:border-color 150ms ease}.replay:active{transform:none}}
@font-face{font-family:GmarketSans;font-weight:300;font-display:swap;unicode-range:U+1100-11FF,U+3130-318F,U+A960-A97F,U+AC00-D7A3,U+D7B0-D7FF;src:url("/_blob/4d9a12c31d0dc860dfda9402c6a1081a") format("truetype")}
@font-face{font-family:GmarketSans;font-weight:500;font-display:swap;unicode-range:U+1100-11FF,U+3130-318F,U+A960-A97F,U+AC00-D7A3,U+D7B0-D7FF;src:url("/_blob/6f9581f507168432b9814a59b66b9ae8") format("truetype")}
@font-face{font-family:GmarketSans;font-weight:700;font-display:swap;unicode-range:U+1100-11FF,U+3130-318F,U+A960-A97F,U+AC00-D7A3,U+D7B0-D7FF;src:url("/_blob/d17b297ecdc8a118884e4708e4dbfcf4") format("truetype")}
</style>
</helmet>
<div onPointerDown="{{spawnAt}}" style="position: relative; min-height: 100vh; background: linear-gradient(178deg, #060a1d 0%, #040614 46%, #020308 100%); font-family: GmarketSans, Geist, 'Noto Sans KR', system-ui, sans-serif; color: #e6eaf7; overflow: hidden; isolation: isolate; cursor: crosshair">

<canvas data-under="emerge" aria-hidden="true" style="position: absolute; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; z-index: 0"></canvas>
<div data-comp="1" aria-hidden="{{compHidden}}" onPointerDown="{{dragStart}}" onPointerMove="{{dragMove}}" onPointerUp="{{dragEnd}}" onPointerCancel="{{dragEnd}}" style="touch-action: none; cursor: {{comp.cursor}}; position: absolute; left: {{comp.left}}; top: {{comp.top}}; width: {{comp.w}}; height: {{comp.h}}; z-index: {{comp.z}}; visibility: {{comp.vis}}; box-sizing: border-box; background: {{comp.bg}}; border: {{comp.border}}; border-radius: 10px; padding: {{comp.pad}}; display: flex; flex-direction: column; justify-content: space-between">
<canvas data-comp-text="1" role="img" aria-label="{{comp.text}}" style="display: {{comp.textDisp}}; position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none"></canvas>
<div style="display: {{comp.rectDisp}}; flex-direction: column; gap: 6px">
<span style="font-size: 16px; font-weight: 500">사각형 컴포넌트</span>
<span style="font-size: 13px; color: #9ba6c9">글자 장 아래에서 융기</span>
</div>
<span style="display: {{comp.labelDisp}}; font-family: GmarketSans, 'Geist Mono', monospace; font-size: 12px; color: #7682ab">{{comp.label}}</span>
</div>

<sc-for list="{{parts}}" as="pt" hint-placeholder-count="0">
<canvas data-part="{{pt.id}}" role="img" aria-label="{{pt.text}}" style="position: absolute; left: {{pt.left}}; top: {{pt.top}}; width: {{pt.w}}; height: {{pt.h}}; z-index: {{pt.z}}; visibility: {{pt.vis}}; pointer-events: none"></canvas>
</sc-for>
<canvas data-field="emerge" aria-hidden="true" style="position: absolute; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; z-index: 1"></canvas>
<canvas data-lens="emerge" aria-hidden="true" style="position: absolute; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; z-index: 3"></canvas>
<div data-lens-hit="1" role="region" tabindex="0" aria-label="{{lens.aria}}" aria-keyshortcuts="ArrowUp ArrowDown ArrowLeft ArrowRight Plus Minus Escape" onPointerDown="{{lens.down}}" onPointerMove="{{lens.move}}" onPointerUp="{{lens.up}}" onPointerCancel="{{lens.up}}" onWheel="{{lens.wheel}}" onKeyDown="{{lens.key}}" onDoubleClick="{{lens.dbl}}" onFocus="{{lens.focus}}" onBlur="{{lens.blur}}" style="display: {{lens.disp}}; position: absolute; left: {{lens.left}}; top: {{lens.top}}; width: {{lens.w}}; height: {{lens.h}}; z-index: 3; clip-path: {{lens.clip}}; cursor: {{lens.cursor}}; touch-action: none; outline: none"></div>
<div data-lens-size="1" aria-hidden="true" onPointerDown="{{lens.down}}" onPointerMove="{{lens.move}}" onPointerUp="{{lens.up}}" onPointerCancel="{{lens.up}}" style="display: {{lens.disp}}; position: absolute; left: {{lens.hx}}; top: {{lens.hy}}; width: 20px; height: 20px; z-index: 3; cursor: nwse-resize; touch-action: none"></div>
<div data-lens-bind="1" aria-hidden="true" onPointerDown="{{dragStart}}" onPointerMove="{{dragMove}}" onPointerUp="{{dragEnd}}" onPointerCancel="{{dragEnd}}" style="display: none; position: absolute; z-index: 3; cursor: grab; touch-action: none"></div>
<div data-lens-draw="1" role="application" tabindex="0" aria-label="돋보기 형태 그리기 — 닫힌 선 · Esc 취소" onPointerDown="{{ldraw.down}}" onPointerMove="{{ldraw.move}}" onPointerUp="{{ldraw.up}}" onPointerCancel="{{ldraw.up}}" onKeyDown="{{ldraw.esc}}" style="display: {{ldraw.disp}}; position: absolute; inset: 0; z-index: 3; cursor: crosshair; touch-action: none"></div>

<section aria-label="융기 단계" onPointerDown="{{stopProp}}" style="position: absolute; left: 32px; bottom: 32px; z-index: 4; width: 320px; box-sizing: border-box; padding: 16px; border-radius: 10px; background: #040614; border: 1px solid #1c2442; display: flex; flex-direction: column; gap: 12px; cursor: default">
<div style="display: flex; align-items: baseline; justify-content: space-between">
<h1 style="margin: 0; font-size: 14px; font-weight: 600">{{heading}}</h1>
<span style="font-family: GmarketSans, 'Geist Mono', monospace; font-size: 11.5px; color: #7682ab">{{total}}</span>
</div>
<div role="group" aria-label="컴포넌트 종류" style="display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px">
<sc-for list="{{kinds}}" as="kd" hint-placeholder-count="5">
<button class="type {{kd.cls}}" type="button" aria-pressed="{{kd.pressed}}" onClick="{{kd.pick}}">{{kd.name}}</button>
</sc-for>
</div>
<div style="display: {{lensDisp}}; flex-direction: column; gap: 8px">
<div role="group" aria-label="배율" style="display: flex; gap: 4px; align-items: center">
<span style="font-size: 12px; color: #7682ab; white-space: nowrap; width: 44px; flex: none">배율</span>
<sc-for list="{{lp.zs}}" as="lz" hint-placeholder-count="3"><button class="type {{lz.cls}}" type="button" aria-pressed="{{lz.pressed}}" onClick="{{lz.pick}}" style="padding: 0 4px">{{lz.name}}</button></sc-for>
</div>
<div role="group" aria-label="결합" style="display: flex; gap: 4px; align-items: center">
<span style="font-size: 12px; color: #7682ab; white-space: nowrap; width: 44px; flex: none">결합</span>
<sc-for list="{{lp.bind}}" as="lbd" hint-placeholder-count="2"><button class="type {{lbd.cls}}" type="button" aria-pressed="{{lbd.pressed}}" onClick="{{lbd.pick}}" style="padding: 0 4px; white-space: nowrap">{{lbd.name}}</button></sc-for>
</div>
<div role="group" aria-label="형태" style="display: {{lp.shapeDisp}}; gap: 4px; align-items: center">
<span style="font-size: 12px; color: #7682ab; white-space: nowrap; width: 44px; flex: none">형태</span>
<span style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; flex: 1"><sc-for list="{{lp.shapes}}" as="ls" hint-placeholder-count="3"><button class="type {{ls.cls}}" type="button" aria-pressed="{{ls.pressed}}" onClick="{{ls.pick}}" style="padding: 0 4px; white-space: nowrap">{{ls.name}}</button></sc-for></span>

<div role="group" aria-label="정보" style="display: flex; gap: 4px; align-items: center">

<sc-for list="{{lp.info}}" as="li" hint-placeholder-count="3"><button class="type {{li.cls}}" type="button" aria-pressed="{{li.pressed}}" onClick="{{li.pick}}" style="padding: 0 4px">{{li.name}}</button></sc-for>
</div>
<div role="group" aria-label="광각" style="display: flex; gap: 4px; align-items: center">
<span style="font-size: 12px; color: #7682ab; white-space: nowrap; width: 44px; flex: none">광각</span>
<sc-for list="{{lp.wide}}" as="lw" hint-placeholder-count="3"><button class="type {{lw.cls}}" type="button" aria-pressed="{{lw.pressed}}" onClick="{{lw.pick}}" style="padding: 0 4px">{{lw.name}}</button></sc-for>
</div>
<div role="group" aria-label="테두리" style="display: {{lp.seamDisp}}; gap: 4px; align-items: center">
<span style="font-size: 12px; color: #7682ab; white-space: nowrap; width: 44px; flex: none">테두리</span>
<sc-for list="{{lp.seam}}" as="lsm" hint-placeholder-count="2"><button class="type {{lsm.cls}}" type="button" aria-pressed="{{lsm.pressed}}" onClick="{{lsm.pick}}" style="padding: 0 4px; white-space: nowrap">{{lsm.name}}</button></sc-for>
</div>
<div role="group" aria-label="빛번짐" style="display: flex; gap: 4px; align-items: center">
<span style="font-size: 12px; color: #7682ab; white-space: nowrap; width: 44px; flex: none">빛번짐</span>
<sc-for list="{{lp.bleed}}" as="lb" hint-placeholder-count="3"><button class="type {{lb.cls}}" type="button" aria-pressed="{{lb.pressed}}" onClick="{{lb.pick}}" style="padding: 0 4px">{{lb.name}}</button></sc-for>
</div>
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 4px">
<span style="font-size: 12px; line-height: 1.5; color: #7682ab; white-space: pre-line; word-break: keep-all">{{lp.note}}</span>
<button class="replay" type="button" onClick="{{lp.open}}" style="white-space: nowrap; flex: none">{{lp.openT}}</button>
</div>
</div>
<div style="display: {{emDisp}}; flex-direction: column; gap: 12px">
<div role="group" aria-label="원본" style="display: flex; gap: 4px">
<sc-for list="{{types}}" as="ty" hint-placeholder-count="3">
<button class="type {{ty.cls}}" type="button" aria-pressed="{{ty.pressed}}" onClick="{{ty.pick}}">{{ty.name}}</button>
</sc-for>
</div>
<button class="type {{rs.cls}}" type="button" aria-pressed="{{rs.pressed}}" onClick="{{rs.toggle}}" style="display: {{rs.disp}}">{{rs.label}}</button>
<button class="type {{hb.cls}}" type="button" aria-pressed="{{hb.pressed}}" onClick="{{hb.toggle}}" style="display: {{hb.disp}}">{{hb.label}}</button>
<button class="type {{tr.cls}}" type="button" aria-pressed="{{tr.pressed}}" onClick="{{tr.toggle}}" style="display: {{tr.disp}}">{{tr.label}}</button>
<button class="type {{gl.cls}}" type="button" aria-pressed="{{gl.pressed}}" onClick="{{gl.toggle}}" style="display: {{gl.disp}}">{{gl.label}}</button>
<div role="group" aria-label="텍스트 모션" style="display: {{tm.disp}}; gap: 4px; align-items: center">
<span style="font-size: 12px; color: #7682ab; white-space: nowrap; padding-right: 4px">모션</span>
<sc-for list="{{tm.opts}}" as="to" hint-placeholder-count="3">
<button class="type {{to.cls}}" type="button" aria-pressed="{{to.pressed}}" onClick="{{to.pick}}">{{to.name}}</button>
</sc-for>
</div>
<div role="group" aria-label="랜덤 갱신 주기" style="display: {{tc.disp}}; gap: 4px; align-items: center">
<span style="font-size: 12px; color: #7682ab; white-space: nowrap; padding-right: 4px">갱신 주기</span>
<sc-for list="{{tc.opts}}" as="tq" hint-placeholder-count="2">
<button class="type {{tq.cls}}" type="button" aria-pressed="{{tq.pressed}}" onClick="{{tq.pick}}">{{tq.name}}</button>
</sc-for>
</div>
<div role="group" aria-label="영역 확장 방향" style="display: {{ex.disp}}; gap: 4px; align-items: center">
<span style="font-size: 12px; color: #7682ab; white-space: nowrap; padding-right: 4px">{{ex.label}}</span>
<sc-for list="{{ex.opts}}" as="eo" hint-placeholder-count="5">
<button class="type {{eo.cls}}" type="button" aria-pressed="{{eo.pressed}}" aria-label="{{eo.label}}" onClick="{{eo.pick}}">{{eo.name}}</button>
</sc-for>
</div>
<div role="group" aria-label="비운 자리에 보일 것" style="display: {{mb.disp}}; gap: 4px; align-items: center">
<span style="font-size: 12px; color: #7682ab; white-space: nowrap; padding-right: 4px">비운 자리</span>
<sc-for list="{{mb.opts}}" as="mo" hint-placeholder-count="2">
<button class="type {{mo.cls}}" type="button" aria-pressed="{{mo.pressed}}" onClick="{{mo.pick}}">{{mo.name}}</button>
</sc-for>
</div>
<ol style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 2px">
<sc-for list="{{stages}}" as="s" hint-placeholder-count="4">
<li class="stage {{s.cls}}"><span class="no">{{s.no}}</span><span>{{s.name}}</span><span class="ms">{{s.ms}}</span></li>
</sc-for>
</ol>
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
<span style="font-size: 12px; line-height: 1.5; color: #7682ab; word-break: keep-all">끌기 : 이동<br>빈 곳 : 새로</span>
<div style="display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px">
<button class="replay" type="button" onClick="{{replay}}">솟기</button>
<button class="replay" type="button" onClick="{{sinkIt}}">들어가기</button>
<button class="replay" type="button" onClick="{{switchIt}}" style="display: {{sw.disp}}">{{sw.label}}</button>
</div>
</div>
</div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"stage1_create":{"editor":"boolean","default":true,"section":"단계"},"stage2_dissolve":{"editor":"boolean","default":true,"section":"단계"},"stage3_rise":{"editor":"boolean","default":true,"section":"단계"},"stage4_restore":{"editor":"boolean","default":false,"section":"단계"},"overlap":{"editor":"range","min":0,"max":0.85,"step":0.05,"default":0.5,"section":"재생"},"tempo":{"editor":"range","min":0.25,"max":2,"step":0.05,"default":1,"section":"재생"},"loop":{"editor":"boolean","default":false,"section":"재생"},"compType":{"editor":"enum","options":["레거시","마스크","혼합","텍스트","돋보기"],"default":"레거시","section":"컴포넌트"},"legacySrc":{"editor":"enum","options":["사각형","글자"],"default":"사각형","section":"컴포넌트"},"maskSrc":{"editor":"enum","options":["이미지","카드","글자"],"default":"이미지","section":"컴포넌트"},"text":{"editor":"enum","options":["TERRA","Gateway","노드"],"default":"TERRA","section":"컴포넌트"},"elemSize":{"editor":"range","min":32,"max":200,"step":4,"default":96,"unit":"px","section":"컴포넌트"},"expandFrom":{"editor":"enum","options":["중앙","위","아래","왼쪽","오른쪽"],"default":"중앙","section":"단계"},"holeBack":{"editor":"enum","options":["어둡게","비움"],"default":"어둡게","section":"단계"},"holeDim":{"editor":"range","min":0.1,"max":0.9,"step":0.05,"default":0.6,"section":"단계"},"holeFloor":{"editor":"range","min":0,"max":1,"step":0.05,"default":0.6,"section":"단계"},"mixBack":{"editor":"enum","options":["원본 컴포넌트","배경"],"default":"원본 컴포넌트","section":"컴포넌트"},"maskCell":{"editor":"enum","options":["넓이","중심점"],"default":"넓이","section":"컴포넌트"},"maskTextSize":{"editor":"range","min":80,"max":320,"step":4,"default":180,"unit":"px","section":"컴포넌트"},"dataText":{"editor":"enum","options":["TERRA GUI v3","node-07 · 온라인","CPU 42% · MEM 61%","트리 3 · 리프 12"],"default":"node-07 · 온라인","section":"텍스트"},"dataDir":{"editor":"enum","options":["좌","우","중","동시"],"default":"좌","section":"텍스트"},"textMotion":{"editor":"enum","options":["랜덤 갱신","명도 번짐","발광"],"default":"랜덤 갱신","section":"텍스트"},"refreshCurve":{"editor":"enum","options":["가속","감속"],"default":"가속","section":"텍스트"},"trail":{"editor":"boolean","default":false,"section":"이동"},"glowMs":{"editor":"range","min":50,"max":1500,"step":10,"default":200,"unit":"ms","section":"이동"},"palette":{"editor":"enum","options":["은하수","성운","단색"],"default":"은하수","section":"글자 장"},"speed":{"editor":"range","min":0,"max":2,"step":0.1,"default":1,"section":"글자 장"},"cell":{"editor":"int","min":11,"max":24,"default":15,"unit":"px","section":"글자 장"},"motion":{"editor":"boolean","default":true,"section":"글자 장"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { top: false, cur: -1, hidden: true, cx: 0.5, cy: 0.42, run: 0, dir: '', kind: null, lsrc: null, msrc: null };
  }
  componentDidMount() {
    this._live = true;
    this.startField('emerge');
    setTimeout(() => { if (!this._live) return; this.play(); if (this.LENSMODE()) setTimeout(() => this._live && this.lensToggle(true), 1600); }, 500);
  }
  componentWillUnmount() {
    this._live = false;
    clearTimeout(this._loopT);
    this.stopField();
  }

  // ───── 융기 단계 ─────
  // 단계마다: 이름 · 기본 길이(ms) · 켜기 prop. 꺼진 단계는 길이 0 — 그 단계가 맡던 값은 아래 규칙대로 건너뛴다.
  // 발광(중심이 밝아지고 범위가 커지는 것)은 쓰지 않는다 — 생성 다음 곧바로 소거로 들어간다
  STAGES() {
    return [
      { key: 'stage1_create', no: '1', name: '생성 — 배경 뒤', back: '제거 — 컴포넌트가 사라짐', ms: 120 },
      { key: 'stage2_dissolve', no: '2', name: '소거 — 글자가 빛난 뒤 사라짐', back: '메움 — 글자가 빛나며 다시 채움', ms: 600 },
      { key: 'stage3_rise', no: '3', name: '부상 — 밝아진 뒤 맨 위로', back: '하강 — 배경 뒤로, 어두워짐', ms: 180 },
      { key: 'stage4_restore', no: '4', name: '복원 — 소거와 같은 속도', back: '다시 비움 — 복원의 거울', ms: 600 }
    ];
  }
  // 컴포넌트 종류 2개
  //  레거시 — 글자 장이 비면서 그 아래의 컴포넌트가 솟는다 (원본: 사각형 · 글자)
  //  마스크 — 컴포넌트는 배경 뒤에 그대로 있고, 그 모양과 색이 글자 장에 투영된다 (원본: 이미지 · 카드 · 글자)
  KIND() { const k = this.state.kind ?? this.props.compType ?? '레거시'; return k === '마스크' ? 'mask' : k === '혼합' ? 'mix' : k === '텍스트' ? 'data' : 'legacy'; }
  LENSMODE() { return this.state.lensMode ?? (this.props.compType === '돋보기'); }   // 돋보기 — 지금 컴포넌트(레거시 · 마스크 · 혼합 · 텍스트)를 그대로 두고 그 위에서 확대
  // 텍스트 — 원본 컴포넌트가 없다. 글자 장의 글자가 그 자리에서 데이터 문자열로 바뀐다 (서체·크기는 글자 장 그대로)
  DATA() { return this.props.dataText ?? 'node-07 · 온라인'; }

      tc: { disp: DT && this.TMOTION() === '랜덤 갱신' ? 'flex' : 'none', opts: ['가속', '감속'].map((name) => { const sel = this.TCURVE() === name;
        return { name: name + (name === '가속' ? ' · 주기 ↓' : ' · 주기 ↑'), cls: sel ? 'sel' : '', pressed: sel ? 'true' : 'false', pick: () => { if (sel) return; this.endDrag(); this._seq = null; this.setState({ tcurve: name, hidden: true, cur: -1, dir: '' }); setTimeout(() => { if (this._live) this.play(); }, 30); } }; }) },
      tr: { disp: MV || DT ? 'none' : 'block', cls: this.TRAIL() ? 'sel' : '', pressed: this.TRAIL() ? 'true' : 'false', label: '잔상 : ' + (this.TRAIL() ? '켬' : '끔'), toggle: () => this.setState({ trail: !this.TRAIL() }) },
      hb: { disp: MV || DT ? 'none' : 'block', cls: this.HOLEBACK() === '어둡게' ? 'sel' : '', pressed: this.HOLEBACK() === '어둡게' ? 'true' : 'false', label: '레거시 배경 : ' + (this.HOLEBACK() === '어둡게' ? '어둡게' : '비움'),
        toggle: () => this.setState({ holeBack: this.HOLEBACK() === '어둡게' ? '비움' : '어둡게' }) },
      rs: { disp: MV || DT ? 'none' : 'block', cls: this.RESTORE() ? 'sel' : '', pressed: this.RESTORE() ? 'true' : 'false', label: '배경 복원 : ' + (this.RESTORE() ? '켬' : '끔'),
        toggle: () => { const on = !this.RESTORE(); this.endDrag(); this.setState({ restore: on }); setTimeout(() => { if (this._live && this.KIND() !== 'mask') this.play(); }, 30); } },
      parts: MIX && this.shape().parts ? this.shape().parts.map((p, k) => ({
        id: p.id, text: p.text, w: p.w + 'px', h: p.h + 'px',
        left: 'calc(' + (POS.cx * 100).toFixed(3) + '% - ' + (Z.w / 2 - p.x) + 'px)', top: 'calc(' + (POS.cy * 100).toFixed(3) + '% - ' + (Z.h / 2 - p.y) + 'px)',
        z: (S.ptop || '')[k] === '1' ? 2 : 0, vis: S.hidden ? 'hidden' : 'visible'
      })) : [],
      sw: { disp: this.KIND() === 'mask' ? 'inline-flex' : 'none', label: S.mode === 'legacy' ? '마스크로' : '레거시로' },
      compHidden: S.hidden ? 'true' : 'false',
      kinds: [['legacy', '레거시'], ['mask', '마스크'], ['mix', '혼합'], ['data', '텍스트'], ['lens', '돋보기']].map(([id, name]) => { const LM = this.LENSMODE(), on = id === 'lens' ? LM : !LM && this.KIND() === id;
        return { name, cls: on ? 'sel' : '', pressed: on ? 'true' : 'false',
          pick: () => { if (id === 'lens') { if (!LM) { this.setState({ lensMode: true }); this.lensToggle(true); } return; }   // 돋보기 — 지금 컴포넌트는 그대로, 그 위에 돋보기를 펼친다
            if (LM) { this.setState({ lensMode: false, lensDraw: false }); this.lensToggle(false); if (this.KIND() === id) return; }
            if (this.KIND() === id) return; this.endDrag(); this._seq = null; this.setState({ kind: name, hidden: true, top: false, cur: -1, dir: '' }); setTimeout(() => { if (this._live) this.play(); }, 30); } }; }),
      emDisp: this.LENSMODE() ? 'none' : 'flex', lensDisp: this.LENSMODE() ? 'flex' : 'none', ldraw: LV.ldraw,
      types: (DT ? ['좌', '우', '중', '동시'] : this.KIND() === 'mask' ? ['이미지', '카드', '글자'] : this.KIND() === 'mix' ? [] : ['사각형', '글자']).map((name) => {
        const sel = DT ? this.DDIR() === name : this.KIND() === 'mask' ? this.MSRC() === name : (this.state.lsrc ?? this.props.legacySrc ?? '사각형') === name;
        if (DT) return { name, cls: sel ? 'sel' : '', pressed: sel ? 'true' : 'false', pick: () => { if (sel) return; this.endDrag(); this._seq = null; this.setState({ ddir: name, hidden: true, cur: -1, dir: '' }); setTimeout(() => { if (this._live) this.play(); }, 30); } };
        return { name, cls: sel ? 'sel' : '', pressed: sel ? 'true' : 'false',
          pick: () => { if (sel) return; this.endDrag(); this._seq = null; this.setState(this.KIND() === 'mask' ? { msrc: name, hidden: true, top: false, cur: -1, dir: '' } : { lsrc: name, hidden: true, top: false, cur: -1, dir: '' }); setTimeout(() => { if (this._live) this.play(); }, 30); } };
      }),
      comp: {
        bg: this.TYPE() === 'rect' ? '#0b1128' : 'transparent', border: this.TYPE() === 'rect' ? '1px solid #2b3666' : '0',
        pad: this.TYPE() === 'rect' ? '22px 24px' : '0', rectDisp: this.TYPE() === 'rect' ? 'flex' : 'none', labelDisp: this.TYPE() === 'rect' ? 'inline' : 'none',
        textDisp: this.TYPE() === 'rect' || (MIX && this.MIXBACK() === '배경') ? 'none' : 'block', text: this.TYPE() === 'mask' ? this.MSRC() + ' 컴포넌트' : this.props.text ?? 'TERRA',
        left: 'calc(' + (POS.cx * 100).toFixed(3) + '% - ' + Z.w / 2 + 'px)', top: 'calc(' + (POS.cy * 100).toFixed(3) + '% - ' + Z.h / 2 + 'px)',
        w: Z.w + 'px', h: Z.h + 'px', z: S.top ? 2 : 0, vis: S.hidden ? 'hidden' : 'visible',
        label: S.top ? '맨 위' : '배경 뒤', cursor: S.top || ((MV || MIX || DT) && S.ready) ? 'grab' : 'default'
      },
      spawnAt: (e) => {
        const r = e && e.currentTarget && e.currentTarget.getBoundingClientRect ? e.currentTarget.getBoundingClientRect() : null;
        if (!r) return;
        if (this.LENSMODE() && !this.LENS().bind) { this._lensA = { t0: performance.now(), dir: 1 }; this.setLens({ on: true, x: (e.clientX - r.left) / r.width, y: (e.clientY - r.top) / r.height }); return; }   // 돋보기 — 누른 자리로 펼친다
        this.play((e.clientX - r.left) / r.width, (e.clientY - r.top) / r.height);
      },
      stopProp: (e) => { if (e && e.stopPropagation) e.stopPropagation(); },
      replay: () => this.play(),
      dragStart: (e) => { if (this.LENSMODE() && !this.LENS().bind) return;   // 돋보기 모드 — 컴포넌트를 누르면 그 자리로 돋보기(바닥의 spawnAt 이 받는다)
        if (!e) return;
        if (e.stopPropagation) e.stopPropagation();   // 바탕의 '그 자리에서 새로'를 막는다
        if (!(this.state.top || (((this.KIND() === 'mask' && this.state.mode !== 'legacy') || this.KIND() === 'mix' || this.KIND() === 'data') && this.state.ready)) || this.state.hidden) return;   // 맨 위로 올라온 뒤(마스크는 투영이 다 된 뒤)에만 옮긴다
        const root = e.currentTarget.parentElement, r = root.getBoundingClientRect();
        const P0 = this._dragPos || this.state;
        this._drag = { r, dx: e.clientX - (r.left + P0.cx * r.width), dy: e.clientY - (r.top + P0.cy * r.height) };
        clearTimeout(this._loopT);
        if (e.currentTarget.setPointerCapture && e.pointerId != null) e.currentTarget.setPointerCapture(e.pointerId);
      },
      dragMove: (e) => {
        const D = this._drag; if (!D || !e) return;
        const Z = this.SIZE(), mx = Z.w / 2 / D.r.width, my = Z.h / 2 / D.r.height;
        const cx = Math.min(1 - mx, Math.max(mx, (e.clientX - D.dx - D.r.left) / D.r.width));
        const cy = Math.min(1 - my, Math.max(my, (e.clientY - D.dy - D.r.top) / D.r.height));
        this._dragPos = { cx, cy };   // 다시 그리지 않는다 — 다음 글자 장 프레임이 DOM 과 함께 옮긴다
      },
      dragEnd: (e) => {
        if (!this._drag) return;
        this.endDrag();
        if (e && e.currentTarget && e.currentTarget.releasePointerCapture && e.pointerId != null) { try { e.currentTarget.releasePointerCapture(e.pointerId); } catch (_) {} }
      }
    };
  }
}
