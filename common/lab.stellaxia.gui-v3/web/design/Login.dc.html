<script type="text/x-dc" data-dc-script data-props='{"embed":{"editor":"boolean","default":false,"section":"삽입"},"palette":{"editor":"enum","options":["은하수","성운","단색"],"default":"은하수","section":"글자 장"},"speed":{"editor":"range","min":0,"max":2,"step":0.1,"default":1,"section":"글자 장"},"cell":{"editor":"int","min":11,"max":24,"default":15,"unit":"px","section":"글자 장"},"motion":{"editor":"boolean","default":true,"section":"글자 장"},"installed":{"editor":"enum","options":["Tree","Leaf","Tree + Leaf"],"default":"Leaf","section":"로그인"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  componentDidMount() {
    this._live = true;
    this.startField('login');
  }
  componentWillUnmount() {
    this._live = false;
    this.stopField();
  }

  // ───── 메인 → 로그인 ─────
  //   처음(메인): 메인 레퍼런스처럼 TERRA 만. 화면을 한 번 누르면 로고(마스크)가 위로 올라가고(0.7초), 비운 자리에 로그인 컴포넌트가 차례로 나타난다. Esc = 메인으로 (거꾸로)
  //   로그인 컴포넌트 — 기본은 텍스트 컴포넌트(글자 장의 칸 글자가 바뀐다), TREE LEAF 만 마스크
  //       TREE · LEAF                       마스크, 로고의 1/3 — 이 노드에 설치된 타입은 높은 명도 · 아니면 낮은 명도 (TREE 어두운 초록 · LEAF 연두)
  //   admin     : admin_______________      입력 칸도 텍스트 — 빈 칸은 흐린 점(·), 친 글자는 흰색, 입력 중이면 커서 칸이 깜박
  //   password  : ••••················
  //   social       auto □       Login       social · auto: 밝힌 바탕색 · auto 는 누르면 ■ (로그인 유지) · Login: 흰색
  //   New Tree Connect                      파랑
  //   전부 볼드, 랜덤 갱신 · 오른쪽으로 발생 · 주기 증가. 색은 정해져 있되 그 칸 바탕색 20% 섞임
  INSTALLED() { const v = (this.state || {}).inst ?? this.props.installed ?? 'Leaf'; return { tree: v !== 'Leaf', leaf: v !== 'Tree' }; }
  LCOL() { return { tree: [44, 150, 86], leaf: [176, 236, 96], white: [242, 244, 252], blue: [104, 156, 255], dim: [58, 68, 108], label: [176, 184, 214], hint: [132, 142, 180] }; }
  LT() { return { move: 850, after: 150, step: 120, cell: 38, dur: 520, out: 320 }; }
  cellsOf(t) { const out = []; for (const c of t) { out.push(c); if (/[ᄀ-ᅟ가-힣]/.test(c)) out.push(''); } return out; }
  layoutLogin() {
    const w = this._w, h = this._h, cw = this._cw, ch = this._ch;
    // CLI 틀 + 포스터 — 머리 줄(┌─ TERRA // LOGIN ─ 01/02 ─┐) · 프롬프트 · 메타 · 노드 타입 낱말(6줄 마스크) + 빗금 블록 · 구분 줄 · 입력 둘 · social · auto / Login · New Tree · 아래 줄(키)
    const size = Math.min(w * 0.19, h * 0.36), logoH = size * 0.74, WR = 6, PW = 40, BODY = 25;
    const stack = logoH + ch * 1.6 + BODY * ch, top = Math.max(ch * 2, (h - stack) / 2);
    const logoY1 = top + logoH / 2, rT = Math.ceil((top + logoH + ch * 1.6) / ch), ms = 0, maskY = 0;
    const rP = rT + 1, rM = rT + 2, rW = rT + 4, rR = rW + WR + 1, rA = rR + 2, rB = rA + 2, rC = rB + 2, rD = rC + 2, rE = rD + 2, rK = rE + 2, rS = rK + 2;
    const c0 = Math.round(w / 2 / cw) - PW / 2, room = PW - 12;
    const fld = (r) => ({ x: (c0 + 11) * cw, y: r * ch - 3, w: (room + 1) * cw, h: ch + 6 });
    this._L = { zone: { c0: c0 - 3, c1: c0 + PW + 2, r0: rT - 1, r1: rS + 1 }, size, ms, logoY0: h * 0.5, logoY1, dyRows: Math.round((logoY1 - h * 0.5) / ch), maskY, PW, rT, rP, rM, rW, WR, rR, c0, rA, rB, rC, rD, rE, rK, rS, room,
      stripe: { c0: c0 + PW - 8, c1: c0 + PW - 1 },
      hit: { auto: { c0: c0, c1: c0 + 7, r: rD }, login: { c0: c0 + PW - 7, c1: c0 + PW - 1, r: rD }, nt: { c0: c0, c1: c0 + 17, r: rE } } };
    const px = (o) => ({ x: Math.round(o.c0 * cw - 4), y: Math.round(o.r * ch - 4), w: Math.round((o.c1 - o.c0 + 1) * cw + 8), h: ch + 8 }), H = this._L.hit;
    const pos = { ia: fld(rA), ip: fld(rB), ab: px(H.auto), lb: px(H.login), nb: px(H.nt) };
    if (JSON.stringify(pos) !== JSON.stringify((this.state || {}).pos)) this.setState({ pos });
  }
  // 열림 정도 — 로고 이동(0 → 1) · 컴포넌트가 나타나기 시작하는 시각
  openVals(now) {
    // 로고 이동 — 등가속 → 등감속 (가속 구간 40% · 감속 구간 60% — 감속이 더 완만하게 길다). 속도는 0 에서 시작해 0 으로 멈춘다
    const S = this.state || {}, T = this.LT(), F = 0.4, ss = (x) => { x = Math.min(1, Math.max(0, x)); return x < F ? x * x / F : 1 - (1 - x) * (1 - x) / (1 - F); };
    if (S.open) return { e: ss((now - (this._openAt || now)) / T.move), showAt: (this._openAt || now) + T.move + T.after, open: true };
    const t = now - (this._closeAt || -1e9), n = this._outN || 0, outEnd = n * 20 + T.out;   // 닫기: 글자가 먼저 사라지고(오른쪽부터), 그다음 로고가 내려온다
    return { e: 1 - ss((t - outEnd) / T.move), out: t, open: false };
  }
  // 글자 줄 — 입력 칸도 텍스트: 친 글자(흰색) + 남은 자리 점(흐림)
  loginItems() {
    const L = this._L, S = this.state || {}, room = L.room, PW = L.PW, c0 = L.c0, cut = (t) => (t.length > room - 1 ? t.slice(t.length - room + 1) : t);
    const A = cut(S.va || ''), Pw = cut('•'.repeat((S.vp || '').length)), dash = (n) => '─'.repeat(Math.max(0, n));
    const isT = (this._wCur || (this.INSTALLED().tree && !this.INSTALLED().leaf ? 2 : 3)) === 2, ty = isT ? 'tree' : 'leaf', TY = ty.toUpperCase();
    const it = [
      // 머리 줄 — 틀 모서리 · 제목 · 쪽 번호
      { k: 't0', t: '┌─', c: c0 - 2, r: L.rT, col: 'dim' }, { k: 't1', t: 'TERRA // LOGIN', c: c0 + 1, r: L.rT, col: 'label', thin: true },
      { k: 't2', t: dash(PW - 23), c: c0 + 16, r: L.rT, col: 'dim' }, { k: 't3', t: '01/02', c: c0 + PW - 6, r: L.rT, col: 'label', thin: true }, { k: 't4', t: '─┐', c: c0 + PW, r: L.rT, col: 'dim' },
      // 프롬프트 · 메타
      { k: 'p0', t: '○', c: c0, r: L.rP, col: 'ty' }, { k: 'p1', t: 'terra login --as', c: c0 + 2, r: L.rP, col: 'hint' }, { k: 'p2', t: ty, c: c0 + 19, r: L.rP, col: 'white', live: true },
      { k: 'm0', t: 'NODE AUTH // GATEWAY', c: c0, r: L.rM, col: 'label', thin: true }, { k: 'm1', t: '[' + TY + ']', c: c0 + PW - 6, r: L.rM, col: 'ty', live: true },
      // 구분 줄 — 낱말 아래
      { k: 'r0', t: 'NODE TYPE', c: c0, r: L.rR, col: 'label', thin: true }, { k: 'r1', t: dash(PW - 16), c: c0 + 10, r: L.rR, col: 'dim' }, { k: 'r2', t: isT ? 'T/02' : 'L/03', c: c0 + PW - 4, r: L.rR, col: 'ty', live: true },
      // 입력 — CLI 줄
      { k: 'aL', t: 'admin', c: c0, r: L.rA, col: 'white' }, { k: 'aC', t: '>', c: c0 + 9, r: L.rA, col: 'label' },
      { k: 'aV', t: A, c: c0 + 11, r: L.rA, col: 'white', live: true }, { k: 'aD', t: '·'.repeat(room - A.length), c: c0 + 11 + A.length, r: L.rA, col: 'dim', live: true },
      { k: 'pL', t: 'password', c: c0, r: L.rB, col: 'white' }, { k: 'pC', t: '>', c: c0 + 9, r: L.rB, col: 'label' },
      { k: 'pV', t: Pw, c: c0 + 11, r: L.rB, col: 'white', live: true }, { k: 'pD', t: '·'.repeat(room - Pw.length), c: c0 + 11 + Pw.length, r: L.rB, col: 'dim', live: true },
      { k: 'so', t: 'social', c: c0, r: L.rC, col: 'bgb' }, { k: 'sd', t: dash(PW - 7), c: c0 + 7, r: L.rC, col: 'dim', thin: true },
      // auto · Login
      { k: 'ab', t: S.autoOn ? '[■]' : '[ ]', c: c0, r: L.rD, col: 'bgb', hv: 'auto', live: true }, { k: 'au', t: 'auto', c: c0 + 4, r: L.rD, col: 'bgb', hv: 'auto' }, { k: 'an', t: '· 로그인 유지', c: c0 + 9, r: L.rD, col: 'hint', thin: true },
      { k: 'lg', t: '⏎ Login', c: c0 + PW - 7, r: L.rD, col: 'white', hv: 'login' },
      { k: 'nt', t: '+ New Tree Connect', c: c0, r: L.rE, col: 'blue', hv: 'nt' },
      // 아래 줄 — 키
      { k: 'b0', t: '└─', c: c0 - 2, r: L.rK, col: 'dim' }, { k: 'b1', t: 'enter · tab · esc', c: c0 + 1, r: L.rK, col: 'hint', thin: true }, { k: 'b2', t: dash(PW - 19) + '─┘', c: c0 + 19, r: L.rK, col: 'dim' }
    ];
    if (S.msg) { const cl = this.cellsOf(S.msg).length; it.push({ k: 'ms', t: S.msg, c: c0 + Math.max(0, Math.round((PW - cl) / 2)), r: L.rS, col: 'hint', thin: true }); }
    return it;
  }
  // 나타나는 시각 — 열 때: 줄 차례로(0.12초씩) · 그 뒤 바뀐 줄: 그때부터 · 입력처럼 계속 바뀌는 줄(live)은 처음 나타난 뒤로는 바로
  syncItems(now, OV) {
    const T = this._TX || (this._TX = {}), items = this.loginItems(), LT = this.LT(); let ord = 0;
    for (const it of items) { const P = T[it.k], first = OV.showAt + 120 + (ord++) * LT.step;
      if (!P || P.gen !== this._gen) T[it.k] = Object.assign({}, it, { at: first, gen: this._gen, g: [], nx: [] });
      else if (P.t !== it.t || P.c !== it.c || P.r !== it.r) Object.assign(P, it, { at: it.live && now > P.at ? now - 1e5 : Math.max(now, P.at), g: [], nx: [] });
      else Object.assign(P, { col: it.col, hv: it.hv }); }
    for (const k in T) if (!items.find((q) => q.k === k)) delete T[k];
  }
  // 노드 타입 낱말 — 설치된 것 하나. 둘 다 설치면 LEAF → TREE 를 4초마다 번갈아. 바뀔 때는 지우기와 만들기를 같은 앞선으로 동시에 오른쪽으로 쓸어 간다
  wordState(now, OV) {
    const I = this.INSTALLED(), W = I.leaf && I.tree ? [3, 2] : I.tree ? [2] : [3], PER = 4000;
    if (!OV.open) return { cur: this._wCur || W[0], prev: 0, t0: -1e12 };
    // 모드를 바꾸면 그 순간부터 다시 센다 — 보이던 낱말에서 새 낱말로 같은 쓸기로 바뀐다 (같은 낱말이면 그대로)
    const md = this._modeAt && this._modeAt > OV.showAt, base = md ? this._modeAt : OV.showAt;
    const k = W.length > 1 ? Math.max(0, Math.floor((now - base) / PER)) : 0, cur = W[k % W.length];
    let prev = k > 0 ? W[(k - 1) % W.length] : md ? this._wFrom : 0, t0 = base + k * PER;
    if (k === 0 && md && prev === cur) { prev = 0; t0 = -1e12; }
    this._wCur = cur;
    return { cur, prev, t0 };
  }
  // 직전 발광 색 — 흰색이 아니라 그 자리 글자 색으로 빛난다 (레거시 · 마스크 발광과 같은 식: 채도 ×(1 - 0.25g) · 명도 max(V, 0.25) + 0.6g)
  glowC(c, g) {
    const r = c[0] / 255, gg = c[1] / 255, b = c[2] / 255, mx = Math.max(r, gg, b), mn = Math.min(r, gg, b), d = mx - mn;
    let h = 0; if (d) h = mx === r ? ((gg - b) / d) % 6 : mx === gg ? (b - r) / d + 2 : (r - gg) / d + 4; h /= 6; if (h < 0) h += 1;
    const S = (mx ? d / mx : 0) * (1 - 0.25 * g), V = Math.min(1, Math.max(mx, 0.25) + 0.6 * g);
    const i = Math.floor(h * 6), f = h * 6 - i, p = V * (1 - S), q = V * (1 - f * S), t = V * (1 - (1 - f) * S);
    const o = [[V, t, p], [q, V, p], [p, V, t], [p, q, V], [t, p, V], [V, p, q]][i % 6];
    return [o[0] * 255, o[1] * 255, o[2] * 255];
  }
  // 농도 글자 — 값 0–1 을 네 단으로. 같은 칸은 늘 같은 글자(단 안에서 칸 번호로 고른다)
  rampG(v, i) { const R = v < 0.4 ? ':-·' : v < 0.62 ? '+=*' : v < 0.84 ? '#%&' : '@#$'; return R[(i * 7 + (i / 97 | 0)) % R.length]; }
  mixC(a, b, k) { return [a[0] * (1 - k) + b[0] * k, a[1] * (1 - k) + b[1] * k, a[2] * (1 - k) + b[2] * k]; }
  brightBg(c) { const m = Math.max(c[0], c[1], c[2]) || 1, k = 236 / m; return [Math.min(255, c[0] * k), Math.min(255, c[1] * k), Math.min(255, c[2] * k)]; }
