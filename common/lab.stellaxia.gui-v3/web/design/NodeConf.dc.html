<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Terra — 노드 설정</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;family=Noto+Sans+KR:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#040614}
.nc-nav{border-right:1px solid rgba(70,160,108,.32);padding:12px 10px;overflow-y:auto;display:flex;flex-direction:column;gap:2px;grid-row:1 / span 2}
.nc-id{display:flex;flex-direction:column;gap:2px;padding:0 4px 10px;border-bottom:1px solid rgba(70,160,108,.22);margin-bottom:6px}
.nc-id b{font-weight:700;color:#d0ff96}
.nc-k{font:500 11px 'Geist Mono',GmarketSans,monospace;color:#709c80}
.nc-gh{display:flex;align-items:center;gap:6px;margin:10px 0 4px;font:700 11px GmarketSans,'Geist Mono',sans-serif;color:#78e89c}
.nc-hl{display:inline-block;width:12px;height:1px;background:rgba(70,160,108,.85);flex:none}
.nc-hr{flex:1;height:1px;background:rgba(70,160,108,.4)}
.nc-ni{display:flex;align-items:center;gap:6px;width:100%;padding:6px 8px;border:0;background:transparent;color:#9cc4a8;font:500 12px GmarketSans,'Geist Mono',sans-serif;text-align:left;cursor:pointer}
.nc-ni:hover{background:rgba(70,170,110,.1);color:#d6f4de}
.nc-ni.on{background:rgba(70,170,110,.2);color:#d0ff96;box-shadow:inset 2px 0 0 rgba(70,160,108,.95)}
.nc-badge{margin-left:auto;font:600 10px 'Geist Mono',monospace;color:#ffd27a}
.nc-main{overflow-y:auto;padding:14px 18px 10px}
.nc-h{display:flex;align-items:center;gap:8px;margin:0 0 10px;font:700 13px GmarketSans,'Geist Mono',sans-serif;color:#78e89c}
.nc-row{display:grid;grid-template-columns:minmax(150px,220px) minmax(0,1fr);align-items:center;gap:16px;padding:9px 0;border-bottom:1px solid rgba(70,160,108,.14)}
.nc-lab{display:flex;flex-direction:column;gap:2px}
.nc-ctl{display:flex;align-items:center;gap:10px;min-width:0}
.nc-ctl input[type=range]{flex:1;max-width:260px;accent-color:#6eec9c}
.nc-val{font:500 11px 'Geist Mono',monospace;color:#d6f4de;min-width:44px}
.nc-tg{display:inline-flex;align-items:center;gap:8px;border:1px solid rgba(70,160,108,.45);background:transparent;color:#709c80;font:600 11px GmarketSans,'Geist Mono',sans-serif;padding:4px 10px 4px 6px;cursor:pointer}
.nc-tgk{width:22px;height:10px;border:1px solid rgba(70,160,108,.6);position:relative}
.nc-tgk::after{content:'';position:absolute;top:1px;left:1px;width:8px;height:6px;background:#548064;transition:left .15s}
.nc-tg.on{color:#d0ff96;border-color:rgba(110,236,156,.85)}
.nc-tg.on .nc-tgk::after{left:11px;background:#96f0aa}
.nc-seg{display:inline-flex;border:1px solid rgba(70,160,108,.45)}
.nc-seg button{border:0;background:transparent;color:#709c80;font:600 11px GmarketSans,'Geist Mono',sans-serif;padding:4px 10px;cursor:pointer}
.nc-seg button.on{background:rgba(70,170,110,.25);color:#d0ff96}
.nc-in{display:flex;align-items:center;gap:8px;border-bottom:1px solid rgba(56,128,88,.55);padding:3px 0 4px;flex:1;max-width:320px}
.nc-in span{font:700 12px 'Geist Mono',monospace;color:#78e89c}
.nc-in input{flex:1;min-width:0;border:0;outline:none;background:transparent;color:#d6f4de;font:500 12px 'Geist Mono',GmarketSans,monospace;padding:0}
.nc-in input[readonly]{color:#709c80}
.nc-in:focus-within{border-bottom-color:rgba(110,236,156,.9)}
.nc-in-s{max-width:150px}
.nc-chips{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.nc-chip{display:inline-flex;align-items:center;gap:4px;border:1px solid rgba(70,160,108,.45);padding:2px 2px 2px 8px;font:500 11px 'Geist Mono',GmarketSans,monospace}
.nc-chip button{border:0;background:transparent;color:#709c80;cursor:pointer;width:18px}
.nc-chip button:hover{color:#ffb2a6}
.nc-danger{border:1px solid rgba(220,90,80,.6);background:transparent;color:#ffb2a6;font:600 12px GmarketSans,'Geist Mono',sans-serif;padding:5px 12px;cursor:pointer}
.nc-danger:hover,.nc-danger.arm{background:rgba(220,90,80,.22)}
.nc-foot{display:flex;align-items:center;gap:10px;padding:8px 18px;border-top:1px solid rgba(70,160,108,.32)}
.nc-msg{font:500 11px GmarketSans,'Geist Mono',sans-serif;color:#96f0aa}
.nc-btn{min-height:28px;padding:0 14px;border:1px solid rgba(70,160,108,.45);background:transparent;color:#d6f4de;font:600 12px GmarketSans,'Geist Mono',sans-serif;cursor:pointer}
.nc-btn:hover:not([disabled]){border-color:rgba(110,236,156,.8);background:rgba(70,170,110,.16)}
.nc-btn[disabled]{opacity:.4;cursor:default}
.nc-pri{background:rgba(70,170,110,.22);border-color:rgba(110,236,156,.85);color:#d0ff96}
.nc button:focus-visible,.nc input:focus-visible{outline:1px solid #d0ff96;outline-offset:2px}
.nc-row:has(.nc-skins){align-items:start}
.nc-ctl:has(.nc-skins){flex-direction:column;align-items:stretch}
.nc-skins{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px}
.nc-skin{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px 6px;border:1px solid rgba(70,160,108,.3);background:transparent;color:#9cc4a8;font:500 11px GmarketSans,'Geist Mono',sans-serif;cursor:pointer;min-width:0}
.nc-skin img,.nc-sk0{width:40px;height:40px;image-rendering:pixelated}
.nc-sk0{display:grid;place-items:center;font-size:22px;color:#548064}
.nc-skn{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#d6f4de}
.nc-skin .nc-k{font-size:10px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nc-skin:hover{background:rgba(70,170,110,.1)}
.nc-skin.on{border-color:rgba(110,236,156,.9);background:rgba(70,170,110,.2)}
.nc-skin.on .nc-skn{color:#d0ff96}
.nc-prof{display:flex;align-items:center;gap:14px;min-width:0}
.nc-pav{width:72px;height:72px;border-radius:50%;border:1px solid rgba(110,236,156,.6);overflow:hidden;display:grid;place-items:center;flex:none;background:#05081a}
.nc-pav img{width:100%;height:100%;object-fit:cover}
.nc-pcol{display:flex;flex-direction:column;gap:5px;min-width:0}
.nc-prow{display:flex;gap:6px}
.nc-prow .nc-btn{display:inline-flex;align-items:center}
.nc-pcol .nc-k{overflow-wrap:anywhere}
.nc-meta{display:flex;align-items:center;gap:6px;margin-top:2px;flex-wrap:wrap}
.nc-meta code{font:500 10px 'Geist Mono',monospace;color:#5d8a6c}
.nc-tag{font:600 10px GmarketSans,'Geist Mono',sans-serif;padding:0 5px;border:1px solid}
.nc-tag.ed{color:#96f0aa;border-color:rgba(110,236,156,.55)}
.nc-tag.ro{color:#8a9cb0;border-color:rgba(138,156,176,.45)}
.nc-rs{font:500 10px GmarketSans,'Geist Mono',sans-serif;color:#ffd27a}
.nc-row:has(.nc-list),.nc-row:has(.nc-dirs){align-items:start}
.nc-list{margin:0;padding:0 0 0 14px;display:flex;flex-direction:column;gap:3px;font:500 11px 'Geist Mono',GmarketSans,monospace;color:#9cc4a8}
.nc-dirs{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}
.nc-dir{display:flex;align-items:center;gap:8px;min-width:0}
.nc-dir .nc-in{max-width:none}
.nc-dir .nc-in-s{flex:0 0 120px}
.nc-x{border:0;background:transparent;color:#709c80;cursor:pointer;font-size:14px;width:22px}
.nc-x:hover{color:#ffb2a6}
.nc-add{align-self:flex-start}
.nc-warn{border-color:rgba(255,210,122,.7);color:#ffd27a}
.nc-danger[disabled]{opacity:.4;cursor:default}
.nc-row:has(.nc-meta) .nc-lab{gap:3px}
</style>
</helmet>
<div class="nc" style="position: relative; width: 100%; height: {{rootH}}; box-sizing: border-box; display: grid; grid-template-columns: 190px minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto; background: #040614; color: #d6f4de; font: 500 12px GmarketSans, 'Geist Mono', 'Noto Sans KR', sans-serif;">
  <nav aria-label="설정 분류" class="nc-nav">
    <div class="nc-id"><b>{{name}}</b><span class="nc-k">{{kind}} · {{nodeId}}</span></div>
    <sc-for list="{{groups}}" as="g" hint-placeholder-count="2">
      <div class="nc-gh"><span class="nc-hl"></span>{{g.name}}<span class="nc-hr"></span></div>
      <sc-for list="{{g.items}}" as="it" hint-placeholder-count="3">
        <button type="button" class="nc-ni {{it.cls}}" aria-current="{{it.cur}}" onClick="{{it.pick}}">{{it.name}}<span class="nc-badge">{{it.badge}}</span></button>
      </sc-for>
    </sc-for>
  </nav>
  <main class="nc-main" aria-label="{{secName}}">
    <h2 class="nc-h"><span class="nc-hl"></span>{{secName}}<span class="nc-hr"></span><span class="nc-k">{{secGroup}}</span></h2>
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="5">
      <div class="nc-row">
        <div class="nc-lab"><span>{{r.label}}</span><span class="nc-k">{{r.sub}}</span><sc-if value="{{r.isMeta}}" hint-placeholder-val="{{ false }}"><span class="nc-meta"><code>{{r.keyT}}</code><span class="nc-tag {{r.tagCls}}">{{r.tagT}}</span><span class="nc-rs">{{r.rsT}}</span></span></sc-if></div>
        <div class="nc-ctl">
          <sc-if value="{{r.isToggle}}" hint-placeholder-val="{{ true }}"><button type="button" class="nc-tg {{r.tgCls}}" aria-pressed="{{r.on}}" onClick="{{r.toggle}}"><span class="nc-tgk"></span>{{r.tgT}}</button></sc-if>
          <sc-if value="{{r.isSeg}}" hint-placeholder-val="{{ false }}"><span class="nc-seg"><sc-for list="{{r.opts}}" as="o" hint-placeholder-count="3"><button type="button" aria-pressed="{{o.on}}" class="{{o.cls}}" onClick="{{o.pick}}">{{o.name}}</button></sc-for></span></sc-if>
          <sc-if value="{{r.isText}}" hint-placeholder-val="{{ false }}"><label class="nc-in"><span>&gt;</span><input type="text" value="{{r.val}}" placeholder="{{r.ph}}" onInput="{{r.input}}" spellcheck="false" aria-label="{{r.label}}" readonly="{{r.ro}}"></label></sc-if>
          <sc-if value="{{r.isRange}}" hint-placeholder-val="{{ false }}"><input type="range" min="{{r.min}}" max="{{r.max}}" step="{{r.step}}" value="{{r.val}}" onInput="{{r.input}}" aria-label="{{r.label}}"><span class="nc-val">{{r.valT}}</span></sc-if>
          <sc-if value="{{r.isChips}}" hint-placeholder-val="{{ false }}"><span class="nc-chips"><sc-for list="{{r.chips}}" as="c" hint-placeholder-count="2"><span class="nc-chip">{{c.name}}<button type="button" aria-label="{{c.name}} 빼기" onClick="{{c.del}}">×</button></span></sc-for><label class="nc-in nc-in-s"><span>+</span><input type="text" placeholder="이름 — Enter" value="{{r.draft}}" onInput="{{r.input}}" onKeyDown="{{r.key}}" spellcheck="false" aria-label="{{r.label}} 더하기"></label></span></sc-if>
          <sc-if value="{{r.isProf}}" hint-placeholder-val="{{ false }}"><span class="nc-prof"><span class="nc-pav"><sc-if value="{{r.hasImg}}" hint-placeholder-val="{{ false }}"><img src="{{r.pImg}}" alt="프로필 미리보기"></sc-if><sc-if value="{{r.noImg}}" hint-placeholder-val="{{ true }}"><span class="nc-sk0">◍</span></sc-if></span><span class="nc-pcol"><span class="nc-prow"><label class="nc-btn">이미지 · GIF 올리기<input type="file" accept="image/*" onChange="{{r.pick}}" style="display: none;"></label><button type="button" class="nc-btn" onClick="{{r.clear}}">지우기</button></span><span class="nc-k">파일 › {{r.pPath}}</span><span class="nc-k">경로 기록 › {{r.pProps}}</span></span></span></sc-if>
          <sc-if value="{{r.isSkin}}" hint-placeholder-val="{{ false }}"><span class="nc-skins" role="radiogroup" aria-label="{{r.label}}"><sc-for list="{{r.skins}}" as="k" hint-placeholder-count="4"><button type="button" role="radio" aria-checked="{{k.on}}" class="nc-skin {{k.cls}}" onClick="{{k.pick}}"><sc-if value="{{k.noThumb}}" hint-placeholder-val="{{ false }}"><span class="nc-sk0">◍</span></sc-if><sc-if value="{{k.hasThumb}}" hint-placeholder-val="{{ true }}"><img src="{{k.thumb}}" alt="" width="40" height="40"></sc-if><span class="nc-skn">{{k.name}}</span><span class="nc-k">{{k.path}}</span></button></sc-for></span><span class="nc-k">{{r.skinEmpty}}</span></sc-if>
          <sc-if value="{{r.isDanger}}" hint-placeholder-val="{{ false }}"><button type="button" class="nc-danger {{r.dCls}}" onClick="{{r.act}}" disabled="{{r.dOff}}">{{r.dT}}</button></sc-if>
          <sc-if value="{{r.isList}}" hint-placeholder-val="{{ false }}"><ul class="nc-list"><sc-for list="{{r.items}}" as="it" hint-placeholder-count="3"><li>{{it.t}}</li></sc-for></ul></sc-if>
          <sc-if value="{{r.isDirs}}" hint-placeholder-val="{{ false }}"><span class="nc-dirs"><sc-for list="{{r.dirs}}" as="dd" hint-placeholder-count="1"><span class="nc-dir"><label class="nc-in nc-in-s"><span>@</span><input type="text" value="{{dd.name}}" onInput="{{dd.inName}}" spellcheck="false" aria-label="공유 이름"></label><label class="nc-in"><span>&gt;</span><input type="text" value="{{dd.path}}" placeholder="~/TerraShare" onInput="{{dd.inPath}}" spellcheck="false" aria-label="공유 경로"></label><button type="button" class="nc-x" aria-label="이 공유 폴더 빼기" onClick="{{dd.del}}">×</button></span></sc-for><button type="button" class="nc-btn nc-add" onClick="{{r.add}}">+ 공유 폴더</button></span></sc-if>
          <sc-if value="{{r.hasAct}}" hint-placeholder-val="{{ false }}"><button type="button" class="nc-btn" onClick="{{r.noteRun}}">{{r.actT}}</button></sc-if>
        </div>
      </div>
    </sc-for>
  </main>
  <footer class="nc-foot">
    <span class="nc-k">{{dirtyT}}</span><span style="flex: 1;"></span><span class="nc-msg" aria-live="polite">{{msg}}</span>
    <button type="button" class="nc-btn nc-warn" style="display: {{restartD}};" onClick="{{restartNow}}">지금 다시 시작</button>
    <button type="button" class="nc-btn" onClick="{{revert}}" disabled="{{clean}}">되돌리기</button>
    <button type="button" class="nc-btn nc-pri" onClick="{{apply}}" disabled="{{clean}}">적용</button>
  </footer>
</div>
<script type="text/x-dc" data-dc-script data-props='{"nodeName":{"editor":"text","default":"02·b"},"nodeKind":{"editor":"enum","options":["계정","트리","리프","리소스"],"default":"리프"},"parentName":{"editor":"text","default":"02"},"nodeKey":{"editor":"text","default":""},"nodePath":{"editor":"text","default":""},"remote":{"editor":"boolean","default":false},"onSkin":{"editor":null},"winW":{"editor":null},"winH":{"editor":null},"$preview":{"width":860,"height":600}}'>
// 설정 창 — 노드를 두 쪽에서 관리. 왼쪽 분류, 오른쪽 항목, 아래 적용 · 되돌리기 (바뀐 수 · 재시작 필요 수)
//   GUI(사람마다 · 노드마다 보이는 모습) — 표시 · 프로필 · 스킨 · 뷰
//     표시 · 뷰 · 스킨 → 사용자 문서 me/documents (app:lab.stellaxia.gui-v3/…) — 어느 기기에서든 같다
//     프로필 → v3 모듈 백엔드(노드의 모듈 데이터 영역 · lab.stellaxia.gui-v3.node-files.*) — 그 노드를 보는 모든 사람에게 같다
//     (시안에서는 셋 다 localStorage 로 흉내: 'terra.skin' · 'terra.fs' · 'terra.fs.f.<노드 id>:<상대 경로>')
//   노드(Terra 코어 Daemon 설정 config.json — 실제 키 이름 그대로) — 정체 · 연결 · 공유 · 업데이트 · 로그 · 위험
//     읽기 terra.daemon.config.get(+schema.get) · 쓰기 terra.daemon.config.patch {set, save:true} — 쓰기는 로컬 노드만(권한 node.config)
//     원격 노드(remote)면 전부 읽기 + "그 노드에서 열기". 계정 · 리소스는 노드가 아니라 노드 설정이 없다
//     키마다 소유자(편집 = operator · 읽기 = installer/derived)와 재시작 필요 여부를 함께 보인다. 비밀 키 · 효과 없는 키 · 포트 편집은 두지 않는다
//   시안 — 노드 설정 값은 이 창 안에서만 (적용하면 기준값이 바뀐다)
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { sec: 'show', v: null, base: null, draft: {}, msg: '', arm: null, needRestart: 0 }; }
  isNode() { const k = this.props.nodeKind || '리프'; return k === '트리' || k === '리프'; }
  remote() { return !!this.props.remote; }
  // Daemon 설정 키 — [키, 소유자(O 편집 · I/D 읽기), 재시작 필요]. 근거: Terra products/leaf/daemon/src/terra_daemon/core/config.go (스키마 140키 중 v3 1차 노출분)
  DKEYS() { return {
    'daemon.device_name': ['O', false], 'daemon.roles': ['D', false], 'registration.node_id': ['D', false], 'registration.parent': ['D', false],
    'master.url': ['O', true], 'wireguard.advertise_endpoint': ['O', true], 'heartbeat.interval_sec': ['O', true],
    'storage.shared_dirs': ['O', true], 'storage.memos_dir': ['O', true], 'local_fs.enabled': ['O', false],
    'core.version': ['D', false], 'core_distribution.hold': ['O', true], 'core_distribution.hold_reason': ['O', true], 'core_distribution.allow_apply': ['O', true], 'core_distribution.maintenance_window': ['O', true], 'core_distribution.disk_quota_mb': ['O', true],
    'logging.level': ['O', false], 'logging.max_size_mb': ['O', true], 'logging.max_backups': ['O', true] }; }
  defaults() {
    const k = this.props.nodeKind || '리프', nm = this.props.nodeName || 'lab-ws-02', slug = nm.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'node', par = this.props.parentName || '—';
    return { label: true, orbit: true, color: '기본', proj: '마스크', view: k === '트리' ? '리프 뷰' : k === '리프' ? '리소스 뷰' : '트리 뷰', dbl: true, badge: true, skin: this.skinOf(), profile: this.profOf(),
      // 노드 설정 — 시안 값 (실제로는 GET /config 의 실행 중 값)
      'daemon.device_name': slug, 'daemon.roles': k === '트리' ? 'tree' : 'leaf', 'registration.parent': par, 'registration.node_id': this.nodeId(),
      'master.url': 'https://' + (par.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'tree') + '.terra.local:8080', 'wireguard.advertise_endpoint': '', 'heartbeat.interval_sec': 10,
      'storage.shared_dirs': [{ name: 'share-0', path: '~/TerraShare' }], 'storage.memos_dir': '', 'local_fs.enabled': true,
      'core.version': '1.7.0', 'core_distribution.hold': false, 'core_distribution.hold_reason': '', 'core_distribution.allow_apply': true, 'core_distribution.maintenance_window': '', 'core_distribution.disk_quota_mb': 4096,
      'logging.level': 'info', 'logging.max_size_mb': 10, 'logging.max_backups': 5 };
  }
  // 스킨 — 노드 id 로 저장한 구 id ('' = 기본 무늬). 보관함은 스타메이커와 같은 terra.star.index
  // ── 노드 파일 (프로필) ──
  fsAll() { try { const v = JSON.parse(localStorage.getItem('terra.fs') || 'null'); if (v && v.nodes) return v; } catch (e) {} return { nodes: {} }; }
  fsNode(F, id) { return F.nodes[id] || (F.nodes[id] = { files: {}, props: {} }); }
  profOf() { const N = this.fsAll().nodes[this.props.nodeKey || '']; return (N && N.props && N.props.profile && N.props.profile.image) || ''; }
  nodeBase() { return this.props.nodePath || '/' + (this.props.nodeName || 'node'); }
  // 속성에 적는 경로는 노드 상대 '/데이터/…' (백엔드 lab.stellaxia.gui-v3.node-props 와 같은 꼴) — 화면엔 노드 경로를 앞에 붙여 보인다. 예전 꼴(노드 경로 포함)도 읽는다
  relOf(path) { if (!path) return ''; const a = '/데이터/', b = this.nodeBase() + '/데이터/'; return path.startsWith(a) ? path.slice(a.length) : path.startsWith(b) ? path.slice(b.length) : ''; }
  profData(path) { const id = this.props.nodeKey || '', rel = this.relOf(path); if (!rel) return ''; try { return localStorage.getItem('terra.fs.f.' + id + ':' + rel) || ''; } catch (e) { return ''; } }
  profPick(f) {
