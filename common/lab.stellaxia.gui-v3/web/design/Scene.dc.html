      stageName: { tree: '트리 뷰', leaf: '리프 뷰', res: '리소스 뷰' }[S.resIn ? 'res' : this._lv ? 'leaf' : 'tree'],
      path: (() => { const fid = this._lv ? this._leafId : (this._focus ? this._focus.id : 0), parts = []; for (let n = sys.nodes[fid]; n; n = n.parent) parts.unshift(n.depth === 0 ? '계정' : n.label); if (S.resIn && S.resName) parts.push(S.resName); return parts.join(' › '); })(),
      hint: S.resIn ? 'ESC — 리프 뷰로 · 우클릭 — 속성' : this._lv ? '행성을 누르면 리소스 뷰로 · ESC — 트리 뷰로 (진입을 거꾸로)' : '트리를 누르면 그 계로 · 포커싱된 트리를 한 번 더 누르면 리프 뷰로 · ESC — 직전 초점으로',
      bgm: ['없음', '상', '하', '좌', '우'].map((name) => { const on = this.BGMOVE() === name; return { name, cls: on ? 'sel' : '', pressed: on ? 'true' : 'false', pick: () => { if (!on) this.setState({ bgMove: name }); } }; }),
      res: { disp: S.resIn ? 'flex' : 'none', name: S.resName || '', back: () => this.exitRes() },
      stars: Object.keys(this.STAR_TYPES()).map((name) => { const on = this.STAR() === name; return { name, cls: on ? 'sel' : '', pressed: on ? 'true' : 'false', pick: () => { if (!on) this.setState({ star: name }); } }; }),
      tr: { pressed: this.TRAILS() ? 'true' : 'false', label: '잔상 ' + (this.TRAILS() ? 'ON' : 'OFF'), bg: this.TRAILS() ? '#e6eaf7' : 'transparent', fg: this.TRAILS() ? '#040614' : '#e6eaf7', toggle: () => this.setState({ trails: !this.TRAILS() }) },
      mk: { pressed: this.STARMASK() ? 'true' : 'false', label: '마스크 ' + (this.STARMASK() ? 'ON' : 'OFF'), bg: this.STARMASK() ? '#e6eaf7' : 'transparent', fg: this.STARMASK() ? '#040614' : '#e6eaf7', toggle: () => this.setState({ starMask: !this.STARMASK() }) },
      stat: '트리 ' + (sys.nodes.length - 1) + ' · 깊이 ' + sys.depth,
      // 화면의 ESC 버튼 — 키 입력이 보드에 닿지 않는 환경을 위해. 돌아갈 곳이 없으면 흐리게
      back: { go: () => this.goBack(), op: S.entered || this._enter || (this._hist && this._hist.length) ? '1' : '0.4', cur: S.entered || (this._hist && this._hist.length) ? 'pointer' : 'default' },
      leaf: { disp: S.entered ? 'flex' : 'none', name: S.entered && this._enter ? (sys.nodes[this._enter.id] || {}).label : '', back: () => this.exitLeaf() },
      heading: heading + (S.hidden ? '' : out ? ' — 들어가는 중' : ''),
      sceneLabel: '계정을 항성으로 한 트리 ' + (sys.nodes.length - 1) + '개의 항성계',
      kinds: [['legacy', '레거시'], ['mask', '마스크'], ['mix', '혼합'], ['data', '텍스트']].map(([id, name]) => ({
        name, cls: K === id ? 'sel' : '', pressed: K === id ? 'true' : 'false', pick: () => { if (K !== id) pick({ kind: name, mode: 'mask' }); }
      })),
      // 타입마다 붙는 줄 — 텍스트: 전파 방향 · 혼합: 비운 자리
      opts: K === 'data' ? ['좌', '우', '중', '동시'].map((name) => ({ name, cls: this.DDIR() === name ? 'sel' : '', pressed: this.DDIR() === name ? 'true' : 'false', pick: () => { if (this.DDIR() !== name) pick({ ddir: name }); } }))
        : K === 'mix' ? ['원본 컴포넌트', '배경'].map((name) => ({ name, cls: this.MIXBACK() === name ? 'sel' : '', pressed: this.MIXBACK() === name ? 'true' : 'false', pick: () => { if (this.MIXBACK() !== name) this.setState({ mixBack: name }); } }))
        : [],
      optsLabel: K === 'data' ? '전파' : K === 'mix' ? '비운 자리' : '', optsDisp: K === 'data' || K === 'mix' ? 'flex' : 'none',
      ex: { disp: legView ? 'flex' : 'none', opts: [['중', '중앙'], ['상', '위'], ['하', '아래'], ['좌', '왼쪽'], ['우', '오른쪽']].map(([name, val]) => {
        const sel = this.EXPAND() === val;
        return { name, cls: sel ? 'sel' : '', pressed: sel ? 'true' : 'false', label: val + '에서 확장', pick: () => { if (!sel) pick({ expand: val, mode: S.mode }); } };
      }) },
      rs: { disp: legView ? 'block' : 'none', cls: this.RESTORE() ? 'sel' : '', pressed: this.RESTORE() ? 'true' : 'false', label: '배경 복원 — ' + (this.RESTORE() ? '켬' : '끔'), toggle: () => pick({ restore: !this.RESTORE(), mode: S.mode }) },
      tr: { disp: legView ? 'flex' : 'none', cls: this.TRAIL() ? 'sel' : '', pressed: this.TRAIL() ? 'true' : 'false', label: '잔상 — ' + (this.TRAIL() ? '켬' : '끔'), toggle: () => this.setState({ trail: !this.TRAIL() }) },
      te: { cls: this.TRAIL_EDGE() ? 'sel' : '', pressed: this.TRAIL_EDGE() ? 'true' : 'false', label: '가지 잔상 — ' + (this.TRAIL_EDGE() ? '켬' : '끔'), toggle: () => this.setState({ trailEdge: !this.TRAIL_EDGE() }) },
      hb: { disp: legView ? 'block' : 'none', cls: this.HOLEBACK() === '어둡게' ? 'sel' : '', pressed: this.HOLEBACK() === '어둡게' ? 'true' : 'false', label: '레거시 배경 — ' + this.HOLEBACK(), toggle: () => this.setState({ holeBack: this.HOLEBACK() === '어둡게' ? '비움' : '어둡게' }) },
      stages, total: Math.round(this.timeline(K, S.mode).endAll) + 'ms',
      replay: () => { this._seq = null; this.setState({ hidden: true }); setTimeout(() => { if (this._live) this.play(); }, 30); },
      entry: () => { if (this._res && this._res.dir === 'in') return; this.startEntry(); },
      sinkIt: () => this.sink(),
      sw: { disp: K === 'mask' ? 'inline-flex' : 'none', label: S.mode === 'legacy' ? '마스크로' : '레거시로', go: () => this.switchMode() },
      presets: Object.keys(this.SPECS()).map((name) => ({
        name: name.replace('자식 ', ''), cls: name === cur ? 'sel' : '', pressed: name === cur ? 'true' : 'false',
        pick: () => { if (name !== cur) this.setState({ preset: name, focus: 0 }); }
      })),
      stopProp: (e) => { if (e && e.stopPropagation) e.stopPropagation(); },
      pmove: (e) => { if (!e || !this._cv) return; if (this._q_ctlDrag || (e.target && e.target.closest && e.target.closest('[data-ctlwin],[data-minfly],[data-loginwrap]'))) { this._mouse = null; return; } const rc = this._cv.getBoundingClientRect(); this._mouse = { x: e.clientX - rc.left, y: e.clientY - rc.top }; },
      pleave: () => { this._mouse = null; },
      pdown: (e) => { if (!e || e.button !== 0 || !this._cv || (e.target && e.target.closest && e.target.closest('[data-ctlwin],[data-loginwrap],[data-minfly]'))) return; const rc = this._cv.getBoundingClientRect(); this.gfDown(e.clientX - rc.left, e.clientY - rc.top); },   // 지도 노드 — 길게 누르기를 잰다
      tap: (e) => {
        if (!e || e.button !== 0 || !this._cv || !this._hits || (e.target && e.target.closest && e.target.closest('[data-ctlwin],[data-loginwrap],[data-minfly]'))) return;   // 제어기 창 안의 누르기는 창이 받는다
        if (this._q_pop) { const rc0 = this._cv.getBoundingClientRect(); if (this.gf_popTap(e.clientX - rc0.left, e.clientY - rc0.top)) return; this.gf_popHide(); }   // 우클릭 할 일 누르기 · 다른 곳을 누르면 닫기
        const rc = this._cv.getBoundingClientRect(), mx = e.clientX - rc.left, my = e.clientY - rc.top;
        if (this.gfHit(mx, my) || this._q_hold || this.gfOver(mx, my)) { this.gfTap(mx, my); return; }   // 전역 틀이 받는 자리만 (지도 노드를 누르고 있었으면 떼는 자리와 상관없이)
        if (this._navS) return;   // 노드 이동 중
        if (this._res && this._res.dir === 'in') return;   // 리소스 뷰 — 누르기로는 나가지 않는다 (ESC 로 리프 뷰). 우클릭 = 속성
        if (this._lv) {   // 리프 뷰 — 행성을 누르면 리소스 뷰로 (진입 · 나가기 중엔 받지 않는다)
          if (this._entL) return;
          const best = this.pickHit(mx, my);
          if (best && typeof best.id === 'string' && best.id.startsWith('p:')) this.enterRes(best.id.slice(2));
          return;
        }
        if (this._enter) return;   // 트리 → 리프 전환 중
        const best = this.pickHit(mx, my); if (!best) return;
        // 초점 맞은 항성을 한 번 더 누르면 들어가기 — 단 두 번 누름(0.32초 안에 두 번째)은 '초점 풀기'(뒤로 = ESC). 들어가기(와 로그인 창)는 두 번째 누름이 없다고 확인된 뒤에만
        const EP = this._q_enterP; if (EP && performance.now() - EP.t < 320) { clearTimeout(EP.h); this._q_enterP = null; if (!this.goBack()) this.focusTo(0); return; }
        if (best.id !== 0 && this._focus && this._focus.id === best.id && !this._focus.from) { const id = best.id; this._q_enterP = { t: performance.now(), h: setTimeout(() => { this._q_enterP = null; if (this._live && this._focus && this._focus.id === id && !this._enter && !this._lv) this.enterLeaf(id); }, 320) }; }
        else this.focusTo(best.id);
      }
    };
  }

}
